# Productivity Protocols — CI verification workflow (TEMPLATE, not installed).
#
# This file lives in protocols/ci/ so it does NOT run. To activate it, a
# maintainer copies it to .github/workflows/verify-protocols.yml at the repo
# root. Once active, receipts are CI-issued: generated by a verifier identity
# distinct from any author, on a clean checkout, which is what turns the
# receipts' *reproducibility* into *trust* (see ../KNOWN-LIMITATIONS.md).
name: verify-protocols
on:
  push:
    paths: ["protocols/**"]
  pull_request:
    paths: ["protocols/**"]
permissions:
  contents: read
  id-token: write   # for OIDC-based signing (sigstore) of the attestation
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Verify (validate -> tests -> evals -> hostile -> build -> receipts)
        working-directory: protocols
        run: node tools/verify-all.js
      - name: Confirm clean checkout is byte-identical (replay)
        working-directory: protocols
        run: |
          A=$(find dist -type f | sort | xargs sha256sum | sha256sum)
          node build-protocols.js >/dev/null
          B=$(find dist -type f | sort | xargs sha256sum | sha256sum)
          test "$A" = "$B" || (echo "build not byte-identical" && exit 1)
      - name: Attest (digest of all receipts + build)
        working-directory: protocols
        run: node tools/attest.js
      # In a real setup, sign protocols/ATTESTATION.json here with sigstore/cosign
      # using the workflow's OIDC identity, and/or publish to a transparency log.
      # That is the step that makes the attestation trusted rather than merely
      # reproducible. Left as a documented maintainer action.
      - name: Upload receipts + attestation
        uses: actions/upload-artifact@v4
        with:
          name: protocol-receipts
          path: |
            protocols/RECEIPT.json
            protocols/ATTESTATION.json
            protocols/protocols/*/RECEIPT.json

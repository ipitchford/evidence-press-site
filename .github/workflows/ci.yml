name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the documented floor (tools/check-published.js uses built-in fetch).
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Select ledgered protocol build source when production-sealed
        run: |
          if [ -f protocols/PUBLISHED.json ]; then
            node -e '
              const fs = require("fs");
              const ledger = require("./protocols/PUBLISHED.json");
              if (ledger.source && ledger.source.dirty === false && /^[0-9a-f]{40}$/.test(ledger.source.commit || "")) {
                fs.appendFileSync(process.env.GITHUB_ENV, "PRODUCTIVITY_PROTOCOLS_SOURCE_COMMIT=" + ledger.source.commit + "\n");
                console.log("Protocol build will reproduce " + ledger.source.commit + ".");
              } else {
                console.log("Protocol ledger is an unsealed development candidate; exact candidate check must still pass.");
              }
            '
          fi

      - name: Syntax check every script
        run: |
          node --check build.js
          for f in tools/*.js assets/js/*.js; do node --check "$f"; done
          node --check protocols/build-protocols.js
          for f in protocols/tools/*.js protocols/tools/lib/*.js protocols/tests/release-integrity/run.js; do node --check "$f"; done

      - name: Renderer regression tests
        run: node tools/test-render.js

      - name: Article authoring contract and hostile controls
        run: node tools/test-articles.js

      - name: Reader-first release-page policy
        run: |
          node tools/test-release-pages.js
          node tools/build-audio-provenance-status.js --check

      - name: Operating-model contract and hostile controls
        run: node tools/test-operating-model.js

      - name: Research-graph contract and hostile controls
        run: node tools/test-research-graph.js

      - name: Atlas roadmap contract and hostile controls
        run: node tools/test-atlas-roadmap.js

      - name: Atlas proposal quarantine and hostile controls
        run: node tools/test-atlas-proposals.js

      - name: Verify protocol source and regenerate ignored receipts
        run: |
          node protocols/tools/make-manifest.js
          git diff --exit-code -- 'protocols/protocols/*/MANIFEST.json'
          node protocols/tools/verify-all.js --no-build

      - name: Build the complete site from a clean checkout
        run: REQUIRE_COMMITTED_MANIFESTS=1 ./protocols/deploy/integrate.sh

      - name: Research graph source/public parity
        run: node tools/test-research-graph.js --built

      - name: Atlas proposal source/public parity
        run: node tools/test-atlas-proposals.js --built

      - name: Protocol candidate/production byte-integrity gate
        run: |
          if [ -f protocols/PUBLISHED.json ]; then
            if [ "$(node -p "require('./protocols/PUBLISHED.json').source.dirty")" = "false" ]; then
              node protocols/tools/check-release-integrity.js
            else
              node protocols/tools/check-release-integrity.js --candidate
            fi
          fi

      - name: Metadata conformance and cross-surface consistency
        run: node tools/test-metadata.js

      - name: Internal link and asset check
        run: node tools/check-links.js

      - name: Publication-preservation gate
        # Refuses any build that would drop a previously published URL.
        run: node tools/check-published.js

      - name: Build is reproducible from the same source
        # The build must not depend on the wall clock or on any other state that
        # varies between runs: rebuild and require byte-identical output.
        run: |
          find dist -type f -exec sha256sum {} \; | sort -k2 > /tmp/first.sha
          rm -rf dist
          REQUIRE_COMMITTED_MANIFESTS=1 ./protocols/deploy/integrate.sh
          find dist -type f -exec sha256sum {} \; | sort -k2 > /tmp/second.sha
          diff /tmp/first.sha /tmp/second.sha && echo "Byte-identical rebuild."

      - name: No inline scripts (the CSP forbids them)
        run: |
          # Scoped to generated pages: the self-contained comic bundle under
          # assets/ legitimately carries inline script and is deliberately not
          # covered by the per-document CSP.
          if grep -rlE '<script>|<script [^>]*on[a-z]+=' dist --include='*.html' --exclude-dir=assets; then
            echo "Inline script or inline handler found; script-src 'self' would block it."
            exit 1
          fi
          echo "No inline scripts."

  accessibility:
    name: Accessibility (axe via pa11y-ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Select ledgered protocol build source when production-sealed
        run: |
          if [ -f protocols/PUBLISHED.json ]; then
            node -e '
              const fs = require("fs");
              const ledger = require("./protocols/PUBLISHED.json");
              if (ledger.source && ledger.source.dirty === false && /^[0-9a-f]{40}$/.test(ledger.source.commit || "")) {
                fs.appendFileSync(process.env.GITHUB_ENV, "PRODUCTIVITY_PROTOCOLS_SOURCE_COMMIT=" + ledger.source.commit + "\n");
              }
            '
          fi

      - name: Build the site
        run: REQUIRE_COMMITTED_MANIFESTS=1 ./protocols/deploy/integrate.sh

      - name: Install the pinned browser-test runner
        run: npm ci --ignore-scripts

      - name: Protocol candidate/production byte-integrity gate
        run: |
          if [ -f protocols/PUBLISHED.json ]; then
            if [ "$(node -p "require('./protocols/PUBLISHED.json').source.dirty")" = "false" ]; then
              node protocols/tools/check-release-integrity.js
            else
              node protocols/tools/check-release-integrity.js --candidate
            fi
          fi

      - name: Serve dist/
        run: npx --yes http-server dist -p 8080 --silent &

      - name: Wait for the server
        run: npx --yes wait-on http://127.0.0.1:8080 --timeout 60000

      - name: Run pa11y-ci with the axe runner
        # Automated checks catch roughly a third of WCAG failures. They are a
        # floor, not a conformance claim: keyboard and screen-reader testing
        # are recorded separately in docs/ACCESSIBILITY.md.
        run: npx --yes pa11y-ci --config .pa11yci.json

      - name: Audit every release at desktop and mobile widths
        run: npm run test:release-corpus

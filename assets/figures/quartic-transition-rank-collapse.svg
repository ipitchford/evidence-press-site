<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Constrained quartic transition and rank collapse</title>
  <desc id="desc">A quartic phase profile is paired with the aligned transition curve. Along that curve three twisted de Rham classes span rank two away from the origin and rank one at the origin.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11191d"/><stop offset="1" stop-color="#203034"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="660" rx="20" fill="url(#bg2)"/>
  <text x="64" y="72" fill="#f5f5f4" font-family="Georgia,serif" font-size="30">Exact rank loss at the aligned quartic transition</text>
  <text x="64" y="108" fill="#a8b4b6" font-family="system-ui,sans-serif" font-size="17">First reduce amplitudes in the twisted de Rham quotient; then test their coordinate determinant.</text>
  <line x1="82" y1="510" x2="548" y2="510" stroke="#657477" stroke-width="1.5"/>
  <line x1="315" y1="152" x2="315" y2="548" stroke="#657477" stroke-width="1.5"/>
  <path d="M102 500 C156 445 191 319 236 258 C266 218 293 331 315 386 C338 442 368 331 396 258 C438 148 476 386 530 500" fill="none" stroke="#2dd4bf" stroke-width="4" filter="url(#glow)"/>
  <circle cx="236" cy="258" r="7" fill="#f59e0b"/><circle cx="315" cy="386" r="7" fill="#f59e0b"/><circle cx="396" cy="258" r="7" fill="#f59e0b"/>
  <text x="103" y="574" fill="#d6dcdd" font-family="Georgia,serif" font-size="21">Ψ(W) = W⁴ − 3⁄2 KW² + bW</text>
  <text x="654" y="165" fill="#a8b4b6" font-family="system-ui,sans-serif" font-size="15" letter-spacing="1.5">ALIGNED TRANSITION CURVE</text>
  <line x1="678" y1="510" x2="1124" y2="510" stroke="#657477" stroke-width="1.5"/>
  <line x1="891" y1="216" x2="891" y2="550" stroke="#657477" stroke-width="1.5"/>
  <path d="M710 438 C768 366 806 250 891 386 C976 522 1014 406 1090 285" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="891" cy="386" r="12" fill="#151a1e" stroke="#2dd4bf" stroke-width="4"/>
  <circle cx="786" cy="331" r="7" fill="#f59e0b"/><circle cx="1015" cy="406" r="7" fill="#f59e0b"/>
  <text x="663" y="575" fill="#d6dcdd" font-family="Georgia,serif" font-size="21">−3K³ + K + 3b² = 0</text>
  <rect x="612" y="190" width="516" height="84" rx="14" fill="#172428" stroke="#334549"/>
  <text x="641" y="225" fill="#f5f5f4" font-family="Georgia,serif" font-size="19">det[1, Ψ, Ψ²] = 9b⁄64 (−3K³ + K + 3b²)</text>
  <text x="641" y="254" fill="#a8b4b6" font-family="system-ui,sans-serif" font-size="16">rank 2 along the curve away from the origin · rank 1 at the origin</text>
  <text x="64" y="625" fill="#819092" font-family="system-ui,sans-serif" font-size="15">Schematic phase profile; the determinant and rank statements are exact.</text>
</svg>

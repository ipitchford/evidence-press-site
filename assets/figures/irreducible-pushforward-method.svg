<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Irreducible pushforward separation method</title>
  <desc id="desc">An irreducible prime divisor on the base lifts to one reduced closed point on an elliptic double cover. Separate arrows show the pole-gap and deck-involution tests excluding two types of collision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11191d"/><stop offset="1" stop-color="#203034"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3a8"/></marker>
  </defs>
  <rect width="1200" height="660" rx="20" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f5f5f4" font-family="Georgia,serif" font-size="30">Coefficient-one pushforward turns arithmetic into separation</text>
  <text x="64" y="108" fill="#a8b4b6" font-family="system-ui,sans-serif" font-size="17">Two later tests do different jobs; neither follows from irreducibility alone.</text>
  <line x1="96" y1="520" x2="515" y2="520" stroke="#a8b4b6" stroke-width="2"/>
  <circle cx="300" cy="520" r="12" fill="#f59e0b"/>
  <text x="96" y="564" fill="#d6dcdd" font-family="system-ui,sans-serif" font-size="18">base: one irreducible prime of degree h</text>
  <path d="M300 490 C300 445 310 422 334 387" fill="none" stroke="#94a3a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="327" y="452" fill="#a8b4b6" font-family="system-ui,sans-serif" font-size="16">pushforward, coefficient 1</text>
  <ellipse cx="300" cy="292" rx="212" ry="118" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <path d="M88 292 C170 175 430 175 512 292 C430 409 170 409 88 292Z" fill="none" stroke="#d6dcdd" stroke-width="1.5" opacity=".26"/>
  <g fill="#2dd4bf">
    <circle cx="145" cy="274" r="7"/><circle cx="205" cy="205" r="7"/><circle cx="300" cy="176" r="7"/><circle cx="395" cy="205" r="7"/><circle cx="455" cy="274" r="7"/><circle cx="410" cy="356" r="7"/><circle cx="190" cy="356" r="7"/>
  </g>
  <path d="M145 274 Q300 120 455 274" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 9"/>
  <text x="151" y="330" fill="#f5f5f4" font-family="Georgia,serif" font-size="22">one reduced closed point upstairs</text>
  <path d="M530 250 C620 220 670 190 724 170" fill="none" stroke="#94a3a8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M530 338 C620 370 670 407 724 439" fill="none" stroke="#94a3a8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="742" y="130" width="392" height="150" rx="16" fill="#172428" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="775" y="174" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="15" letter-spacing="1.5">POLE-GAP TEST</text>
  <text x="775" y="216" fill="#f5f5f4" font-family="Georgia,serif" font-size="24">hO versus (h + 1)O</text>
  <text x="775" y="250" fill="#d6dcdd" font-family="system-ui,sans-serif" font-size="17">excludes adjacent common zeros</text>
  <rect x="742" y="374" width="392" height="150" rx="16" fill="#172428" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="775" y="418" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="15" letter-spacing="1.5">ELLIPTIC DECK TEST</text>
  <text x="775" y="460" fill="#f5f5f4" font-family="Georgia,serif" font-size="24">σ(Q) = S − Q,  hS ≠ O</text>
  <text x="775" y="494" fill="#d6dcdd" font-family="system-ui,sans-serif" font-size="17">excludes a mirror-divisor collision</text>
  <text x="64" y="625" fill="#819092" font-family="system-ui,sans-serif" font-size="15">Conceptual map; see the manuscript for hypotheses and proof.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Random reshuffling as a baseline policy</title>
  <desc id="desc">A uniform random permutation induces an unoriented pair skeleton and fair orientation bits. Exact conditional value resolves the exposed bits and compares the result with the same random-reshuffling completion. Uncertain approximations fall back to a fresh fair coin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10191d"/><stop offset="1" stop-color="#202c35"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a1a8"/></marker>
    <filter id="soft"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="20" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f7f7f5" font-family="Georgia,serif" font-size="31">Resolve only the fair choices that random reshuffling already exposes</text>
  <text x="60" y="106" fill="#aeb9be" font-family="system-ui,sans-serif" font-size="17">The comparator stays fixed: the same skeleton with fair orientation bits.</text>

  <g transform="translate(55 170)">
    <rect width="250" height="210" rx="18" fill="#162329" stroke="#40535b"/>
    <text x="24" y="36" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14" letter-spacing="1.5">UNIFORM RR DRAW</text>
    <g font-family="ui-monospace,monospace" font-size="18" text-anchor="middle">
      <g><circle cx="42" cy="90" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="42" y="96" fill="#f7f7f5">4</text></g>
      <g><circle cx="96" cy="90" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="96" y="96" fill="#f7f7f5">1</text></g>
      <g><circle cx="150" cy="90" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="150" y="96" fill="#f7f7f5">6</text></g>
      <g><circle cx="204" cy="90" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="204" y="96" fill="#f7f7f5">2</text></g>
      <g><circle cx="69" cy="151" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="69" y="157" fill="#f7f7f5">5</text></g>
      <g><circle cx="177" cy="151" r="24" fill="#23343b" stroke="#d6dcdd"/><text x="177" y="157" fill="#f7f7f5">3</text></g>
    </g>
    <text x="24" y="194" fill="#8fa0a7" font-family="system-ui,sans-serif" font-size="14">visit every item once</text>
  </g>

  <path d="M320 275H376" stroke="#91a1a8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(390 145)">
    <rect width="330" height="260" rx="18" fill="#162329" stroke="#c084fc" stroke-width="1.5"/>
    <text x="24" y="36" fill="#c084fc" font-family="system-ui,sans-serif" font-size="14" letter-spacing="1.5">FORGET PAIR ORIENTATION</text>
    <g fill="none" stroke="#d6dcdd" stroke-width="2">
      <ellipse cx="65" cy="116" rx="42" ry="70"/><ellipse cx="165" cy="116" rx="42" ry="70"/><ellipse cx="265" cy="116" rx="42" ry="70"/>
    </g>
    <g fill="#c084fc"><circle cx="65" cy="116" r="8"/><circle cx="165" cy="116" r="8"/><circle cx="265" cy="116" r="8"/></g>
    <g fill="#f7f7f5" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">
      <text x="65" y="75">{4,1}</text><text x="165" y="75">{6,2}</text><text x="265" y="75">{5,3}</text>
    </g>
    <text x="165" y="217" text-anchor="middle" fill="#d6dcdd" font-family="Georgia,serif" font-size="20">skeleton S + fair bits Ω</text>
    <text x="165" y="242" text-anchor="middle" fill="#8fa0a7" font-family="system-ui,sans-serif" font-size="14">conditionally independent orientations</text>
  </g>

  <path d="M735 275H790" stroke="#91a1a8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(805 145)">
    <rect width="340" height="260" rx="18" fill="#162329" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="24" y="36" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14" letter-spacing="1.5">EXACT CONDITIONAL VALUE</text>
    <path d="M42 178 C88 177 89 80 135 80 S182 178 228 178 S273 110 307 110" fill="none" stroke="#22d3ee" stroke-width="4" filter="url(#soft)"/>
    <g fill="#10191d" stroke="#22d3ee" stroke-width="3">
      <rect x="123" y="68" width="24" height="24" rx="4" transform="rotate(45 135 80)"/>
      <rect x="216" y="166" width="24" height="24" rx="4" transform="rotate(45 228 178)"/>
      <rect x="295" y="98" width="24" height="24" rx="4" transform="rotate(45 307 110)"/>
    </g>
    <text x="24" y="217" fill="#f7f7f5" font-family="Georgia,serif" font-size="19">choose each exposed sign</text>
    <text x="24" y="243" fill="#8fa0a7" font-family="system-ui,sans-serif" font-size="14">conditional decrement · same-RR mean</text>
  </g>

  <g transform="translate(390 470)">
    <rect width="755" height="150" rx="18" fill="#121e23" stroke="#40535b"/>
    <text x="24" y="36" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="14" letter-spacing="1.5">CERTIFY OR RANDOMIZE</text>
    <rect x="28" y="61" width="295" height="60" rx="12" fill="#1a3037" stroke="#22d3ee"/>
    <text x="176" y="88" text-anchor="middle" fill="#f7f7f5" font-family="Georgia,serif" font-size="18">enclosure excludes zero</text>
    <text x="176" y="109" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14">use certified orientation</text>
    <text x="377" y="96" text-anchor="middle" fill="#8fa0a7" font-family="system-ui,sans-serif" font-size="20">otherwise</text>
    <rect x="431" y="61" width="295" height="60" rx="12" fill="#2a2234" stroke="#c084fc"/>
    <text x="579" y="88" text-anchor="middle" fill="#f7f7f5" font-family="Georgia,serif" font-size="18">sign remains uncertain</text>
    <text x="579" y="109" text-anchor="middle" fill="#c084fc" font-family="system-ui,sans-serif" font-size="14">use a fresh fair fallback coin</text>
  </g>

  <text x="60" y="665" fill="#819096" font-family="system-ui,sans-serif" font-size="15">Conceptual map. Exact filtrations, value coefficients, tie handling, and singleton coupling are stated in the manuscript.</text>
</svg>

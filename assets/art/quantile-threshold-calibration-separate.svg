<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that quantile and threshold calibration checks can disagree even for Gaussian forecasts. Title: Quantile and threshold calibration checks can disagree, even for Gaussian forecasts. Subtitle: The same forecasts, two weightings: one error averages to 0 for the quantile check and to ε/9 for the threshold check. Centre, two stacked panels against the spread s from 1 to 2 of the forecasts with median 0, which all have P(Y ≤ 0) = ½. Top: the weights the two checks give these forecasts; a flat blue line at 1 for the quantile check (equal weights), and a rising orange line from 2/3 to 4/3 for the threshold check, where the weight grows with the spread. Bottom: the same error ε(2s − 3) on both, a straight line from −ε at s = 1 to +ε at s = 2: outcomes run below the forecast for small s and above it for large s. Left: averaging the same error two ways gives 0 evenly, so the quantile check passes, and ε/9 weighted by spread, so the threshold check fails. At ε = 1/10 outcomes fall below 0 in 50.76% of cases while forecasts say 50%; about 34,000 cases detect it. Borel–Kolmogorov: conditioning on a probability-zero set depends on how it is described. Right: when do the checks agree? Forecasts with countably many shapes: yes (Gneiting and Resin). Smooth Gaussian family: no, in both directions. Ordered categories: quantile implies threshold for up to three, not from four. Run both kinds of check. Constructed population examples.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.55" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Quantile and threshold calibration checks can disagree, even for Gaussian forecasts</text><text class="og-hide" x="40" y="80" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">The same forecasts, two weightings: one error averages to 0 for the quantile check and to ε/9 for the threshold check</text><text class="og-hide" x="40" y="118" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Average the same error two ways</text><text class="og-hide" x="40" y="150" fill="#8ecbff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">evenly (quantile check)</text><text class="og-hide" x="40" y="178" fill="#8ecbff" font-family="Georgia,serif" font-size="28" font-weight="bold" font-style="normal" text-anchor="start">0</text><text class="og-hide" x="70" y="178" fill="#8ecbff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">check passes</text><text class="og-hide" x="40" y="214" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">by spread (threshold check)</text><text class="og-hide" x="40" y="242" fill="#ffb36b" font-family="Georgia,serif" font-size="28" font-weight="bold" font-style="normal" text-anchor="start">ε/9</text><text class="og-hide" x="100" y="242" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">check fails</text><text class="og-hide" x="40" y="284" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">At ε = 1/10 outcomes fall below 0</text><text class="og-hide" x="40" y="302" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">in 50.76% of cases; forecasts say 50%.</text><text class="og-hide" x="40" y="320" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">About 34,000 cases detect it.</text><text class="og-hide" x="40" y="352" fill="#bcc8cf" font-family="Georgia,serif" font-size="12.5" font-weight="normal" font-style="italic" text-anchor="start">Borel–Kolmogorov: conditioning on a</text><text class="og-hide" x="40" y="368" fill="#bcc8cf" font-family="Georgia,serif" font-size="12.5" font-weight="normal" font-style="italic" text-anchor="start">probability-zero set depends on how it is described</text><line x1="480" y1="236" x2="888" y2="236" stroke="rgba(255,255,255,0.55)" stroke-width="1.3"/><line x1="480" y1="236" x2="480" y2="112" stroke="rgba(255,255,255,0.55)" stroke-width="1.3"/><line x1="475" y1="236" x2="480" y2="236" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="471" y="240" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">0</text><line x1="475" y1="157.33333333333331" x2="480" y2="157.33333333333331" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="471" y="161.33333333333331" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1</text><text transform="rotate(-90 440 177)" class="og-hide" x="440" y="177" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">weight</text><polyline points="480.0,157.3 490.0,157.3 500.0,157.3 510.0,157.3 520.0,157.3 530.0,157.3 540.0,157.3 550.0,157.3 560.0,157.3 570.0,157.3 580.0,157.3 590.0,157
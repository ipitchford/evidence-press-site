ill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">+ε</text><text transform="rotate(-90 440 306)" class="og-hide" x="440" y="306" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">error</text><polygon points="480,306 480.0,350.0 490.0,347.8 500.0,345.6 510.0,343.4 520.0,341.2 530.0,339.0 540.0,336.8 550.0,334.6 560.0,332.4 570.0,330.2 580.0,328.0 590.0,325.8 600.0,323.6 610.0,321.4 620.0,319.2 630.0,317.0 640.0,314.8 650.0,312.6 660.0,310.4 670.0,308.2 680.0,306.0 690.0,303.8 700.0,301.6 710.0,299.4 720.0,297.2 730.0,295.0 740.0,292.8 750.0,290.6 760.0,288.4 770.0,286.2 780.0,284.0 790.0,281.8 800.0,279.6 810.0,277.4 820.0,275.2 830.0,273.0 840.0,270.8 850.0,268.6 860.0,266.4 870.0,264.2 880.0,262.0 880,306" fill="rgba(255,255,255,0.08)"/><polyline points="480.0,350.0 490.0,347.8 500.0,345.6 510.0,343.4 520.0,341.2 530.0,339.0 540.0,336.8 550.0,334.6 560.0,332.4 570.0,330.2 580.0,328.0 590.0,325.8 600.0,323.6 610.0,321.4 620.0,319.2 630.0,317.0 640.0,314.8 650.0,312.6 660.0,310.4 670.0,308.2 680.0,306.0 690.0,303.8 700.0,301.6 710.0,299.4 720.0,297.2 730.0,295.0 740.0,292.8 750.0,290.6 760.0,288.4 770.0,286.2 780.0,284.0 790.0,281.8 800.0,279.6 810.0,277.4 820.0,275.2 830.0,273.0 840.0,270.8 850.0,268.6 860.0,266.4 870.0,264.2 880.0,262.0" fill="none" stroke="#f6f2ea" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="350" x2="480" y2="355" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="480" y="368" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">1.0</text><line x1="680" y1="350" x2="680" y2="355" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="680" y="368" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">1.5</text><line x1="880" y1="350" x2="880" y2="355" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="880" y="368" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">2.0</text><text class="og-hide" x="680" y="386" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">spread s of the forecasts with median 0 (all have P(Y ≤ 0) = ½)</text><text class="og-hide" x="704" y="317" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start">the same error ε(2s − 3) on both:</text><text class="og-hide" x="704" y="332" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">outcomes run below the forecast</text><text class="og-hide" x="704" y="346" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">for small s, above it for large s</text><line x1="930" y1="108" x2="930" y2="372" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text class="og-hide" x="952" y="118" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">When do the checks agree?</text><text class="og-hide" x="952" y="144" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Forecasts with countably</text><text class="og-hide" x="952" y="162" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">many shapes: yes</text><text class="og-hide" x="952" y="180" fill="#bcc8cf" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">(Gneiting and Resin)</text><t
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for bounded swaps in pass-and-swap queues. Left: five jobs whose swapping graph is a ring, in queue order 0, 1, 2, 4, 3, with a cap of two swaps. When job 0 is served it swaps into the place of job 1, job 1 swaps into the place of job 2, and the cap blocks a third swap, so job 2 must leave although it could have swapped with job 3. Two pentagon diagrams show the orientation before and after: only the edge between jobs 2 and 3 flips, and the longest directed chain has three edges both times, more than the cap. These 180 arrangements recur for ever, refuting the conjecture. Middle: for cap 2, rings of 5 and 9 jobs have such a trap and a ring of 7 does not, following the rule n = 1 mod 2w. Right: a bipartite hexagon with groups X and Y and every edge pointing from X to Y, illustrating that for bipartite swapping graphs and odd caps each move adds an X to Y edge until no chain is longer than the cap. Schematic; based on Section 1.4 and Theorems 4.1, 5.2 and 7.1 of the paper.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffd36e" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd36e" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the domination polynomial of random graphs. Title: almost every network has dominating-set counts that rise to one peak, with no second hump. Subtitle: random graphs with p times (log n) squared large are ultra-log-concave with high probability; at the boundary scale a Poisson count decides. Left: a ten-node network with three orange guard nodes; every other node is next to a guard; caption: a dominating set. Right: a schematic single-peaked bar profile of counts of dominating sets by size, captioned one peak, no second hump: log-concave; the second bar is highlighted, with the note that Cameron’s nine-node exception starts 1, 7, 50 and 7 times 7 is less than 1 times 50 at the second nonzero count, the only place it can fail. Footer: profile schematic; 636 of 32,768 six-node graphs fail ultra-log-concavity at p = 1/2; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.7" cy="0.6" r="0.35">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Almost every network: dominating-set counts rise to one peak, no second hump</text><text class="og-hide" x="40" y="72" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Random graphs with p(log n)² large: ultra-log-concave with high probability · at the boundary scale a Poisson count decides</text><line x1="150" y1="170" x2="90" y2="120" stroke="#c9c2cf" stroke-width="2"/><line x1="150" y1="170" x2="215" y2="115" stroke="#c9c2cf" stroke-width="2"/><line x1="150" y1="170" x2="95" y2="230" stroke="#c9c2cf" stroke-width="2"/><line x1="300" y1="200" x2="215" y2="115" stroke="#c9c2cf" stroke-width="2"/><line x1="300" y1="200" x2="255" y2="275" stroke="#c9c2cf" stroke-width="2"/><line x1="300" y1="200" x2="370" y2="140" stroke="#c9c2cf" stroke-width="2"/><line x1="395" y1="270" x2="330" y2="330" stroke="#c9c2cf" stroke-width="2"/><line x1="395" y1="270" x2="450" y2="215" stroke="#c9c2cf" stroke-width="2"/><line x1="395" y1="270" x2="255" y2="275" stroke="#c9c2cf" stroke-width="2"/><line x1="370" y1="140" x2="450" y2="215" stroke="#c9c2cf" stroke-width="2"/><line x1="90" y1="120" x2="215" y2="115" stroke="#c9c2cf" stroke-width="2"/><line x1="95" y1="230" x2="255" y2="275" stroke="#c9c2cf" stroke-width="2"/><line x1="330" y1="330" x2="255" y2="275" stroke="#c9c2cf" stroke-width="2"/><circle cx="150" cy="170" r="14" fill="#ffc36b"/><circle cx="90" cy="120" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="215" cy="115" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="95" cy="230" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="300" cy="200" r="14" fill="#ffc36b"/><circle cx="255" cy="275" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="370" cy="140" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="395" cy="270" r="14" fill="#ffc36b"/><circle cx="330" cy="330" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><circle cx="450" cy="215" r="10" fill="none" stroke="#e6e1ea" stroke-width="2.5"/><text class="og-hide" x="270" y="372" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle">a dominating set: every node is a guard (orange) or next to one</text><text class="og-hide" x="600" y="108" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">counts of dominating sets by size k (schematic)</text><rect x="600" y="327" width="38" height="3" fill="#9fd3ff" opacity="0.85"/><rect x="644" y="312" width="38" height="18" fill="#f2a7b5" opacity="0.85"/><rect x="688" y="282" width="38" height="48" fill="#9fd3ff" opacity="0.85"/><rect x="732" y="240" width="38" height="90" fill="#9fd3ff" opacity="0.85"/><rect x="776" y="204" width="38" height="126" fill="#9fd3ff" opacity="0.85"/><rect x="820" y="192" width="38" height="138" fill="#9fd3ff" opacity="0.85"/><rect x="864" y="207" width="38" height="123" fill="#9fd3ff" opacity="0.85"/><rect x="908" y="240" width="38" height="90" fill="#9fd3ff" opacity="0.85"/><rect x="952" y="279" width="38" height="51" fill="#9fd3ff" opacity="0.85"/><rect x="996" y="309" width="38" height="21" fill="#9fd3ff" opacity="0.85"/><rect x="1040" y="324" width="38" height="6" fill="#9fd3ff" opacity="0.85"/><line x1="594" y1="330" x2="1084" y2="330" stroke="#e6e1ea" stroke-width="1.5"/><text class="og-hide" x="860" y="356" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle">one peak, no second hump: log-concave</text><text class="og-hide" x="600" y="140" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Cameron’s nine-node exception starts 1, 7, 50:</text><text class="og-hide" x="600" y="160" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">7 × 7 &lt; 1 × 50 at the second nonzero count,</text><text class="og-hide" x="600" y="180" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">the only place it can fail</text><text class="og-hide" x="1160" y="390" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">Profile schematic; 636 of 32,768 six-node graphs fail ULC at p = 1/2. Unrefereed candidate.</text>
</svg>
,monospace" font-size="17">α = 1 / [p(p+d+2)]</text><text class="og-hide" x="1000" y="224" text-anchor="middle" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="13">fixed noninteger p &gt; 1 · d ≥ 2</text><path d="M794 267 H848" stroke="#f2c177" stroke-width="2" stroke-dasharray="5 6" opacity=".6"/><rect x="860" y="267" width="286" height="78" rx="18" fill="#151a1e" fill-opacity=".45" stroke="#f2c177" stroke-width="1.7" stroke-dasharray="7 6"/><text class="og-hide" x="1003" y="300" text-anchor="middle" fill="#f2c177" font-family="Georgia,serif" font-size="22">uniform equivalence fails</text><text class="og-hide" x="1003" y="327" text-anchor="middle" fill="#c8d0da" font-family="ui-monospace,monospace" font-size="12">integer exponent · d ≥ 2</text></g>
</svg>
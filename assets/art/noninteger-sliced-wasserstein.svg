<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic projection rosette for two measures feeds two angular--Mellin multiplier rails. On the upper rail, fixed noninteger p leaves every harmonic and frequency channel open and leads to the uniform bound W_p at most C times sliced W_p to the power 1 over p times p plus d plus 2 on the full p-moment ball. On the lower rail, integer p has a crossed-out multiplier at harmonic degree p plus 2, marking the null mode that obstructs uniform equivalence. This is a proof-mechanism diagram, not simulated data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#9fdfeb" stop-opacity="0.06"/><stop offset="1" stop-color="#9fdfeb" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

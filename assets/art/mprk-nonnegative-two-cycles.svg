<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for the MPRK22(4/7) counterexample. On a logarithmic axis of the first component y1, the iteration started at (1/2, 1/2) hops for ever between a trap near 0.49 and a trap near 1e-7, while the true equilibrium y1 = 0.001 lies between them, inside the basin bounded by a repelling two-cycle. A linear-scale bar on the right shows that this basin has width about 0.108, so about 89 per cent of uniformly drawn starting mass fractions end on the two-cycle. Positions use the certified values of Theorems 5 and 6; the arcs are schematic.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffc184" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc184" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><marker id="mprk-hop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffc184"/></marker></defs><text class="og-hide" x="60" y="50" fill="#fff5e9" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="normal" text-anchor="start">Started at (½, ½), the scheme hops between two traps for ever</text><text class="og-hide" x="60" y="80" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" text-anchor="start">MPRK22(4/7): every coefficient positive · rates 9990 and 10 · step size 1</text><path d="M110 222 H710" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><path d="M110 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><text class="og-hide" x="110" y="324" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">10<tspan dy="-9" font-size="13">-8</tspan></text><path d="M185 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><path d="M260 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><text class="og-hide" x="260" y="324" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">10<tspan dy="-9" font-size="13">-6</tspan></text><path d="M335 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><path d="M410 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><text class="og-hide" x="410" y="324" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">10<tspan dy="-9" font-size="13">-4</tspan></text><path d="M485 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><path d="M560 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><text class="og-hide" x="560" y="324" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">10<tspan dy="-9" font-size="13">-2</tspan></text><path d="M635 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><path d="M710 216 V228" stroke="#e2d9d0" stroke-opacity=".55" stroke-width="2"/><text class="og-hide" x="710" y="324" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="110" y="350" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">first component y₁ (log scale)</text><rect x="282.00499918789103" y="217" width="355.5171508098383" height="10" rx="5" fill="#a9ebd3" fill-opacity=".55"/><circle cx="282.00499918789103" cy="222" r="7" fill="#3a1d26" stroke="#d6b5ef" stroke-width="2.5"/><circle cx="637.5221499977293" cy="222" r="7" fill="#3a1d26" stroke="#d6b5ef" stroke-width="2.5"/><text class="og-hide" x="459.7635745928102" y="252" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">basin of the true equilibrium</text><path d="M682.9980039242475 204 Q437.2746357068502 90 191.55126748945278 204" stroke="#ffc184" stroke-width="3.5" fill="none" marker-end="url(#mprk-hop)"/><path d="M191.55126748945278 240 Q437.2746357068502 354 682.9980039242475 240" stroke="#ffc184" stroke-width="3.5" fill="none" marker-end="url(#mprk-hop)"/><text class="og-hide" x="437.2746357068502" y="138" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">one step</text><text class="og-hide" x="437.2746357068502" y="280" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle">next step</text><rect x="180.55126748945278" y="207" width="14" height="30" rx="4" fill="#ffc184" fill-opacity=".3" stroke="#ffc184" stroke-width="2.5"/><text class="og-hide" x="197.55126748945278" y="274" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="end">trap L ≈ 10⁻⁷</text><rect x="679.9980039242475" y="207" width="14" height="30" rx="4" fill="#ffc184" fill-opacity=".3" stroke="#ffc184" stroke-width="2.5"/><text class="og-hide" x="676.9980039242475" y="274" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="start">trap H ≈ 0.49</text><path d="M485 210 L497 222 L485 234 L473 222 Z" fill="#a9ebd3" stroke="#3a1d26" stroke-width="2"/><text class="og-hide" x="485" y="196" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">true equilibrium y₁ = 0.001</text><path d="M852 104 V352" stroke="#e2d9d0" stroke-opacity=".2"/><text class="og-hide" x="890" y="128" fill="#fff5e9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="start">Same line, linear scale</text><text class="og-hide" x="890" y="158" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">The equilibrium is the only fixed</text><text class="og-hide" x="890" y="180" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">point and is locally stable, yet it</text><text class="og-hide" x="890" y="202" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">attracts only a band of width 0.108.</text><rect x="890" y="254" width="270" height="16" rx="3" fill="#ffc184" fill-opacity=".22"/><rect x="890.0005305957333" y="254" width="29.17323107800678" height="16" rx="3" fill="#a9ebd3" fill-opacity=".85"/><circle cx="1023.25100190749" cy="262" r="6" fill="#ffc184"/><text class="og-hide" x="890" y="292" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text class="og-hide" x="1160" y="292" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="890" y="244" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">≈ 11% → equilibrium</text><text class="og-hide" x="890" y="324" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">≈ 89% of starting mass fractions</text><text class="og-hide" x="890" y="346" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">end on the two-cycle</text><text class="og-hide" x="60" y="386" fill="#e2d9d0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Open circles: repelling two-cycle at the basin edges · arcs are schematic hops, not a time plot · positions from the certified values</text>
</svg>
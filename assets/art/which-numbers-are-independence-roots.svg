<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on which numbers are independence roots. Title: i times the golden ratio is an independence root. Subtitle: a number is a zero of some graph’s independence polynomial exactly when the two obvious tests allow it. Left: the complex plane with a dashed unit circle; the positive real axis is marked in pink with the note no roots on the positive axis; on the imaginary axis two gold points at plus and minus i phi, outside the circle, labelled modulus 1.618, and two blue points at plus and minus i over phi, inside it; caption zeros of 1 plus 3 x squared plus x to the fourth. Right: join five blocks of disjoint cliques, (4111), (3, 37), (11, 18, 43), (2, 7, 13, 23) and (3, 3, 3, 3, 3, 10); 4,293 vertices, largest independent set of size 6; I of x equals (1 plus 3 x squared plus x to the fourth) times (1 plus 4293 x plus 2430 x squared); so plus or minus i phi and plus or minus i over phi are roots, and the modulus of i phi, 1.618, is larger than one. Every root needs: 1 over z an algebraic integer, no conjugate positive real. Nothing else is needed: cographs, trees and well-covered graphs realise them all. Footer: left, the complex plane with the unit circle, gold points outside it; right, the explicit witness graph of Section 4; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.42" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="27" font-weight="normal" font-style="normal" text-anchor="start">i × golden ratio is an independence root</text><text class="og-hide" x="40" y="74" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">A number is a zero of some graph’s independence polynomial exactly when the two obvious tests allow it</text><line x1="40" y1="222" x2="340" y2="222" stroke="#8f9aa3" stroke-width="1.4"/><line x1="190" y1="102" x2="190" y2="342" stroke="#8f9aa3" stroke-width="1.4"/><circle cx="190" cy="222" r="56" fill="none" stroke="#c3ccd2" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="192" y1="222" x2="340" y2="222" stroke="#f2a7b5" stroke-width="4" opacity="0.85"/><text class="og-hide" x="256" y="240" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">no roots on the</text><text class="og-hide" x="256" y="254" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">positive axis</text><text class="og-hide" x="230.32" y="175.68" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">|z| = 1</text><circle cx="190" cy="131.4" r="8" fill="#ffc36b" stroke="#111" stroke-width="1.2"/><text class="og-hide" x="204" y="136.4" fill="#ffc36b" font-family="Georgia,serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">iφ</text><circle cx="190" cy="312.6" r="8" fill="#ffc36b" stroke="#111" stroke-width="1.2"/><text class="og-hide" x="204" y="317.6" fill="#ffc36b" font-family="Georgia,serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">−iφ</text><circle cx="190" cy="187.4" r="6" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><text class="og-hide" x="204" y="192.4" fill="#9fd3ff" font-family="Georgia,serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">i/φ</text><circle cx="190" cy="256.6" r="6" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><text class="og-hide" x="204" y="261.6" fill="#9fd3ff" font-family="Georgia,serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">−i/φ</text><text class="og-hide" x="176" y="136.39009663000587" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">modulus 1.618</text><text class="og-hide" x="172" y="334" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="end">zeros of</text><text class="og-hide" x="172" y="350" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="end">1 + 3x² + x⁴</text><text class="og-hide" x="420" y="132" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Join five blocks of disjoint cliques:</text><text class="og-hide" x="420" y="156" fill="#e2e7ea" font-family="Georgia,serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">(4111) + (3, 37) + (11, 18, 43) + (2, 7, 13, 23) + (3, 3, 3, 3, 3, 10)</text><text class="og-hide" x="420" y="186" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">4,293 vertices, largest independent set of size 6</text><text class="og-hide" x="420" y="228" fill="#ffc36b" font-family="Georgia,serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="start">I(x) = (1 + 3x² + x⁴)(1 + 4293x + 2430x²)</text><text class="og-hide" x="420" y="258" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">so ±iφ and ±i/φ are roots, and |iφ| = 1.618… is larger than one</text><text class="og-hide" x="420" y="300" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">Every root needs: 1/z an algebraic integer, no conjugate positive real.</text><text class="og-hide" x="420" y="320" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Nothing else is needed: cographs, trees and well-covered graphs realise them all.</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Left: the complex plane with the unit circle; gold points lie outside it. Right: the explicit witness graph of Section 4. Unrefereed candidate.</text>
</svg>
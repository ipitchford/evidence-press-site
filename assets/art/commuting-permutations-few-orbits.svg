<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that counts of commuting shuffles sorted by their number of joint orbits stay log-concave at every fixed orbit count except two, where the ratio collapses when n has many small divisors; with three shuffles the first certified failure is a 54-digit number.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">MATHEMATICS · COMBINATORICS AND NUMBER THEORY</text>
<text class="og-hide" x="56" y="141" fill="#f6f2ea" font-family="Georgia,serif" font-size="33" font-weight="normal" text-anchor="start">Commuting shuffles: log-concavity</text>
<text class="og-hide" x="56" y="180" fill="#f6f2ea" font-family="Georgia,serif" font-size="33" font-weight="normal" text-anchor="start">breaks only at two orbits</text>
<text class="og-hide" x="56" y="222" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">In every rank the two-orbit ratio collapses when n</text>
<text class="og-hide" x="56" y="250" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">has many small divisors; at three or more orbits it</text>
<text class="og-hide" x="56" y="278" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">holds for large n.</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="99.69999999999999" fill="#ffc36b" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">54 digits</text>
<text class="og-hide" x="948" y="125.69999999999999" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">first certified rank-three failure</text>
<rect x="752" y="158.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="201.7" fill="#9fd3ff" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">845 digits</text>
<text class="og-hide" x="948" y="227.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">certified rank-four failure</text>
<rect x="752" y="260.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#a8e0b0" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="305.7" fill="#a8e0b0" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">≈ 2.52</text>
<text class="og-hide" x="948" y="327.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">exact lim inf at ℓ = 3, k = 3 (bound was 1.10)</text>
</svg>
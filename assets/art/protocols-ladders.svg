<rect width="1060" height="706" fill="url(#lg)"/>
<defs><radialGradient id="lg" cx="0.5" cy="0.1" r="0.9"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.08"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient></defs>
<text x="530" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" letter-spacing="0.14em" fill="#2dd4bf">TWO INDEPENDENT MEASURES · NEVER MERGED</text>
<line x1="530" y1="72" x2="530" y2="552" stroke="#334155" stroke-width="1" opacity="0.4"/>
<text x="93" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#2dd4bf">Protocol assurance</text><text x="93" y="124" font-family="system-ui, sans-serif" font-size="15" fill="#a8a29e">What was checked, and how?</text><line x1="285" y1="552" x2="285" y2="224" stroke="#2dd4bf" stroke-width="1" opacity="0.25"/><g><rect x="93" y="512" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">DRAFT</text></g><g><rect x="93" y="464" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">STRUCTURE_VALIDATED</text></g><g><rect x="93" y="416" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">EXAMPLE_CONFORMANCE_VALIDATED</text></g><g><rect x="93" y="368" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">TASKSET_PASSED</text></g><g><rect x="93" y="320" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">CROSS_MODEL_REPRODUCED</text></g><g><rect x="93" y="272" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">SECURITY_REVIEWED</text></g><g><rect x="93" y="224" width="384" height="40" rx="8" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1.5"/><text x="109" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#ccfbf1">FIELD_READY</text></g>
<text x="583" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#f59e0b">Productivity evidence</text><text x="583" y="124" font-family="system-ui, sans-serif" font-size="15" fill="#a8a29e">Does it help? — measured, never assumed</text><line x1="775" y1="552" x2="775" y2="320" stroke="#f59e0b" stroke-width="1" opacity="0.25"/><g><rect x="583" y="512" width="384" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/><text x="599" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#fde68a">NO_IMPACT_EVIDENCE</text></g><g><rect x="583" y="464" width="384" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/><text x="599" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#fde68a">BENCHMARK_SIGNAL</text></g><g><rect x="583" y="416" width="384" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/><text x="599" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#fde68a">CONTROLLED_USER_SIGNAL</text></g><g><rect x="583" y="368" width="384" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/><text x="599" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#fde68a">FIELD_SIGNAL</text></g><g><rect x="583" y="320" width="384" height="40" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/><text x="599" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="0.4" fill="#fde68a">CAUSAL_EFFECT_SUPPORTED</text></g>
<text x="93" y="592" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.06em" fill="#a8a29e">OFF-LADDER · RETAINED FINDINGS</text><g><rect x="93" y="604" width="96" height="30" rx="6" fill="rgba(180,83,9,0.12)" stroke="#f59e0b" stroke-width="1.2"/><text x="101" y="623" font-family="ui-monospace, monospace" font-size="12" fill="#fde68a">DEPRECATED</text></g>
<text x="583" y="592" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.06em" fill="#a8a29e">OFF-LADDER · RETAINED FINDINGS</text><g><rect x="583" y="604" width="121.2" height="30" rx="6" fill="rgba(180,83,9,0.12)" stroke="#f59e0b" stroke-width="1.2"/><text x="591" y="623" font-family="ui-monospace, monospace" font-size="12" fill="#fde68a">NO_CLEAR_GAIN</text></g><g><rect x="716.2" y="604" width="213.60000000000002" height="30" rx="6" fill="rgba(180,83,9,0.12)" stroke="#f59e0b" stroke-width="1.2"/><text x="724.2" y="623" font-family="ui-monospace, monospace" font-size="12" fill="#fde68a">HARM_OR_REGRESSION_FOUND</text></g>
<text x="530" y="686" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf7f2">A protocol can top the left ladder and still sit at NO_CLEAR_GAIN — as the 0.1.0 predecessors did. That is the design.</text>
</svg>

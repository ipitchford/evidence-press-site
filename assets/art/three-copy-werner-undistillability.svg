<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Three paired three-level systems and a parameter line from minus one to one. The threshold at minus one half separates three-copy distillability from three-copy undistillability, with the endpoint included on the undistillable side. Candidate claim only.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a6dbe4" stop-opacity="0.06"/><stop offset="1" stop-color="#a6dbe4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif" fill="#f6f0e8"><text class="og-hide" x="280" y="62" text-anchor="middle" font-size="29">Three copies · three levels</text><rect x="100" y="116" width="90" height="164" rx="15" fill="#a6dbe4" fill-opacity=".07" stroke="#a6dbe4" stroke-width="2"/><path d="M123 147 H167" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="120" cy="147" r="9" fill="#a6dbe4"/><circle cx="170" cy="147" r="9" fill="#f3c779"/><path d="M123 197 H167" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="120" cy="197" r="9" fill="#a6dbe4"/><circle cx="170" cy="197" r="9" fill="#f3c779"/><path d="M123 247 H167" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="120" cy="247" r="9" fill="#a6dbe4"/><circle cx="170" cy="247" r="9" fill="#f3c779"/><rect x="235" y="116" width="90" height="164" rx="15" fill="#a6dbe4" fill-opacity=".07" stroke="#a6dbe4" stroke-width="2"/><path d="M258 147 H302" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="255" cy="147" r="9" fill="#a6dbe4"/><circle cx="305" cy="147" r="9" fill="#f3c779"/><path d="M258 197 H302" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="255" cy="197" r="9" fill="#a6dbe4"/><circle cx="305" cy="197" r="9" fill="#f3c779"/><path d="M258 247 H302" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="255" cy="247" r="9" fill="#a6dbe4"/><circle cx="305" cy="247" r="9" fill="#f3c779"/><rect x="370" y="116" width="90" height="164" rx="15" fill="#a6dbe4" fill-opacity=".07" stroke="#a6dbe4" stroke-width="2"/><path d="M393 147 H437" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="390" cy="147" r="9" fill="#a6dbe4"/><circle cx="440" cy="147" r="9" fill="#f3c779"/><path d="M393 197 H437" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="390" cy="197" r="9" fill="#a6dbe4"/><circle cx="440" cy="197" r="9" fill="#f3c779"/><path d="M393 247 H437" stroke="#a6dbe4" opacity=".45" stroke-width="2"/><circle cx="390" cy="247" r="9" fill="#a6dbe4"/><circle cx="440" cy="247" r="9" fill="#f3c779"/><text class="og-hide" x="280" y="341" text-anchor="middle" font-size="23">all complex rank-two tests</text><path d="M605 201 H737.5" stroke="#f3c779" stroke-width="13"/><path d="M737.5 201 H1135" stroke="#a6dbe4" stroke-width="13"/><circle cx="737.5" cy="201" r="13" fill="#a6dbe4" stroke="#fff" stroke-width="3"/><path d="M737.5 170 V128" stroke="#eee" stroke-width="2"/><text class="og-hide" x="870" y="62" text-anchor="middle" font-size="29">The three-copy threshold</text><text class="og-hide" x="737.5" y="113" text-anchor="middle" font-size="34">α = −½</text><text class="og-hide" x="650" y="255" text-anchor="middle" font-size="22" fill="#f3c779">distillable</text><text class="og-hide" x="970" y="255" text-anchor="middle" font-size="22" fill="#a6dbe4">undistillable</text><text class="og-hide" x="605" y="177" text-anchor="middle" font-size="21">−1</text><text class="og-hide" x="1135" y="177" text-anchor="middle" font-size="21">1</text><text class="og-hide" x="870" y="341" text-anchor="middle" font-size="21">endpoint included · candidate theorem</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on quadrant dependence and rank correlations of exchangeable ranks. Left: three interchangeable units drawn as a triangle of discs marked +, + and −, with the observed pair of ranks highlighted; three signs cannot all cancel, and the leftover one costs correlation. Middle: a number line for Gini’s gamma from −1 to +1. The stretch from −1 to −4/9 is shaded as out of reach: for a pair from three exchangeable units Gini’s gamma is never below −4/9, while with no constraint it can reach −1. For comparison, a Gaussian example reaches about −0.379 and the general correlation-matrix bound is −1/2. A note adds that 3γ − 2ρ is never below −23/54 for three units. Right: for Archimedean copulas all four conjectured implications between quadrant dependence and the positive or negative measure inducing property are crossed out as failing. Footer: exact population bounds; the four counterexamples are deliberately tiny effects.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Three interchangeable units cap negative dependence</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">two ranks drawn from a cluster of three exchangeable units: how negatively can they be related?</text><path d="M150,140L96,262L204,262Z" stroke="#d9d2c4" stroke-width="1.4" fill="none" opacity=".5"/><path d="M96,262L204,262" stroke="#f6c177" stroke-width="4"/><circle cx="150" cy="140" r="24" fill="#8fd3c8" opacity="0.85"/><text class="og-hide" x="150" y="148" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">−</text><circle cx="96" cy="262" r="24" fill="#f6c177" opacity="1"/><text class="og-hide" x="96" y="270" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">+</text><circle cx="204" cy="262" r="24" fill="#f6c177" opacity="1"/><text class="og-hide" x="204" y="270" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">+</text><text class="og-hide" x="150" y="304" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">the observed pair</text><text class="og-hide" x="150" y="326" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">three signs cannot all cancel:</text><text class="og-hide" x="150" y="344" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">the odd one costs correlation</text><rect x="330" y="184" width="158.3" height="32" fill="#d9d2c4" opacity=".16"/><text class="og-hide" x="409.1666666666667" y="234" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">out of reach</text><path d="M330 200H900" stroke="#f6f2ea" stroke-width="2"/><path d="M330.0 192v16" stroke="#f6f2ea" stroke-width="2"/><text class="og-hide" x="330.0" y="234" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">−1</text><path d="M615.0 192v16" stroke="#f6f2ea" stroke-width="2"/><text class="og-hide" x="615.0" y="234" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">0</text><path d="M900.0 192v16" stroke="#f6f2ea" stroke-width="2"/><text class="og-hide" x="900.0" y="234" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">+1</text><path d="M488.3 166V216" stroke="#f6c177" stroke-width="3"/><circle cx="488.3" cy="200" r="7" fill="#f6c177"/><text class="og-hide" x="488.3" y="156" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">least Gini’s gamma: −4/9</text><path d="M507.0 210v34" stroke="#8fd3c8" stroke-width="1.6"/><text class="og-hide" x="513.0" y="258" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Gaussian example ≈ −0.379</text><path d="M472.5 210v58" stroke="#d9d2c4" stroke-width="1.4" stroke-dasharray="3 3"/><text class="og-hide" x="466.5" y="282" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">correlation-matrix bound −1/2</text><text class="og-hide" x="330" y="126" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">with no constraint: down to −1</text><text class="og-hide" x="330" y="334" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">also: 3γ − 2ρ is never below −23/54 for three units</text><text class="og-hide" x="950" y="132" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="bold" text-anchor="start">Archimedean copulas:</text><text class="og-hide" x="950" y="152" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">all four conjectured links fail</text><path d="M950 180l12 12M962 180l-12 12" stroke="#f6c177" stroke-width="2.6"/><text class="og-hide" x="972" y="190" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">quadrant dep. ⇒ PMI</text><path d="M950 214l12 12M962 214l-12 12" stroke="#f6c177" stroke-width="2.6"/><text class="og-hide" x="972" y="224" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">PMI ⇒ quadrant dep.</text><path d="M950 248l12 12M962 248l-12 12" stroke="#f6c177" stroke-width="2.6"/><text class="og-hide" x="972" y="258" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">neg. quadrant ⇒ NMI</text><path d="M950 282l12 12M962 282l-12 12" stroke="#f6c177" stroke-width="2.6"/><text class="og-hide" x="972" y="292" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">NMI ⇒ neg. quadrant</text><text class="og-hide" x="1160" y="388" fill="#d9d2c4" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">Exact population bounds · the four counterexamples are deliberately tiny effects</text>
</svg>
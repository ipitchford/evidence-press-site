<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on thin, strong films at a hard wall. Title: A thin film at a hard wall. Subtitle: which wall survives as the film shrinks, and the limit is uniform exactly when the film cannot bind a particle. Left: a hard wall with a shaded film next to it and the zero-energy solution across a square-well film. Beyond the film the solution is a straight line. A tilted line (well with k l = 1) leaves a hard wall; extended backwards it meets zero outside the wall, showing the wall moved out by epsilon times c. A flat line (resonant well, k l = pi/2) gives a Robin wall. Right: a table of four square wells of depth k squared and width l. k l = 1: hard wall, uniform, error of order epsilon. k l = pi/2: Robin wall, uniform, error of order the square root of epsilon. k l = pi: hard wall, not uniform, error stays maximal. k l = 3 pi/2: Robin wall, not uniform, error stays maximal. Uniform exactly when the film cannot bind a particle (k l at most pi/2). Robin strength: half the sum of the principal curvatures of the wall. Bounded smooth regions, dimension two or more; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

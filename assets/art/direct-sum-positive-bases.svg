s-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">no small change improves it</text><line x1="670" y1="108" x2="670" y2="372" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text class="og-hide" x="700" y="112" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">The general theorem</text><text class="og-hide" x="700" y="156" fill="#f6f2ea" font-family="Georgia,serif" font-size="22" font-weight="normal" font-style="normal" text-anchor="start">cos measure ≤ 1 / √(r₁² + r₂² + … + rₖ²)</text><text class="og-hide" x="700" y="182" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">for simplices in complementary subspaces of dimensions r₁, …, rₖ,</text><text class="og-hide" x="700" y="202" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">equality only when they are regular and perpendicular</text><text class="og-hide" x="700" y="246" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">And no nearby configuration does better,</text><text class="og-hide" x="700" y="270" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">inside the class or outside it, in every dimension:</text><text class="og-hide" x="700" y="290" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">the conjectured best sphere coverings by few caps</text><text class="og-hide" x="700" y="310" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">are at least locally best</text><text class="og-hide" x="700" y="352" fill="#bcc
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on direct-sum positive bases. Title: Perpendicular simplices win: the best direction sets for derivative-free search. Subtitle: cosine measure is the cosine of the worst angle between any direction and its nearest trial direction; bigger is better. Left, six unit directions in four dimensions: top, two regular triangles of arrows in perpendicular planes x1x2 and x3x4, labelled cos measure 1/√8 ≈ 0.354, best of all direct sums of this size; bottom, a regular tetrahedron of arrows in x1x2x3 perpendicular to a pair of opposite arrows on x4, labelled cos measure 1/√10 ≈ 0.316, worse, yet also a local optimum: no small change improves it. Right, the general theorem: cos measure ≤ 1/√(r1² + … + rk²) for simplices in complementary subspaces of dimensions r1, …, rk, with equality only when they are regular and perpendicular; and no nearby configuration does better, inside the class or outside it, in every dimension, so the conjectured best sphere coverings by few caps are at least locally best. Note: the global question stays open for sizes n + 3 to 2n − 2.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Perpendicular simplices win: the best direction sets for derivative-free search</text><text class="og-hide" x="40" y="80" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Cosine measure = cosine of the worst angle between any direction and its nearest trial direction (bigger is better)</text><text class="og-hide" x="40" y="112" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Six unit directions in four dimensions</text><circle cx="105" cy="190" r="52" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="105" y1="190" x2="105.0" y2="149.4" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="105.0,144.0 110.0,153.0 100.0,153.0" fill="#ffb36b"/><line x1="105" y1="190" x2="140.2" y2="210.3" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="144.8,213.0 134.6,212.8 139.5,204.2" fill="#ffb36b"/><line x1="105" y1="190" x2="69.8" y2="210.3" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="65.2,213.0 70.5,204.2 75.4,212.8" fill="#ffb36b"/><text class="og-hide" x="178" y="200" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="middle">⊥</text><circle cx="250" cy="190" r="52" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="250" y1="190" x2="250.0" y2="149.4" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="250.0,144.0 254.9,153.0 245.1,153.0" fill="#ffb36b"/><line x1="250" y1="190" x2="285.2" y2="210.3" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="289.8,213.0 279.6,212.8 284.5,204.2" fill="#ffb36b"/><line x1="250" y1="190" x2="214.8" y2="210.3" stroke="#ffb36b" stroke-width="3" stroke-linecap="round"/><polygon points="210.2,213.0 215.5,204.2 220.4,212.8" fill="#ffb36b"/><text class="og-hide" x="105" y="258" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">triangle in x₁x₂</text><text class="og-hide" x="250" y="258" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">triangle in x₃x₄</text><text class="og-hide" x="320" y="178" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start">cos measure 1/√8 ≈ 0.354</text><text class="og-hide" x="320" y="202" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">best of all direct sums of this size</text><circle cx="105" cy="318" r="52" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="146.0" y1="290.9" x2="118.9" y2="365.1" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="146.0" y1="290.9" x2="81.7" y2="296.7" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="146.0" y1="290.9" x2="73.4" y2="319.4" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="118.9" y1="365.1" x2="81.7" y2="296.7" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="118.9" y1="365.1" x2="73.4" y2="319.4" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="81.7" y1="296.7" x2="73.4" y2="319.4" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><line x1="105" y1="318" x2="141.5" y2="293.8" stroke="#8ecbff" stroke-width="3" stroke-linecap="round"/><polygon points="146.0,290.9 141.2,300.0 135.7,291.7" fill="#8ecbff"/><line x1="105" y1="318" x2="117.4" y2="359.9" stroke="#8ec
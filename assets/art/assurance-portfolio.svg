<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t3 d3">
<title id="t3">The sixteen projects: probability of delivery against payoff, medalled by tier</title>
<desc id="d3">A scatter plot. Horizontal axis: probability the project delivers its resolution criterion under agent execution, from 0.1 to 0.9. Vertical axis: supersession-discounted payoff conditional on delivery, from 0.4 to 0.9. Sixteen numbered points drawn as medals in tier colours: gold for projects 1 and 2 at the right, silver for projects 3 to 7 in the middle including the coverage census at payoff 0.82, bronze for projects 8 to 12 clustered near probability 0.4 to 0.5, teal for projects 13 to 16 at the left, and five platinum medals T1 to T5 for the theoretical-core programmes, clustered at probability 0.20 to 0.33 with payoffs from 0.52 up to 0.81 for the compositional calculus. Project 16 sits bottom-left at probability 0.16 but payoff 0.82, annotated as the project that needs a government host. A dashed amber line marks the coin-flip probability of one half.</desc>

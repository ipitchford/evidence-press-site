<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t3 d3">
<title id="t3">The sixteen projects: probability of delivery against payoff</title>
<desc id="d3">A scatter plot. Horizontal axis: probability the project delivers its resolution criterion, from 0.1 to 0.9. Vertical axis: payoff conditional on delivery, from 0.4 to 0.9. Sixteen numbered points. Projects 1 and 2, marked with gold and silver medals, sit far right at probability 0.85 and 0.80 with payoff 0.50. Project 3, bronze, sits at 0.62. The highest payoffs, projects 6 at 0.85 and 5 at 0.82, sit mid-table near probability 0.45. Project 16, blind proficiency testing, sits bottom-left at probability 0.15 but payoff 0.80, annotated as the project that needs a government host. A dashed line marks the coin-flip probability of one half.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t3 d3">
<title id="t3">The sixteen projects: probability of delivery against payoff, medalled by tier</title>
<desc id="d3">A scatter plot. Horizontal axis: probability the project delivers its resolution criterion, from 0.1 to 0.9. Vertical axis: payoff conditional on delivery, from 0.4 to 0.9. Sixteen numbered points drawn as medals in tier colours: gold for projects 1 and 2 at the right, silver for projects 3 to 6 in the middle, bronze for projects 7 to 11 clustered near probability 0.4, teal for projects 12 to 16 at the left. The highest payoffs, projects 6 at 0.85 and 5 at 0.82, are silver. Project 16 sits bottom-left at probability 0.15 but payoff 0.80, annotated as the project that needs a government host. A dashed amber line marks the coin-flip probability of one half.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t3 d3">
<title id="t3">The sixteen projects and five core programmes: probability of delivery against payoff, medalled by tier, assessed 2026-11-04</title>
<desc id="d3">A scatter plot. Horizontal axis: probability the project delivers its resolution criterion under agent execution. Vertical axis: supersession-discounted payoff conditional on delivery, from 0.15 to 0.75. Numbered points are medals in tier colours: one gold at probability 0.86, silver from 0.55 to 0.68, bronze at 0.40, teal from 0.10 to 0.33, and platinum for the five theoretical-core programmes from 0.17 to 0.37. Project 14, blind proficiency testing, has the highest payoff in the portfolio at low probability. A dashed amber line marks the coin-flip probability of one half. Overlapping points are moved sideways by up to 20 pixels.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/></linearGradient></defs>

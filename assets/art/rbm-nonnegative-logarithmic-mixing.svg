<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Alternating exact heat-bath updates redraw layer L and then layer R in one complete sweep. For nonnegative interactions and biases, the candidate worst-start total-variation upper bound min(1,(n/2)(2/e)^(2k-2)) is plotted at n=one million on a logarithmic vertical axis, joining the integer-sweep bounds. At 30 sweeps it is 0.00932459, below 0.01. This is a theorem bound, not simulation or elementary-operation runtime; the small layer diagram is schematic.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#edbc76" stop-opacity="0.06"/><stop offset="1" stop-color="#edbc76" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="art-description">
<desc id="art-description">At matrix order eight the graph code has sixteen coordinates. Under the binary coefficient-span bound e at most three, the theorem gives a subcode of dimension at least two supported on at most eight coordinates, forcing minimum distance at most seven. The support diagram is schematic. Over the sixteen-element field a classical Cauchy construction instead attains distance nine; it has coefficient-span dimension four and lies outside that hypothesis.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#61d9c0" stop-opacity="0.25"/><stop offset="1" stop-color="#61d9c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

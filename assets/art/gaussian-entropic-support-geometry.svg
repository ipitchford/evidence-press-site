<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Two unit-variance Gaussian supports are represented by almost perpendicular lines. The exact rank-one squared Wasserstein joint-plan error is plotted against u, entropy divided by positive support cosine c. At u equal to one the squared distance is approximately 0.402. The curve is calculated directly from the manuscript formula, not simulated. Exactly zero cosine has a different selected limit and is excluded from this curve.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f4cb86" stop-opacity="0.06"/><stop offset="1" stop-color="#f4cb86" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif" fill="#fbf3e5">
<text x="235" y="58" text-anchor="middle" font-size="28">nearly perpendicular supports</text>

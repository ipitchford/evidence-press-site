<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">A local fold schematic shows the birth of a saddle and a minimum. Antipodal symmetry creates two such pairs. The exact global counts change from 6 minima, 6 maxima and 10 saddles to 8 minima, 6 maxima and 12 saddles: 22 to 26. This is not a numerical flow simulation.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#efb8c9" stop-opacity="0.06"/><stop offset="1" stop-color="#efb8c9" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on Hankel determinants of an oscillatory complex weight. Left: computed curves of the 2-by-2 determinant (green) and the 3-by-3 determinant (red) against frequency x from 0 to 20, for exponent alpha 0 (solid) and 1.5 (dashed), normalised by their values at x = 0 and drawn on a signed logarithmic scale. A dashed gold line marks zero. The green curves stay above zero throughout; the red curves cross zero repeatedly, each crossing marked as a frequency where no orthogonal polynomial of degree 3 exists. Right, in gold: Even sizes never vanish. Proved for every even size, every alpha greater than minus one and every real frequency, so even-degree rules for oscillatory integrals always exist (existence only).</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.45" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Oscillatory Gegenbauer Hankel determinants: even sizes stay positive</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Weight (1 − t²)ᵅ e^(ixt) on [−1, 1]; computed values, normalised by the value at x = 0</text><text class="og-hide" x="90" y="110" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">size of the determinant against frequency x (signed log scale)</text><rect x="90" y="230" width="610" height="110" fill="#ff9a8a" fill-opacity=".04"/><path d="M90 230.0 H700" stroke="#ffd77a" stroke-width="1.6" stroke-dasharray="5 4"/><text class="og-hide" x="708" y="235" fill="#ffd77a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">0</text><text class="og-hide" x="96" y="332" fill="#ff9a8a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">each crossing of 0: no orthogonal polynomial of degree 3 at that x</text><path d="M90.0 128.5 L97.6 128.5 L105.3 128.7 L112.9 129.0 L120.5 129.4 L128.1 130.0 L135.8 130.6 L143.4 131.4 L151.0 132.3 L158.6 133.3 L166.3 134.3 L173.9 135.4 L181.5 136.6 L189.1 137.7 L196.8 138.9 L204.4 140.0 L212.0 141.0 L219.6 142.0 L227.3 142.8 L234.9 143.6 L242.5 144.3 L250.1 145.0 L257.8 145.6 L265.4 146.2 L273.0 146.7 L280.6 147.3 L288.3 147.9 L295.9 148.5 L303.5 149.1 L311.1 149.6 L318.8 150.1 L326.4 150.6 L334.0 151.1 L341.6 151.5 L349.3 151.9 L356.9 152.3 L364.5 152.7 L372.1 153.1 L379.8 153.5 L387.4 153.9 L395.0 154.3 L402.6 154.6 L410.3 155.0 L417.9 155.4 L425.5 155.7 L433.1 156.0 L440.8 156.3 L448.4 156.6 L456.0 156.9 L463.6 157.2 L471.3 157.5 L478.9 157.8 L486.5 158.1 L494.1 158.4 L501.8 158.7 L509.4 158.9 L517.0 159.2 L524.6 159.5 L532.3 159.7 L539.9 160.0 
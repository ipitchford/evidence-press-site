<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a combinatorics paper. Left: a graph on seven vertices made of two separate edges and a path of two edges. Centre: a bar chart of the share of k-vertex sets that contain an edge, for k from 0 to 7, rising from zero to one, with fractions such as 4/21 and 19/35 marked; the sequence is log-concave at every k. Right: with witnesses of size three the needed inequality fails, 96 is less than 120, for counts 0, 1, 4, 10, 5, 1. Caption: Xie–Xu Conjecture 4.1 proved.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.45" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="28" font-weight="normal" text-anchor="start">Dependent sets of a graph are ultra log-concave</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">For every graph, d_k / C(n,k) is a log-concave sequence, even with vertex weights; witnesses of size three fail</text><text class="og-hide" x="50" y="126" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">A graph on 7 vertices</text><text class="og-hide" x="50" y="148" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">dependent = contains an edge</text><path d="M70 200 L70 270" stroke="#e3d9c9" stroke-width="2.4"/><path d="M140 200 L140 270" stroke="#e3d9c9" stroke-width="2.4"/><path d="M215 190 L215 245" stroke="#e3d9c9" stroke-width="2.4"/><path d="M215 245 L215 300" stroke="#e3d9c9" stroke-width="2.4"/><circle cx="70" cy="200" r="8" fill="#ffd77a"/><circle cx="70" cy="270" r="8" fill="#ffd77a"/><circle cx="140" cy="200" r="8" fill="#ffd77a"/><circle cx="140" cy="270" r="8" fill="#ffd77a"/><circle cx="215" cy="190" r="8" fill="#ffd77a"/><circle cx="215" cy="245" r="8" fill="#ffd77a"/><circle cx="215" cy="300" r="8" fill="#ffd77a"/><text class="og-hide" x="290" y="126" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Share of k-sets that are dependent</text><text class="og-hide" x="290" y="148" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">d_k / C(7,k): log-concave at every k</text><path d="M290 154 V340 H690" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.3" fill="none"/><rect x="299.0" y="340.0" width="32.0" height="0.0" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="315.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><rect x="349.0" y="340.0" width="32.0" height="0.0" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="365.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><rect x="399.0" y="305.7" width="32.0" height="34.3" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="415.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text class="og-hide" x="415.0" y="299.7" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">4/21</text><rect x="449.0" y="242.3" width="32.0" height="97.7" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="465.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">3</text><text class="og-hide" x="465.0" y="236.3" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">19/35</text><rect x="499.0" y="180.6" width="32.0" height="159.4" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="515.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text class="og-hide" x="515.0" y="174.6" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">31/35</text><rect x="549.0" y="160.0" width="32.0" height="180.0" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="565.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><text class="og-hide" x="565.0" y="154.0" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">21/21</text><rect x="599.0" y="160.0" width="32.0" height="180.0" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="615.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text class="og-hide" x="615.0" y="154.0" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">7/7</text><rect x="649.0" y="160.0" width="32.0" height="180.0" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="665.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">7</text><text class="og-hide" x="665.0" y="154.0" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">1/1</text><text class="og-hide" x="690" y="376" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">set size k</text><path d="M730 108 L 730 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="760" y="126" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Triples break it</text><text class="og-hide" x="760" y="148" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">witnesses of size three, counts (0, 1, 4, 10, 5, 1):</text><text class="og-hide" x="760" y="196" fill="#e3d9c9" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">need 2·3·4² ≥ 3·4·1·10</text><text class="og-hide" x="760" y="262" fill="#ff9f80" font-family="Georgia,serif" font-size="54" font-weight="bold" text-anchor="start">96 &lt; 120</text><text class="og-hide" x="760" y="300" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">so pairs (graph edges) are exactly the limit</text><text class="og-hide" x="760" y="340" fill="#9be3c0" font-family="Georgia,serif" font-size="18" font-weight="bold" text-anchor="start">Xie–Xu Conjecture 4.1: proved</text>
</svg>
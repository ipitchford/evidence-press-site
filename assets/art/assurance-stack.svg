<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t2 d2">
<title id="t2">The verifiability stack and its oracles</title>
<desc id="d2">Four horizontal layers. Bottom: extractable facts and citations, checked by machine against source hashes, exhaustively. Second: statistical claims, re-computed by deterministic replay. Third: causal and identification claims, partially formalisable as certificates and countermodels. Top: framing and value judgements, human only. Layers get more amber toward the top, marking the share of human judgement. An arrow on the right points downward, labelled: push products down the stack, so human hours concentrate where only humans can supply them.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/></linearGradient>
<marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
</defs>

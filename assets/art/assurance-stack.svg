<text x="60" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e7e5e4">The verifiability stack — what checks each claim class, and how completely</text>
<rect x="90" y="110" width="880" height="86" rx="10" fill="#f59e0b" opacity="0.3"/>
<rect x="90" y="110" width="880" height="86" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1" opacity="0.18"/>
<text x="116" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#fde68a">4. Framing and value judgements</text>
<text x="116" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8a938f">no oracle — human judgement only</text>
<text x="944" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#fde68a" text-anchor="end" opacity="0.9">not delegable</text>
<rect x="90" y="212" width="880" height="86" rx="10" fill="#f59e0b" opacity="0.16"/>
<rect x="90" y="212" width="880" height="86" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1" opacity="0.18"/>
<text x="116" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#e7e5e4">3. Causal and identification claims</text>
<text x="116" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8a938f">certificates, null-space witnesses, countermodel search</text>
<text x="944" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e7e5e4" text-anchor="end" opacity="0.9">partially formalisable</text>
<rect x="90" y="314" width="880" height="86" rx="10" fill="#2dd4bf" opacity="0.16"/>
<rect x="90" y="314" width="880" height="86" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1" opacity="0.18"/>
<text x="116" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#e7e5e4">2. Statistical claims</text>
<text x="116" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8a938f">deterministic replay and internal recomputation</text>
<text x="944" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e7e5e4" text-anchor="end" opacity="0.9">re-computable</text>
<rect x="90" y="416" width="880" height="86" rx="10" fill="#2dd4bf" opacity="0.3"/>
<rect x="90" y="416" width="880" height="86" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1" opacity="0.18"/>
<text x="116" y="452" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#a7f3d0">1. Extractable facts and citations</text>
<text x="116" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8a938f">source hashes, span containment, identifier resolution</text>
<text x="944" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a7f3d0" text-anchor="end" opacity="0.9">machine-checkable, exhaustive</text>
<line x1="1050" y1="140" x2="1050" y2="470" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#arw2)" opacity="0.9"/>
<text x="1072" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">push products</text>
<text x="1072" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">down the stack:</text>
<text x="1072" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">machines check</text>
<text x="1072" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">the bottom</text>
<text x="1072" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">exhaustively;</text>
<text x="1072" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">human hours</text>
<text x="1072" y="370" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">concentrate at</text>
<text x="1072" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">the top</text>
<text x="90" y="536" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">Two cautions: correlated model errors limit AI-checking-AI, and a scarce stamp invites rubber-stamping.</text>
</svg>
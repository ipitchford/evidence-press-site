<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how many resolved past cases are needed to learn to combine probability forecasts. Title: how long must the track record be? Left text: several forecasters report honest probabilities; combining them well means learning how their evidence overlaps, from past cases with outcomes. Proved, up to constants: independent forecasters need about log(1/delta)/epsilon cases; when anything goes, about (m to the n plus log(1/delta))/epsilon cases; and everything in between. In the hard cases every pattern of reports and every forecaster’s own record look the same, yet the right combination differs. Centre: the smallest hard example with two forecasters who each report 31/64 or 33/64, drawn as a two-by-two table; each pattern where they agree has chance 1025/4096 and each where they disagree 1023/4096, identical in every alternative; if both say 31/64 the right answer is 833/2050, 961/2050 or 1089/2050. Right: the shape of the bound on log scales, excess error against the number of resolved cases, for independent forecasters, an intermediate dependence where the pooling bias levels off, and arbitrary dependence. Footer: binary outcomes; exact calibrated reports; worst case; constants not optimised; the chart shows the form of the bound only; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.3">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#ffc36b" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">How long must the track record be?</text><text class="og-hide" x="40" y="94" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Several forecasters report honest probabilities.</text><text class="og-hide" x="40" y="114" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Combining them well means learning how their</text><text class="og-hide" x="40" y="134" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">evidence overlaps, from past cases with outcomes.</text><text class="og-hide" x="40" y="174" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Proved, up to constants:</text><text class="og-hide" x="40" y="198" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">independent: about log(1/δ)/ε cases</text><text class="og-hide" x="40" y="220" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">anything goes: about (m<tspan baseline-shift="super" font-size="10">n</tspan> + log(1/δ))/ε cases</text><text class="og-hide" x="40" y="242" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">and everything in between.</text><text class="og-hide" x="40" y="282" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Why so many? In the hard cases every pattern of</text><text class="og-hide" x="40" y="301" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">reports and every forecaster’s own record look</text><text class="og-hide" x="40" y="320" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">the same, yet the right combination differs.</text><text class="og-hide" x="590" y="74" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle">Smallest hard example (two forecasters)</text><text class="og-hide" x="500" y="153" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="end">31/64</text><text class="og-hide" x="500" y="233" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="end">33/64</text><text class="og-hide" x="550" y="100" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">31/64</text><text class="og-hide" x="630" y="100" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">33/64</text><rect x="510" y="108" width="80" height="80" fill="rgba(255,195,107,0.16)" stroke="#c3ccd2" stroke-width="1"/><text class="og-hide" x="550" y="153" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">1025/4096</text><rect x="590" y="108" width="80" height="80" fill="rgba(255,255,255,0.05)" stroke="#c3ccd2" stroke-width="1"/><text class="og-hide" x="630" y="153" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">1023/4096</text><rect x="510" y="188" width="80" height="80" fill="rgba(255,255,2
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Exact threshold for stable nonclique supports: sizes one to five are excluded, while Geneson's six-neuron graph supplies the sharp witness. The drawn arrows are precisely its missing directed edges, not its synapses. The certified expansion has sizes 6, 11, 16 and onward in steps of five, with size-dependent parameters and shrinking stability margin.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#b2bcff" stop-opacity="0.06"/><stop offset="1" stop-color="#b2bcff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><marker id="ctln-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b2bcff"/></marker></defs><g font-family="Arial,sans-serif"><g class="og-hide"><text x="46" y="61" fill="#faf7f2" font-size="26">STABLE NONCLIQUE SUPPORT</text><text x="56" y="176" fill="#f2c680" font-family="Georgia,serif" font-size="78">n ≤ 5</text><text x="58" y="220" fill="#ede6e0" font-size="25">ruled out</text><text x="58" y="268" fill="#c7c6d4" font-size="21">every legal</text><text x="58" y="296" fill="#c7c6d4" font-size="21">parameter pair</text></g><path d="M303.8711801799273 243.1794919243113 L378.5 113.9185842870421" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M311.1916882556161 139.5 L370.0814157129579 105.5" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M313.8711801799273 149.5 L463.1288198200727 149.5" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M311.1916882556161 159.5 L466.2102355330306 249" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M390 114 L390 293" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M476.1288198200727 166.82050807568876 L401.5 296.0814157129579" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M308.1916882556161 275.6961524227067 L367.0814157129579 309.69615242270663" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M466.1288198200727 260.5 L316.8711801799273 260.50000000000006" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M375.6794919243112 300.80384757729337 L316.7897644669694 266.8038475772934" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M380 298.6794919243112 L305.3711801799273 169.41858428704208" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><path d="M293.8711801799273 240.50000000000006 L293.8711801799273 172.5" fill="none" stroke="#b2bcff" stroke-width="1.8" opacity=".68" marker-end="url(#ctln-arrow)"/><circle cx="390" cy="94" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="390" y="100" text-anchor="middle" font-size="18" fill="#faf7f2">1</text><circle cx="486.1288198200727" cy="149.5" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="486.1288198200727" y="155.5" text-anchor="middle" font-size="18" fill="#faf7f2">2</text><circle cx="486.1288198200727" cy="260.5" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="486.1288198200727" y="266.5" text-anchor="middle" font-size="18" fill="#faf7f2">3</text><circle cx="390" cy="316" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="390" y="322" text-anchor="middle" font-size="18" fill="#faf7f2">4</text><circle cx="293.8711801799273" cy="260.50000000000006" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="293.8711801799273" y="266.50000000000006" text-anchor="middle" font-size="18" fill="#faf7f2">5</text><circle cx="293.8711801799273" cy="149.5" r="18" fill="#192030" stroke="#b2bcff" stroke-width="2.5"/><text x="293.8711801799273" y="155.5" text-anchor="middle" font-size="18" fill="#faf7f2">6</text><g class="og-hide"><text x="390" y="357" text-anchor="middle" fill="#b2bcff" font-size="23">6 neurons suffice</text><text x="390" y="389" text-anchor="middle" fill="#c7c6d4" font-size="19">Geneson seed · missing-edge arrows</text><path d="M593 65V355" stroke="#c7c6d4" opacity=".2"/><text x="672" y="75" fill="#faf7f2" font-size="27">A CERTIFIED INFINITE FAMILY</text><path d="M705 168H1120" stroke="#b2bcff" stroke-width="2"/><circle cx="720" cy="168" r="19" fill="#b2bcff" fill-opacity=".12" stroke="#b2bcff" stroke-width="2"/><text x="720" y="240" text-anchor="middle" fill="#faf7f2" font-family="Georgia,serif" font-size="44">6</text><circle cx="873" cy="168" r="27" fill="#b2bcff" fill-opacity=".12" stroke="#b2bcff" stroke-width="2"/><text x="873" y="240" text-anchor="middle" fill="#faf7f2" font-family="Georgia,serif" font-size="44">11</text><circle cx="1026" cy="168" r="35" fill="#b2bcff" fill-opacity=".12" stroke="#b2bcff" stroke-width="2"/><text x="1026" y="240" text-anchor="middle" fill="#faf7f2" font-family="Georgia,serif" font-size="44">16</text><text x="1130" y="183" fill="#b2bcff" font-size="43">…</text><text x="892" y="306" text-anchor="middle" fill="#f2c680" font-family="Georgia,serif" font-size="39">n = 5r + 6</text><text x="892" y="351" text-anchor="middle" fill="#ded8e4" font-size="23">size-dependent parameters</text><text x="892" y="383" text-anchor="middle" fill="#ded8e4" font-size="23">no uniform stability margin</text></g></g>
</svg>
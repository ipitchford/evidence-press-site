<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Number line of goods counts 1 to 9 for three agents with additive valuations. Counts 1 to 5: PMMS allocations always exist (Amanatidis, Markakis and Ntokos 2020). Counts 6 and 7: existence re-proved in the paper. Count 8: existence proved in the paper, through four normal-form size profiles (1,1,5), (1,2,4), (1,3,3) and (2,2,3), the last three split into three sub-cases each, giving ten LRAT certificates. Count 9: counterexamples by Gölz and by Bei, Lin, Liu, Luan and Tao. The least counterexample size is therefore nine.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#9ee0b8" stop-opacity="0.06"/><stop offset="1" stop-color="#9ee0b8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif" fill="#f4efe6"><text x="52" y="54" font-size="23">Three agents, additive values, m goods: must a PMMS allocation exist?</text></g><path d="M78 132 H910" stroke="#f4efe6" stroke-opacity=".25" stroke-width="2"/><circle cx="78" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="78" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">1</text><circle cx="182" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="182" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">2</text><circle cx="286" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="286" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">3</text><circle cx="390" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="390" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">4</text><circle cx="494" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="494" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">5</text><circle cx="598" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="598" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">6</text><circle cx="702" cy="132" r="23" fill="#9ee0b8" fill-opacity=".14" stroke="#9ee0b8" stroke-width="2"/><text x="702" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">7</text><circle cx="806" cy="132" r="30" fill="#9ee0b8" fill-opacity=".28" stroke="#9ee0b8" stroke-width="3"/><text x="806" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="28">8</text><circle cx="910" cy="132" r="23" fill="#f29e7d" fill-opacity=".16" stroke="#f29e7d" stroke-width="2" stroke-dasharray="5 4"/><text x="910" y="141" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="24">9</text><path d="M858 104 V200" stroke="#f29e7d" stroke-width="2" stroke-dasharray="3 5"/><path d="M56 176 V184 H516 V176" fill="none" stroke="#9ee0b8" stroke-opacity=".7" stroke-width="1.5"/><text x="286" y="210" text-anchor="middle" fill="#9ee0b8" font-family="sans-serif" font-size="16">PMMS always exists</text><text x="286" y="231" text-anchor="middle" fill="#ddd8d0" font-family="sans-serif" font-size="14">Amanatidis, Markakis, Ntokos 2020</text><path d="M576 176 V184 H724 V176" fill="none" stroke="#9ee0b8" stroke-opacity=".7" stroke-width="1.5"/><text x="650" y="210" text-anchor="middle" fill="#9ee0b8" font-family="sans-serif" font-size="16">always exists</text><text x="650" y="231" text-anchor="middle" fill="#ddd8d0" font-family="sans-serif" font-size="14">re-proved here</text><text x="910" y="88" text-anchor="middle" fill="#f29e7d" font-family="sans-serif" font-size="15">counterexamples</text><text x="910" y="198" text-anchor="middle" fill="#ddd8d0" font-family="sans-serif" font-size="14">Gölz; Bei et al.</text><text x="806" y="88" text-anchor="middle" fill="#9ee0b8" font-family="sans-serif" font-size="15">new</text><path d="M806 164 V238 C 806 262, 330 250, 330 292" fill="none" stroke="#9ee0b8" stroke-opacity=".45" stroke-width="1.5"/><text x="330" y="318" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="22">(1,1,5)</text><rect x="323" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><path d="M806 164 V238 C 806 262, 480 250, 480 292" fill="none" stroke="#9ee0b8" stroke-opacity=".45" stroke-width="1.5"/><text x="480" y="318" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="22">(1,2,4)</text><rect x="455" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="473" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="491" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><path d="M806 164 V238 C 806 262, 630 250, 630 292" fill="none" stroke="#9ee0b8" stroke-opacity=".45" stroke-width="1.5"/><text x="630" y="318" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="22">(1,3,3)</text><rect x="605" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="623" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="641" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><path d="M806 164 V238 C 806 262, 780 250, 780 292" fill="none" stroke="#9ee0b8" stroke-opacity=".45" stroke-width="1.5"/><text x="780" y="318" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="22">(2,2,3)</text><rect x="755" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="773" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><rect x="791" y="332" width="13" height="13" rx="2" fill="#9ee0b8" fill-opacity=".85"/><text x="892" y="316" fill="#ddd8d0" font-family="sans-serif" font-size="15">bundle sizes of a</text><text x="892" y="335" fill="#ddd8d0" font-family="sans-serif" font-size="15">normal-form allocation</text><text x="892" y="358" fill="#9ee0b8" font-family="sans-serif" font-size="15">■ = one LRAT certificate (10)</text><text x="880" y="258" fill="#f29e7d" font-family="Georgia" font-size="40">m* = 9</text>
</svg>
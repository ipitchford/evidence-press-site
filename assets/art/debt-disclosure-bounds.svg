<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Two hypothetical £100 billion portfolios have the same four-year average maturity: all debt at year four, or £50 billion now and £50 billion at year eight. Under a one-percentage-point rate rise with like-for-like refinancing, their first-year extra costs are £0 and £0.5 billion. Circle area represents principal; horizontal position represents maturity.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f3c16b" stop-opacity="0.06"/><stop offset="1" stop-color="#f3c16b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="43" fill="#d6c8b9" font-family="Georgia,serif" font-size="20" text-anchor="start">SAME £100bn TOTAL · SAME 4-YEAR AVERAGE</text><path d="M630 72 V325" stroke="#ead7c3" stroke-opacity=".22"/><text class="og-hide" x="675" y="45" fill="#d6c8b9" font-family="Georgia,serif" font-size="20" text-anchor="start">FIRST-YEAR EXTRA COST</text><text class="og-hide" x="60" y="99" fill="#f3c16b" font-family="Georgia,serif" font-size="26" text-anchor="start">A</text><text class="og-hide" x="60" y="228" fill="#e59b9c" font-family="Georgia,serif" font-size="26" text-anchor="start">B</text><path d="M110 150 H565" stroke="#f3c16b" stroke-opacity=".45" stroke-width="2"/><path d="M120 145 V156" stroke="#d6c8b9" stroke-opacity=".65"/><path d="M340 145 V156" stroke="#d6c8b9" stroke-opacity=".65"/><path d="M560 145 V156" stroke="#d6c8b9" stroke-opacity=".65"/><path d="M110 280 H565" stroke="#e59b9c" stroke-opacity=".45" stroke-width="2"/><path d="M120 275 V286" stroke="#d6c8b9" stroke-opacity=".65"/><path d="M340 275 V286" stroke="#d6c8b9" stroke-opacity=".65"/><path d="M560 275 V286" stroke="#d6c8b9" stroke-opacity=".65"/><circle cx="340" cy="150" r="38" fill="#f3c16b" fill-opacity=".16" stroke="#f3c16b" stroke-width="3"/><text class="og-hide" x="340" y="157" fill="#f3c16b" font-family="Georgia,serif" font-size="23" text-anchor="middle">100</text><circle cx="120" cy="280" r="27" fill="#e59b9c" fill-opacity=".16" stroke="#e59b9c" stroke-width="3"/><text class="og-hide" x="120" y="287" fill="#e59b9c" font-family="Georgia,serif" font-size="21" text-anchor="middle">50</text><circle cx="560" cy="280" r="27" fill="#e59b9c" fill-opacity=".16" stroke="#e59b9c" stroke-width="3"/><text class="og-hide" x="560" y="287" fill="#e59b9c" font-family="Georgia,serif" font-size="21" text-anchor="middle">50</text><path d="M120 316 V335 M340 316 V335 M560 316 V335" stroke="#d6c8b9" stroke-opacity=".3"/><text class="og-hide" x="120" y="359" fill="#d6c8b9" font-family="Georgia,serif" font-size="19" text-anchor="middle">now</text><text class="og-hide" x="340" y="359" fill="#d6c8b9" font-family="Georgia,serif" font-size="19" text-anchor="middle">4 years</text><text class="og-hide" x="560" y="359" fill="#d6c8b9" font-family="Georgia,serif" font-size="19" text-anchor="middle">8 years</text><text class="og-hide" x="730" y="162" fill="#f3c16b" font-family="Georgia,serif" font-size="67" text-anchor="start">£0</text><text class="og-hide" x="730" y="288" fill="#e59b9c" font-family="Georgia,serif" font-size="67" text-anchor="start">£0.5bn</text><path d="M680 146 H706 M698 138 L706 146 L698 154 M680 273 H706 M698 265 L706 273 L698 281" stroke="#d6c8b9" stroke-width="2.5" fill="none"/><text class="og-hide" x="679" y="353" fill="#d6c8b9" font-family="Georgia,serif" font-size="20" text-anchor="start">+1 percentage point · like-for-like refinancing</text>
</svg>
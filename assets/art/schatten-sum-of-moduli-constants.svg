<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on sums of matrix moduli in Schatten p-norms. Title: How much bigger can a matrix sum be than its absolute values? On the left, for two matrices at p = 3/2 (Lee's problem): previous upper bound 1.1225; new upper bound (Corollary 2.4) 1.0648; certified 3 by 3 example (Proposition 2.5) at least 1.036425; best rank-one value D 1.036414. Note: the constant is exact, D(p,n), whenever there are at least as many matrices as their size n. On the right, a plot of the worst-case constant against the number of matrices m from 1 to 40 at p = 3/2: a dashed grey curve for the previous upper bound m to the power (p−1)/2p rises highest; a blue curve for the new upper bound ((1+√m)/2) to the power 1−1/p lies below it; a red curve for the rank-one value D(p,m), a lower bound, lies lowest; the band between red and blue is shaded and labelled: the true constant lies in this band.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.7" cy="0.5" r="0.45">
<stop offset="0" stop-color="#8cc8ff" stop-opacity="0.06"/><stop offset="1" stop-color="#8cc8ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">How much bigger can a matrix sum be than its absolute values?</text><text class="og-hide" x="40" y="78" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Schatten norms, 1 &lt; p &lt; 2: exact constant when m ≥ n, a new bound for all m</text><text class="og-hide" x="40" y="128" fill="#b9c8d4" font-family="Georgia,serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="start">Can the sum A+B be bigger than |A|+|B|? Yes, by a factor c.</text><text class="og-hide" x="40" y="148" fill="#b9c8d4" font-family="Georgia,serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="start">For two matrices at p = 3/2 (Lee's problem):</text><text class="og-hide" x="40" y="192" fill="#a9b3bc" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start">previous upper bound</text><text class="og-hide" x="560" y="192" fill="#a9b3bc" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">1.1225</text><path d="M40 205 H560" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="232" fill="#8cc8ff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">new upper bound (Cor. 2.4)</text><text class="og-hide" x="560" y="232" fill="#8cc8ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">1.0648</text><path d="M40 245 H560" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="272" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">certified 3×3 example (Prop. 2.5)</text><text class="og-hide" x="560" y="272" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">≥ 1.036425</text><path d="M40 285 H560" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="312" fill="#ff8a7a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">best rank-one value D</text><text class="og-hide" x="560" y="312" fill="#ff8a7a" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">1.036414</text><path d="M40 325 H560" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="360" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Exact constant D(p,n) whenever there are at least as many matrices as their size n.</text><path d="M690.0 330.0 L701.8 316.3 L713.6 306.9 L725.4 299.4 L737.2 293.3 L749.0 287.9 L760.8 283.2 L772.6 279.0 L784.4 275.1 L796.2 271.6 L807.9 268.3 L819.7 265.2 L831.5 262.3 L843.3 259.6 L855.1 257.0 L866.9 254.6 L878.7 252.3 L890.5 250.0 L902.3 247.9 L914.1 245.8 L925.9 243.9 L937.7 242.0 L949.5 240.1 L961.3 238.4 L973.1 236.6 L984.9 235.0 L996.7 233.4 L1008.5 231.8 L1020.3 230.3 L1032.1 228.8 L1043.8 227.3 L1055.6 225.9 L1067.4 224.5 L1079.2 223.2 L1091.0 221.9 L1102.8 220.6 L1114.6 219.3 L1126.4 218.1 L1138.2 216.9 L1150.0 215.7 L1150.0 255.4 L1138.2 256.3 L1126.4 257.1 L1114.6 258.0 L1102.8 258.9 L1091.0 259.8 L1079.2 260.7 L1067.4 261.7 L1055.6 262.7 L1043.8 263.7 L1032.1 264.7 L1020.3 265.7 L1008.5 266.8 L996.7 267.9 L984.9 269.0 L973.1 270.2 L961.3 271.4 L949.5 272.7 L937.7 273.9 L925.9 275.3 L914.1 276.6 L902.3 278.0 L890.5 279.5 L878.7 281.0 L866.9 282.6 L855.1 284.3 L843.3 286.1 L831.5 287.9 L819.7 289.9 L807.9 291.9 L796.2 294.1 L784.4 296.5 L772.6 299.0 L760.8 30
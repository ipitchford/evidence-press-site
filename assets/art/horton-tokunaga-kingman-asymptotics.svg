<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Two rooted binary trees each have four leaves. A balanced tree has Horton-Strahler order three, whereas a comb has order two. Leaves have order one; equal child orders increment, unequal orders retain the maximum. This illustrates why conditioning on leaf count does not fix branching order. A separate Kingman formula records a positive geometric prefactor for limiting branch densities, not a finite-tree simulation.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#b7d9f6" stop-opacity="0.06"/><stop offset="1" stop-color="#b7d9f6" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

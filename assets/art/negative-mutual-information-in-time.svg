<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on negative mutual information in time. Title: Negative mutual information in time in the smallest dimensions. Subtitle: Three levels in, two out, a rank-two start: where a proposed quantum mutual information in time turns negative. Left: the coherent erasure family dips below zero. A solid curve shows the mutual information in time of the coherent completion as the channel parameter t runs from 0 to 1; it is negative on a shaded interval from 0 to tau and rises to log 2. A dashed line shows the incoherent completion, t log 2, which is never negative. A dot marks t = 5/21. Centre: at t = 5/21 the sign is a comparison of two whole numbers: 5 to the fifth times 7 to the seventh, 2573571875, is less than 2 to the fourteenth times 3 to the twelfth, 8707129344; so I(5/21) is one forty-second of the log of their ratio, about minus 0.029 nats; negative exactly for 0 &lt; t &lt; tau = (square root of 33 minus 1)/16. Right: smallest place it can fail: input levels at least 3, output levels at least 2, rank of the starting state at least 2. All three at once: a certified qutrit-to-qubit example, about minus 0.00139 nats. Not the first counterexample.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

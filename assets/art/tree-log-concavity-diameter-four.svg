<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on log-concavity of independent-set counts in trees. Title: When does a tree stop being log-concave? Left: the tree studied, a hub (orange) joined to the middle vertices (blue) of eight three-vertex paths called cherries, each with two leaves (green); caption: one cherry is a three-vertex path joined at its middle. Middle: a bar split into a green part, yes, log-concave for m up to 16,391, and a red part, no, for m from 16,392; notes: first failure at 49,177 vertices, at one place only; every tree of diameter at most 3 is log-concave, so four is the least failing diameter; no failing diameter-4 tree up to 62 vertices. Right: rows of red blocks showing the failing sizes, counted down from the largest, for m = 10^5 (sizes 22 to 25), 10^6 (27 to 31), 10^12 (56 to 66) and 10^40 (209 to 225); caption: length about 4.93 log log m.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.6" r="0.4">
<stop offset="0" stop-color="#9fd4ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f6f2ea" font-family="Georgia,serif" font-size="26" font-weight="normal" font-style="normal" text-anchor="start">When does a tree stop being log-concave?</text><text class="og-hide" x="40" y="80" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Independent-set counts of a hub with m cherries (diameter four): exact threshold and the shape of the failures</text><line x1="205" y1="250" x2="205.0" y2="188.0" stroke="#bcc8cf" stroke-width="2"/><line x1="205.0" y1="188.0" x2="182.7" y2="140.2" stroke="#bcc8cf" stroke-width="2"/><line x1="205.0" y1="188.0" x2="227.3" y2="140.2" stroke="#bcc8cf" stroke-width="2"/><line x1="205" y1="250" x2="248.8" y2="206.2" stroke="#bcc8cf" stroke-width="2"/><line x1="248.8" y1="206.2" x2="266.9" y2="156.6" stroke="#bcc8cf" stroke-width="2"/><line x1="248.8" y1="206.2" x2="298.4" y2="188.1" stroke="#bcc8cf" stroke-width="2"/><line x1="205" y1="250" x2="267.0" y2="250.0" stroke="#bcc8cf" stroke-width="2"/><line x1="267.0" y1="250.0" x2="314.8" y2="227.7" stroke="#bcc8cf" stroke-width="2"/><line x1="267.0" y1="250.0" x2="314.8" y2="272.3" stroke="#bcc8cf" stroke-width="2"/><line x1="205" y1="250" x2="248.8" y2="293.8" stroke="#bcc8cf" stroke-width="2"/><line x1="248.8" y1="293.8" x2="298.4" y2="311.9" stroke="#bcc8cf" stroke-width="2"/><line x1="248.8" y1="293.8" x2="266.9" y2="343.4" stroke="#bcc8cf" stroke-width="2"/><line x1="205" y1="250" x2="205.0" y2="312.0" stroke="#bcc8cf" stroke-width="2"/><line x1="205.0" y1="312.0" x2="227.3" y2="359.8" stroke="#bcc8cf" stroke-width="2"/><line x1="205.0" y1="312.0" x2="182.7" y2="359.8" stroke="#bcc8cf" stroke-width="2"/><line x1="205" y1="250" x2="161.2" y2="293.8" stroke="#bcc8cf" stroke-width="2"/><line x1="161.2" y1="293.8" x2="143.1" y2="343.4" stroke="#bcc8cf" stroke-width="2"/><line x1="161.2" y1="293.8" x2="111.6" y2="311.9" stroke="#bcc8cf" stroke-width="2"/><line x
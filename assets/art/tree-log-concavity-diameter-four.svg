="M221 254 L 352 300" stroke="#ffb36b" stroke-width="1.2" fill="none"/><text class="og-hide" x="356" y="304" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">hub</text><text class="og-hide" x="205" y="388" fill="#bcc8cf" font-family="Georgia,serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="middle">one cherry = a three-vertex path joined at its middle</text><text class="og-hide" x="430" y="122" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Is the count sequence log-concave?</text><rect x="430" y="172" width="204.6" height="28" rx="4" fill="#9fe0b0" fill-opacity="0.85"/><rect x="638.6" y="172" width="121.4" height="28" rx="4" fill="#ff8a7a" fill-opacity="0.9"/><text class="og-hide" x="440" y="192" fill="#10251a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">yes: m ≤ 16,391</text><text class="og-hide" x="750" y="192" fill="#2a0f0b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="end">no: m ≥ 16,392</text><text class="og-hide" x="430" y="230" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">first failure: 49,177 vertices, at one place only</text><text class="og-hide" x="430" y="252" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">every tree of diameter ≤ 3 is log-concave,</text><text class="og-hide" x="430" y="272" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">so four is the least failing diameter</text><text class="og-hide" x="430" y="306" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">no failing diameter-4 tree up to 62 vertices</text><text class="og-hide" x="800" y="122" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">The failures form one block that grows slowly</text><text class="og-hide" x="800" y="142" fill="#bcc8cf" font-family="Georgia,serif" font-size="12.5" font-weight="normal" font-style="italic" text-anchor="start">failing sizes, counted down from the largest</text><text class="og-hide" x="800" y="188" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">m = 10⁵</text><rect x="900.0" y="173" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="915.3" y="173" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="930.6" y="173" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="945.9" y="173" width="13.3" height="18" rx="2" fill="#ff8a7a"/><text class="og-hide" x="969.1764705882352" y="208" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">22–25</text><text class="og-hide" x="800" y="234" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">m = 10⁶</text><rect x="900.0" y="219" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="915.3" y="219" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="930.6" y="219" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="945.9" y="219" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="961.2" y="219" width="13.3" height="18" rx="2" fill="#ff8a7a"/><text class="og-hide" x="984.4705882352941" y="254" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">27–31</text><text class="og-hide" x="800" y="280" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">m = 10¹²</text><rect x="900.0" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="915.3" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="930.6" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="945.9" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="961.2" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="976.5" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="991.8" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1007.1" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1022.4" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1037.6" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1052.9" y="265" width="13.3" height="18" rx="2" fill="#ff8a7a"/><text class="og-hide" x="1076.235294117647" y="300" fill="#bcc8cf" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">56–66</text><text class="og-hide" x="800" y="326" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">m = 10⁴⁰</text><rect x="900.0" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="915.3" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="930.6" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="945.9" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="961.2" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="976.5" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="991.8" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1007.1" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1022.4" y="311" width="13.3" height="18" rx="2" fill="#ff8a7a"/><rect x="1037.6" y="311" width="13
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Unequal spectral bands receive unequal regularisation, producing anisotropic jitter and a smaller certified population risk than any isotropic choice in the two-band witness. Bar heights are schematic.</desc><defs>

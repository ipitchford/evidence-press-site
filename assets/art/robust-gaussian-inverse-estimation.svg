<stop offset="0" stop-color="#a8c7ff" stop-opacity="0.06"/><stop offset="1" stop-color="#a8c7ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">A tagged-coordinate disturbance and a global nonlinear comparison are distinct variational tests. Rotation symmetry makes each particle marginal Haar. The relative density one plus epsilon cosine theta-one yields particle lambda-N at most one for every N. In the nonlinear proof, the first Fourier mode is penalised by the interaction and other nonconstant modes have squared frequency at least four. A global compactness and rigidity argument, not the mode diagram alone, proves lambda-MF strictly greater than one. The optimum and particle limit remain undetermined.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f4c76d" stop-opacity="0.06"/><stop offset="1" stop-color="#f4c76d" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on optimal paired-comparison designs. On the left, the exact comparison graph of the unique D-optimal Bradley-Terry design for 14 alternatives: a blue group of six weak alternatives (strength 71) and an orange group of six strong alternatives (strength 4380), each joined within itself by all 15 pairs, and two yellow middle alternatives (strength 73 at the top, 4260 at the bottom) joined to every outer alternative: 54 pairs in all. A thick yellow four-cycle runs from a weak alternative to the 73 vertex, to a strong alternative, to the 4260 vertex and back; dashed lines mark its two diagonals, which the design never compares ("no shortcut either way"). On the right, headed "Optimal comparisons with no shortcut: 14 alternatives": the unique D-optimal design compares 54 of the 91 pairs; the four-cycle has neither diagonal, so the graph is not chordal; this disproves the conjecture of Röttger, Kahle and Schwabe (2025) that optimal Bradley-Terry designs are always chordal; its weights are irrational and all 91 optimality conditions were checked exactly.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffd56b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffd56b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for “Small diameter does not control hitting-time robustness”. Left: the diameter-three regular graph G_m drawn collapsed for m = 3, as in the paper’s Figure 1: seven cliques K0 to K6 in a ring, consecutive cliques completely joined; each clique K_i is attached to a portal vertex h_i, and the seven portals form a clique in the centre, so any two vertices are within three steps. The target clique K0 at the top is highlighted. Chevrons on the ring edges show the fixed perturbation: each transition along the ring is multiplied by 1 + η when it moves away from K0 and by 1 − η when it moves towards it; the edge between the two antipodal cliques, at equal distance from K0, is unchanged (marked =), as are the portal edges. Right: the mechanism in three steps: bias along the ring away from K0; depletion, K0 receives tiny stationary mass; Kac’s formula, the hitting time of a vertex v in K0 is at least 1/π′(v) − 1. A callout gives the exact computed figure from the paper’s Table 3: on G54, with 5,995 vertices and ε times the diameter equal to 0.74, the worst-case expected hitting time is 5.80 times larger. The graph is a schematic; the theorem uses m at least 54.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.22" cy="0.5" r="0.8">
<stop offset="0" stop-color="#5eead4" stop-opacity="0.07"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

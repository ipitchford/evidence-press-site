="#effcfa" font-family="Georgia,serif" font-size="11" font-style="italic" text-anchor="middle">h<tspan baseline-shift="sub" font-size="72%">5</tspan></text><circle cx="203.1" cy="158.6" r="10" fill="#0a2629" stroke="#a5f3fc" stroke-width="1.8"/><text x="203.1" y="162.6" fill="#effcfa" font-family="Georgia,serif" font-size="11" font-style="italic" text-anchor="middle">h<tspan baseline-shift="sub" font-size="72%">6</tspan></text><text class="og-hide" x="300" y="42" fill="#ff9f7a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">target K₀</text><text class="og-hide" x="300" y="61" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">stationary mass collapses</text><text class="og-hide" x="28" y="374" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">ring of cliques · bias pushes</text><text class="og-hide" x="28" y="391" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">the walk away from K₀</text><text class="og-hide" x="320" y="374" fill="#a5f3fc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">portal clique: short routes,</text><text class="og-hide" x="320" y="391" fill="#a5f3fc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">rarely used</text><text class="og-hide" x="520" y="70" fill="#effcfa" font-family="Georgia,serif" font-size="31" font-weight="bold" text-anchor="start">Close everywhere, hard to reach</text><text class="og-hide" x="520" y="100" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Every pair of vertices is within 3 steps through the portals h<tspan baseline-shift="sub" font-size="72%">i</tspan> — yet the walk seldom takes them.</text><circle cx="534" cy="144" r="14" fill="none" stroke="#5eead4" stroke-width="2"/><text class="og-hide" x="534" y="149" fill="#5eead4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1</text><text class="og-hide" x="560" y="150" fill="#effcfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">bias</text><text class="og-hide" x="660" y="150" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">each step along the ring × (1 ± η), away from K₀</text><circle cx="534" cy="190" r="14" fill="none" stroke="#5eead4" stroke-width="2"/><text class="og-hide" x="534" y="195" fill="#5eead4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">2</text><text class="og-hide" x="560" y="196" fill="#effcfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">depletion</text><text class="og-hide" x="660" y="196" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">K₀ gets tiny stationary mass π′</text><circle cx="534" cy="236" r="14" fill="none" stroke="#5eead4" stroke-width="2"/><text class="og-hide" x="534" y="241" fill="#5eead4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">3</text><text class="og-hide" x="560" y="242" fill="#effcfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">Kac</text><text class="og-hide" x="660" y="242" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">hitting time of v in K₀ ≥ 1/π′(v) − 1</text><rect x="520" y="290" width="640" height="84" rx="10" fill="#081f22" fill-opacity=".7" stroke="#ff9f7a" stroke-opacity=".75"/><text class="og-hide" x="540" y="347" fill="#ff9f7a" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" text-anchor="start">5.80×</text><text class="og-hide" x="680" y="324" fill="#effcfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">slower worst-case hitting on G₅₄</text><text class="og-hide" x="680" y="350" fill="#b9d8d4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">5,995 vertices · ε·Δ = 0.74 · exact computation</text>
</svg>
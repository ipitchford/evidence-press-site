<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on complementary quantum measurements. Left: a number line from 0 to 4 for the score S, the summed triangular discrimination of two orthogonal qutrit states over two complementary bases. The band from 0 to 8/3 is shaded as reachable; a gold marker at 8/3 reads proved best, and the stretch from 8/3 to the trivial ceiling 4 is dashed and labelled never reached. Notes: equality only on special planes tied to the nine Hesse SIC rays, exact certificate; Fisher-information efficiency of two random complementary settings at most 2/3. Right: for a qubit with a system of dimension n on a logarithmic axis, a red bar shows that every complementary pair was previously known to be fooled only from n = 164, and a green bar shows it is now fooled from n = 4 by a separable state; n = 2 holds and n = 3 is open. The certified margin, minus 9 over 20 million nats, is tiny.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#ffd77a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd77a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Complementary measurements: a sharp 8/3 for qutrits, and no safe choice from n = 4</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Two complementary tables cannot certify total correlation for a qubit paired with any system of dimension 4 or more</text><text class="og-hide" x="70" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Telling two orthogonal qutrit states apart</text><text class="og-hide" x="70" y="150" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">score S = summed triangular discrimination over two complementary bases</text><rect x="70.0" y="227" width="380.0" height="18" rx="4" fill="#8cc8ff" fill-opacity=".55"/><rect x="450.0" y="227" width="190.0" height="18" rx="4" fill="#ff8a8a" fill-opacity=".14" stroke="#ff8a8a" stroke-opacity=".5" stroke-dasharray="5 4"/><path d="M70.0 248 V256" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="70" y="274" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">0</text><path d="M212.5 248 V256" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="212.5" y="274" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1</text><path d="M355.0 248 V256" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="355" y="274" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">2</text><path d="M497.5 248 V256" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="497.5" y="274" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">3</text><path d="M640.0 248 V256" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="640" y="274" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">4</text><path d="M450.0 190 V250" stroke="#ffd77a" stroke-width="3"/><text class="og-hide" x="450" y="180" fill="#ffd77a" font-family="Georgia,serif" font-size="18" font-weight="bold" text-anchor="middle">8/3 · proved best</text><path d="M640.0 206 V250" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="638" y="200" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">4 · trivial ceiling</text><text class="og-hide" x="255.25" y="216" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">reachable</text><text class="og-hide" x="545" y="298" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">never reached</text><text class="og-hide" x="70" y="328" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">Equality only on special planes tied to the nine Hesse SIC rays · exact certificate</text><text class="og-hide" x="70" y="350" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">Fisher-information efficiency of two random complementary settings ≤ 2/3</text><path d="M690 108 L 690 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="730" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Qubit with a dimension-n system</text><text class="og-hide" x="730" y="150" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">can any choice of complementary measurements be trusted?</text><text class="og-hide" x="730" y="190" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">before: every pair fooled only from n = 164</text><rect x="1002.7" y="200" width="147.3" height="16" rx="3" fill="#ff8a8a" fill-opacity=".7"/><text class="og-hide" x="730" y="246" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">now: every pair fooled from n = 4 (separable state)</text><rect x="784.0" y="256" width="366.0" height="16" rx="3" fill="#9be3c0" fill-opacity=".8"/><rect x="738.1" y="256" width="10" height="16" rx="2" fill="#e3d9c9" fill-opacity=".7"/><rect x="762.0" y="256" width="10" height="16" rx="2" fill="#c9b8ff" fill-opacity=".8"/><text class="og-hide" x="743.1428440905356" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2</text><text class="og-hide" x="767.0241737038394" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3</text><text class="og-hide" x="783.9682467169642" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4</text><text class="og-hide" x="837.9364934339285" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10</text><text class="og-hide" x="973.55554540375" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle"></text><text class="og-hide" x="1002.6924643975271" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">164</text><text class="og-hide" x="737.1428440905356" y="312" fill="#c9b8ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">n = 2: holds · n = 3: open</text><text class="og-hide" x="730" y="352" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">margin −9/20,000,000 nats: tiny, but certified exactly</text>
</svg>
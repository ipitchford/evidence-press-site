<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on sharp finite-market prophet inequalities for a single threshold. Title: One fixed price, three buyers, two items: 79% guaranteed. Subtitle: worst-case share of a prophet’s value, buyers in random order with different value distributions, exact (Theorem 2.1). Left: a chart against the stockout target q, how often all the stock sells, from 0 to 1. A rising blue curve, share of stock sold, and a falling pink curve, chance a buyer is served, cross at q* = 0.64, marked by a ring and labelled best sell-out target: 78.7%. Dashed horizontal lines mark the best fixed price with any information, 79.1%, and buyers alike, 85.2%. Right: tune the price to a sell-out target q; the guarantee is the lower of two exact curves, and the best target sits where they cross. Over all market sizes that target attains 1 minus e to the minus k times k to the k over k factorial (63% for one item, 73% for two): the Arnosti-Ma conjecture, proved (Corollary 3.1). Sell-out tuning costs only about 0.03 over n squared; buyers who differ cost about 0.18 over n (two items). Footer: exact curves for n = 3, k = l = 2, the left panel of the paper’s figure; worst cases over all value distributions; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that no order of Rényi entropy keeps every alternating sign under heat flow: every order fails by the sixth derivative, and the first failing derivative is now known on most of the order axis, from 2 above order 3 to 5 near Shannon entropy.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">INFORMATION THEORY · HEAT FLOW</text>
<text class="og-hide" x="56" y="148" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">No Rényi order survives the</text>
<text class="og-hide" x="56" y="194" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">heat flow</text>
<text class="og-hide" x="56" y="236" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">Collision entropy keeps three signs, then fails at</text>
<text class="og-hide" x="56" y="264" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">the fourth</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="99.69999999999999" fill="#ffc36b" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">6th</text>
<text class="og-hide" x="948" y="125.69999999999999" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">all orders fail</text>
<rect x="752" y="158.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="201.7" fill="#9fd3ff" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">4th</text>
<text class="og-hide" x="948" y="227.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">order 2 fails</text>
<rect x="752" y="260.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#a8e0b0" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="303.7" fill="#a8e0b0" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">0.377</text>
<text class="og-hide" x="948" y="329.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">3rd fails below</text>
</svg>
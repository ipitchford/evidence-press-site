<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on which Rényi entropies have alternating time derivatives under heat flow. A step chart plots, against the Rényi order α on a log scale from 0.1 to 10 with order ∞ at the right, the first derivative that can take the wrong sign: the 3rd for orders up to 0.377; the 4th from about 0.389 to 0.849 and at order 2, collision entropy; the 5th near Shannon entropy, from 0.93 to 1.19 and from 1.75 to 1.76; the 3rd between orders 2 and 3; and the 2nd above order 3, including ∞. Light bands mark the intervals where the first failing derivative is not pinned down. A dashed ceiling at the 6th derivative states that every order has failed by then, so no order keeps every sign. Footer: Rényi entropy under Gaussian heat flow.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">No Rényi order survives the heat flow</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">the first time-derivative of Rényi entropy that can take the wrong sign, order by order</text><path d="M110 130H1090" stroke="#f6c177" stroke-width="1.6" stroke-dasharray="6 5"/><text class="og-hide" x="116" y="122" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">every order has failed by the 6th derivative</text><text class="og-hide" x="98" y="295" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">2nd</text><path d="M110 290H1090" stroke="#d9d2c4" stroke-width=".6" opacity=".2"/><text class="og-hide" x="98" y="255" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">3rd</text><path d="M110 250H1090" stroke="#d9d2c4" stroke-width=".6" opacity=".2"/><text class="og-hide" x="98" y="215" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">4th</text><path d="M110 210H1090" stroke="#d9d2c4" stroke-width=".6" opacity=".2"/><text class="og-hide" x="98" y="175" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">5th</text><path d="M110 170H1090" stroke="#d9d2c4" stroke-width=".6" opacity=".2"/><text class="og-hide" x="98" y="135" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">6th</text><path d="M110 130H1090" stroke="#d9d2c4" stroke-width=".6" opacity=".2"/><rect x="366.5" y="130" width="6.1" height="200" fill="#d9d2c4" opacity=".1"/><rect x="523.4" y="130" width="17.6" height="200" fill="#d9d2c4" opacity=".1"/><rect x="588.6" y="130" width="74.5" height="200" fill="#d9d2c4" opacity=".1"/><rect x="664.3" y="130" width="24.7" height="200" fill="#d9d2c4" opacity=".1"/><rect x="110.0" y="250" width="255.0" height="80" fill="#8fd3c8" opacity="0.65" rx="2"/><rect x="372.5" y="210" width="149.3" height="120" fill="#f6c177" opacity="0.75" rx="2"/><rect x="541.0" y="170" width="46.1" height="160" fill="#f6c177" opacity="0.85" rx="2"/><rect x="663.2" y="170" width="3.5" height="160" fill="#f6c177" opacity="0.85" rx="2"/><rect x="685.0" y="210" width="8.0" height="120" fill="#f6c177" opacity="0.75" rx="2"/><rect x="689.0" y="250" width="76.9" height="80" fill="#8fd3c8" opacity="0.65" rx="2"/><rect x="767.3" y="290" width="291.2" height="40" fill="#8fd3c8" opacity="0.55" rx="2"/><path d="M110 330H1090" stroke="#f6f2ea" stroke-width="2"/><path d="M110.0 330v7" stroke="#f6f2ea"/><text class="og-hide" x="110.0" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">0.1</text><path d="M366.5 330v7" stroke="#f6f2ea"/><text class="og-hide" x="366.5" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">0.377</text><path d="M555.0 330v7" stroke="#f6f2ea"/><text class="og-hide" x="555.0" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1</text><path d="M689.0 330v7" stroke="#f6f2ea"/><text class="og-hide" x="689.0" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">2</text><path d="M767.3 330v7" stroke="#f6f2ea"/><text class="og-hide" x="767.3" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">3</text><path d="M1000.0 330v7" stroke="#f6f2ea"/><text class="og-hide" x="1000.0" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10</text><path d="M1060.0 330v7" stroke="#f6f2ea"/><text class="og-hide" x="1060.0" y="354" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">∞</text><text class="og-hide" x="555.0" y="160" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Shannon</text><text class="og-hide" x="695.0" y="200" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">collision entropy: 4th</text><text class="og-hide" x="866.0" y="280" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">above order 3: 2nd</text><text class="og-hide" x="223.6" y="240" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">up to 0.377: 3rd</text><text class="og-hide" x="244.0" y="152" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">light bands: not pinned down</text><text class="og-hide" x="1090" y="374" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">Rényi order α →</text><text class="og-hide" x="48" y="388" fill="#d9d2c4" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Rényi entropy under Gaussian heat flow · log scale in the order · first wrong-signed derivative</text>
</svg>
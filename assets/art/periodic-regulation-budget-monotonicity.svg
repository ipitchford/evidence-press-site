<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for the budget-monotonicity theorem for Gavish and Katriel’s periodic regulation model. Main panel: one year with five permitted treatment dates, drawn evenly spaced. At each date a solid amber bar shows the optimal pulse for a yearly effort budget M1 = 2 and a wider outlined mint bar shows the optimal pulse for the larger budget M2 = 8; every amber bar sits inside its mint bar. Dates 3 and 5 receive no effort at M1 but positive effort at M2, so the set of treated dates grows and no pulse shrinks or is removed (Theorem 1.1 and Corollary 1.2). The pulse sizes are the paper’s computed optima for its five-date equal-price example: at M1 = 2 they are 0.71, 0.33, 0, 0.96 and 0; at M2 = 8 they are 2.18, 1.86, 1.28, 2.50 and 0.18. Inset: with uneven prices p1 = 5/2 and p2 = 1 (Proposition 8.1), starting from the price-weighted budget B0 = (7/2) log(3/2) where both pulses equal log(3/2), raising the budget by 15 percent raises pulse 1 to 0.493 while pulse 2 falls from 0.405 to 0.400, so monotonicity can fail with seasonal prices.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9ebd3" stop-opacity="0.06"/><stop offset="1" stop-color="#a9ebd3" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="44" y="46" fill="#f2f5f8" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="start">More yearly budget: no pulse shrinks, none is removed</text><path d="M70 98.0 V318 H770" stroke="#c9d6e0" stroke-width="1.5" fill="none"/><path d="M64 238.0 h6" stroke="#c9d6e0" stroke-width="1.4"/><path d="M70 238.0 H770" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="59" y="244.0" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="end">1</text><path d="M64 158.0 h6" stroke="#c9d6e0" stroke-width="1.4"/><path d="M70 158.0 H770" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="59" y="164.0" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="end">2</text><text class="og-hide" x="59" y="324" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="end">0</text><text class="og-hide" x="30" y="218.0" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="middle" transform="rotate(-90 30 218.0)">pulse size uᵢ</text><text class="og-hide" x="420" y="370" fill="#9fb1c0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">one year · five permitted treatment dates (evenly drawn)</text><path d="M140.0 318 v6" stroke="#c9d6e0" stroke-width="1.4"/><text class="og-hide" x="140.0" y="344" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">date 1</text><rect x="107.0" y="143.6" width="66" height="174.4" rx="3" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2.4"/><rect x="122.0" y="261.4" width="36" height="56.6" rx="2" fill="#ffc184"/><path d="M280.0 318 v6" stroke="#c9d6e0" stroke-width="1.4"/><text class="og-hide" x="280.0" y="344" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">date 2</text><rect x="247.0" y="169.0" width="66" height="149.0" rx="3" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2.4"/><rect x="262.0" y="291.6" width="36" height="26.4" rx="2" fill="#ffc184"/><path d="M420.0 318 v6" stroke="#c9d6e0" stroke-width="1.4"/><text class="og-hide" x="420.0" y="344" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">date 3</text><rect x="387.0" y="215.8" width="66" height="102.2" rx="3" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2.4"/><path d="M402.0 316.5 h36" stroke="#ffc184" stroke-width="3"/><path d="M560.0 318 v6" stroke="#c9d6e0" stroke-width="1.4"/><text class="og-hide" x="560.0" y="344" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">date 4</text><rect x="527.0" y="117.7" width="66" height="200.3" rx="3" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2.4"/><rect x="542.0" y="241.0" width="36" height="77.0" rx="2" fill="#ffc184"/><path d="M700.0 318 v6" stroke="#c9d6e0" stroke-width="1.4"/><text class="og-hide" x="700.0" y="344" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">date 5</text><rect x="667.0" y="303.9" width="66" height="14.1" rx="3" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2.4"/><path d="M682.0 316.5 h36" stroke="#ffc184" stroke-width="3"/><text class="og-hide" x="420.0" y="203.8" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">off at M₁, on at M₂</text><text class="og-hide" x="700.0" y="291.9" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">new at M₂</text><rect x="104" y="66" width="16" height="18" rx="2" fill="#ffc184"/><text class="og-hide" x="130" y="81" fill="#ffc184" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="start">budget M₁ = 2</text><rect x="104" y="96" width="16" height="18" rx="2" fill="#a9ebd3" fill-opacity=".16" stroke="#a9ebd3" stroke-width="2"/><text class="og-hide" x="130" y="111" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="start">budget M₂ = 8: every pulse ≥, none removed</text><rect x="836" y="72" width="330" height="268" rx="14" fill="#0b141c" fill-opacity=".42" stroke="#c9d6e0" stroke-opacity=".3"/><text class="og-hide" x="854" y="104" fill="#f2f5f8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">Uneven price breaks it</text><text class="og-hide" x="854" y="128" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">two pulses, prices p₁ = 5/2, p₂ = 1</text><path d="M888 146 V278 H1084" stroke="#c9d6e0" stroke-width="1.3" fill="none"/><path d="M888.0 237.1 L1070.0 158.4" stroke="#9fd0ff" stroke-width="3.4" stroke-linecap="round"/><path d="M888.0 237.1 L1070.0 242.3" stroke="#ff9f80" stroke-width="3.4" stroke-linecap="round"/><circle cx="888.0" cy="237.1" r="5" fill="#f2f5f8"/><circle cx="1070.0" cy="158.4" r="4.5" fill="#9fd0ff"/><circle cx="1070.0" cy="242.3" r="4.5" fill="#ff9f80"/><text class="og-hide" x="1079.0" y="164.4" fill="#9fd0ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">u₁ ↑ 0.493</text><text class="og-hide" x="1079.0" y="248.3" fill="#ff9f80" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">u₂ ↓ 0.400</text><text class="og-hide" x="896.0" y="261.1" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">both start at log 3/2 ≈ 0.405</text><text class="og-hide" x="888.0" y="298" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">B₀</text><text class="og-hide" x="1070.0" y="298" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">B₁</text><text class="og-hide" x="979" y="318" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">price-weighted budget B →</text><text class="og-hide" x="44" y="388" fill="#9fb1c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Left: computed optima of the paper’s five-date equal-price example (Theorem 1.1) · inset: exact branch of Proposition 8.1, B₁ = 1.15 B₀</text>
</svg>
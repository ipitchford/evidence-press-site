<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on fractional Hardy constants of convex domains. Title: The fractional Hardy constant on convex domains. Subtitle: Worst convex shape: a slab. Every convex region keeps at least 2 to the minus s of the half-space constant. Left: edge strength as a share of a flat edge, at p = 1: the fractional Hardy constant of each shape divided by that of a half-space; a half-space, exactly 1; a disc, strictly below 1, attained; a thin slab, the minimum, 2 to the minus s. Centre: every convex domain lies in the band between 1 and the new floor 2 to the minus s, plotted against the order s from 0 to 1, with an upper bound for the disc inside the band and the old floor one half as a dashed line below; thin slabs reach the floor; the gain is up to twice the old guarantee. Right: also proved: at small order all convex shapes share one limit; below the half-space value the constant is attained, for balls and planar convex shapes. Open: three-dimensional convex bodies, corners, exact p-ranges; no particular constant is computed.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffd38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

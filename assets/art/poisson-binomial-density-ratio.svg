<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper proving that a count of independent yes/no events with unequal chances is never more likely to take any value than the Poisson law with the same mean, by more than the factor mean divided by variance. Left: the exact distribution of the number of successes among five independent events with chances 0.9, 0.6, 0.5, 0.3 and 0.2 (gold bars, mean 2.5, variance 0.95), the Poisson probabilities with the same mean (blue dots and line), and the Poisson probabilities multiplied by mean over variance, about 2.63 (pink dashed line). Every bar lies below the dashed line; the largest bar-to-Poisson ratio is about 1.63, at three events. Right: the guarantee, and the paper’s worked example: one event with chance 0.99 and 9,999 events with chance 0.01, where the earlier bound gives a factor of 100, the new bound gives 1.02 and the actual worst factor is about 1.0099. The bound concerns single outcomes and events; one-sided tails and total variation distance are compared by other classical results.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.42">
<stop offset="0" stop-color="#ffcf7a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">How far can a count of independent chances beat its Poisson approximation?</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Never by more than the factor mean ÷ variance: the Dümbgen–Wellner conjecture, proved for every Poisson-binomial count</text><path d="M70 336.0 H650" stroke="#e3d9c9" stroke-opacity="0.4" stroke-width="1"/><text class="og-hide" x="62" y="340" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.0</text><path d="M70 275.4 H650" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="62" y="279.44444444444446" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.2</text><path d="M70 214.9 H650" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="62" y="218.88888888888889" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.4</text><path d="M70 154.3 H650" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="62" y="158.33333333333331" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.6</text><rect x="89.6" y="332.6" width="33.4" height="3.4" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="106.25" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><rect x="162.1" y="294.7" width="33.4" height="41.3" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="178.75" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1</text><rect x="234.6" y="227.8" width="33.4" height="108.2" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="251.25" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2</text><rect x="307.1" y="230.8" width="33.4" height="105.2" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="323.75" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3</text><rect x="379.6" y="296.2" width="33.4" height="39.8" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="396.25" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4</text><rect x="452.1" y="331.1" width="33.4" height="4.9" rx="3" fill="#ffcf7a" fill-opacity="0.92"/><text class="og-hide" x="468.75" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">5</text><text class="og-hide" x="541.25" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">6</text><text class="og-hide" x="613.75" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">7</text><path d="M106.3 270.6 L178.8 172.5 L251.3 131.6 L323.8 165.7 L396.3 229.5 L468.8 282.8 L541.3 313.8 L613.8 328.1" stroke="#f2a7c3" stroke-width="2.6" stroke-dasharray="8 6" fill="none" stroke-linejoin="round"/><path d="M106.3 311.1 L178.8 273.9 L251.3 258.3 L323.8 271.3 L396.3 295.5 L468.8 315.8 L541.3 327.6 L613.8 333.0" stroke="#9fd2ff" stroke-width="2.4" fill="none" stroke-linejoin="round"/><circle cx="106.3" cy="311.1" r="4.2" fill="#9fd2ff"/><circle cx="178.8" cy="273.9" r="4.2" fill="#9fd2ff"/><circle cx="251.3" cy="258.3" r="4.2" fill="#9fd2ff"/><circle cx="323.8" cy="271.3" r="4.2" fill="#9fd2ff"/><circle cx="396.3" cy="295.5" r="4.2" fill="#9fd2ff"/><circle cx="468.8" cy="315.8" r="4.2" fill="#9fd2ff"/><circle cx="541.3" cy="327.6" r="4.2" fill="#9fd2ff"/><circle cx="613.8" cy="333.0" r="4.2" fill="#9fd2ff"/><text class="og-hide" x="70" y="376" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">number of events k</text><text class="og-hide" x="62" y="106" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">probability of exactly k events</text><text class="og-hide" x="416.25" y="215.54820504284868" fill="#f2a7c3" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Poisson × mean/variance</text><circle cx="82" cy="132.2" r="4.2" fill="#9fd2ff"/><text class="og-hide" x="94" y="136.16666666666666" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Poisson, same mean</text><text class="og-hide" x="454.75" y="142.2222222222222" fill="#ffcf7a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">gold bars: the exact law</text><text class="og-hide" x="454.75" y="159.2222222222222" fill="#ffcf7a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">for chances 0.9, 0.6, 0.5,</text><text class="og-hide" x="454.75" y="176.2222222222222" fill="#ffcf7a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">0.3 and 0.2</text><path d="M680 112 L 680 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="700" y="134" fill="#f4f1ea" font-family="Georgia,serif" font-size="19" font-weight="normal" text-anchor="start">The guarantee (Theorem 1.1)</text><text class="og-hide" x="700" y="164" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">No outcome is more likely than under Poisson</text><text class="og-hide" x="700" y="183" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">by more than mean ÷ variance.</text><text class="og-hide" x="700" y="211" fill="#f2a7c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Here mean 2.5, variance 0.95: factor 2.63;</text><text class="og-hide" x="700" y="229" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">the bars reach at most 1.63 × Poisson.</text><text class="og-hide" x="700" y="268" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Worked example: one chance 0.99, 9,999 at 0.01</text><text class="og-hide" x="700" y="300" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="start">old bound 100</text><text class="og-hide" x="860" y="300" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="start">→</text><text class="og-hide" x="896" y="300" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="start">new bound 1.02</text><text class="og-hide" x="700" y="324" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">actual worst factor ≈ 1.0099</text><text class="og-hide" x="700" y="360" fill="#c4b7a2" font-family="Georgia,serif" font-size="11.5" font-weight="normal" text-anchor="start">Single outcomes and events; one-sided tails and total variation are compared differently.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on ratios of negative-exponent Riesz capacities. On the left, a map of the plane of the two exponents (numerator against denominator, 0 to 6), following the paper's Figure 1. Above the dashed diagonal, shaded green, two points maximise C_t/C_s (Theorem 1). Below the diagonal the ratio is C_s/C_t: where the numerator exponent s is at least 2, shaded violet, the regular simplex is best (Theorem 2); where s is below 2, shaded orange, the simplex is beaten by splitting a vertex (Theorem 7). A gold line marks the threshold s = 2. On the right, an equilateral triangle with three equal violet points (the regular simplex, optimal when s is at least 2) and an arrow to the same triangle with its top vertex split into two nearby orange points a distance 2h apart, which beats it when s is below 2. A side panel states the exact threshold: for C_s/C_t with s &lt; t in every dimension n of at least 2, the simplex is optimal if and only if s is at least 2, with the bound (n/(n+1)) to the power gamma, gamma = 1/s - 1/t (Corollary 8). The map is schematic, not numerical data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.55" cy="0.55" r="0.42">
<stop offset="0" stop-color="#b9a6ff" stop-opacity="0.06"/><stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">When is the regular simplex the best shape?</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ratios of negative-exponent Riesz capacities of a compact set: the answer switches exactly at exponent 2</text><path d="M100.0 356.0 L430.0 116.0 L100.0 116.0 Z" fill="#7fd8c4" fill-opacity="0.22"/><path d="M210.0 276.0 L430.0 116.0 L430.0 276.0 Z" fill="#b9a6ff" fill-opacity="0.26"/><path d="M100.0 356.0 L210.0 276.0 L430.0 276.0 L430.0 356.0 Z" fill="#ffb38a" fill-opacity="0.22"/><path d="M100 356 L430.0 116.0" stroke="#e3d9c9" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M210.0 276.0 H430.0" stroke="#ffd56b" stroke-width="4"/><path d="M100 356 H430 M100 356 V116" stroke="#c4b7a2" stroke-width="1.3"/><path d="M100.0 356 v6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="100" y="377" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><path d="M100 356.0 h-6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="90" y="361" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">0</text><path d="M210.0 356 v6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="210" y="377" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2</text><path d="M100 276.0 h-6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="90" y="281" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">2</text><path d="M320.0 356 v6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="320" y="377" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4</text><path d="M100 196.0 h-6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="90" y="201" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">4</text><path d="M430.0 356 v6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="430" y="377" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">6</text><path d="M100 116.0 h-6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="90" y="121" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">6</text><text class="og-hide" x="430" y="396" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="end">exponent in the denominator</text><text class="og-hide" x="70" y="104" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">exponent in the numerator</text><text class="og-hide" x="119.25" y="148" fill="#7fd8c4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">two points best</text><text class="og-hide" x="119.25" y="167" fill="#7fd8c4" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">for C<tspan dy="4" font-size="10">t</tspan><tspan dy="-4"> / C</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4"> (Thm 1)</tspan></text><text class="og-hide" x="421.75" y="234" fill="#b9a6ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">regular simplex</text><text class="og-hide" x="421.75" y="252" fill="#b9a6ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">best (Thm 2)</text><text class="og-hide" x="421.75" y="318" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">simplex beaten:</text><text class="og-hide" x="421.75" y="336" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">split a vertex (Thm 7)</text><text class="og-hide" x="438" y="281" fill="#ffd56b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">s = 2</text><path d="M520 112 L 520 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><path d="M615.0 148.0 L679.1 259.0 L550.9 259.0 Z" fill="none" stroke="#e3d9c9" stroke-opacity=".45" stroke-width="1.4"/><circle cx="615.0" cy="148.0" r="9" fill="#b9a6ff" stroke="#1b1b1b" stroke-width="1.2"/><circle cx="679.1" cy="259.0" r="9" fill="#b9a6ff" stroke="#1b1b1b" stroke-width="1.2"/><circle cx="550.9" cy="259.0" r="9" fill="#b9a6ff" stroke="#1b1b1b" stroke-width="1.2"/><path d="M845.0 148.0 L909.1 259.0 L780.9 259.0 Z" fill="none" stroke="#e3d9c9" stroke-opacity=".45" stroke-width="1.4"/><circle cx="832.0" cy="148.0" r="7" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1.2"/><circle cx="858.0" cy="148.0" r="7" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1.2"/><path d="M832.0 132.0 H858.0" stroke="#ffb38a" stroke-width="1.3"/><text class="og-hide" x="845" y="126" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2h</text><circle cx="909.1" cy="259.0" r="9" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1.2"/><circle cx="780.9" cy="259.0" r="9" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1.2"/><text class="og-hide" x="615" y="330" fill="#b9a6ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">regular simplex</text><text class="og-hide" x="615" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">optimal when s ≥ 2</text><text class="og-hide" x="845" y="330" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">one vertex split in two</text><text class="og-hide" x="845" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">beats it when s &lt; 2</text><path d="M708 226 H742" stroke="#e3d9c9" stroke-width="1.6"/><path d="M742 226 l-9 -5 v10 Z" fill="#e3d9c9"/><text class="og-hide" x="960" y="150" fill="#ffd56b" font-family="Georgia,serif" font-size="19" font-weight="normal" text-anchor="start">Exact threshold</text><text class="og-hide" x="960" y="180" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">For C<tspan dy="4" font-size="10">s</tspan><tspan dy="-4"> / C</tspan><tspan dy="4" font-size="10">t</tspan><tspan dy="-4"> with s &lt; t</tspan></text><text class="og-hide" x="960" y="199" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">in every dimension n ≥ 2:</text><text class="og-hide" x="960" y="234" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">simplex optimal</text><text class="og-hide" x="960" y="258" fill="#ffd56b" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="start">⇔  s ≥ 2</text><text class="og-hide" x="960" y="292" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">bound (n/(n+1))<tspan dy="-7" font-size="10">γ</tspan><tspan dy="7">, γ = 1/s − 1/t</tspan></text><text class="og-hide" x="960" y="318" fill="#c4b7a2" font-family="Georgia,serif" font-size="12" font-weight="normal" text-anchor="start">(Corollary 8)</text><path d="M940 130 L 940 330" stroke="#e3d9c9" stroke-opacity=".18" stroke-width="1.2"/>
</svg>
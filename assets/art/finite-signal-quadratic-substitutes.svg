<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">The same sparse three-by-three signal support has supported conditional means zero, zero, absent; absent, a, b; a, absent, b. Each supported cell in a row has conditional signal probability one half. Its exact sharp coefficient is four a squared divided by the square of a plus b. For a equals one half and b equals one, the coefficient is four ninths, below the substitution threshold one, so every admissible disclosure of A passes. For a equals one and b equals one half, the coefficient is sixteen ninths and substitution fails. The axis shows exact coefficients, not measured data. This concerns one disclosure orientation and scalar quadratic value.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a8e8ce" stop-opacity="0.06"/><stop offset="1" stop-color="#a8e8ce" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif">
    <text class="og-hide" x="183" y="51" text-anchor="middle" fill="#fff4e7" font-size="29">Same sparse support</text>
    <text class="og-hide" x="789" y="51" text-anchor="middle" fill="#fff4e7" font-size="33">One threshold. Two outcomes.</text>
    <g fill="#dbcddd" font-size="19" text-anchor="middle">
      <text class="og-hide" x="97" y="99">B₀</text><text class="og-hide" x="179" y="99">B₁</text><text class="og-hide" x="261" y="99">B₂</text>
      <text class="og-hide" x="35" y="146">A₀</text><text class="og-hide" x="35" y="213">A₁</text><text class="og-hide" x="35" y="280">A₂</text>
    </g>
    <rect x="63" y="114" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="97" y="151" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">0</text><rect x="145" y="114" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="179" y="151" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">0</text><rect x="227" y="114" width="68" height="50" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#dbcddd" stroke-opacity=".15" stroke-dasharray="3 5"/><text class="og-hide" x="261" y="151" text-anchor="middle" fill="#a697ad" font-family="Georgia,serif" font-size="37">—</text><rect x="63" y="181" width="68" height="50" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#dbcddd" stroke-opacity=".15" stroke-dasharray="3 5"/><text class="og-hide" x="97" y="218" text-anchor="middle" fill="#a697ad" font-family="Georgia,serif" font-size="37">—</text><rect x="145" y="181" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="179" y="218" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">a</text><rect x="227" y="181" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="261" y="218" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">b</text><rect x="63" y="248" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="97" y="285" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">a</text><rect x="145" y="248" width="68" height="50" rx="8" fill="#ffffff" fill-opacity=".025" stroke="#dbcddd" stroke-opacity=".15" stroke-dasharray="3 5"/><text class="og-hide" x="179" y="285" text-anchor="middle" fill="#a697ad" font-family="Georgia,serif" font-size="37">—</text><rect x="227" y="248" width="68" height="50" rx="8" fill="#fff4e7" fill-opacity=".08" stroke="#dbcddd" stroke-opacity=".4"/><text class="og-hide" x="261" y="285" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="37">b</text>
    <text class="og-hide" x="180" y="324" text-anchor="middle" fill="#dbcddd" font-size="19">— impossible signal pair</text>
    <text class="og-hide" x="180" y="347" text-anchor="middle" fill="#dbcddd" font-size="18">other cells: probability ½</text>
    <text class="og-hide" x="180" y="382" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="27">C* = 4a² / (a + b)²</text>
    <path d="M332 210 H399 M388 201 L400 210 L388 219" fill="none" stroke="#fff4e7" stroke-width="2.5" opacity=".5"/>
    <path d="M440 210 H1120" stroke="#dbcddd" stroke-width="3" opacity=".35"/>
    <path d="M440 210 H780" stroke="#a8e8ce" stroke-width="8" stroke-linecap="round" opacity=".65"/>
    <path d="M780 210 H1120" stroke="#ffb0a1" stroke-width="8" stroke-linecap="round" opacity=".65"/>
    <path d="M780 144 V284" stroke="#fff4e7" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>
    <text class="og-hide" x="780" y="126" text-anchor="middle" fill="#fff4e7" font-size="23">threshold</text>
    <text class="og-hide" x="780" y="321" text-anchor="middle" fill="#fff4e7" font-size="34">1</text>
    <text class="og-hide" x="440" y="246" text-anchor="middle" fill="#dbcddd" font-size="21">0</text>
    <text class="og-hide" x="1120" y="246" text-anchor="middle" fill="#dbcddd" font-size="21">2</text>
    <circle cx="591.1111111111111" cy="210" r="13" fill="#a8e8ce" stroke="#342038" stroke-width="4"/>
    <circle cx="1044.4444444444443" cy="210" r="13" fill="#ffb0a1" stroke="#342038" stroke-width="4"/>
    <text class="og-hide" x="591.1111111111111" y="153" text-anchor="middle" fill="#a8e8ce" font-family="Georgia,serif" font-size="65">4/9</text>
    <text class="og-hide" x="1044.4444444444443" y="153" text-anchor="middle" fill="#ffb0a1" font-family="Georgia,serif" font-size="65">16/9</text>
    <text class="og-hide" x="591.1111111111111" y="278" text-anchor="middle" fill="#a8e8ce" font-size="28">all disclosures pass</text>
    <text class="og-hide" x="1044.4444444444443" y="278" text-anchor="middle" fill="#ffb0a1" font-size="28">a disclosure fails</text>
    <text class="og-hide" x="591.1111111111111" y="318" text-anchor="middle" fill="#dbcddd" font-size="22">a = ½, b = 1</text>
    <text class="og-hide" x="1044.4444444444443" y="318" text-anchor="middle" fill="#dbcddd" font-size="22">a = 1, b = ½</text>
    <text class="og-hide" x="790" y="372" text-anchor="middle" fill="#fff4e7" font-size="24">Exact coefficient · scalar quadratic value</text>
  </g>
</svg>
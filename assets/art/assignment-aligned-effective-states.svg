<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Unit 81 on the fresh same-checkpoint bank: ranking AUROC 0.992, but threshold 0.5 detects 88 of 125 positives. A separate schematic shows that equal current reports can have different Boolean clause-edit outcomes; the three tests are not interchangeable.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#8cddcc" stop-opacity="0.06"/><stop offset="1" stop-color="#8cddcc" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="55" y="62" fill="#8cddcc" font-family="Arial,sans-serif" font-size="23">RANKING</text><text class="og-hide" x="55" y="143" fill="#8cddcc" font-family="Arial,sans-serif" font-size="67">0.992</text><text class="og-hide" x="55" y="181" fill="#f4efe6" font-family="Arial,sans-serif" font-size="21">AUROC · unit 81</text><text class="og-hide" x="420" y="62" fill="#f5c47e" font-family="Arial,sans-serif" font-size="23">THRESHOLD</text><text class="og-hide" x="420" y="143" fill="#f5c47e" font-family="Arial,sans-serif" font-size="56">88 / 125</text><text class="og-hide" x="420" y="181" fill="#f4efe6" font-family="Arial,sans-serif" font-size="20">positives detected · cutoff 0.5</text><rect x="55" y="232" width="643" height="38" rx="4" fill="#f5c47e" opacity=".3"/><rect x="55" y="232" width="452.672" height="38" rx="4" fill="#8cddcc" opacity=".85"/><text class="og-hide" x="55" y="310" fill="#f4efe6" font-family="Arial,sans-serif" font-size="23">Strong ranking does not guarantee threshold fidelity.</text><text class="og-hide" x="55" y="354" fill="#c9c4bd" font-family="Arial,sans-serif" font-size="18">Fresh balanced bank · same checkpoint</text><path d="M755 62 V343" fill="none" stroke="#f4efe6" stroke-width="1" opacity="0.22" stroke-linecap="round"/><text class="og-hide" x="805" y="62" fill="#f5c47e" font-family="Arial,sans-serif" font-size="23">EDIT SUFFICIENCY</text><rect x="810" y="106" width="288" height="57" rx="12" fill="none" stroke="#8cddcc" stroke-width="2"/><text class="og-hide" x="838" y="143" fill="#f4efe6" font-family="Arial,sans-serif" font-size="22">Same current report</text><path d="M954 164 V198 M954 198 L858 239 M954 198 L1050 239" fill="none" stroke="#f5c47e" stroke-width="2" opacity="1" stroke-linecap="round"/><circle cx="858" cy="263" r="22" fill="#8cddcc" opacity="0.8"/><circle cx="1050" cy="263" r="22" fill="#f5c47e" opacity="0.8"/><text class="og-hide" x="819" y="313" fill="#8cddcc" font-family="Arial,sans-serif" font-size="22">SAT</text><text class="og-hide" x="1003" y="313" fill="#f5c47e" font-family="Arial,sans-serif" font-size="22">UNSAT</text><text class="og-hide" x="805" y="354" fill="#c9c4bd" font-family="Arial,sans-serif" font-size="18">Separate Boolean edit witness</text>
</svg>
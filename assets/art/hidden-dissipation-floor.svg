<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">A three-state ring is observed as one A state and two B states. The past and future uninterrupted-persistence tests have negative covariance at the target q=1/20. That yields a positive dissipation floor for every compatible finite hidden architecture; the lower bound is not the optimum.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a6dbe4" stop-opacity="0.06"/><stop offset="1" stop-color="#a6dbe4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="none" stroke="#a6dbe4"><path d="M77 207 Q190 148 304 207 L323 316 Q192 368 60 316Z" stroke-opacity=".5" fill="#a6dbe4" fill-opacity=".055" stroke-width="2"/><path d="M190 108 L84 283 L294 283Z" stroke-width="3.5"/></g><circle cx="190" cy="108" r="25" fill="#161c25" stroke="#f3c779" stroke-width="3"/><text x="190" y="116" text-anchor="middle" fill="#f3c779" font-family="Georgia,serif" font-size="25">A</text><circle cx="84" cy="283" r="25" fill="#161c25" stroke="#a6dbe4" stroke-width="3"/><text x="84" y="291" text-anchor="middle" fill="#a6dbe4" font-family="Georgia,serif" font-size="25">B</text><circle cx="294" cy="283" r="25" fill="#161c25" stroke="#a6dbe4" stroke-width="3"/><text x="294" y="291" text-anchor="middle" fill="#a6dbe4" font-family="Georgia,serif" font-size="25">B</text><text x="190" y="44" text-anchor="middle" fill="#f7f1e7" font-family="Georgia,serif" font-size="27">Hidden ring</text><text x="190" y="367" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">opposing rates 1 and 1/20</text><path d="M345 195 H399 M389 187 L401 195 L389 203" fill="none" stroke="#cfccd6" stroke-width="2"/><text x="608" y="44" text-anchor="middle" fill="#f7f1e7" font-family="Georgia,serif" font-size="27">Past meets future</text><path d="M430 192 H786" stroke="#cfccd6" stroke-opacity=".4"/><rect x="438" y="157" width="160" height="70" rx="8" fill="#a6dbe4" fill-opacity=".13"/><rect x="618" y="157" width="160" height="70" rx="8" fill="#f3c779" fill-opacity=".13"/><path d="M438 246 V259 H598 V246 M618 246 V259 H778 V246" fill="none" stroke="#cfccd6" stroke-width="2"/><circle cx="608" cy="192" r="9" fill="#f7f1e7"/><text x="518" y="201" text-anchor="middle" fill="#a6dbe4" font-family="Georgia,serif" font-size="26">past</text><text x="698" y="201" text-anchor="middle" fill="#f3c779" font-family="Georgia,serif" font-size="26">future</text><text x="608" y="129" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">uninterrupted residence in B</text><text x="518" y="287" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">t = 0.3</text><text x="698" y="287" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">t = 0.3</text><text x="608" y="350" text-anchor="middle" fill="#a6dbe4" font-family="Georgia,serif" font-size="31">b &lt; a²</text><path d="M813 195 H851 M840 187 L852 195 L840 203" fill="none" stroke="#cfccd6" stroke-width="2"/><text x="1014" y="44" text-anchor="middle" fill="#f7f1e7" font-family="Georgia,serif" font-size="27">No zero-cost escape</text><path d="M878 106 H1150 M878 306 H1150" stroke="#a6dbe4" stroke-opacity=".4" stroke-width="1.5"/><text x="1014" y="157" text-anchor="middle" fill="#f7f1e7" font-family="Georgia,serif" font-size="23">Every compatible</text><text x="1014" y="190" text-anchor="middle" fill="#f7f1e7" font-family="Georgia,serif" font-size="23">finite architecture</text><text x="1014" y="247" text-anchor="middle" fill="#f3c779" font-family="Georgia,serif" font-size="32">cost &gt; 0.017568</text><text x="1014" y="284" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">certified lower bound</text><text x="1014" y="367" text-anchor="middle" fill="#cfccd6" font-family="Georgia,serif" font-size="20">not the optimal cost</text>
</svg>
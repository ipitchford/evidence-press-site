<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">A seven-vertex retained graph has exactly two connected components, one containing s and one containing t. It illustrates split success, not an optimal graph. The classification strip distinguishes trees, an intermediate nonexistence range, two conditional edge counts, and dense existence. The two boundary counts are certified for 7 through 51 vertices; all orders remain conditional.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#efbd70" stop-opacity="0.06"/><stop offset="1" stop-color="#efbd70" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="none" stroke-linecap="round"><path d="M105,170 L190,90" stroke="#efbd70" stroke-width="4" opacity=".8"/><path d="M190,90 L265,180" stroke="#efbd70" stroke-width="4" opacity=".8"/><path d="M265,180 L170,270" stroke="#efbd70" stroke-width="4" opacity=".8"/><path d="M170,270 L105,170" stroke="#efbd70" stroke-width="4" opacity=".8"/><path d="M105,170 L265,180" stroke="#efbd70" stroke-width="4" opacity=".8"/><path d="M390,95 L460,210" stroke="#b8d8b0" stroke-width="4" opacity=".8"/><path d="M460,210 L350,275" stroke="#b8d8b0" stroke-width="4" opacity=".8"/><path d="M390,95 L350,275" stroke="#b8d8b0" stroke-width="4" opacity=".8"/><path d="M265 180 L390 95 M170 270 L350 275" stroke="#e7ddd4" stroke-width="2" stroke-dasharray="6 10" opacity=".23"/></g><circle cx="105" cy="170" r="19" fill="#efbd70" stroke="#fff8e9" stroke-width="2"/><circle cx="190" cy="90" r="9" fill="#efbd70" stroke="#fff8e9" stroke-width="1"/><circle cx="265" cy="180" r="9" fill="#efbd70" stroke="#fff8e9" stroke-width="1"/><circle cx="170" cy="270" r="9" fill="#efbd70" stroke="#fff8e9" stroke-width="1"/><circle cx="390" cy="95" r="9" fill="#b8d8b0" stroke="#fff8e9" stroke-width="1"/><circle cx="460" cy="210" r="19" fill="#b8d8b0" stroke="#fff8e9" stroke-width="2"/><circle cx="350" cy="275" r="9" fill="#b8d8b0" stroke="#fff8e9" stroke-width="1"/><g font-family="Georgia" fill="#29231f" font-size="25" text-anchor="middle"><text x="105" y="178">s</text><text x="460" y="218">t</text></g><g class="og-hide" font-family="Georgia" fill="#fff4e6" font-size="29"><text x="65" y="42">Success means exactly two components</text><text x="615" y="77">Can one design win for every p?</text></g><rect x="610" y="145" width="70" height="56" rx="7" fill="#b8d8b0" opacity=".88"/><rect x="690" y="145" width="195" height="56" rx="7" fill="#c78b8b" opacity=".88"/><rect x="895" y="145" width="40" height="56" rx="7" fill="#efbd70" opacity=".88"/><rect x="945" y="145" width="40" height="56" rx="7" fill="#efbd70" opacity=".88"/><rect x="995" y="145" width="160" height="56" rx="7" fill="#b8d8b0" opacity=".88"/><g class="og-hide" font-family="system-ui" font-size="21" fill="#f7eade" text-anchor="middle"><text x="645" y="235">trees</text><text x="787" y="235">no uniform best</text><text x="940" y="121">two counts</text><text x="1075" y="235">dense: yes</text><text x="880" y="292">Boundary counts certified for 7 ≤ n ≤ 51</text><text x="880" y="327" font-size="20">All-order boundary question remains open</text><text x="278" y="337">One terminal in each component</text><text x="278" y="367" font-size="17">RETAINED-EDGE SCHEMATIC · NOT AN OPTIMISER</text></g>

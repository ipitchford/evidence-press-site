<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic two-layer graph leads to the claimed parameter window: counterexamples from alpha to 2 and from 2 to 2.764, with the known positive Ising point at 2 excluded. Outside this window no classification is asserted.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a4dfed" stop-opacity="0.06"/><stop offset="1" stop-color="#a4dfed" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Arial, sans-serif"><path d="M75 145v105" stroke="#f5c47b" stroke-width="2" opacity=".55"/><path d="M75 145L150 100 M75 250L150 205" stroke="#a4dfed" stroke-width="3" fill="none"/><path d="M150 100v105" stroke="#f5c47b" stroke-width="2" opacity=".55"/><path d="M150 100L225 140 M150 205L225 245" stroke="#a4dfed" stroke-width="3" fill="none"/><path d="M225 140v105" stroke="#f5c47b" stroke-width="2" opacity=".55"/><path d="M225 140L300 105 M225 245L300 210" stroke="#a4dfed" stroke-width="3" fill="none"/><path d="M300 105v105" stroke="#f5c47b" stroke-width="2" opacity=".55"/><path d="M300 105L355 155 M300 210L355 260" stroke="#a4dfed" stroke-width="3" fill="none"/><path d="M355 155v105" stroke="#f5c47b" stroke-width="2" opacity=".55"/><circle cx="75" cy="145" r="7" fill="#a4dfed" stroke="#faf7f2" stroke-width="1.2"/><circle cx="75" cy="250" r="7" fill="#f5c47b" stroke="#faf7f2" stroke-width="1.2"/><circle cx="150" cy="100" r="7" fill="#a4dfed" stroke="#faf7f2" stroke-width="1.2"/><circle cx="150" cy="205" r="7" fill="#f5c47b" stroke="#faf7f2" stroke-width="1.2"/><circle cx="225" cy="140" r="7" fill="#a4dfed" stroke="#faf7f2" stroke-width="1.2"/><circle cx="225" cy="245" r="7" fill="#f5c47b" stroke="#faf7f2" stroke-width="1.2"/><circle cx="300" cy="105" r="7" fill="#a4dfed" stroke="#faf7f2" stroke-width="1.2"/><circle cx="300" cy="210" r="7" fill="#f5c47b" stroke="#faf7f2" stroke-width="1.2"/><circle cx="355" cy="155" r="7" fill="#a4dfed" stroke="#faf7f2" stroke-width="1.2"/><circle cx="355" cy="260" r="7" fill="#f5c47b" stroke="#faf7f2" stroke-width="1.2"/><text x="215" y="325" text-anchor="middle" fill="#faf7f2" font-size="23">One common edge probability</text><text x="215" y="354" text-anchor="middle" fill="#d1ccd8" font-size="16">two-layer schematic · not a witness graph</text><path d="M405 200H460m-12-8 12 8-12 8" fill="none" stroke="#d1ccd8" stroke-width="2"/><text x="820" y="78" text-anchor="middle" fill="#faf7f2" font-size="27">A positive point, isolated in a window</text><path d="M495 203H572.917059225 M1096.71 203H1155" stroke="#d1ccd8" stroke-width="3" stroke-dasharray="5 7" opacity=".65"/><path d="M572.917059225 203H880.25 M908.25 203H1096.71" stroke="#f5c47b" stroke-width="8"/><circle cx="572.917059225" cy="203" r="6" fill="#f5c47b"/><circle cx="1096.71" cy="203" r="6" fill="#f5c47b"/><circle cx="894.25" cy="203" r="13" fill="#17222c" stroke="#a4dfed" stroke-width="4"/><path d="M894.25 184V128" stroke="#a4dfed" stroke-width="2"/><text x="894.25" y="117" text-anchor="middle" fill="#a4dfed" font-size="25">q = 2 · known positive</text><text x="572.917059225" y="247" text-anchor="middle" fill="#faf7f2" font-size="22">α ≈ 0.7874</text><text x="1096.71" y="247" text-anchor="middle" fill="#faf7f2" font-size="22">2.764</text><text x="820" y="305" text-anchor="middle" fill="#f5c47b" font-size="25">Counterexamples everywhere else in the window</text><text x="820" y="344" text-anchor="middle" fill="#d1ccd8" font-size="19">every prescribed 0 &lt; p &lt; 1 · graph depends on p and q</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that backtracking-weighted PageRank is not coordinatewise monotone in the return weight mu. Left: the five-vertex house graph, a square on vertices 0, 1, 2, 3 with a triangular roof; the roof vertex 4, joined to vertices 0 and 1, is highlighted. Right: the exact roof score pi_mu(4) at damping 1/2 with uniform restart, from the paper’s closed-form cubic response, plotted against mu on a compressed axis mu/(1+mu) so that mu = 0 (non-backtracking), mu = 1 (ordinary PageRank) and mu tending to infinity (always backtrack) all fit. The score starts at pi_0(4) = 638/3615, falls to the ordinary PageRank value pi_1(4) = 22/125, reaches its single lowest point just past mu = 1, and rises towards pi_infinity(4) = 8/45. Both endpoints lie above the middle value, so the score is not monotone. A dashed schematic curve, labelled as such, shows that a monotone response through pi_1 rising to pi_infinity would have put pi_0 below pi_1, in a shaded band; the true value lies above. The vertical scale is magnified: the three values differ by less than 0.002.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.55" r="0.5">
<stop offset="0" stop-color="#86f0b6" stop-opacity="0.07"/><stop offset="1" stop-color="#86f0b6" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#effaf4" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">More backtracking can lower a score, then raise it again</text><text class="og-hide" x="40" y="80" fill="#d2e7dd" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="normal" text-anchor="start">Backtracking-weighted PageRank of the house roof against the return weight μ: both extremes beat ordinary PageRank</text><path d="M110 215 L270 215" stroke="#d2e7dd" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/><path d="M110 215 L110 318" stroke="#d2e7dd" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/><path d="M110 215 L190 140" stroke="#86f0b6" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round"/><path d="M270 215 L270 318" stroke="#d2e7dd" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/><path d="M270 215 L190 140" stroke="#86f0b6" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round"/><path d="M270 318 L110 318" stroke="#d2e7dd" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/><circle cx="190" cy="140" r="34" fill="#86f0b6" fill-opacity=".14"/><circle cx="110" cy="215" r="19" fill="#1d4148" stroke="#d2e7dd" stroke-opacity="0.7" stroke-width="2.5"/><text class="og-hide" x="110" y="222" fill="#effaf4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">0</text><circle cx="270" cy="215" r="19" fill="#1d4148" stroke="#d2e7dd" stroke-opacity="0.7" stroke-width="2.5"/><text class="og-hide" x="270" y="222" fill="#effaf4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">1</text><circle cx="270" cy="318" r="19" fill="#1d4148" stroke="#d2e7dd" stroke-opacity="0.7" stroke-width="2.5"/><text class="og-hide" x="270" y="325" fill="#effaf4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">2</text><circle cx="110" c
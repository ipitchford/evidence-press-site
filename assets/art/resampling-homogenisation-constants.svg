ont-size="12" font-weight="normal" font-style="normal" text-anchor="middle">10</text><text class="og-hide" x="295" y="334" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">20</text><text class="og-hide" x="420" y="334" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">30</text><text class="og-hide" x="420" y="350" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">number of sources n</text><text class="og-hide" x="94.5" y="190.5555555555555" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">peak 14/9 at three sources</text><text class="og-hide" x="420" y="254.27798524673932" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="end">limit ≈ 1.524</text><text class="og-hide" x="80" y="283.99999999999994" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">two sources: 3/2</text><text class="og-hide" x="480" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">The example behind 14/9</text><text class="og-hide" x="480" y="136" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">decide between explanations A and B</text><rect x="480" y="160" width="104" height="58" rx="8" fill="rgba(255,255,255,0.06)" stroke="#f2a7b5" stroke-width="2"/><text class="og-hide" x="532" y="184" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">source 1</text><text class="og-hide" x="532" y="204" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">can rule out A</text><rect x="598" y="160" width="104" height="58" rx="8" fill="rgba(255,255,255,0.06)" stroke="#9fd3ff" stroke-width="2"/><text class="og-hide" x="650" y="184" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">source 2</text><text class="og-hide" x="650" y="204" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">can rule out B</text><rect x="716" y="160" width="104" height="58" rx="8" fill="rgba(255,255,255,0.06)" stroke="#9aa7b0" stroke-width="2"/><text class="og-hide" x="768" y="184" fill="#9aa7b0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">source 3</text><text class="og-hide" x="768" y="204" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">says nothing</text><text class="og-hide" x="480" y="252" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">Look once at each:</text><text class="og-hide" x="630" y="252" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">advantage D</text><text class="og-hide" x="480" y="280" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">Three random draws:</text><text class="og-hide" x="630" y="280" fill="#ffc36b" font-family="Georgia,serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">14D/9 − 2D²/3 + 2D³/27</text><text class="og-hide" x="480" y="304" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">about 14/9 × D when the signals are weak</text><text class="og-hide" x="480" y="336" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">This multiplies the advantage over guessing,</text><text class="og-hide" x="480" y="352" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">not the accuracy itself</text><line x1="878" y1="104" x2="878" y2="372" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text class="og-hide" x="900" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Also proved</text><text class="og-hide" x="900" y="140" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">All data: the constant c is at most</text><text class="og-hide" x="900" y="157" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">9/14, below the old bound 8/9</text><text class="og-hide" x="900" y="184" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Two sources: solved exactly</text><text class="og-hide" x="900" y="211" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Strong evidence: at least n!/nⁿ</text><text class="og-hide" x="900" y="228" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">of the error survives resampling</text><text class="og-hide" x="900" y="262" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">Open: is 9/14 exact? (conjectured;</text><text class="og-hide" x="900" y="278" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">a search found nothing larger)</text><text class="og-hide" x="900" y="302" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">Yes/no data (8/9) not addressed</text>

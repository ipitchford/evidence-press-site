<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on resampling heterogeneous experiments. Title: Resampling heterogeneous experiments. Subtitle: Resample three weak sources: up to 14/9 times the advantage. In general the constant is at most 9/14. Left: how much can resampling help? The worst-case gain in a test’s advantage for erasure experiments with n random draws from n sources, plotted against the number of sources from 2 to 30: two sources give 3/2, the curve peaks at 14/9 at three sources and decreases towards a dashed limit of about 1.524. Centre: the example behind 14/9: deciding between explanations A and B, source 1 can rule out A, source 2 can rule out B, source 3 says nothing. Looking once at each gives advantage D; three random draws give 14D/9 minus 2D squared over 3 plus 2D cubed over 27, about 14/9 times D when the signals are weak. This multiplies the advantage over guessing, not the accuracy itself. Right: also proved: for all data the constant c is at most 9/14, below the old bound 8/9; two sources are solved exactly; with strong evidence at least n factorial over n to the n of the error survives resampling. Open: whether 9/14 is exact (conjectured; a search found nothing larger). Yes/no data (8/9) not addressed.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffd38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

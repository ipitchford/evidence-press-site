<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the small-regularisation limit of Sinkhorn metrics on curved manifolds. Left: a circle of radius R with two points joined by the arc along the circle and by the shorter straight chord, which is what the transport cost measures; because the chord is shorter than the arc, at small epsilon each mode of the metric is multiplied by 1 minus epsilon over 4 R squared, and on a general surface the bias is epsilon over 4 times the integral of Q grad phi dot grad phi, with Q the squared bending of the surface in space. Right: a round circle and an ellipse with semi-axes 1.3 and 0.644, both of length 2 pi, with dots sized by squared curvature. For the direction phi = cos s both have the same limiting value g0 = 1/2, but the first-order bias coefficient is -0.125 for the circle and -0.043 for the ellipse: the bias depends on the embedding, not only on the intrinsic shape.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffcf6e" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">On curved data, Sinkhorn metrics read slightly short</text><text class="og-hide" x="40" y="77" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">The ε → 0 limit is the right Wasserstein metric, but the first error depends on how the surface bends in space</text><text class="og-hide" x="40" y="116" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Cost measured through space</text><text class="og-hide" x="40" y="137" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sinkhorn uses |x − y|², the chord; the surface geometry uses the arc</text><circle cx="150" cy="262" r="96" fill="#ffffff" fill-opacity=".04" stroke="#e3d9c9" stroke-opacity=".55" stroke-width="1.6"/><path d="M70.3 208.5 A96 96 0 0 1 229.8 208.6" stroke="#b8f0c8" stroke-width="4" fill="none"/><path d="M70.3 208.5 L229.8 208.6" stroke="#ffcf6e" stroke-width="3" stroke-dasharray="7 5"/><circle cx="70.3" cy="208.5" r="6" fill="#f4f1ea"/><circle cx="229.8" cy="208.6" r="6" fill="#f4f1ea"/><text class="og-hide" x="150" y="154" fill="#b8f0c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">arc (on the curve)</text><text class="og-hide" x="150" y="230.5" fill="#ffcf6e" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">chord (the cost)</text><path d="M150 262 L119.0 352.8" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.3"/><text class="og-hide" x="122.9" y="312.0" fill="#e3d9c9" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="end">R</text><text class="og-hide" x="272" y="222" fill="#ffcf6e" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">chord shorter than arc, so</text><text class="og-hide" x="272" y="241" fill="#ffcf6e" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">at small ε each mode reads</text><text class="og-hide" x="272" y="272" fill="#ffcf6e" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="start">metric × (1 − ε/4R²)</text><text class="og-hide" x="272" y="294" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">circle of radius R, first order</text><text class="og-hide" x="272" y="335" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">general surface: bias</text><text class="og-hide" x="272" y="354" fill="#e3d9c9" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">(ε/4)·∫⟨Q∇φ, ∇φ⟩ dμ</text><text class="og-hide" x="272" y="373" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Q = squared bending in space</text><path d="M598 100 L 598 385" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="630" y="116" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Same length, different bias</text><text class="og-hide" x="630" y="137" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">two closed curves of length 2π, uniform density, direction φ = cos s</text><circle cx="725" cy="262" r="72" stroke="#8fd3ff" stroke-width="2.4" fill="none"/><circle cx="796.9" cy="258.5" r="2.50" fill="#8fd3ff" fill-opacity=".9"/><circle cx="796.2" cy="251.4" r="2.50" fill="#8fd3ff" fill-opacity=".9"/><circle cx="794.8" cy="244.5" r="2.50" fill="#8fd3ff" fill-opacity=".9"/><circle cx="792.8" cy="237.7" r="2.50" fill="#8fd3ff" fill-opacity=".9"/><circle cx="790.1" cy="231.2" r="2.50" fill
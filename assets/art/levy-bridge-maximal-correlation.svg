<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the maximal correlation of Lévy bridges. Title: Pinning the endpoint can create dependence. Subtitle: maximal correlation R of the two coordinate paths of a Lévy process (wiggles plus jumps), before and after pinning. Left panel, not pinned: two schematic paths, X in blue and Y in pink, each with one jump at a different time; jumps independent, wiggles correlated 0.2; R = 0.2, because the jumps of X and Y carry no shared information. An arrow leads to the right panel: both ends pinned at the same point, marked by a ring; the two jump counts now nearly always agree; R greater than 0.997, certified by interval arithmetic (Appendix A). Below: in general, R for the bridge equals the largest of the wiggle correlation, the dependence of the two lists of jump sizes, and a count of jumps the coordinates make at the same moment (Theorem 2.1). Footer: schematic paths, jump size 8, endpoint marked; example of Section 6.3; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.5" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

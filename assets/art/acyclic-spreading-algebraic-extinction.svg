-weight="bold" text-anchor="middle">W</text><circle cx="254" cy="268" r="21" fill="#0b1a1e" fill-opacity=".6" stroke="#ffd36e" stroke-width="2.4"/><text class="og-hide" x="254" y="275" fill="#ffd36e" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="middle">X</text><circle cx="346" cy="268" r="21" fill="#0b1a1e" fill-opacity=".6" stroke="#c7b7ff" stroke-width="2.4"/><text class="og-hide" x="346" y="275" fill="#c7b7ff" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="middle">R</text><text class="og-hide" x="204" y="334" fill="#ffd36e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">both acyclic: no loops,</text><text class="og-hide" x="204" y="354" fill="#c9d6e0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">yet no exponential extinction</text><text class="og-hide" x="426" y="44" fill="#f2f5f8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="start">Active spreaders fade algebraically, not exponentially</text><path d="M492 330.0 H1150" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="484" y="335.0" fill="#a9bcc4" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end">10<tspan dy="-7" font-size="0.72em">−10</tspan></text><path d="M492 266.5 H1150" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="484" y="271.5" fill="#a9bcc4" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end">10<tspan dy="-7" font-size="0.72em">−8</tspan></text><path d="M492 203.0 H1150" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="484" y="208.0" fill="#a9bcc4" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end">10<tspan dy="-7" font-size="0.72em">−6</tspan></text><path d="M492 139.5 H1150" stroke="#c9d6e0" stroke-opacity=".12"/><text class="og-hide" x="484" y="144.5" fill="#a9bcc4" font-family="Arial,Hel
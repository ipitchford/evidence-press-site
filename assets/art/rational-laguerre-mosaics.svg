<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic tetrahedral insertion keeps its four boundary vertices and adds 62 interior vertices. Six copies per unit cube give 373 vertices, 432 cells and 3276 incidences, hence harmonic degree 468/115 greater than four. The drawing is a construction schematic, not the exact 66-vertex embedding.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9d9f5" stop-opacity="0.06"/><stop offset="1" stop-color="#a9d9f5" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="210" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#a9d9f5">AN UNCHANGED BOUNDARY</text><path d="M210,85L62,278" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".9"/><path d="M210,85L353,278" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".9"/><path d="M210,85L241,205" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".5"/><path d="M62,278L353,278" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".9"/><path d="M62,278L241,205" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".5"/><path d="M353,278L241,205" fill="none" stroke="#a9d9f5" stroke-width="2.6" opacity=".5"/><path d="M210 85L209,211" stroke="#f3c17c" stroke-width="1.7" opacity=".65"/><path d="M62 278L209,211" stroke="#f3c17c" stroke-width="1.7" opacity=".65"/><path d="M353 278L209,211" stroke="#f3c17c" stroke-width="1.7" opacity=".65"/><path d="M241 205L209,211" stroke="#f3c17c" stroke-width="1.7" opacity=".65"/><path d="M210 128L101 260L316 260Z" fill="#a9d9f5" fill-opacity=".07" stroke="#a9d9f5" stroke-opacity=".45"/><path d="M210 155L129 246L288 246Z" fill="#f3c17c" fill-opacity=".04" stroke="#f3c17c" stroke-opacity=".55"/><circle cx="210" cy="85" r="6" fill="#a9d9f5"/><circle cx="62" cy="278" r="6" fill="#a9d9f5"/><circle cx="353" cy="278" r="6" fill="#a9d9f5"/><circle cx="241" cy="205" r="6" fill="#a9d9f5"/><text class="og-hide" x="210" y="320" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#f9f3e9">4 boundary + 62 interior</text><text class="og-hide" x="210" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#f3c17c">72 convex cells</text><text class="og-hide" x="210" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#f9f3e9">tetrahedral insertion • schematic</text><path d="M406 85V325M815 85V325" stroke="#a9d9f5" stroke-opacity=".24"/><path d="M372 205H440l-10-7m10 7l-10 7" stroke="#f3c17c" fill="none" stroke-width="2"/><text class="og-hide" x="620" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#a9d9f5">SIX COPIES PER UNIT CUBE</text><text class="og-hide" x="620" y="123" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#f9f3e9">V = 1 + 6 × 62 = 373</text><text class="og-hide" x="620" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#f9f3e9">C = 6 × 72 = 432</text><text class="og-hide" x="620" y="233" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#f9f3e9">I = 6 × 546 = 3276</text><text class="og-hide" x="620" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f3c17c">h = I / (V + C)</text><text class="og-hide" x="620" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#f9f3e9">exact periodic incidence counts</text><text class="og-hide" x="1007" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#a9d9f5">BEYOND THE BAND</text><text class="og-hide" x="1007" y="157" text-anchor="middle" font-family="Georgia,serif" font-size="49" fill="#f3c17c">468 / 115</text><text class="og-hide" x="1007" y="211" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#f9f3e9">= 4 + 8 / 115</text><text class="og-hide" x="1007" y="277" text-anchor="middle" font-family="Georgia,serif" font-size="49" fill="#a9d9f5">&gt; 4</text><text class="og-hide" x="1007" y="349" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f9f3e9">weighted / Laguerre</text><text class="og-hide" x="1007" y="383" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#f9f3e9">not ordinary Voronoi</text>
</svg>
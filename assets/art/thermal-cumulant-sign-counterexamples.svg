<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that heat-current cumulant ratios can be arbitrarily negative in thermal Markov networks. Left, schematic: a three-state network. States 0 and 1 form a fast cycle joined by a solid orange hot-bath edge and a dashed blue cold-bath edge, which carries heat from the hot to the cold bath. State 2 is a trap, joined to state 0 by a weak edge of strength epsilon, so it is entered rarely and left slowly. Middle, schematic: the heat delivered to the cold bath over time rises in steps while the fast cycle runs and stays flat during shaded pauses when the system sits in the trap; rare long pauses skew the record towards shortfalls. Right, data: on logarithmic axes, the exact sizes of the negative ratios minus C3/C1 (solid orange) and minus C4/C2 (dashed blue) for the paper's full-support family, as epsilon falls from 10^-3 to 10^-7. Both grow like epsilon to the minus 2, from about 10^3 to about 10^10, while the mean heat current stays fixed at C1 = 40/63. Values are from the paper's Figure 2.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.62" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#effaf9" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">A rarely visited trap makes heat flow in bursts and pauses</text><text class="og-hide" x="40" y="80" fill="#cfe4e2" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="normal" text-anchor="start">Three states, two baths, local detailed balance: the third and fourth cumulant ratios become arbitrarily negative</text><path d="M106 276 Q 140 182 234 168" stroke="#ffb36b" stroke-width="4" fill="none"/><path d="M120 294 Q 222 270 256 204" stroke="#8fd8ff" stroke-width="4" stroke-dasharray="9 6" fill="none"/><path d="M124 306 L 308 318" stroke="#e7a6ff" stroke-width="1.6" stroke-dasharray="2 5" fill="none"/><circle cx="92" cy="300" r="27" fill="#ffffff" fill-opacity=".08" stroke="#cfe4e2" stroke-width="2.5"/><text class="og-hide" x="92" y="308" fill="#effaf9" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle">0</text><circle cx="262" cy="176" r="27" fill="#ffffff" fill-opacity=".08" stroke="#cfe4e2" stroke-width="2.5"/><text class="og-hide" x="262" y="184" fill="#effaf9" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle">1</text><circle cx="338" cy="318" r="27" fill="#ffffff" fill-opacity=".08" stroke="#e7a6ff" stroke-width="2.5"/><text class="og-hide" x="338" y="326" fill="#effaf9" font-family="Georgia,serif" font-size="23" font-weight="bold" text-anchor="middle">2</text><text class="og-hide" x="112" y="168" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">hot bath</text><text class="og-hide" x="228" y="262" fill="#8fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">cold bath</text><text class="og-hide" x="176" y="128" fill="#cfe4e2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">fast cycle carries heat</text><text class="og-hide" x="176" y="146" fill="#cfe4e2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">from hot to cold</text><text class="og-hide" x="212" y="344" fill="#e7a6ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">weak edge ε</text><text class="og-hide" x="338" y="368" fill="#e7a6ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">trap: entered rarely,</text><text class="og-hide" x="338" y="385" fill="#e7a6ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">left slowly</text><path d="M430 162 V318 H706" stroke="#cfe4e2" stroke-opacity=".7" stroke-width="1.6" fill="none"/><text class="og-hide" x="424" y="154" fill="#a9c6c3" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="start">heat to cold bath</text><text class="og-hide" x="700" y="340" fill="#a9c6c3" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="end">time</text><path d="M430 318 H430 V311.0 H438 V304.0 H446 V297.0 H454 V290.0 H462 V283.0 H470 V276.0 H478 V269.0 H486 V262.0 H494 V255.0 H500 H565 H565 V248.0 H573 V241.0 H581 V234.0 H589 V227.0 H597 V220.0 H605 H680 H680 V213.0 H688 V206.0 H696 V199.0 H700" stroke="#effaf9" stroke-width="2.4" fill="none"/><rect x="500" y="170" width="65" height="148" fill="#e7a6ff" fill-opacity=".10"/><rect x="605" y="170" width="75" height="148" fill="#e7a6ff" fill-opacity=".10"/><text class="og-hide" x="642" y="188" fill="#e7a6ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">in trap:</text><text class="og-hide" x="642" y="204" fill="#e7a6ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">no heat</text><text class="og-hide" x="565" y="368" fill="#cfe4e2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">rare long pauses skew the record</text><text class="og-hide" x="565" y="386" fill="#cfe4e2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">towards shortfalls (schematic)</text><path d="M800 132 V318 H1156" stroke="#cfe4e2" stroke-opacity=".7" stroke-width="1.6" fill="none"/><path d="M800.0 318 V324" stroke="#cfe4e2" stroke-width="1.5"/><text class="og-hide" x="800.0" y="342" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10<tspan baseline-shift="super" font-size="70%">−3</tspan></text><path d="M975.0 318 V324" stroke="#cfe4e2" stroke-width="1.5"/><text class="og-hide" x="975.0" y="342" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10<tspan baseline-shift="super" font-size="70%">−5</tspan></text><path d="M1150.0 318 V324" stroke="#cfe4e2" stroke-width="1.5"/><text class="og-hide" x="1150.0" y="342" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10<tspan baseline-shift="super" font-size="70%">−7</tspan></text><text class="og-hide" x="792" y="305.2" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">10<tspan baseline-shift="super" font-size="70%">3</tspan></text><text class="og-hide" x="792" y="251.8" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">10<tspan baseline-shift="super" font-size="70%">6</tspan></text><text class="og-hide" x="792" y="198.4" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">10<tspan baseline-shift="super" font-size="70%">9</tspan></text><text class="og-hide" x="792" y="145.0" fill="#a9c6c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor=
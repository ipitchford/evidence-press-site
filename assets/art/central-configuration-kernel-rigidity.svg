<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Schematic of two full-dimensional seven-body support boxes: k = 4 with eight parameters and k = 5 with five, each of half-width 2^-34. Throughout each box the unique positive-semidefinite metric minimum has rank one and transverse restricted slack greater than 1/64. That nonzero slack rules out a realizable complete central-configuration kernel in either box. This is a local exclusion, not a classification.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9d8eb" stop-opacity="0.06"/><stop offset="1" stop-color="#a9d8eb" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

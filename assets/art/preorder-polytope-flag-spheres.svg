<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on preorder polytopes. On the left, a vertical chain of three dots labelled 1, 2 and 3 from bottom to top, with three teal arcs joining 1 to 2, 2 to 3 and 1 to 3. Beside it: integer points by support size: 1, 6, 6, 1; H equals 1 plus 6t plus 6t squared plus t cubed, which equals (1 plus t) cubed plus 3t(1 plus t), with the 3 in teal; a caption says the 3 counts the three pairs matched upwards, 1 to 2, 2 to 3 and 1 to 3. In the middle, a box reads: No crown? H comes from a flag sphere (Theorem 5.6); a crown blocks the method. On the right, in amber, the six-element crown: three top dots t1, t2, t3 above three bottom dots s1, s2, s3, each bottom dot joined to two top dots in a closed zig-zag, labelled the six-element crown: the first open case. The title reads: Count the points, match the pairs, and look for crowns.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.62" cy="0.5" r="0.5">
<stop offset="0" stop-color="#7fe0c8" stop-opacity="0.06"/><stop offset="1" stop-color="#7fe0c8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="48" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" font-style="normal" text-anchor="start">Count the points, match the pairs, and look for crowns</text><text class="og-hide" x="40" y="76" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Preorder polytopes: gamma-coefficients count pairs matched upwards; every crown-free preorder gives a flag sphere</text><path d="M92 318 V158" stroke="#dfe6ec" stroke-width="2.5"/><path d="M102 318 C152 318 152 238 102 238" fill="none" stroke="#7fe0c8" stroke-width="2.6"/><path d="M102 238 C152 238 152 158 102 158" fill="none" stroke="#7fe0c8" stroke-width="2.6"/><path d="M102 318 C188 318 188 158 102 158" fill="none" stroke="#7fe0c8" stroke-width="2.6"/><circle cx="92" cy="318" r="9" fill="#e8eef2" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="74" y="324" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="end">1</text><circle cx="92" cy="238" r="9" fill="#e8eef2" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="74" y="244" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="end">2</text><circle cx="92" cy="158" r="9" fill="#e8eef2" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="74" y="164" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="end">3</text><text class="og-hide" x="96" y="372" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">chain 1 &lt; 2 &lt; 3</text><text class="og-hide" x="218" y="150" fill="#b9c8d4" font-family="Georgia,serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="start">integer points by support size:</text><text class="og-hide" x="218" y="184" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" font-style="normal" text-anchor="start">1, 6, 6, 1</text><text class="og-hide" x="218" y="230" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" font-style="normal" text-anchor="start">H = 1 + 6t + 6t² + t³</text><text class="og-hide" x="218" y="266" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" font-style="normal" text-anchor="start">= (1+t)³ + <tspan fill="#7fe0c8" font-weight="bold">3</tspan>t(1+t)</text><text class="og-hide" x="218" y="304" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start"><tspan fill="#7fe0c8" font-weight="bold">3</tspan> = the three pairs matched upwards:</text><text class="og-hide" x="218" y="324" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">1→2, 2→3, 1→3 (teal arcs)</text><rect x="470" y="150" width="226" height="140" rx="10" fill="#0c1820" fill-opacity="0.55" stroke="#7fe0c8" stroke-opacity="0.7"/><text class="og-hide" x="583" y="180" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">No crown?</text><text class="og-hide" x="583" y="206" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle">H comes from a</text><text class="og-hide" x="583" y="228" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle">flag sphere</text><text class="og-hide" x="583" y="254" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle">(Theorem 5.6)</text><text class="og-hide" x="583" y="278" fill="#ffc27a" font-family="Georgia,serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="middle">a crown blocks the method</text><path d="M704 220 H726" stroke="#dfe6ec" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M760 300 L760 168" stroke="#ffc27a" stroke-width="2.6"/><path d="M760 300 L1000 168" stroke="#ffc27a" stroke-width="2.6"/><path d="M880 300 L880 168" stroke="#ffc27a" stroke-width="2.6"/><path d="M880 300 L760 168" stroke="#ffc27a" stroke-width="2.6"/><path d="M1000 300 L1000 168" stroke="#ffc27a" stroke-width="2.6"/><path d="M1000 300 L880 168" stroke="#ffc27a" stroke-width="2.6"/><circle cx="760" cy="168" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="760" y="150" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">t₁</text><circle cx="760" cy="300" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="760" y="330" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">s₁</text><circle cx="880" cy="168" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="880" y="150" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">t₂</text><circle cx="880" cy="300" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="880" y="330" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">s₂</text><circle cx="1000" cy="168" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="1000" y="150" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">t₃</text><circle cx="1000" cy="300" r="9" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="1000" y="330" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">s₃</text><text class="og-hide" x="880" y="362" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">the six-element crown: the first open case</text><text class="og-hide" x="40" y="392" fill="#b9c8d4" font-family="Georgia,serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start">Diagram drawn from the paper (Section 1.1, Theorem 3.4, Theorem 5.6); not data.</text>
</svg>
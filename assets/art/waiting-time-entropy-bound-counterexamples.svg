<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for the counterexamples to the conjectured waiting-time bound on entropy production. Left: a triangle of three states. Only jumps between states 1 and 2 are observed; the two hidden edges to state 3 have barrier rates 1 + ε sin ωt and 1 + ε cos ωt, driven out of phase. Every rate equals its reverse at every instant, so the true entropy production σ is zero. Middle: for ε = 1/2 and ω = 1, the phase-averaged waiting-time densities F (the next visible jump repeats 1→2) and G (it repeats 2→1) against the waiting time from 0 to 8, computed from the release data. The curves nearly overlap; their difference, drawn twenty times enlarged, is positive at short waiting times and negative later. The forward-only statistic of Maier et al. reads this asymmetry as dissipation, about 1.1×10⁻⁵ per unit time, although none occurs (Theorem 3.1). Right: in the fixed-prefactor class tested by Maier et al., a log–log plot of the statistic S against the true entropy production σ for 30 numerically computed circular driving protocols, with the line S = σ marking the conjectured ceiling. Weak driving lies below the line; slow, strong driving lies above it. A star marks the switching protocol of Theorem 4.2, certified by interval arithmetic to give S ≥ 1.3179 σ.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#9fd0ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on quantum optimal transport cost operators. Title: Quantum transport costs: noncommuting observables never help. Subtitle: The best error for the simplest limiting cost is exactly 1/(1 + 2^max(p,1)): one third up to p = 1, then 1/5, 1/9, 1/17. Centre: a curve of the best operator-norm error against the exponent p from 0 to 5; it is flat at 1/3 for p ≤ 1 and then falls as 1/(1 + 2^p), with marked points 1/3 at p = 1, 1/5 at p = 2, 1/9 at p = 3 and 1/17 at p = 4; no sum of noncommuting observables does better. Left: the target charges 1 for moving between two perpendicular states; it is approximated by transport costs G_p(A) = |A ⊗ I − I ⊗ Aᵀ|ᵖ built from observables A; the best operator-norm error is exact, and the same curve holds for pure-state transport values; the key tool is a retraction onto costs built from the given measurement blocks; dimension at least three, bounded observables. Right: also proved, the cost cones grow with p, C_p ⊆ C_q when p ≤ q (a conjecture of Bunth, Pitrik, Titkos and Virosztek); for one observable with three or more outcomes the centred cost is never negative exactly when p ≤ 2; for four or more levels there is a lower bound, exact for three levels.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.55" cy="0.6" r="0.4">
<stop offset="0" stop-color="#8ecbff" stop-opacity="0.06"/><stop offset="1" stop-color="#8ecbff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

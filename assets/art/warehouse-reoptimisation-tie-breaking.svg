<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how breaking ties between equally fast plans changes stability in warehouse order picking. Left: five orders and a cart with two bins; the plan remainder first takes one order on the first trip and two on each of the next two, the plan full first takes two, two and then one; both need three trips. Remainder first is labelled as letting the backlog explode above 76 per cent of capacity, full first as stable up to full capacity; a note gives the remainder-first breakdown points as 76 per cent with two bins, 49 per cent with eight and tending to 1 over e, about 37 per cent, for very large carts. Right: the number of orders waiting over time when one synthetic stream of 30,000 Poisson arrivals at 90 per cent of capacity is served by both rules; the remainder-first backlog climbs steadily to 4,765 while full first keeps only a handful waiting. Values are from the paper's computed thresholds and its synthetic queue trace.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.6" r="0.4">
<stop offset="0" stop-color="#8fe3c4" stop-opacity="0.06"/><stop offset="1" stop-color="#8fe3c4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">Five orders, two bins: a tie that decides stability</text><text class="og-hide" x="40" y="82" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Both plans need three trips; reoptimising each time orders arrive turns the choice into a different queue</text><text class="og-hide" x="40" y="136" fill="#ff9f6e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">remainder first (1, 2, 2)</text><rect x="40" y="156" width="92" height="46" rx="9" fill="#ff9f6e" fill-opacity=".07" stroke="#ff9f6e" stroke-opacity=".8" stroke-width="1.8"/><rect x="52" y="165" width="30" height="28" rx="5" fill="none" stroke="#e3d9c9" stroke-opacity=".55" stroke-width="1.3"/><circle cx="67" cy="179" r="8.5" fill="#ff9f6e"/><rect x="90" y="165" width="30" height="28" rx="5" fill="none" stroke="#e3d9c9" stroke-opacity=".55" stroke-width="1.3"/><text class="og-hide" x="86" y="222" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">trip 1</text><path d="M136 179 h12" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.5"/><rect x="152" y="156" width="92" height="46" rx="9" fill="#ff9f6e" fill-opacity=".07" stroke="#ff9f6e" stroke-opacity=".8" stroke-width="1.8"/><rect x="164" y="165" width="30" height="28" rx="5" fill="none" stroke="#e3d9c9" stroke-opacity=".55" stroke-width="1.3"/><circle cx="179" cy="179" r="8.5" fill="#ff9f6e"/><rect x="202" y="165" width="30" height="28" rx="5" fill="none" stroke="#e3d9c9" stroke-opacity=".55" stroke-width="1.3"/><circle cx="217" cy="179" r="8.5" fill="#ff9f6e"/><text class="og-hide" x="198" y="222" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">trip 2</text><path d="M248 179 h12" stroke="#e3d9c9" s
e="13" font-weight="normal" font-style="normal" text-anchor="start">(certified bound at R = 100,000)</text><text class="og-hide" x="40" y="340" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">The corrected estimate (minus X) stays valid.</text><line x1="600" y1="330" x2="1140" y2="330" stroke="#c3ccd2" stroke-width="1.2"/><line x1="600" y1="330" x2="600" y2="110" stroke="#c3ccd2" stroke-width="1.2"/><line x1="662.3" y1="330" x2="662.3" y2="335" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="662.3" y="351" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle">1,000</text><line x1="870.0" y1="330" x2="870.0" y2="335" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="870.0" y="351" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle">10,000</text><line x1="1077.7" y1="330" x2="1077.7" y2="335" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="1077.7" y="351" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle">100,000</text><line x1="595" y1="330.0" x2="600" y2="330.0" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="591" y="334.0" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="end">1</text><line x1="595" y1="256.7" x2="600" y2="256.7" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="591" y="260.7" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="end">10</text><line x1="595" y1="183.3" x2="600" y2="183.3" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="591" y="187.3" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="end">100</text><line x1="595" y1="110.0" x2="600" y2="110.0" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="591" y="114.0" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="end">1,000</text><text class="og-hide" x="870" y="372" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="middle">speed R of the reversible transition (per drive period, log scale)</text><text class="og-hide" x="592" y="96" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">estimate (nats per period, log scale)</text><line x1="600" y1="300.6" x2="1140" y2="300.6" stroke="#a8e6c1" stroke-width="2.4"/><text class="og-hide" x="1140" y="320.6" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="end">true entropy production 4π/5 ≈ 2.5</text><polyline points="768.1,329.7 770.0,328.2 772.0,326.7 773.9,325.3 775.9,323.9 777.8,322.5 779.8,321.1 781.7,319.7 783.7,318.4 785.6,317.1 787.6,315.8 789.5,314.5 791.5,313.2 793.4,312.0 795.4,310.8 797.3,309.6 799.3,308.4 801.2,307.2 803.1,306.0 805.1,304.9 807.0,303.7 809.0,302.6 810.9,301.5 812.9,300.4 814.8,299.3 816.8,298.2 818.7,297.2 820.7,296.1 822.6,295.1 824.6,294.0 826.5,293.0 828.5,292.0 830.4,291.0 832.4,289.9 834.3,289.0 836.3,288.0 838.2,287.0 840.1,286.0 842.1,285.1 844.0,284.1 846.0,283.1 847.9,282.2 849.9,281.3 851.8,280.3 853.8,279.4 855.7,278.5 857.7,277.6 859.6,276.7 861.6,275.8 863.5,274.9 865.5,274.0 867.4,273.1 869.4,272.2 871.3,271.3 873.2,270.5 875.2,269.6 877.1,268.7 879.1,267.9 881.0,267.0 883.0,266.2 884.9,265.3 886.9,264.5 888.8,263.6 890.8,262.8 892.7,262.0 894.7,261.1 896.6,260.3 898.6,259.5 900.5,258.7 902.5,257.9 904.4,257.0 906.3,256.2
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that a phase-blind waiting-time estimate of entropy production can exceed the true value without bound. Title: zero net current, fixed dissipation, yet the estimate grows without limit. Left text: three states; every current averages to zero. One fast transition runs equally both ways, so it makes no entropy, but its speed tracks the drive. Waiting times are compared with the drive run forwards and reversed, with the phase not recorded, and the estimate counts that phase signal as dissipation. Above 145 times the true value (certified bound at R = 100,000). The corrected estimate (minus X) stays valid. Right: a chart on logarithmic axes of the estimate in nats per period against the speed R of the reversible transition, from about 500 to 200,000. A flat line marks the true entropy production 4π/5, about 2.5. A rising curve shows the proved bound of Theorem 1, more than 31 times the true value at R = 100,000, and four dots show certified values of Proposition 2 at R = 750, 1,000, 10,000 and 100,000, the last at 366. Footer: model calculation; under 0.008 nats of overshoot per event, and a reporter hundreds of times faster than the drive; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.45" r="0.35">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

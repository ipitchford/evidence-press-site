<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">The historical upper bound115 narrows to112. Two seven-layer cycle schematics show the exhaustive cases for two maximum33-point bands: sharing a layer, or disjoint. The exact independence number remains between108 and112. Source: normalization lemma and main theorem of the revised paper.</desc><defs>

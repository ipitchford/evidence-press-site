<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on exact pivotal e-variables. Title: Exact pivotal e-variables for infinite hypotheses. Subtitle: A fair coin built from any separating score gives exact, pivotal evidence with the best guarantee from the margin. Left: any separating score becomes a coin. The score h has mean 0 under every null and at least delta under every alternative; the coin has heads chance (1 + h)/2. On the four-state example of Section 7, with margin delta = 6/31, the scores 17/31, minus 1, 11/31 and 3/31 give heads chances 24/31, 0, 21/31 and 17/31, drawn as bars. Centre: the coin is fair under every null (heads 1/2) and biased under every alternative (heads at least 37/62). Bet the fraction delta on heads: evidence 37/31 or 25/31, with the same law under every null, so it is exact and pivotal. Right: expected log growth in this example: binary coin (guaranteed) 0.0188, best pivotal 0.039, best exact but not pivotal 0.056, as bars. Best guarantee from delta alone. Unbounded evidence: pivotality can cost all the growth.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffd38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Exact pivotal e-variables for infinite hypotheses</text><text class="og-hide" x="40" y="80" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">A fair coin built from any separating score gives exact, pivotal evidence with the best guarantee from the margin</text><text class="og-hide" x="40" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Any separating score becomes a coin</text><text class="og-hide" x="40" y="136" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">score h: mean 0 under every null, at least δ</text><text class="og-hide" x="40" y="152" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">under every alternative; heads chance (1 + h)/2</text><rect x="60" y="186" width="56" height="110" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.25)"/><rect x="60" y="210.8" width="56" height="85.2" rx="4" fill="#ffc36b" opacity="0.85"/><text class="og-hide" x="88" y="178" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">h = 17/31</text><text class="og-hide" x="88" y="314" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">24/31</text><text class="og-hide" x="88" y="330" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">state 1</text><rect x="152" y="186" width="56" height="110" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.25)"/><text class="og-hide" x="180" y="178" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">h = −1</text><text class="og-hide" x="180" y="314" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">0</text><text class="og-hide" x="180" y="330" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">state 2</text><rect x="244" y="186" width="56" height="110" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.25)"/><rect x="244" y="221.5" width="56" height="74.5" rx="4" fill="#ffc36b" opacity="0.85"/><text class="og-hide" x="272" y="178" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">h = 11/31</text><text class="og-hide" x="272" y="314" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">21/31</text><text class="og-hide" x="272" y="330" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">state 3</text><rect x="336" y="186" width="56" height="110" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.25)"/><rect x="336" y="235.7" width="56" height="60.3" rx="4" fill="#ffc36b" opacity="0.85"/><text class="og-hide" x="364" y="178" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">h = 3/31</text><text class="og-hide" x="364" y="314" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">17/31</text><text class="og-hide" x="364" y="330" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">state 4</text><text class="og-hide" x="40" y="360" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">four-state example of Section 7, margin δ = 6/31</text><text class="og-hide" x="470" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Fair under every null, biased under</text><text class="og-hide" x="470" y="134" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">every alternative</text><circle cx="540" cy="220" r="46" fill="rgba(255,255,255,0.06)" stroke="#9fd3ff" stroke-width="3"/><text class="og-hide" x="540" y="216" fill="#9fd3ff" font-family="Georgia,serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">1/2</text><text class="og-hide" x="540" y="238" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">heads</text><text class="og-hide" x="540" y="290" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">any null</text><circle cx="720" cy="220" r="46" fill="rgba(255,255,255,0.06)" stroke="#f2a7b5" stroke-width="3"/><text class="og-hide" x="720" y="216" fill="#f2a7b5" font-family="Georgia,serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle">37/62</text><text class="og-hide" x="720" y="238" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">heads</text><text class="og-hide" x="720" y="290" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">any alternative: at least</text><text class="og-hide" x="470" y="330" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Bet the fraction δ on heads: evidence 37/31 or 25/31,</text><text class="og-hide" x="470" y="348" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">the same law under every null (exact and pivotal)</text><line x1="878" y1="104" x2="878" y2="372" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text class="og-hide" x="900" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Expected log growth here</text><rect x="900" y="140" width="72.3" height="14" rx="3" fill="#ffc36b"/><text class="og-hide" x="900" y="170" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">binary coin (guaranteed): 0.0188</text><rect x="900" y="180" width="150.2" height="14" rx="3" fill="#9fd3ff"/><text class="og-hide" x="900" y="210" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">best pivotal: 0.039</text><rect x="900" y="220" width="213.1" height="14" rx="3" fill="#f2a7b5"/><text class="og-hide" x="900" y="250" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">best exact, not pivotal: 0.056</text><text class="og-hide" x="900" y="284" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">Best guarantee from δ alone</text><text class="og-hide" x="900" y="306" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">Unbounded evidence: pivotality</text><text class="og-hide" x="900" y="322" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">can cost all the growth</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Sign-adapted localisation schematic. Strong vertices have marked preferred plus or minus signs; pale small vertices are weak. Compatible interactions fade at the terminal point, but the interaction between two strong vertices of opposite preferred signs remains. The terminal measure is not generally a product. This is a proof schematic, not a spin sample or numerical convergence plot.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2c777" stop-opacity="0.06"/><stop offset="1" stop-color="#f2c777" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

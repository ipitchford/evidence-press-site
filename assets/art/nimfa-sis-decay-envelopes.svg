<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper proving universal decay limits for network SIS epidemics. On the left, a log-log plot shows the average infection level against time in mean recovery times, for an epidemic exactly at the tipping point R0 = 1 that starts with everyone infected. A dashed white curve is the proved limit 1/(1+t), which holds on every network. An orange curve for a small-world network of 1,000 nodes runs just below the limit and crosses the dotted 0.1% line at about 920 recovery times. A blue curve for a spatial random geometric network of 1,000 nodes drops away from the limit and crosses 0.1% at about 40 recovery times. On the right, the two numbers are repeated: about 920 recovery times for the small-world network, with kappa about 0.92, and about 40 for the spatial network, with kappa about 0.035. A note says that at the threshold the average decays like kappa(G)/t, and that a small kappa means the average falls fast while hubs and cores stay infected.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.4">
<stop offset="0" stop-color="#7fd8e8" stop-opacity="0.05"/><stop offset="1" stop-color="#7fd8e8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">How fast an epidemic dies out at the tipping point depends on the network</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Mean-field SIS model on two 1,000-node synthetic networks; both stay below the proved 1/(1+t) limit</text><rect x="92" y="112" width="598" height="228" fill="#000" fill-opacity=".10" stroke="#e3d9c9" stroke-opacity=".25"/><path d="M92.0 112 V340" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="92.0" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0.1</text><path d="M225.6 112 V340" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="225.6" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><path d="M359.1 112 V340" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="359.1" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><path d="M492.7 112 V340" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="492.7" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">100</text><path d="M626.3 112 V340" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="626.3" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1000</text><path d="M92 112.0 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="116.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">100%</text><path d="M92 157.6 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="161.6" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10%</text><path d="M92 203.2 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="207.2" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1%</text><path d="M92 248.8 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="252.8" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.1%</text><path d="M92 294.4 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="298.4" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.01%</text><path d="M92 340.0 H690" stroke="#e3d9c9" stroke-opacity=".10"/><text class="og-hide" x="84" y="344.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.001%</text><text class="og-hide" x="391" y="378" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="middle">time, in mean recovery times (log scale)</text><text class="og-hide" x="92" y="102" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">average infection level, starting fully infected, R₀ = 1</text><path d="M92 248.8 H690" stroke="#f4f1ea" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="2 4"/><text class="og-hide" x="271.3" y="125.0" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">proved limit 1/(1+t), any network</text><path d="M92.0 113.9 L98.7 114.1 L105.4 114.4 L112.2 114.6 L118.9 114.9 L125.6 115.3 L132.3 115.6 L139.0 116.0 L145.8 116.5 L152.5 117.0 L159.2 117.5 L165.9 118.1 L172.6 118.7 L179.3 119.4 L186.1 120.1 L192.8 120.9 L199.5 121.8 L206.2 122.7 L212.9 123.7
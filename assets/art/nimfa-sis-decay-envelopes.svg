311.4 L622.8 313.7 L629.5 316.0 L636.2 318.3 L643.0 320.6 L649.7 322.9 L656.4 325.2 L663.1 327.5 L669.8 329.8 L676.6 332.1 L683.3 334.4 L690.0 336.7" stroke="#7fd8e8" stroke-width="3" fill="none"/><path d="M92.0 113.9 L98.7 114.1 L105.4 114.3 L112.0 114.6 L118.7 114.9 L125.4 115.2 L132.1 115.6 L138.7 116.0 L145.4 116.4 L152.1 116.9 L158.8 117.4 L165.5 118.0 L172.1 118.6 L178.8 119.3 L185.5 120.0 L192.2 120.8 L198.9 121.7 L205.5 122.6 L212.2 123.6 L218.9 124.6 L225.6 125.7 L232.2 126.9 L238.9 128.1 L245.6 129.4 L252.3 130.8 L259.0 132.2 L265.6 133.7 L272.3 135.3 L279.0 136.9 L285.7 138.5 L292.4 140.2 L299.0 142.0 L305.7 143.8 L312.4 145.6 L319.1 147.5 L325.7 149.4 L332.4 151.4 L339.1 153.4 L345.8 155.4 L352.5 157.4 L359.1 159.5 L365.8 161.6 L372.5 163.7 L379.2 165.8 L385.8 167.9 L392.5 170.1 L399.2 172.2 L405.9 174.4 L412.6 176.6 L419.2 178.8 L425.9 181.0 L432.6 183.2 L439.3 185.5 L446.0 187.7 L452.6 189.9 L459.3 192.1 L466.0 194.4 L472.7 196.6 L479.3 198.9 L486.0 201.1 L492.7 203.4 L499.4 205.7 L506.1 207.9 L512.7 210.2 L519.4 212.4 L526.1 214.7 L532.8 217.0 L539.5 219.2 L546.1 221.5 L552.8 223.8 L559.5 226.1 L566.2 228.3 L572.8 230.6 L579.5 232.9 L586.2 235.2 L592.9 237.4 L599.6 239.7 L606.2 242.0 L612.9 244.3 L619.6 246.5 L626.3 248.8 L633.0 251.1 L639.6 253.4 L646.3 255.7 L653.0 257.9 L659.7 260.2 L666.3 262.5 L673.0 264.8 L679.7 267.0 L686.4 269.3" stroke="#f4f1ea" stroke-width="2.2" stroke-dasharray="7 5" fill="none"/><path d="M621.6 248.8 V340" stroke="#ffc06a" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="621.6" cy="248.8" r="5.5" fill="#ffc06a" stroke="#111" stroke-opacity=".4"/><path d="M438.7 248.8 V340" stroke="#7fd8e8" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="438.7" cy="248.8" r="5.5" fill="#7fd8e8" stroke="#111" stroke-opacity=".4"/><text class="og-hide" x="430.7" y="324.4" fill="#7fd8e8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">≈ 40</text><text class="og-hide" x="613.6" y="324.4" fill="#ffc06a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">≈ 920</text><text class="og-hide" x="102.6" y="241.8" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">0.1%</text><text class="og-hide" x="740" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">Same R₀ = 1, same proved limit,</text><text class="og-hide" x="740" y="150" fill="#f4f1ea" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">very different die-out:</text><rect x="740" y="172" width="6" height="64" fill="#ffc06a"/><text class="og-hide" x="758" y="206" fill="#ffc06a" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="start">≈ 920</text><text class="og-hide" x="868" y="196" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">recovery times to fall below 0.1%</text><text class="og-hide" x="868" y="216" fill="#ffc06a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">small-world network, κ ≈ 0.92</text><rect x="740" y="252" width="6" height="64" fill="#7fd8e8"/><text class="og-hide" x="758" y="286" fill="#7fd8e8" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="start">≈ 40</text><text class="og-hide" x="868" y="276" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">recovery times to fall below 0.1%</text><text class="og-hide" x="868" y="296" fill="#7fd8e8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">spatial network, κ ≈ 0.035</text><text class="og-hide" x="740" y="346" fill="#c4b7a2" font-family="Georgia,serif" font-size="13.5" font-weight="normal" text-anchor="start">At the threshold the average decays like κ(G)/t.</text><text class="og-hide" x="740" y="366" fill="#c4b7a2" font-family="Georgia,serif" font-size="13.5" font-weight="normal" text-anchor="start">Small κ: the average falls fast, but hubs and cores stay infected.</text>
</svg>
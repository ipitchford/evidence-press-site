sans-serif" font-size="12" font-weight="normal" text-anchor="start">2 unstable eigenvalues (exact)</text><text class="og-hide" x="117.31428571428572" y="251" fill="#cdbfae" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">onset n = 13, 15, 17, 22 · ◌ −½ conj.</text><text class="og-hide" x="612" y="46" fill="#f6efe4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="start">Why the exponent one is a knife edge</text><text class="og-hide" x="612" y="68" fill="#cdbfae" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">n<tspan baseline-shift="super" font-size="70%">2</tspan>λ approaches the zeros ζ of F<tspan baseline-shift="sub" font-size="72%">γ</tspan>(z) = <tspan baseline-shift="sub" font-size="72%">1</tspan>F<tspan baseline-shift="sub" font-size="72%">1</tspan>(1; γ+1; −z)</text><text class="og-hide" x="612" y="86" fill="#cdbfae" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">γ = α for U<tspan baseline-shift="sub" font-size="72%">n</tspan> (left end), γ = m for V<tspan baseline-shift="sub" font-size="72%">n</tspan> (right end)</text><rect x="640" y="112" width="286.2" height="260" fill="#ffb347" fill-opacity=".13"/><rect x="926.2" y="112" width="73.8" height="260" fill="#c9b6ff" fill-opacity=".12"/><text class="og-hide" x="648" y="362" fill="#ffb347" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="bold" text-anchor="start">Re ζ &lt; 0: unstable</text><text class="og-hide" x="994" y="362" fill="#c9b6ff" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="bold" text-anchor="end">Re ζ &gt; 0</text><path d="M640 372 H1000" stroke="#e2d5c3" stroke-width="1.2"/><path d="M926.2 372 V112" stroke="#f6efe4" stroke-width="1.6"/><text class="og-hide" x="922.2" y="124" fill="#cdbfae" font-family="Georgia,serif" font-size="12" font-weight="bold" text-an
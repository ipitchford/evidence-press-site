f6f2ea" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">10</text><text class="og-hide" x="94" y="248" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">r = 2</text><rect x="106" y="224" width="60" height="36" rx="5" fill="rgba(255,195,107,0.22)" stroke="#ffc36b" stroke-width="1.2"/><text class="og-hide" x="136" y="249" fill="#ffc36b" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">58</text><rect x="170" y="224" width="60" height="36" rx="5" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/><text class="og-hide" x="200" y="249" fill="#f6f2ea" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">4</text><text class="og-hide" x="94" y="288" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">r = 3</text><rect x="106" y="264" width="60" height="36" rx="5" fill="rgba(255,195,107,0.22)" stroke="#ffc36b" stroke-width="1.2"/><text class="og-hide" x="136" y="289" fill="#ffc36b" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">58</text><rect x="170" y="264" width="60" height="36" rx="5" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/><text class="og-hide" x="200" y="289" fill="#f6f2ea" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">4</text><rect x="234" y="264" width="60" height="36" rx="5" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/><text class="og-hide" x="264" y="289" fill="#f6f2ea" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">½</text><text class="og-hide" x="40" y="324" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Row 2, column 0: 58 is strong evidence that at</text><text class="og-hide" x="40" y="340" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">least one of the top two is real; column 1: 4 is</text><text class="og-hide" x="40" y="356" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">only weak evidence that both are</text><text class="og-hide" x="470" y="116" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Complete 10,000 × 10,000 matrix</text><text class="og-hide" x="470" y="136" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">entry evaluations, log scale</text><line x1="470" y1="292" x2="860" y2="292" stroke="rgba(255,255,255,0.55)" stroke-width="1.3"/><line x1="470" y1="292" x2="470" y2="298" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="470" y="314" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">10⁸</text><line x1="567.5" y1="292" x2="567.5" y2="298" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="567.5" y="314" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">10⁹</text><line x1="665" y1="292" x2="665" y2="298" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="665" y="314" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">10¹⁰</text><line x1="762.5" y1="292" x2="762.5" y2="298" stroke="rgba(255,255,255,0.55)"/><text class="og-hide" x="762.5" y="314" fill="#
" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">Higher-degree products: open</text><text class="og-hide" x="952" y="346" fill="#c3ccd2" font-family="Georgia,serif" font-size="12" font-weight="normal" font-style="italic" text-anchor="start">Float mode not certified</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on e-value discovery matrices. Title: E-value discovery matrices in linear time per row. Subtitle: Vovk and Wang asked whether pairwise-product rows can be computed in linear time: they can. Left: what a discovery matrix says, for e-values 20, 8 and one half merged by the average of pairwise products: a lower-triangular matrix with row 1: 10; row 2: 58, 4; row 3: 58, 4, one half. Row 2, column 0: 58 is strong evidence that at least one of the top two is real; column 1: 4 is only weak evidence that both are. Centre: entry evaluations for a complete 10,000 by 10,000 matrix on a log scale: previous algorithm (row cost grows like K squared) 1.67 times 10 to the 11; this paper (row cost grows like K) 3.77 times 10 to the 8; about 440 times fewer, about two minutes in plain Python, in a simulated study in the design of Vovk and Wang, scaled up. Right: why it works: inserting values into a gap cannot raise the plain average unless it raises the pairwise-product average too, so a hidden table is totally monotone and SMAWK finds every row minimum quickly. Proved for U2 and fixed mixes with the plain average; higher-degree products open; float mode not certified.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffd38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

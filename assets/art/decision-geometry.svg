<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="art-description">
<desc id="art-description">At the manuscript’s exact double-boundary example q=(2/5,2/5,3/10,1/5), the nearby compatibility sets are {3}, {1,3}, {2,3}, and {1,2,3}. Every set contains orientation 3, but the complete set varies. Lines indicate set inclusion, not parameter-space distances. Conditional on the stated evolutionary model.</desc><defs>

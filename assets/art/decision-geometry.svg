<stop offset="0" stop-color="#6ddbc4" stop-opacity="0.25"/><stop offset="1" stop-color="#6ddbc4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

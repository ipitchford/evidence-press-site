acity=".22"/><text class="og-hide" x="635" y="62" fill="#d6ccd2" font-family="Georgia,serif" font-size="20">CRITICAL MEAN DEGREE</text><text class="og-hide" x="635" y="130" fill="#fbf5e9" font-family="Georgia,serif" font-size="32">p꜀ = 1 + Σ D(x)² + O(s³)</text><text class="og-hide" x="635" y="187" fill="#a9dcf1" font-family="Georgia,serif" font-size="23">Pure power law</text><text class="og-hide" x="635" y="228" fill="#a9dcf1" font-family="Georgia,serif" font-size="27">coefficient of s²:  π² / 12</text><text class="og-hide" x="635" y="285" fill="#f0c480" font-family="Georgia,serif" font-size="22">Add nearest-neighbour weight λ</text><text class="og-hide" x="635" y="329" fill="#f0c480" font-family="Georgia,serif" font-size="29">π² / 12  +  λ  +  λ² / 2</text><text class="og-hide" x="48" y="388" fill="#d6ccd2" font-family="Georgia,serif" font-size="17">Schematic exploration · fixed dimension one · s → 0 · linear, undirected bonds</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on ultraviolet obstructions to the gravitational clock of a null-cone quantisation of gravity. On the left, a past light cone is drawn in oblique view as fine luminous generators running from a small cap circle (labelled cap, v = ε) to a large corner circle in a warm accent (labelled corner S, v = 1). One generator is highlighted; near the cap it frays into ripples that grow finer, hinting at ultraviolet modes (schematic, not data). A clock dial sits on this generator with its hand blurred into a fan of positions, labelled: clock reading does not settle. On the right, three rows list the three standard definitions of the clock and how each fails: Weyl ordering, zero-point value proportional to K squared, growing with the number K of modes kept; normal ordering, ground value of order minus K, not an operator on finite-particle states; Wick ordering, vacuum reading 1 minus epsilon, yet a positive form that is not closable, so no operator. Headline: three ways to define the gravitational clock; none gives an operator. Footer: linearised sector, natural Fock realisation; not a claim that no clock exists.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>

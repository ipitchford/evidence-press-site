<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on adversarial random walks. Left: a small drawing of the graph, a clique whose every vertex carries one private leaf, with one longer path of length L hanging off one vertex and ending at a hard endpoint; covering means collecting all the leaves. Right: a plot against path length L of the largest relative perturbation epsilon an adversary may apply before the expected time doubles. A flat green line at about 0.293 is labelled cover time stays; a falling orange curve 0.628 divided by L is labelled hitting time tends to zero. The core has 2 to the power 2 to the L vertices.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.70" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Cover-time robustness can stay positive while hitting-time robustness vanishes</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Counterexample to Zuckerman’s Conjecture 1.17: the two tolerances differ by a factor growing like log log |V|</text><text class="og-hide" x="60" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">The graph</text><text class="og-hide" x="60" y="150" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">huge clique · a private leaf on every vertex · one path of length L</text><path d="M138.0 262.0 L161.3 213.5" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M138.0 262.0 L213.8 201.6" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M138.0 262.0 L255.9 235.1" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M138.0 262.0 L255.9 288.9" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M138.0 262.0 L213.8 322.4" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M138.0 262.0 L161.3 310.5" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M161.3 213.5 L213.8 201.6" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M161.3 213.5 L255.9 235.1" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M161.3 213.5 L255.9 288.9" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M161.3 213.5 L213.8 322.4" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M161.3 213.5 L161.3 310.5" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M213.8 201.6 L255.9 235.1" stroke="#e3d9c9" stroke-opacity=".28" stroke-width="1.1"/><path d="M213.8
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how far permanental compounds can exceed the permanent at fixed rank. Left: the exact exponential base of the worst ratio plotted against the share p = k/n of indices in the first group, from Theorem 1.1(iii) and Figure 1 of the paper. A solid curve for complex vectors of rank at least two and real vectors of rank at least four rises from 1 to a peak e/2 ≈ 1.359 at p = ½; a dashed curve for real rank three stays lower and is flat at e²/6 ≈ 1.2315 across the shaded interval from ⅓ to ⅔. A faint line at 1 means no violation. Right: at each fixed k the largest eigenvalue can exceed the permanent by order (log n)^k and the best 0/1 test by order (log n)^(k−1), drawn as rows of blocks for k = 2, 3 and 4, each block one factor of log n. Footer: the smallest violating dimensions are real 3 and complex 2, an exact 0/1 witness has 152 vectors, and the rates are asymptotic in n.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

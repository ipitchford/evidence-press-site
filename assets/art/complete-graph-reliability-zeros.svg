<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that the innermost complex zeros of the reliability polynomial of K_n sit at distance about (2 log n − 1.392)/n inside the unit circle, in two mirror-image directions at about ±137 degrees rather than on the negative real axis.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">MATHEMATICS · GRAPH POLYNOMIALS</text>
<text class="og-hide" x="56" y="148" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">Reliability zeros of K_n</text>
<text class="og-hide" x="56" y="190" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">Innermost zeros: distance (2 log n − 1.392)/n inside</text>
<text class="og-hide" x="56" y="218" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">the unit circle, at about ±137 degrees; the constant</text>
<text class="og-hide" x="56" y="246" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">comes from Waldvogel's W_0 = 0.7377…</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="99.69999999999999" fill="#ffc36b" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">±137°</text>
<text class="og-hide" x="948" y="125.69999999999999" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">direction of innermost zeros</text>
<rect x="752" y="158.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="201.7" fill="#9fd3ff" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">29/30</text>
<text class="og-hide" x="948" y="227.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">of zeros on explicit curve</text>
<rect x="752" y="260.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#a8e0b0" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="303.7" fill="#a8e0b0" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">0.7377</text>
<text class="og-hide" x="948" y="329.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Waldvogel constant</text>
</svg>
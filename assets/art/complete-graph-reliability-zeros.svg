<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the complex zeros of the reliability polynomial of the complete graph, the chance that a complete network stays connected when each link fails independently with probability q. Left: the complex q-plane with the unit circle and all 78 nontrivial zeros of K_14, computed with the release code, forming an oval inside the circle; the innermost pair is highlighted and dashed rays mark the limiting directions ±137 degrees (±2.393 radians), away from the negative real axis. A small shaded arc by q = 1 marks the sliver |arg q| &lt; π/30 that the curve theorem leaves out. Right: three results. The innermost zeros approach two mirror directions near ±137 degrees; their distance inside the unit circle is about (2 log n − 1.392)/n, where −1.392 = −2(1 + log W_0) and W_0 = 0.7377… is Waldvogel’s 1983 constant, the smallest zero of the deformed exponential; and 29/30 of the zeros lie on an explicit curve over the arc from π/30 to 59π/30. Footer: the radius and directions are large-n limits.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Where the reliability zeros come closest to zero</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">zeros of the chance that a randomly thinned complete network stays connected, in the complex q-plane</text><path d="M148 226H452M300 80V368" stroke="#d9d2c4" stroke-width="1" opacity=".45"/><circle cx="300" cy="226" r="128" fill="none" stroke="#d9d2c4" stroke-width="1.6" opacity=".8"/><path d="M436.2 240.3A137 137 0 0 0 436.2 211.7" stroke="#bdb5a6" stroke-width="5" fill="none" opacity=".5"/><path d="M300 226L198.7 131.9" stroke="#f6c177" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M300 226L198.7 320.1" stroke="#f6c177" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="404.5" cy="198.1" r="3.4" fill="#8fd3c8"/><circle cx="396.2" cy="190.7" r="3.4" fill="#8fd3c8"/><circle cx="390.4" cy="183.7" r="3.4" fill="#8fd3c8"/><circle cx="385.7" cy="176.9" r="3.4" fill="#8fd3c8"/><circle cx="381.3" cy="170.3" r="3.4" fill="#8fd3c8"/><circle cx="376.2" cy="163.9" r="3.4" fill="#8fd3c8"/><circle cx="370.0" cy="157.9" r="3.4" fill="#8fd3c8"/><circle cx="363.6" cy="153.6" r="3.4" fill="#8fd3c8"/><circle cx="357.7" cy="149.2" r="3.4" fill="#8fd3c8"/><circle cx="351.7" cy="145.8" r="3.4" fill="#8fd3c8"/><circle cx="345.3" cy="141.9" r="3.4" fill="#8fd3c8"/><circle cx="339.1" cy="138.6" r="3.4" fill="#8fd3c8"/><circle cx="332.1" cy="136.2" r="3.4" fill="#8fd3c8"/><circle cx="324.5" cy="134.3" r="3.4" fill="#8fd3c8"/><circle cx="317.6" cy="133.2" r="3.4" fill="#8fd3c8"/><circle cx="311.3" cy="131.9" r="3.4" fill="#8fd3c8"/><circle cx="304.4" cy="131.7" r="3.4" fill="#8fd3c8"/><circle cx="297.8" cy="131.6" r="3.4" fill="#8fd3c8"/><circle cx="290.3" cy="132.2" r="3.4" fill="#8fd3c8"/><circle cx="283.1" cy="133.0" r="3.4" fill="#8fd
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on counterexamples to the unimodality of domination polynomials. Title: The count of dominating sets dips, then rises again. Subtitle: d sub 160080 is greater than d sub 160320, which is less than d sub 160560, in explicit 317,440-vertex graphs, certified in exact integer arithmetic (Theorem 1.1). Left: a chart with three vertical bars at dominating-set sizes 160,080, 160,320 and 160,560, showing the certified range of one million times d sub k divided by 2 to the power 314880. The outer bars, in blue, span 1556 to 1615 and 1565 to 1624; the middle bar, in pink, spans 1482 to 1541. A dashed green line at 1541 marks the top of the middle interval, below both outer bars. Right: the Alikhani–Peng conjecture said these counts always rise to one peak, then fall. Two families of dominating sets, exactly equal in number but different in typical size, give two humps with a dip between them. Same idea: many peaks, and a most common size far from the average. Minimum degree log2 n plus log2 log2 n plus 1 forces one central peak. Footer: bars are certified intervals for the split and the bipartite example, both connected; the middle bar lies wholly below both outer bars; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.4">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">The count of dominating sets dips, then rises again</text><text class="og-hide" x="40" y="74" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">d_160080 &gt; d_160320 &lt; d_160560 in explicit 317,440-vertex graphs, certified in exact integer arithmetic (Theorem 1.1)</text><line x1="90" y1="320" x2="630" y2="320" stroke="#c3ccd2" stroke-width="1.2" opacity="0.7"/><line x1="90" y1="100" x2="90" y2="320" stroke="#c3ccd2" stroke-width="1.2" opacity="0.7"/><text class="og-hide" x="82" y="299.55555555555554" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1480</text><text class="og-hide" x="82" y="250.66666666666669" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1520</text><text class="og-hide" x="82" y="201.77777777777777" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1560</text><text class="og-hide" x="82" y="152.88888888888889" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1600</text><text class="og-hide" x="82" y="104" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1640</text><line x1="90" y1="221.0" x2="630" y2="221.0" stroke="#a8e6c1" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.9"/><text class="og-hide" x="626" y="238" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">top of the middle interval: 1541</text><rect x="182.0" y="130.6" width="32" height="72.1" rx="4" fill="#9fd3ff" opacity="0.88" stroke="#111" stroke-width="1"/><text class="og-hide" x="222" y="135.55555555555554" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1615</text><text class="og-hide" x="222" y="207.66666666666669" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1556</text><text class="og-hide" x="198" y="340" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">160,080</text><rect x="344.0" y="221.0" width="32" height="72.1" rx="4" fill="#f2a7b5" opacity="0.88" stroke="#111" stroke-width="1"/><text class="og-hide" x="384" y="214" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1541</text><text class="og-hide" x="384" y="298.1111111111111" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1482</text><text class="og-hide" x="360" y="340" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">160,320</text><rect x="506.0" y="119.6" width="32" height="72.1" rx="4" fill="#9fd3ff" opacity="0.88" stroke="#111" stroke-width="1"/><text class="og-hide" x="546" y="124.55555555555557" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1624</text><text class="og-hide" x="546" y="196.66666666666666" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">1565</text><text class="og-hide" x="522" y="340" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">160,560</text><text class="og-hide" x="360" y="360" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">dominating-set size k; bars: certified range of 10⁶ d_k / 2^314880</text><text class="og-hide" x="700" y="128" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">The Alikhani–Peng conjecture said these</text><text class="og-hide" x="700" y="150" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">counts always rise to one peak, then fall.</text><text class="og-hide" x="700" y="184" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Two families of dominating sets, exactly equal</text><text class="og-hide" x="700" y="204" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">in number but different in typical size, give</text><text class="og-hide" x="700" y="224" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">two humps with a dip between them.</text><text class="og-hide" x="700" y="258" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Same idea: many peaks, and a most common size</text><text class="og-hide" x="700" y="278" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">far from the average. Minimum degree</text><text class="og-hide" x="700" y="298" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">log₂ n + log₂ log₂ n + 1 forces one central peak.</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Bars: certified intervals for the split and the bipartite example (both connected). The middle bar lies wholly below both outer bars. Unrefereed candidate.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">The eight-vertex graph H4 has fourteen cross links: the highlighted vertex retains two of four. Its two missing links form a star. Weights 9 at the centre and 5 at both ends give positive residual 2 at every star vertex; the other weights are 1 with residual 18. A weighted certificate succeeds beyond the strict-majority partition class.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a7d8ee" stop-opacity="0.06"/><stop offset="1" stop-color="#a7d8ee" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper that solves optimal size-aware dispatching to two fluid queues exactly, shown on the paper’s running example: job sizes 1/2 and 3/2 equally likely, load rho = 3/4, both queues starting with 1/2 unit of work. Left: the workload plane, with the longer queue’s work across and the shorter queue’s work up. Balanced routing stays on the dotted diagonal. The optimal path leaves the diagonal: first all arriving work goes to one queue; when the relative imbalance z reaches 3/13 (at workloads 4/7 and 5/14), small jobs go to the shorter queue; that queue empties at longer-queue work 9/14 and is then kept exactly busy, taking all small jobs and 5/9 of the large ones, while the longer queue drains to zero. The dashed most-work-left path shares the first leg but keeps all work on the longer queue until the other empties. Top right: before either queue empties, large jobs always go to the longer queue; small jobs switch from the longer to the shorter queue at z = 3/13. Bottom right: waiting cost from the start, balanced 3/2, most work left 21/16 and optimal 33/28, a saving of 3/14, about 21 percent, against balanced routing. All values are exact and are for the fluid model, not the random queue.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.6" r="0.5">
<stop offset="0" stop-color="#7cd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#7cd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#eef1ff" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">The best dispatcher pulls two queues apart</text><text class="og-hide" x="40" y="80" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="normal" text-anchor="start">Exact optimal fluid path: job sizes ½ and 3/2 equally likely, load ρ = ¾, each queue starting with ½ unit of work</text><path d="M90 360 H442" stroke="#cdd3f0" stroke-opacity=".4" stroke-width="1.5"/><path d="M90 360 V113.59999999999997" stroke="#cdd3f0" stroke-opacity=".4" stroke-width="1.5"/><path d="M310 360 V365" stroke="#cdd3f0" stroke-opacity=".6" stroke-width="1.5"/><path d="M85 140 H90" stroke="#cdd3f0" stroke-opacity=".6" stroke-width="1.5"/><text class="og-hide" x="90" y="380" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><text class="og-hide" x="310" y="380" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">½</text><text class="og-hide" x="81" y="145" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">½</text><text class="og-hide" x="98" y="112" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">shorter queue’s work ↑</text><text class="og-hide" x="334" y="380" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">longer queue’s work →</text><path d="M90 360 L332.0 118.0" stroke="#c7cde8" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/><path d="M193.6 256.4 L202.5 239.8 L210.2 247.5 Z" fill="#c7cde8"/><path d="M341.4 202.9 L420.0 360.0 L376.9 360" stroke="#f2a7c8" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/><path d="M310.0 140.0 L341.4 202.9 L372.9 360.0 L90 360" stroke="#7cd3ff" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M331.3 182.6 L318.4 168.9 L328.1 164.1 Z" fill="#7cd3ff"/><path d="M360.5 298.1 L351.7 281.5 L362.2 279.4 Z" fill="#7cd3ff"/><path d="M222.4 360.0 L240.4 354.6 L240.4 365.4 Z" fill="#7cd3ff"/><circle cx="310.0" cy="140.0" r="7" fill="#7cd3ff" stroke="#151a36" stroke-width="2"/><circle cx="341.4" cy="202.9" r="6.5" fill="#7cd3ff" stroke="#151a36" stroke-width="2"/><circle cx="372.9" cy="360.0" r="6.5" fill="#7cd3ff" stroke="#151a36" stroke-width="2"/><text class="og-hide" x="298.0" y="138.0" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="end">start</text><text class="og-hide" x="340.0" y="158.0" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">① all arriving work → longer queue</text><text class="og-hide" x="373.4" y="224.9" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">② at imbalance z = 3/13:</text><text class="og-hide" x="373.4" y="242.9" fill="#7cd3ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">small jobs → shorter queue</text><text class="og-hide" x="434.0" y="318" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">③ shorter queue empty, then</text><text class="og-hide" x="434.0" y="336" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">kept exactly busy: all small,</text><text class="og-hide" x="434.0" y="354" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">5/9 of large jobs</text><path d="M104 133 H134" stroke="#7cd3ff" stroke-width="4.5"  stroke-linecap="round"/><text class="og-hide" x="142" y="138" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">optimal</text><path d="M104 153 H134" stroke="#f2a7c8" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/><text class="og-hide" x="142" y="158" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">most work left</text><path d="M104 173 H134" stroke="#c7cde8" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/><text class="og-hide" x="142" y="178" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">balanced</text><text class="og-hide" x="620" y="126" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Where each job goes, by imbalance z (before a queue empties)</text><text class="og-hide" x="700" y="161" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">size 3/2</text><text class="og-hide" x="700" y="196" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">size ½</text><rect x="712" y="144" width="438" height="24" rx="3" fill="#a9b1e6" fill-opacity=".85"/><rect x="712" y="179" width="101.1" height="24" rx="3" fill="#a9b1e6" fill-opacity=".85"/><rect x="813.1" y="179" width="336.9" height="24" rx="3" fill="#7cd3ff"/><text class="og-hide" x="981.5" y="161" fill="#151a36" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">to the longer queue</text><text class="og-hide" x="981.5" y="196" fill="#151a36" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">to the shorter queue</text><path d="M813.1 138 V212" stroke="#eef1ff" stroke-width="2" stroke-dasharray="4 4"/><text class="og-hide" x="712" y="228" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><text class="og-hide" x="1150" y="228" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="813.1" y="228" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">z = 3/13</text><text class="og-hide" x="859.1" y="228" fill="#aab3dc" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">z = (longer − shorter) / total work</text><text class="og-hide" x="620" y="266" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Waiting cost from the start</text><text class="og-hide" x="762" y="294" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">balanced</text><rect x="772" y="280" width="360.0" height="18" rx="3" fill="#c7cde8" fill-opacity="0.8"/><text class="og-hide" x="1140.0" y="294" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">3/2</text><text class="og-hide" x="762" y="322" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">most work left</text><rect x="772" y="308" width="315.0" height="18" rx="3" fill="#f2a7c8" fill-opacity="0.8"/><text class="og-hide" x="1095.0" y="322" fill="#eef1ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">21/16</text><text class="og-hide" x="762" y="350" fill="#cdd3f0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">optimal</text><rect x="772" y="336" width="282.9" height="18" rx="3" fill="#7cd3ff" fill-opacity="1"/><text class="og-hide" x="1062.9" y="350" fill="#7cd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">33/28</text><text class="og-hide" x="772" y="384" fill="#7cd3ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">optimal saves 3/14 ≈ 21% against balanced routing</text>
</svg>
, so the counts are jointly normal</text><text class="og-hide" x="590" y="104" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">Two or more cycles: fixed by the first nodes</text><text class="og-hide" x="590" y="126" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">the count follows its cyclic core, which stops changing early</text><path d="M630 200L680 150L730 200L680 250Z" fill="#ffc36b" opacity="0.14"/><line x1="630" y1="200" x2="730" y2="200" stroke="#ffc36b" stroke-width="2.4"/><line x1="630" y1="200" x2="680" y2="150" stroke="#ffc36b" stroke-width="2.4"/><line x1="630" y1="200" x2="680" y2="250" stroke="#ffc36b" stroke-width="2.4"/><line x1="730" y1="200" x2="680" y2="150" stroke="#ffc36b" stroke-width="2.4"/><line x1="730" y1="200" x2="680" y2="250" stroke="#ffc36b" stroke-width="2.4"/><circle cx="630" cy="200" r="6" fill="#f6f2ea" stroke="#10161c" stroke-width="1.5"/><circle cx="730" cy="200" r="6" fill="#f6f2ea" stroke="#10161c" stroke-width="1.5"/><circle cx="680" cy="150" r="6" fill="#f6f2ea" stroke="#10161c" stroke-width="1.5"/><circle cx="680" cy="250" r="6" fill="#f6f2ea" stroke="#10161c" stroke-width="1.5"/><line x1="730" y1="200" x2="790" y2="168" stroke="#9fd3ff" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="790" cy="168" r="6" fill="#9fd3ff" stroke="#10161c" stroke-width="1.5"/><text class="og-hide" x="680" y="286" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle">diamond core</text><text class="og-hide" x="802" y="158" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="start">pendant leaf</text><text class="og-hide" x="858" y="182" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">count ÷ log n → 4 × (copies of the core)</text><text class="og-hide" x="858" y="206" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">a random limit set by the earliest nodes;</text><text class="og-hide" x="858" y="226" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">the core may never appear at all</text><text class="og-hide" x="858" y="256" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">at m = 2: about 9.37 core copies on average,</text><text class="og-hide" x="858" y="276" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">so about 37.5 log n copies of the pattern</text><text class="og-hide" x="40" y="372" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Uniform attachment graph, fixed patterns and fixed m; unrefereed candidate.</text>

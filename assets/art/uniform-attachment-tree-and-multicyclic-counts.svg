<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on counts of small patterns in uniform attachment graphs. Title: Counting patterns in a randomly growing network. Subtitle: each new node links to m earlier nodes chosen at random; two conjectures of Björklund, Holmgren, Janson and Lo, proved. Left, in green: tree patterns, variance grows like n; counts vary by about the square root of n and forget the early network. Three small trees with their exact variance constants divided by n at m = 2: two-edge path 12, three-edge path 1688, three-leaf star 888. Every mixture of tree counts also varies on the square-root-of-n scale, so the counts are jointly normal. Right, in amber: two or more cycles, fixed by the first nodes; the count follows its cyclic core, which stops changing early. A diamond (four nodes, five edges, shaded) with one pendant leaf attached by a dashed edge. Count divided by log n tends to 4 times the number of copies of the core: a random limit set by the earliest nodes, and the core may never appear at all. At m = 2 there are about 9.37 core copies on average, so about 37.5 log n copies of the pattern. Footer: uniform attachment graph, fixed patterns and fixed m; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.6" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on when similarity-sensitive entropy fails to be concave. Title: Similarity-sensitive entropy: four outcomes are safe, five can fail. Subtitle: pooling can lower H sub K of p, minus the sum of p sub i times log of (K p) sub i, only for some similarity matrices K; one exact test per outcome decides which. Left: a complete bipartite graph with two outcomes in one dashed group and three in the other; every pair across the groups is joined by a line, labelled similarity a across the groups and a squared within a group. Middle: a to-scale line of the edge similarity a from 0.60 to 0.74 showing the exact test on the five-outcome example, green and labelled passes on grid up to 0.6736, pink and labelled fails from 0.6736 to one over root two, grey and labelled not positive definite beyond; the pink window is about 0.033 wide; a marker at a equals 12 over 17 notes that revealing the group raises expected entropy by about 0.0003 nats. Right: four outcomes are always safe (positive definite, triangle inequality, exact polynomial certificate); five outcomes can fail (the two-group example, in a narrow window); under either condition and at any size an observation raises expected entropy by at most one half log n; dendrogram (ultrametric) similarities are always safe. Footer: left, five outcomes in groups of two and three; middle, failure proved on the pink window, and the exact test passes at a equals 0.60, 0.61, up to 0.67; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.45" cy="0.55" r="0.4">
<stop offset="0" stop-color="#f2a7b5" stop-opacity="0.06"/><stop offset="1" stop-color="#f2a7b5" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Similarity-sensitive entropy: four outcomes are safe, five can fail</text><text class="og-hide" x="40" y="74" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Pooling can lower H_K(p) = −Σ pᵢ log (Kp)ᵢ only for some similarity matrices K; one exact test per outcome decides which</text><line x1="95" y1="152" x2="265" y2="122" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><line x1="95" y1="152" x2="265" y2="202" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><line x1="95" y1="152" x2="265" y2="282" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><line x1="95" y1="252" x2="265" y2="122" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><line x1="95" y1="252" x2="265" y2="202" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><line x1="95" y1="252" x2="265" y2="282" stroke="#9fd3ff" stroke-width="2" opacity="0.75"/><rect x="69" y="122" width="52" height="160" rx="26" fill="none" stroke="#ffc36b" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.85"/><rect x="239" y="92" width="52" height="220" rx="26" fill="none" stroke="#ffc36b" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.85"/><circle cx="95" cy="152" r="12" fill="#f6f2ea" stroke="#111" stroke-width="1.2"/><circle cx="95" cy="252" r="12" fill="#f6f2ea" stroke="#111" stroke-width="1.2"/><circle cx="265" cy="122" r="12" fill="#f6f2ea" stroke="#111" stroke-width="1.2"/><circle cx="265" cy="202" r="12" fill="#f6f2ea" stroke="#111" stroke-width="1.2"/><circle cx="265" cy="282" r="12" fill="#f6f2ea" stroke="#111" stroke-width="1.2"/><text class="og-hide" x="180" y="338" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle">similarity a across the groups</text><text class="og-hide" x="180" y="357" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle">a² within a group</text><text class="og-hide" x="360" y="144" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Edge similarity a (to scale)</text><text class="og-hide" x="360" y="164" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">exact test on the five-outcome example</text><rect x="360.0" y="196" width="220.9" height="28" fill="#a8e6c1" opacity="0.85"/><text class="og-hide" x="470.5" y="215" fill="#123" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">passes on grid</text><rect x="580.9" y="196" width="100.4" height="28" fill="#f2a7b5" opacity="0.85"/><text class="og-hide" x="631.1" y="215" fill="#311" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">fails</text><rect x="681.3" y="196" width="98.7" height="28" fill="#8f9aa3" opacity="0.85"/><text class="og-hide" x="730.7" y="215" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">not PD</text><line x1="360.0" y1="224" x2="360.0" y2="232" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="360.0" y="248" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">0.60</text><line x1="510.0" y1="224" x2="510.0" y2="232" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="510.0" y="248" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">0.65</text><line x1="660.0" y1="224" x2="660.0" y2="232" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="660.0" y="248" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">0.70</text><text class="og-hide" x="580.9" y="188" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">0.6736</text><text class="og-hide" x="684.3" y="188" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">1/√2</text><line x1="580.9" y1="256" x2="681.3" y2="256" stroke="#f2a7b5" stroke-width="1.4"/><text class="og-hide" x="631.1" y="272" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">window ≈ 0.033 wide</text><line x1="677.6" y1="282" x2="677.6" y2="304" stroke="#ffc36b" stroke-width="1.6"/><circle cx="677.6" cy="282" r="3.5" fill="#ffc36b"/><text class="og-hide" x="683.6" y="318" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">a = 12/17: revealing the group raises</text><text class="og-hide" x="683.6" y="334" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">expected entropy by ≈ 0.0003 nats</text><text class="og-hide" x="830" y="128" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">Four outcomes: always safe</text><text class="og-hide" x="830" y="150" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">(positive definite, triangle inequality;</text><text class="og-hide" x="830" y="168" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">exact polynomial certificate)</text><text class="og-hide" x="830" y="202" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">Five outcomes: can fail</text><text class="og-hide" x="830" y="224" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">the two-group example, in a narrow window</text><text class="og-hide" x="830" y="258" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Either condition, any size: an observation</text><text class="og-hide" x="830" y="278" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">raises expected entropy by at most ½ log n</text><text class="og-hide" x="830" y="312" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Dendrogram (ultrametric) similarities</text><text class="og-hide" x="830" y="332" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">are always safe</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Left: five outcomes in groups of two and three. Middle: failure proved on the pink window; the exact test passes at a = 0.60, 0.61, …, 0.67. Unrefereed candidate.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the best Gaussian measurement of m identical copies of a pure single-mode Gaussian state of light. Left: four identical copies enter an interferometer that adds them coherently; one bright output (gold, thick arrow) carries all of the changing mean and is measured by homodyne detection at an optimised angle, while three dark outputs (blue, dashed) are measured along a fixed axis. By the paper's Theorem 1 no Gaussian measurement of the copies, even with auxiliary light, does better. Right: for the paper's coherent-squeezing example with alpha = 1/2, the Fisher information per copy of the best joint measurement (gold points, exact values from Table 1 for m = 1 to 10) rises above the value for measuring copies separately (81/32, salmon dashed line) towards the quantum limit 3 (violet dotted line); by Corollary 1 the total shortfall from the quantum limit never exceeds lambda squared over 2. Lines merely join the exact points.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.45" r="0.4">
<stop offset="0" stop-color="#ffd27a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="28" font-weight="normal" text-anchor="start">One bright mode is enough</text><text class="og-hide" x="40" y="82" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15.5" font-weight="normal" text-anchor="start">The best Gaussian measurement of many copies of a light beam gathers the signal into one output and measures every output by homodyne detection</text><ellipse cx="90" cy="160" rx="17" ry="9" fill="none" stroke="#9cc7ff" stroke-width="2" transform="rotate(-25 90 160)"/><circle cx="99" cy="157" r="3" fill="#ffd27a"/><path d="M115 160 H205" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><text class="og-hide" x="60" y="134" fill="#c4b7a2" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="start">m identical copies</text><ellipse cx="90" cy="205" rx="17" ry="9" fill="none" stroke="#9cc7ff" stroke-width="2" transform="rotate(-25 90 205)"/><circle cx="99" cy="202" r="3" fill="#ffd27a"/><path d="M115 205 H205" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><ellipse cx="90" cy="250" rx="17" ry="9" fill="none" stroke="#9cc7ff" stroke-width="2" transform="rotate(-25 90 250)"/><circle cx="99" cy="247" r="3" fill="#ffd27a"/><path d="M115 250 H205" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><ellipse cx="90" cy="295" rx="17" ry="9" fill="none" stroke="#9cc7ff" stroke-width="2" transform="rotate(-25 90 295)"/><circle cx="99" cy="292" r="3" fill="#ffd27a"/><path d="M115 295 H205" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><rect x="205" y="140" width="120" height="175" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.6"/><text class="og-hide" x="265" y="222" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">interferometer</text><text class="og-hide" x="265" y="241" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">adds the copies</text><path d="M325 160 H430" stroke="#ffd27a" stroke-width="6"/><path d="M430 160 l-12 -7 v14 z" fill="#ffd27a"/><text class="og-hide" x="440" y="156" fill="#ffd27a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">bright output</text><text class="og-hide" x="440" y="175" fill="#ffd27a" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">homodyne at the best angle φ</text><path d="M325 222 H430" stroke="#9cc7ff" stroke-width="2.4" stroke-dasharray="6 4"/><path d="M325 260 H430" stroke="#9cc7ff" stroke-width="2.4" stroke-dasharray="6 4"/><path d="M325 298 H430" stroke="#9cc7ff" stroke-width="2.4" stroke-dasharray="6 4"/><text class="og-hide" x="440" y="256" fill="#9cc7ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">dark outputs</text><text class="og-hide" x="440" y="275" fill="#9cc7ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">homodyne along a fixed axis</text><text class="og-hide" x="60" y="352" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">No Gaussian measurement of the m copies does better (Theorem 1).</text><path d="M640 150 L 640 370" stroke="#e3d9c9" stroke-opacity=".25" stroke-width="1.2"/><path d="M715 140 V315 H1148" stroke="#e3d9c9" stroke-opacity=".7" stroke-width="1.6" fill="none"/><path d="M715 173.6 H1140" stroke="#c9b6ff" stroke-width="2" stroke-dasharray="3 5"/><text class="og-hide" x="1140" y="165.57142857142858" fill="#c9b6ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="end">quantum limit Q = 3</text><path d="M715 284.1 H1140" stroke="#ff9f8a" stroke-width="2" stroke-dasharray="8 5"/><text class="og-hide" x="1140" y="304.0625" fill="#ff9f8a" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="end">measuring copies separately</text><path d="M715.0 284.1 L762.2 276.7 L809.4 269.3 L856.7 262.0 L903.9 254.6 L951.1 247.2 L998.3 239.9 L1045.6 232.5 L1092.8 226.0 L1140.0 220.7" stroke="#ffd27a" stroke-width="3" fill="none"/><circle cx="715.0" cy="284.1" r="4" fill="#ffd27a"/><circle cx="762.2" cy="276.7" r="4" fill="#ffd27a"/><circle cx="809.4" cy="269.3" r="4" fill="#ffd27a"/><circle cx="856.7" cy="262.0" r="4" fill="#ffd27a"/><circle cx="903.9" cy="254.6" r="4" fill="#ffd27a"/><circle cx="951.1" cy="247.2" r="4" fill="#ffd27a"/><circle cx="998.3" cy="239.9" r="4" fill="#ffd27a"/><circle cx="1045.6" cy="232.5" r="4" fill="#ffd27a"/><circle cx="1092.8" cy="226.0" r="4" fill="#ffd27a"/><circle cx="1140.0" cy="220.7" r="4" fill="#ffd27a"/><text class="og-hide" x="866.1111111111111" y="220.71428571428575" fill="#ffd27a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">best joint measurement</text><text class="og-hide" x="715.0" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="856.7" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">4</text><text class="og-hide" x="998.3" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">7</text><text class="og-hide" x="1140.0" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">10</text><text class="og-hide" x="707" y="295.4" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">2.5</text><text class="og-hide" x="707" y="236.5" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">2.75</text><text class="og-hide" x="707" y="177.6" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">3.0</text><text class="og-hide" x="711" y="120" fill="#c4b7a2" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="start">Fisher information per copy (coherent squeezing, α = 1/2)</text><text class="og-hide" x="1140" y="355" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="end">number of copies m · exact values (Table 1)</text><text class="og-hide" x="715" y="377" fill="#c9b6ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">total shortfall from the quantum limit never exceeds λ²/2</text>
</svg>
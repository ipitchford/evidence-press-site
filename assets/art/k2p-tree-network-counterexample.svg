<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A two-reticulation K2,3 network has exactly the same 64 nucleotide-pattern probabilities as a three-leaf star tree. Amber nodes mark reticulations. The equality uses edge-specific continuous-time transition-biased K2P rates, not one shared prescribed rate ratio.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9dcf2" stop-opacity="0.06"/><stop offset="1" stop-color="#a9dcf2" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><marker id="k2p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c283"/></marker></defs><path d="M115 105L100 235" stroke="#f4c283" stroke-width="3.5" opacity=".85" marker-end="url(#k2p-arrow)"/><path d="M375 105L100 235" stroke="#f4c283" stroke-width="3.5" opacity=".85" marker-end="url(#k2p-arrow)"/><path d="M115 105L390 235" stroke="#f4c283" stroke-width="3.5" opacity=".85" marker-end="url(#k2p-arrow)"/><path d="M375 105L390 235" stroke="#f4c283" stroke-width="3.5" opacity=".85" marker-end="url(#k2p-arrow)"/><path d="M115 105L245 220" stroke="#a9dcf2" stroke-width="3.5" opacity=".85" /><path d="M375 105L245 220" stroke="#a9dcf2" stroke-width="3.5" opacity=".85" /><path d="M100 235L70 315" stroke="#a9dcf2" stroke-width="3.5" opacity=".85" /><path d="M390 235L430 315" stroke="#a9dcf2" stroke-width="3.5" opacity=".85" /><path d="M245 220L245 315" stroke="#a9dcf2" stroke-width="3.5" opacity=".85" /><circle cx="115" cy="105" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><circle cx="375" cy="105" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><circle cx="100" cy="235" r="9" fill="#f4c283" stroke="#1e2330" stroke-width="2"/><circle cx="390" cy="235" r="9" fill="#f4c283" stroke="#1e2330" stroke-width="2"/><circle cx="245" cy="220" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><circle cx="70" cy="315" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><text class="og-hide" x="70" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">1</text><circle cx="430" cy="315" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><text class="og-hide" x="430" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">2</text><circle cx="245" cy="315" r="6" fill="#a9dcf2" stroke="#1e2330" stroke-width="2"/><text class="og-hide" x="245" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">3</text><text class="og-hide" x="245" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff5e7">TWO RETICULATIONS</text><text class="og-hide" x="245" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#a9dcf2">a network</text><text class="og-hide" x="615" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="51" fill="#a9dcf2">64 = 64</text><text class="og-hide" x="615" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#fff5e7">exact pattern</text><text class="og-hide" x="615" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#fff5e7">probabilities</text><text class="og-hide" x="615" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">same observable law</text><path d="M1000 132L865 290" stroke="#a9dcf2" stroke-width="4"/><circle cx="865" cy="290" r="7" fill="#a9dcf2"/><path d="M1000 132L1020 290" stroke="#a9dcf2" stroke-width="4"/><circle cx="1020" cy="290" r="7" fill="#a9dcf2"/><path d="M1000 132L1135 290" stroke="#a9dcf2" stroke-width="4"/><circle cx="1135" cy="290" r="7" fill="#a9dcf2"/><circle cx="1000" cy="132" r="9" fill="#a9dcf2"/><text class="og-hide" x="1000" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff5e7">ONE TREE</text><text class="og-hide" x="865" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">1</text><text class="og-hide" x="1020" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">3</text><text class="og-hide" x="1135" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff5e7">2</text><text class="og-hide" x="1000" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f4c283">edge-specific K2P</text>
</svg>
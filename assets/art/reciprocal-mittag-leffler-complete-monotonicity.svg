<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the two-parameter Mittag-Leffler function. Left: the (alpha, beta) parameter plane for alpha from 1 to 2.5 and beta from 0 to 5. A gold strip marks the band alpha minus 1 to alpha conjectured in 2025 to be exactly where one over E is completely monotone. A green triangle below it marks the region proved here for every alpha between 1 and 2 (Theorem A). A red curve rising through the point (2, 3) marks the boundary b(alpha): solid near alpha equals 2, where it is proved to be the exact boundary (Theorem B), and dashed elsewhere, where it is computed numerically. Right, in gold: The band is too narrow. Also true below the band for every order between 1 and 2; near order 2, true exactly up to b(alpha), with b(2) = 3 and slope about 2.83, where two zeros collide.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">When is 1/E completely monotone? More often than conjectured</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Two-parameter Mittag–Leffler function; regions proved in this release versus the 2025 conjecture</text><text class="og-hide" x="90" y="100" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">parameters (α, β) where 1/E is completely monotone (E = Mittag–Leffler E with parameters α, β)</text><path d="M90.0 352.0 L490.0 304.0 L490.0 352.0 Z" fill="#9be3c0" fill-opacity="0.32"/><path d="M90.0 352.0 L90.0 304.0 L490.0 256.0 L490.0 304.0 Z" fill="#ffd77a" fill-opacity="0.34"/><path d="M450.0 352.0 L450.0 221.2 L466.0 216.0 L482.0 210.7 L486.0 209.4 L490.0 208.0 L494.0 206.6 L502.0 203.9 L518.0 198.3 L530.0 352.0 Z" fill="#9be3c0" fill-opacity="0.22"/><path d="M290.0 265.9 L306.0 262.0 L322.0 258.0 L338.0 253.8 L354.0 249.5 L370.0 245.1 L386.0 240.6 L402.0 235.9 L418.0 231.1 L434.0 226.2 L450.0 221.2 L466.0 216.0 L482.0 210.7 L486.0 209.4 L490.0 208.0 L494.0 206.6 L502.0 203.9 L518.0 198.3 L534.0 192.6 L550.0 186.7 L566.0 180.8 L582.0 174.7 L598.0 168.4 L614.0 162.1 L630.0 155.6 L646.0 148.9 L662.0 142.2 L678.0 135.3" fill="none" stroke="#ff9a8a" stroke-width="2.4" stroke-dasharray="7 5"/><path d="M450.0 221.2 L466.0 216.0 L482.0 210.7 L486.0 209.4 L490.0 208.0 L494.0 206.6 L502.0 203.9 L518.0 198.3" fill="none" stroke="#ff9a8a" stroke-width="4"/><path d="M490 112 V352" stroke="#e3d9c9" stroke-opacity=".35" stroke-dasharray="3 4"/><circle cx="490" cy="208" r="5" fill="#ff9a8a"/><text class="og-hide" x="500" y="226" fill="#ff9a8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">(2, 3)</text><text class="og-hide" x="218.00000000000003" y="301.6" fill="#ffd77a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">conjectured band</text><text class="og-hide" x="310" y="343.36" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Theorem A</text><text class="og-hide" x="538" y="148" fill="#ff9a8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">b(α), numerical</text><path d="M90 352 H690 M90 352 V112" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="90" y="372" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="290" y="372" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1.5</text><text class="og-hide" x="490" y="372" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text class="og-hide" x="690" y="372" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2.5</text><text class="og-hide" x="80" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><text class="og-hide" x="80" y="308" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><text class="og-hide" x="80" y="260" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text class="og-hide" x="80" y="212" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">3</text><text class="og-hide" x="80" y="164" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text class="og-hide" x="80" y="116" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">5</text><text class="og-hide" x="390" y="390" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">order α</text><text class="og-hide" x="50" y="232" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">β</text><path d="M712 108 L 712 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="735" y="140" fill="#ffd77a" font-family="Georgia,serif" font-size="28" font-weight="bold" text-anchor="start">The band is too narrow</text><rect x="735" y="162" width="22" height="14" fill="#ffd77a" fill-opacity=".5"/><text class="og-hide" x="767" y="175" fill="#ffd77a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">conjectured: α − 1 ≤ β ≤ α</text><rect x="735" y="192" width="22" height="14" fill="#9be3c0" fill-opacity=".6"/><text class="og-hide" x="767" y="205" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">also true below, every 1 &lt; α &lt; 2</text><path d="M735 229 h22" stroke="#ff9a8a" stroke-width="4"/><text class="og-hide" x="767" y="235" fill="#ff9a8a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">near α = 2: exactly up to b(α)</text><text class="og-hide" x="735" y="275" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">b(2) = 3, slope b′(2) ≈ 2.83 (exact formula)</text><text class="og-hide" x="735" y="297" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">where two zeros of E collide</text><text class="og-hide" x="735" y="331" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">dashed curve: computed, not proved</text><text class="og-hide" x="735" y="349" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">away from α = 2 (a conjecture)</text>
</svg>
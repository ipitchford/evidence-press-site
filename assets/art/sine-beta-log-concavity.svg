<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper proving that points of the Sine-beta process, counted outward from a fixed origin, have log-concave and positively dependent (MTP2) joint laws for every beta. On the left, ten particles of the circular beta-ensemble sit on a circle; a yellow mark at the top labelled 0 shows where the circle is cut. The first particle clockwise from the cut, y1, is teal and the last, y n, is amber. An arrow labelled cut and unroll leads to a horizontal line with 0 marked in yellow. To the right of 0 the points are labelled Z0, Z1, Z2 and so on, with Z0 equal to y1 and Z1 equal to y2; to the left they are labelled Z minus 1, Z minus 2 and so on, with Z minus 1 equal to y n minus n and Z minus 2 equal to y n minus 1 minus n. A caption reads: labels are fixed coordinates, no random rank. A box on the right states the consequence for the typical spacing G of mean one: the variance of G is at most 1 over beta plus 1, and at beta equal to 2 the bound is one third while the exact value is 0.180. Text at the bottom left says the result is proved for every beta (Theorem 2.1) and was conjectured by Johnston and Prochno in 2024, and that the ten points are a schematic, not data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.62" cy="0.5" r="0.5">
<stop offset="0" stop-color="#7fe0c8" stop-opacity="0.06"/><stop offset="1" stop-color="#7fe0c8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="48" fill="#f4f1ea" font-family="Georgia,serif" font-size="25" font-weight="normal" font-style="normal" text-anchor="start">Cut the circle at the origin, and every labelled point becomes a fixed coordinate</text><text class="og-hide" x="40" y="76" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Why points counted from a fixed origin in Sine-β have log-concave, positively dependent (MTP₂) joint laws, for every β</text><path d="M171.5 126.2 A86 86 0 1 1 158.5 126.2" fill="none" stroke="#dfe6ec" stroke-width="2"/><path d="M165 111 V141" stroke="#ffd76a" stroke-width="3.5"/><text class="og-hide" x="165" y="104" fill="#ffd76a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle">0 (cut)</text><circle cx="196.7" cy="132.0" r="7" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><circle cx="236.1" cy="163.7" r="7" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><circle cx="250.8" cy="217.4" r="7" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><circle cx="233.0" cy="264.7" r="7" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><circle cx="191.6" cy="293.8" r="7" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><circle cx="138.4" cy="293.8" r="7" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><circle cx="97.0" cy="264.7" r="7" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><circle cx="79.0" cy="212.0" r="7" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><circle cx="93.9" cy="163.7" r="7" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><circle cx="133.3" cy="132.0" r="7" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="210.65871153088233" y="130.0392222136104" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">y₁</text><text class="og-hide" x="119.34128846911764" y="130.0392222136104" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="end">yₙ</text><text class="og-hide" x="165" y="219" fill="#b9c8d4" font-family="Georgia,serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="middle">n particles</text><text class="og-hide" x="165" y="328" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">circular β-ensemble</text><path d="M318 212 H372" stroke="#dfe6ec" stroke-width="2.2"/><path d="M372 205 L386 212 L372 219 Z" fill="#dfe6ec"/><text class="og-hide" x="352" y="198" fill="#b9c8d4" font-family="Georgia,serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="middle">cut and unroll</text><path d="M410 205 H1160" stroke="#dfe6ec" stroke-width="2"/><path d="M785 171 V221" stroke="#ffd76a" stroke-width="3.5"/><text class="og-hide" x="785" y="241" fill="#ffd76a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">0</text><circle cx="825.8" cy="205" r="8" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="825.8" y="185" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₀</text><circle cx="890.4" cy="205" r="8" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="890.4" y="185" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₁</text><circle cx="961.8" cy="205" r="8" fill="#7fe0c8" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="961.8" y="185" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₂</text><circle cx="1026.4" cy="205" r="8" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="1026.4" y="185" fill="#a9b9c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₃</text><circle cx="1091.0" cy="205" r="8" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="1091" y="185" fill="#a9b9c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₄</text><circle cx="744.2" cy="205" r="8" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="744.1999999999999" y="185" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₋₁</text><circle cx="679.6" cy="205" r="8" fill="#ffc27a" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="679.5999999999999" y="185" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₋₂</text><circle cx="615.0" cy="205" r="8" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="615" y="185" fill="#a9b9c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₋₃</text><circle cx="543.6" cy="205" r="8" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="543.6" y="185" fill="#a9b9c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₋₄</text><circle cx="479.0" cy="205" r="8" fill="#a9b9c6" stroke="#10202b" stroke-width="1.5"/><text class="og-hide" x="479" y="185" fill="#a9b9c6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="middle">Z₋₅</text><text class="og-hide" x="825.8" y="241" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">= y₁</text><text class="og-hide" x="890.4" y="241" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">= y₂</text><text class="og-hide" x="744.1999999999999" y="263" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">= yₙ − n</text><text class="og-hide" x="679.5999999999999" y="241" fill="#ffc27a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle">= yₙ₋₁ − n</text><text class="og-hide" x="961.8" y="275" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle">labels are fixed coordinates: no random rank</text><rect x="640" y="300" width="520" height="74" rx="10" fill="#0c1820" fill-opacity="0.55" stroke="#7fe0c8" stroke-opacity="0.7"/><text class="og-hide" x="660" y="330" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" font-style="normal" text-anchor="start">Typical spacing G (mean 1):  Var(G) ≤ 1/(β+1)</text><text class="og-hide" x="660" y="357" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="start">At β = 2 the bound is 1/3; the exact value is 0.180</text><text class="og-hide" x="40" y="352" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Proved for every β > 0 (Theorem 2.1);</text><text class="og-hide" x="40" y="372" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">conjectured by Johnston and Prochno in 2024.</text><text class="og-hide" x="40" y="392" fill="#b9c8d4" font-family="Georgia,serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start">Schematic: n = 10 points drawn for illustration, not data.</text>
</svg>
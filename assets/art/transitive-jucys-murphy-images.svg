a,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">and no smaller degree reaches the identity</text><text class="og-hide" x="845" y="252" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Over ℤ: the orbit bound is exact</text><text class="og-hide" x="845" y="272" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">for n ≤ 5 and n = 7;</text><text class="og-hide" x="845" y="292" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">index 2 at n = 6 (exact computation)</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Left: one transitive and one intransitive word on four letters. Middle: the three transitive images built in Section 3 for n = 3. Unrefereed candidate.</text>

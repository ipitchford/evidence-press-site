<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on transitive Jucys–Murphy images. Title: Every central element is transitive, exactly when (n minus 1) factorial is invertible. Subtitle: keeping only the connected products of swaps in Jucys–Murphy evaluations still reaches the whole centre of the symmetric group algebra. Left: two drawings of four numbered letters; in the first, green swaps link all four letters, labelled transitive, kept, swaps link all letters; in the second, two pink swaps leave two separate groups, labelled not transitive, dropped. Middle: the n equals 3 matrix of transitive images in the class basis, columns K one one one, K two one and K three, rows for alpha equal to (1,1,1), (2,1) and (3): first row 2, 0, 0; second row minus 3, minus 1, 0; third row 1, 1, 1. The corner 2 is circled, with the note: 2 equals (3 minus 1) factorial; over a ring where 2 cannot be divided by, the identity is out of reach. Right: over the complex numbers every central element is one transitive image; degree 2n minus 2 suffices, and no smaller degree reaches the identity; over the integers the orbit bound is exact for n at most 5 and n equal to 7, with index 2 at n equal to 6, by exact computation. Footer: left, one transitive and one intransitive word on four letters; middle, the three transitive images built in Section 3 for n equals 3; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.42" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

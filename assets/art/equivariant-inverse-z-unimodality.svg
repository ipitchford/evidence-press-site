<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Boolean rank-two matroid with C2 swapping its elements. The sign representation occurs once in degrees zero, one and two, shown by a gold three-node string. The trivial representation occurs only in degree one, shown by a mint singleton. Total dimensions are one, two, one. This is an abstract representation decomposition, not geometric cohomology.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2c56f" stop-opacity="0.06"/><stop offset="1" stop-color="#f2c56f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif" fill="#f7f0e4">
 <path d="M350 87 V292" stroke="#f7f0e4" stroke-opacity=".12" stroke-width="2"/><text class="og-hide" x="350" y="57" text-anchor="middle" font-size="31">degree 0</text><path d="M650 87 V292" stroke="#f7f0e4" stroke-opacity=".12" stroke-width="2"/><text class="og-hide" x="650" y="57" text-anchor="middle" font-size="31">degree 1</text><path d="M950 87 V292" stroke="#f7f0e4" stroke-opacity=".12" stroke-width="2"/><text class="og-hide" x="950" y="57" text-anchor="middle" font-size="31">degree 2</text>
 <path d="M350 226 H950" stroke="#f2c56f" stroke-opacity=".14" stroke-width="38" stroke-linecap="round"/>
 <path d="M350 226 H950" stroke="#f2c56f" stroke-width="5"/>
 <circle cx="350" cy="226" r="26" fill="#f2c56f"/><circle cx="350" cy="226" r="9" fill="#302319"/><circle cx="650" cy="226" r="26" fill="#f2c56f"/><circle cx="650" cy="226" r="9" fill="#302319"/><circle cx="950" cy="226" r="26" fill="#f2c56f"/><circle cx="950" cy="226" r="9" fill="#302319"/>
 <circle cx="650" cy="128" r="28" fill="#8de0ca"/><circle cx="650" cy="128" r="10" fill="#203e36"/>
 <text class="og-hide" x="63" y="138" font-size="30" fill="#8de0ca">trivial</text>
 <text class="og-hide" x="63" y="237" font-size="30" fill="#f2c56f">sign</text>
 <path d="M62 298 H1090" stroke="#f7f0e4" stroke-opacity=".18"/>
 <text class="og-hide" x="63" y="345" font-size="26">total</text>
 <text class="og-hide" x="350" y="348" text-anchor="middle" font-size="42">1</text><text class="og-hide" x="650" y="348" text-anchor="middle" font-size="42">2</text><text class="og-hide" x="950" y="348" text-anchor="middle" font-size="42">1</text>
 <text class="og-hide" x="1090" y="385" text-anchor="end" font-family="Arial,sans-serif" font-size="17" fill="#e6ded1">Boolean rank 2 · C₂ symmetry · abstract strings</text>
 </g>
</svg>
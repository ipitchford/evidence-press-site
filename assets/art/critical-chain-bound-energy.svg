<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the bound energy of half a critical chain: the energy that entanglement locks into an isolated half and no operation on that half can extract. A single plot shows one-particle energy against wave number k from 0 to π for two exact bands: the hopping band 2 cos k (solid), which crosses zero at k = π/2 with nonzero slope, marked by a tangent line labelled nonzero speed v, and the cubic band (2 cos k)³ (dashed), which meets zero at the same point but flat, a third-order zero. The half from π/2 to π, where both bands are negative, is shaded once as the same filled Fermi sea: both chains have the same ground state and the same entanglement. Linked labels give the two conclusions: for the cubic band the locked energy is proportional to S⁴/L³, a smaller amount with a different power of L; for the hopping band it is proportional to S²/L with coefficient 3v/(2πc). Headline: same quantum state, different locked energy. Footer: isolated half of a critical free-fermion chain; limits as L grows.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Same quantum state, different locked energy</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">the isolated half’s own energy band decides how much energy entanglement locks away</text><defs><clipPath id="ccb-frame"><rect x="80" y="92" width="580" height="280"/></clipPath></defs><rect x="370.0" y="92" width="290.0" height="280" fill="#8fd3c8" fill-opacity=".10"/><path d="M80 232 H660" stroke="#d9d2c4" stroke-width="1.2" opacity=".55"/><path d="M80 92 V372" stroke="#d9d2c4" stroke-width="1.2" opacity=".55"/><path d="M80.0 232 v6" stroke="#d9d2c4"/><text class="og-hide" x="90.0" y="256" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">0</text><path d="M370.0 232 v6" stroke="#d9d2c4"/><text class="og-hide" x="370.0" y="256" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">π/2</text><path d="M660.0 232 v6" stroke="#d9d2c4"/><text class="og-hide" x="660.0" y="256" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">π</text><text class="og-hide" x="660" y="394" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">wave number k →</text><text class="og-hide" x="68" y="106" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="end">energy</text><path clip-path="url(#ccb-frame)" d="M80.0 -216.0 L81.5 -216.0 L82.9 -215.8 L84.3 -215.6 L85.8 -215.3 L87.3 -215.0 L88.7 -214.5 L90.2 -214.0 L91.6 -213.4 L93.0 -212.7 L94.5 -211.9 L96.0 -211.0 L97.4 -210.1 L98.8 -209.0 L100.3 -207.9 L101.8 -206.7 L103.2 -205.5 L104.7 -204.1 L106.1 -202.7 L107.5 -201
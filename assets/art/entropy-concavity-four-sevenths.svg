<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how much Gaussian noise restores entropy concavity near the Gaussian. A horizontal axis shows the signal fraction q, the share of variance that is signal, from 0 to 1, stretched between one half and 0.6 so the new interval is visible; a second row of labels converts q to the noise-to-signal variance ratio. Coloured bands mark the regimes for symmetric inputs close to the Gaussian: concave below one half (Schubr 2026); concave on the new interval from one half to 4/7 (Theorem A of this paper); at 4/7, where noise variance is three quarters of the signal variance, a yellow marker says the boundary itself is open; above 4/7 a local entropy dip at equal weighting is possible (Luo 2026 counterexamples, with Theorem B giving the exact curvature constant), with a tick at 2 minus root 2. Two small schematic curves of entropy against the mixing weight t show a smooth concave arch on the left and an arch with a dip at t = 1/2 on the right; the dip is enormously magnified, since the real dips are of order 10 to the minus 13 nats.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.6" r="0.45">
<stop offset="0" stop-color="#c6f28a" stop-opacity="0.05"/><stop offset="1" stop-color="#c6f28a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

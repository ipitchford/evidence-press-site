<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Observational equivalence and the three identification regimes</title>
<desc id="d">Left panel: one series of observed records, drawn as seven circles, with four different mechanism curves — amber, blue, teal and cream — all passing exactly through those records. The evidence alone cannot separate them. Right panel: three axes for the target quantity theta. Point identified shows a single amber dot. Partially identified shows a bracketed amber interval covering part of the axis. Not identified shows the whole axis shaded amber with arrows at both ends.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.28" r="0.9">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</radialGradient>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#8a938f"/>
</marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
</marker>
</defs>
<rect width="1200" height="520" fill="url(#bg)"/>
<rect width="1200" height="520" fill="url(#glow)"/>
<text x="90" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e7e5e4">One observed series, four mechanisms</text><text x="90" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">Each curve reproduces the same records exactly.</text><line x1="90" y1="410" x2="530" y2="410" stroke="#8a938f" stroke-width="2"/><line x1="90" y1="150" x2="90" y2="410" stroke="#8a938f" stroke-width="2"/><path d="M 116.4 353.5 Q 147.2 329.4 178.0 305.2 Q 208.8 310.1 239.6 315.0 Q 270.4 312.5 301.2 309.9 Q 332.0 280.2 362.8 250.4 Q 393.6 235.2 424.4 219.9 Q 455.2 228.1 486.0 236.3" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.95"/><path d="M 116.4 353.5 Q 147.2 355.4 178.0 305.2 Q 208.8 336.1 239.6 315.0 Q 270.4 338.5 301.2 309.9 Q 332.0 306.2 362.8 250.4 Q 393.6 261.2 424.4 219.9 Q 455.2 254.1 486.0 236.3" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/><path d="M 116.4 353.5 Q 147.2 299.4 178.0 305.2 Q 208.8 280.1 239.6 315.0 Q 270.4 282.5 301.2 309.9 Q 332.0 250.2 362.8 250.4 Q 393.6 205.2 424.4 219.9 Q 455.2 198.1 486.0 236.3" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/><path d="M 116.4 353.5 Q 147.2 377.4 178.0 305.2 Q 208.8 358.1 239.6 315.0 Q 270.4 360.5 301.2 309.9 Q 332.0 328.2 362.8 250.4 Q 393.6 283.2 424.4 219.9 Q 455.2 276.1 486.0 236.3" fill="none" stroke="#e7e5e4" stroke-width="2" opacity="0.42"/><circle cx="116.4" cy="353.5" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="178.0" cy="305.2" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="239.6" cy="315.0" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="301.2" cy="309.9" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="362.8" cy="250.4" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="424.4" cy="219.9" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><circle cx="486.0" cy="236.3" r="6.5" fill="#151a1e" stroke="#e7e5e4" stroke-width="2.4"/><text x="90" y="444" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">observed records</text><text x="530" y="444" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f" text-anchor="end">time</text><line x1="600" y1="60" x2="600" y2="470" stroke="#e7e5e4" stroke-width="1" opacity="0.12"/><text x="650" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e7e5e4">What the design can then support</text><text x="650" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">No conclusion may exceed the identified result.</text><text x="650" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e7e5e4">Point identified</text><line x1="650" y1="208" x2="1100" y2="208" stroke="#8a938f" stroke-width="2"/><line x1="650" y1="203" x2="650" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="706.25" y1="203" x2="706.25" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="762.5" y1="203" x2="762.5" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="818.75" y1="203" x2="818.75" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="875" y1="203" x2="875" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="931.25" y1="203" x2="931.25" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="987.5" y1="203" x2="987.5" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="1043.75" y1="203" x2="1043.75" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="1100" y1="203" x2="1100" y2="213" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><circle cx="860" cy="208" r="9" fill="#f59e0b"/><text x="650" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e7e5e4">Partially identified</text><line x1="650" y1="312" x2="1100" y2="312" stroke="#8a938f" stroke-width="2"/><line x1="650" y1="307" x2="650" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="706.25" y1="307" x2="706.25" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="762.5" y1="307" x2="762.5" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="818.75" y1="307" x2="818.75" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="875" y1="307" x2="875" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="931.25" y1="307" x2="931.25" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="987.5" y1="307" x2="987.5" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="1043.75" y1="307" x2="1043.75" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="1100" y1="307" x2="1100" y2="317" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><rect x="768" y="300" width="190" height="24" fill="#f59e0b" opacity="0.32"/><path d="M 768 292 v 40 M 958 292 v 40" stroke="#f59e0b" stroke-width="3.4"/><text x="650" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e7e5e4">Not identified</text><line x1="650" y1="416" x2="1100" y2="416" stroke="#8a938f" stroke-width="2"/><line x1="650" y1="411" x2="650" y2="421" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="706.25" y1="411" x2="706.25" y2="421" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="762.5" y1="411" x2="762.5" y2="421" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="818.75" y1="411" x2="818.75" y2="421" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="875" y1="411" x2="875" y2="421" stroke="#8a938f" stroke-width="1.4" opacity="0.7"/><line x1="931.25" y1="411" x2="931.25" y2="421" stroke="#8a9
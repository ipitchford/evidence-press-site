<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on fixed-horizon extremes of spectrally negative Lévy processes with Poisson resetting. Left: for Brownian motion reset to 0 at rate 1, started in its long-run state, the conditional density of the endpoint at time 1 given that the maximum exceeded 3, drawn from the paper's exact formulas. Two humps appear. One, centred near 0, is for paths that were reset after their peak and end at an ordinary level; its probability tends to 0.469. The other sits just below the threshold 3 and decays exponentially above it; it is for paths that have not been reset and end near their peak; its probability tends to 0.531. Right: the constant C_1 in the asymptotic P(maximum &gt; u, endpoint &gt; 0) ~ C_1 e^(−√2 u), left unspecified in Remark 3 of Dębicki, Hashorva and Michna (2026), is 1.32858, strictly between their lower bound 0.921 and upper bound 1.736. A footnote states that the overshoot of the peak above u is exponential with mean 1/√2 and independent of everything else.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffcf7a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

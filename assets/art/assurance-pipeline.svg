<text x="90" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8a938f">1. Generation — cheap candidate analysis,</text>
<text x="90" y="426" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8a938f">getting cheaper on every branch</text>
<rect x="640" y="195" width="26" height="52" rx="5" fill="#f59e0b" opacity="0.92"/>
<rect x="640" y="283" width="26" height="52" rx="5" fill="#f59e0b" opacity="0.92"/>
<rect x="633" y="187" width="40" height="156" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.2" opacity="0.6"/>
<text x="653" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#f59e0b" text-anchor="middle">2. Verification</text>
<text x="653" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#f59e0b" text-anchor="middle" opacity="0.85">the narrow stage</text>
<path d="M 640 253 C 690 320, 705 400, 720 452 " fill="none" stroke="#8a938f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<text x="736" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">unsupported claims stop here</text>
<path d="M 666 255 L 900 257 L 900 273 L 666 275 Z" fill="#2dd4bf" opacity="0.75"/>
<text x="786" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#2dd4bf" text-anchor="middle">assured evidential information</text>
<rect x="900" y="220" width="210" height="90" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1.6" opacity="0.75"/>
<path d="M 927 288 C 947 262, 957 292, 973 272 C 983 260, 993 280, 1007 270" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
<text x="1005" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#e7e5e4" text-anchor="middle">3. Authorisation</text>
<text x="1005" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f" text-anchor="middle">a human signature, by constitutional</text>
<text x="1005" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f" text-anchor="middle">doctrine, not capacity</text>
<line x1="1110" y1="265" x2="1160" y2="265" stroke="#8a938f" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="60" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">Sessions are an input to stage 1. The output the decision-maker needs comes only through stages 2 and 3.</text>

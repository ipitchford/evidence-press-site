<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">The three-stage pipeline: generation, verification, authorisation</title>
<desc id="d">A wide teal band labelled generation, carrying many candidate claims, narrows sharply into an amber gate labelled verification, then continues as a single narrow band labelled assured evidential information into a box labelled authorisation with a handwritten signature mark. Unsupported claims deflect away below the gate. A caption notes that throughput is the minimum across the three stages, and that the narrow stage is verification.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/></linearGradient>
<linearGradient id="gen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.28"/></linearGradient>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a938f"/></marker>
</defs>

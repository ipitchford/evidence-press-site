<text x="90" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8a938f">1. Generation — cheap candidate analysis, getting cheaper on every branch</text>
<rect x="640" y="150" width="26" height="52" rx="5" fill="#f59e0b" opacity="0.92"/>
<rect x="640" y="238" width="26" height="52" rx="5" fill="#f59e0b" opacity="0.92"/>
<rect x="633" y="142" width="40" height="156" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.2" opacity="0.6"/>
<text x="653" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#f59e0b" text-anchor="middle">2. Verification — the narrow stage</text>
<path d="M 640 208 C 690 260, 710 330, 730 372" fill="none" stroke="#8a938f" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/>
<text x="742" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">unsupported claims stop here</text>
<path d="M 666 210 L 900 212 L 900 228 L 666 230 Z" fill="#2dd4bf" opacity="0.75"/>
<rect x="900" y="178" width="200" height="86" rx="10" fill="none" stroke="#e7e5e4" stroke-width="1.6" opacity="0.75"/>
<path d="M 922 238 C 942 214, 952 244, 968 224 C 978 212, 988 232, 1002 222" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
<text x="1000" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#e7e5e4" text-anchor="middle">3. Authorisation</text>
<text x="1000" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f" text-anchor="middle">a human signature, by constitutional</text>
<text x="1000" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f" text-anchor="middle">doctrine, not capacity</text>
<line x1="1100" y1="221" x2="1150" y2="221" stroke="#8a938f" stroke-width="1.6" marker-end="url(#arw)"/>
<text x="783" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#2dd4bf" text-anchor="middle">assured evidential information</text>
<text x="60" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8a938f">Sessions are an input to stage 1. The output the decision-maker needs comes only through stages 2 and 3.</text>

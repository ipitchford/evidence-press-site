<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on boundary limits of the matrix geometric mean. Left: a chart of the exact curve c(t) = 2 divided by the square root of 4 plus t squared, for a coupling t from 0 to 8. Two positive definite 2 by 2 matrices both converge to the projection diag(1, 0), but their geometric mean converges to c(t) times that projection, so every value between 0 and 1 can occur. A gold point marks t = 3/2, where c is exactly 4/5. Right: same symbols in, symbol 4/5 out. Two GLT input sequences built from these blocks both have symbol 1 on the first half of [0, 1] and 0 on the second half (pink step); the published formula predicts that their geometric means have symbol 1 there (green dashed line), but the actual symbol is 4/5 (gold line). A note says the formula is safe when the symbols share no zero region or never overlap.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9fd2ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">The geometric mean can jump at singular matrices, and GLT symbols cannot see it</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Every possible jump obeys one rank test; the jump refutes a published symbol formula</text><path d="M92 342.0 H600" stroke="#e3d9c9" stroke-opacity="0" stroke-width="1"/><text class="og-hide" x="82" y="347" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">0</text><path d="M92 288.5 H600" stroke="#e3d9c9" stroke-opacity="0.13" stroke-width="1"/><text class="og-hide" x="82" y="293.5" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">0.25</text><path d="M92 235.0 H600" stroke="#e3d9c9" stroke-opacity="0.13" stroke-width="1"/><text class="og-hide" x="82" y="240" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">0.5</text><path d="M92 181.5 H600" stroke="#e3d9c9" stroke-opacity="0.13" stroke-width="1"/><text class="og-hide" x="82" y="186.5" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">0.75</text><path d="M92 128.0 H600" stroke="#e3d9c9" stroke-opacity="0.13" stroke-width="1"/><text class="og-hide" x="82" y="133" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">1</text><path d="M92 342 H600" stroke="#c4b7a2" stroke-width="1.2"/><path d="M92.0 342 v6" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="92" y="364" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><path d="M219.0 342 v6" stroke="#c4b7a2" stroke-width="1.2"/><text c
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="art-description">
<desc id="art-description">Seven-point complete split graph CS(3,4), shown as a shortest-path distance diagram, not a Euclidean embedding. Every drawn edge has length one; the four gold vertices are pairwise distance two. With coefficients plus one third on the three teal vertices and minus one quarter on the four gold vertices, the quadratic form Q(p) = 2/3 + (3/4) 2^p - 2 crosses zero at p = log base 2 of 16/9, approximately 0.830075. This witness supplies the sharpness obstruction, not the universal proof.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#69dbc6" stop-opacity="0.25"/><stop offset="1" stop-color="#69dbc6" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the worst case of column-pivoted QR on orthonormal rows. Title: How badly can column-pivoted QR choose rows? Subtitle: Greedy point selection loses at most about e to the C root k against the best choice, with an exact constant, not 2 to the k. Left: the base-10 logarithm of the worst-case loss factor against k, the number of points chosen, from 0 to 120: the old Drmac-Gugercin bound, about 2 to the k, rises steeply; the new bounds e to the 2 root k (all points carry equal energy) and e to the 2.25 root k (no point carries twice the average) rise slowly and cross below the old bound at k = 13 and k = 15. Centre: an upper-triangular matrix whose diagonal (pivots) falls fast and then follows a floor set by orthonormality, the Kahan-type core behind the matching examples. Right: greedy point selection (QRCP) is never worse than the best choice by more than the square root of e times (N minus k plus 1), times e to the C(H) root k; C = 2 when all points carry equal energy, C is about 2.25 when none carries twice the average, and the constant is exact: examples come arbitrarily close to the bound. At k = 100: about 10 to the 9 instead of about 10 to the 30. Exact arithmetic, worst cases only; sharp on the logarithmic scale.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

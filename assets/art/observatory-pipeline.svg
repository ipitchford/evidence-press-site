<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">The nine stages of an Observatory case</title>
<desc id="d">A flow diagram in three rows of three. Row one, evidence: claim registration (exact wording, estimand, population, period, decision), corpus freeze (search date, source ledger, inclusion and exclusion rules), measurement audit (ontology, stock-flow identities, units, missingness, linkage). Row two, inference: rival mechanisms (source-backed rival ledger, semantic coverage statement), identification gate (rank, null space, observability, countermodel search), bounded inference (point estimate only if identified, otherwise bounds or ambiguity). Row three, decision and release: sensitivity and decision analysis (assumption sweeps, robust-policy set, value of information), adversarial verification (fresh agent, separate code, mutation tests, review ledger), release and persistence (manifest, claim-to-evidence index, assurance statement, receipt). Every case closes with a registered terminal status: publication ready, publication ready non-identification, publication ready partial identification, blocked, or rejected.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.28" r="0.9">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</radialGradient>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#8a938f"/>
</marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
</marker>
</defs>

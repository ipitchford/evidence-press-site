 text-anchor="middle" font-weight="700">4</text><text x="138" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e7e5e4">Rival mechanisms</text><text x="100" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">Source-backed rival ledger,</text><text x="100" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">semantic coverage statement</text><line x1="390" y1="325" x2="416" y2="325" stroke="#8a938f" stroke-width="2" marker-end="url(#arw)" opacity="0.8"/><rect x="424" y="266" width="306" height="118" rx="12" fill="#151a1e" fill-opacity="0.72" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.72"/><rect x="424" y="266" width="6" height="118" rx="3" fill="#38bdf8" opacity="0.9"/><circle cx="458" cy="298" r="15" fill="#38bdf8" opacity="0.20"/><text x="458" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle" font-weight="700">5</text><text x="484" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e7e5e4">Identification gate</text><text x="446" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">Rank, null space, observability,</text><text x="446" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8a938f">countermodel search</text><line x1="736" y1="325" x2="762" y2="325" stroke="#8a938f" stroke-width="2" marker-end="url(#arw)" opacity="0.8"/><rect x="770" y="266" width="306" height="118" rx="12" fill="#151a1e" fill-opacity="0.72" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.72"/><rect x="770" y="266" width="6" height="118" rx="3" fill="#38bdf8" opacity="0.9"/><circle cx="804" cy="298" r="15" fill="#38bdf8" opacity="0.20"/><text x="804" y="306" font-family="syste
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the eigenvalues of Markov rate matrices on rings. On the left, a plot of the region near minus one: the shaded area is part of the Karpelevich region Omega_5 (all eigenvalues of five-by-five stochastic matrices) and the blue curve is its boundary arc ending at minus one. A violet point nu = -0.842 + 0.043 i is an eigenvalue of the uniformised five-state ring matrix; a dashed arrow labelled times 1 over beta lifts it to the orange point z = -0.842 + 0.389 i, the affine-rescaled eigenvalue, which lies just above the arc, outside Omega_5. In the middle, the five-state ring: five states joined in a cycle, with clockwise rates 1, 3, 2, 2, 3 written outside and anticlockwise rates 1, 2, 2, 1, 3 inside; every state leaves at total rate 4 and the cycle affinity is F = log 3. On the right, tiles for ring sizes n = 3 to 10: green ticks for n = 3, 4, 6, 8 and 10, where the conjectured containment holds for all rates, and orange crosses for n = 5, 7 and 9, where it fails. Text: n = 3 or n even holds (from known results); every odd n of at least 5 fails at every driving strength (new: dimers near minus one). The proved ellipse and winding bounds stay valid.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.6" r="0.4">
<stop offset="0" stop-color="#9fd2ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

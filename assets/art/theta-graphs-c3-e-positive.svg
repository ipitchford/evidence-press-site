<text class="og-hide" x="275" y="45" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#f4eee7">Three routes. One positivity theorem.</text><polyline points="65,208 155,102 275,72 395,102 485,208" fill="none" stroke="#91d8ef" stroke-width="4"/><circle cx="155" cy="102" r="7" fill="#91d8ef"/><circle cx="275" cy="72" r="7" fill="#91d8ef"/><circle cx="395" cy="102" r="7" fill="#91d8ef"/><polyline points="65,208 205,208 345,208 485,208" fill="none" stroke="#91d8ef" stroke-width="4"/><circle cx="205" cy="208" r="7" fill="#91d8ef"/><circle cx="345" cy="208" r="7" fill="#91d8ef"/><polyline points="65,208 205,315 345,315 485,208" fill="none" stroke="#f3bf77" stroke-width="4"/><circle cx="205" cy="315" r="7" fill="#f3bf77"/><circle cx="345" cy="315" r="7" fill="#f3bf77"/><circle cx="65" cy="208" r="11" fill="#f4eee7"/><circle cx="485" cy="208" r="11" fill="#f4eee7"/><text class="og-hide" x="275" y="179" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#91d8ef">b ≥ 3</text><text class="og-hide" x="275" y="117" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#91d8ef">a ≥ b</text><text class="og-hide" x="275" y="354" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f3bf77">3 edges</text><line x1="550" y1="65" x2="550" y2="337" stroke="#ffffff" opacity=".18"/><text class="og-hide" x="860" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f4eee7">Rearrange terms, preserve the function</text><text class="og-hide" x="740" y="126" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f3bf77">(2, 2, 5)</text><text class="og-hide" x="990" y="126" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#f3bf77">(2, 5, 2)</text><path d="M740 146 Q740 190 850 202 M990 146 Q990 190 870 202" fill="none" stroke="#f3bf77" stroke-width="3"/><text class="og-hide" x="860" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#91d8ef">(5, 2, 2)</text><text class="og-hide" x="860" y="302" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#91d8ef">60 − 8 − 8 = 44</text><text class="og-hide" x="860" y="352" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#f4eee7">The whole weighted group stays positive</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on asymptotic permanental dominance at fixed Gram rank. Title: Every symmetry block averages below the permanent, eventually. Subtitle: worst average eigenvalue of a non-trivial block divided by the permanent, for n vectors in a fixed dimension d (Theorem 1.1). Left: a chart against the number of vectors n on a log scale from 2 to 10 000. A dashed green line at 1 is labelled Lieb’s ceiling: average at most the permanent. Three dashed falling curves, labelled d = 2, d = 3 and d = 4, show (d − 1) log n / n at complex rank d. White dots mark the largest averages in the release’s exact small examples for n = 2 to 6, all below 1. Right: at every fixed rank d, the averages and mean squares of all blocks tend to zero. Worst block: the standard one, about (d − 1) log n / n and (d − 1)(log n) squared / n. Still true while d log n stays far below the square root of n. How large n must be is not computed, so no single new size is settled. Footer: dots are the largest averages in the release’s exact small examples; dashed curves are asymptotic sizes, not bounds at small n; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.4">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

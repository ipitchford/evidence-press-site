<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic Hopf diagram: the coexistence equilibrium changes from stable to unstable at q_H approximately 0.976916, and a small stable periodic orbit exists immediately to its right. The local branch does not assert global periodic convergence or a certified finite continuation interval.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f0bb72" stop-opacity="0.06"/><stop offset="1" stop-color="#f0bb72" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="none" stroke-linecap="round"><path d="M90 290 H1120 M90 290 V65" stroke="#f5ece0" stroke-opacity=".4" stroke-width="2"/><path d="M105 250 H585" stroke="#b8d5a3" stroke-width="6"/><path d="M585 250 H1110" stroke="#f0bb72" stroke-width="4" stroke-dasharray="10 9"/><path d="M585 250 C635 169 730 109 860 83" stroke="#b8d5a3" stroke-width="6"/><path d="M585 250 C635 272 730 282 860 284" stroke="#b8d5a3" stroke-width="6"/><ellipse cx="830" cy="178" rx="64" ry="87" stroke="#b8d5a3" stroke-width="3" opacity=".75"/><path d="M875 116 L888 137 L866 133" stroke="#b8d5a3" stroke-width="3"/><path d="M585 70 V310" stroke="#f0bb72" stroke-width="2" stroke-dasharray="4 8"/><circle cx="585" cy="250" r="10" fill="#f0bb72" stroke="#fff4e6" stroke-width="2"/></g><g font-family="Georgia" fill="#fff4e6" font-size="30"><text class="og-hide" x="145" y="90">Stable coexistence</text><text class="og-hide" x="718" y="50">Stable small cycles</text></g><g font-family="system-ui" fill="#efe4d6" font-size="23"><text class="og-hide" x="300" y="337" text-anchor="middle">before the boundary</text><text class="og-hide" x="585" y="337" text-anchor="middle" fill="#f0bb72">q_H ≈ 0.976916</text><text class="og-hide" x="960" y="337" text-anchor="middle">dormancy probability q →</text><text class="og-hide" x="600" y="382" text-anchor="middle" font-size="18">LOCAL HOPF BRANCH · SCHEMATIC, NOT A CONTINUATION PLOT</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Proposition 6: for fixed positive amplitude z and fixed positive linear scale, the endpoint coefficient is min(z,2)/(1+z). The plotted exact function peaks uniquely at z=2 with value 2/3. The displayed range is 0 to 6; z=0 is only its limiting value. This is not an upper bound or sharpness claim for unrestricted Schatten–Hlawka constants.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f4c78f" stop-opacity="0.06"/><stop offset="1" stop-color="#f4c78f" stop-opacity="0"/>
</radialGradient>
</defs>

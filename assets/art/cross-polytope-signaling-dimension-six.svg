<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A labelled schematic projection of the six-dimensional cross-polytope shows its twelve vertices as six antipodal pairs, plus and minus e_1 through plus and minus e_6. An arrow for the complete input-output correlation set leads to a three-symbol triangle surrounded by a shared-randomness mixing ring, representing exact classical simulation rather than a fixed encoding of vertices. A family-boundary panel states sign.dim of the six-dimensional cross-polytope equals three, shows the exact value three in dimensions three through six, and marks dimension seven only with the lower bound at least four. This is a mathematical schematic, not a quantum device or a statement about three bits.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9dcf2" stop-opacity="0.06"/><stop offset="1" stop-color="#a9dcf2" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

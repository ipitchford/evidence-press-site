<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on balanced perfect matchings. Left: a schematic of three paths with 3, 4 and 2 edges laid end to end on one line; odd edges are blue and even edges orange, standing for the fractional weights alpha and 1 minus alpha. One shaded set A, made of a few intervals, covers parts of all three paths at once; its switch points are marked by red dashed cuts with crosses, and the cut edges are deleted while the rest rounds to a matching. Right: for 3 paths and 4 measures, cutting each path separately needs about 2qd = 24 switches, while cutting all paths at once needs at most q minus 1 plus 2d = 10. Below, in gold: matching error at most 17k, previously order k squared, where k is the number of colours; order k is necessary for arbitrary targets.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Fair pairings: cut every leftover path at once, and the error becomes linear</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Some perfect matching is within 17k of any fractional target, for labels in any k-dimensional norm</text><text class="og-hide" x="70" y="132" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Leftover fractional paths, laid end to end on one line</text><text class="og-hide" x="70" y="154" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">edge weights alternate α and 1 − α along each path</text><rect x="95.8" y="206" width="77.3" height="58" fill="#9be3c0" fill-opacity=".16" stroke="#9be3c0" stroke-opacity=".5" stroke-width="1"/><rect x="231.1" y="206" width="128.9" height="58" fill="#9be3c0" fill-opacity=".16" stroke="#9be3c0" stroke-opacity=".5" stroke-width="1"/><rect x="411.6" y="206" width="83.8" height="58" fill="#9be3c0" fill-opacity=".16" stroke="#9be3c0" stroke-opacity=".5" stroke-width="1"/><rect x="553.3" y="206" width="96.7" height="58" fill="#9be3c0" fill-opacity=".16" stroke="#9be3c0" stroke-opacity=".5" stroke-width="1"/><text class="og-hide" x="292.33333333333337" y="198" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">one set A for all paths</text><path d="M73.0 250 H131.4" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round"/><path d="M137.4 250 H195.9" stroke="#ffb56b" stroke-width="7" stroke-linecap="round"/><path d="M201.9 250 H260.3" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round"/><circle cx="70.0" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="134.4" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="198.9" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="263.3" cy="250" r="4.2" fill="#f4f1ea"/><text class="og-hide" x="166.66666666666666" y="290" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">path 1: 3 edges, α₁</text><path d="M266.3 250 H324.8" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round"/><path d="M330.8 250 H389.2" stroke="#ffb56b" stroke-width="7" stroke-linecap="round"/><path d="M395.2 250 H453.7" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round"/><path d="M459.7 250 H518.1" stroke="#ffb56b" stroke-width="7" stroke-linecap="round"/><circle cx="263.3" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="327.8" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="392.2" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="456.7" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="521.1" cy="250" r="4.2" fill="#f4f1ea"/><text class="og-hide" x="392.2222222222222" y="290" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">path 2: 4 edges, α₂</text><path d="M263.3 190 V274" stroke="#e3d9c9" stroke-opacity=".35" stroke-width="1.2"/><path d="M524.1 250 H582.6" stroke="#8cc8ff" stroke-width="7" stroke-linecap="round"/><path d="M588.6 250 H647.0" stroke="#ffb56b" stroke-width="7" stroke-linecap="round"/><circle cx="521.1" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="585.6" cy="250" r="4.2" fill="#f4f1ea"/><circle cx="650.0" cy="250" r="4.2" fill="#f4f1ea"/><text class="og-hide" x="585.5555555555555" y="290" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">path 3: 2 edges, α₃</text><path d="M521.1 190 V274" stroke="#e3d9c9" stroke-opacity=".35" stroke-width="1.2"/><path d="M95.8 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="95.77777777777777" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M173.1 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="173.11111111111111" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M231.1 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="231.11111111111111" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M360.0 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="360" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M411.6 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="411.55555555555554" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M495.3 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="495.3333333333333" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><path d="M553.3 200 V268" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="4 3"/><text class="og-hide" x="553.3333333333333" y="260" fill="#ff8a8a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">×</text><text class="og-hide" x="70" y="328" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">7 switches cut the whole line; each cut edge (×) is deleted, the rest rounds to a matching</text><path d="M70 345 h22" stroke="#8cc8ff" stroke-width="6"/><text class="og-hide" x="100" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">odd edges (weight α)</text><path d="M260 345 h22" stroke="#ffb56b" stroke-width="6"/><text class="og-hide" x="290" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">even edges (weight 1 − α)</text><text class="og-hide" x="480" y="350" fill="#c4b7a2" font-family="Georgia,serif" font-size="12" font-weight="normal" text-anchor="start">schematic</text><path d="M712 108 L 712 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="745" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">q = 3 paths, d = 4 measures</text><rect x="745" y="166" width="380.0" height="20" rx="3" fill="#ffb56b" fill-opacity=".85"/><text class="og-hide" x="1135" y="181" fill="#ffb56b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">24</text><text class="og-hide" x="745" y="158" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">each path cut separately: about 2qd switches</text><rect x="745" y="222" width="158.3" height="20" rx="3" fill="#9be3c0" fill-opacity=".85"/><text class="og-hide" x="913.3333333333334" y="237" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">10</text><text class="og-hide" x="745" y="214" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">all paths cut at once: q − 1 + 2d switches</text><path d="M745 270 H1155" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1"/><text class="og-hide" x="745" y="304" fill="#ffd77a" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="start">matching error ≤ 17k</text><text class="og-hide" x="745" y="330" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">previously O(k²) · k = number of colours</text><text class="og-hide" x="745" y="352" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">order k is necessary for arbitrary targets</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how far the permanent-on-top conjecture fails. Left: the sharp exponential base g(d) of the worst ratio between the largest eigenvalue of the Schur power and the permanent, plotted for rank d from 1 to 12 from the exact formulas of Theorem 1.1. Two increasing sequences of points: complex vectors g_C(d) and real vectors g_R(d), both approaching a dashed ceiling at e^γ ≈ 1.78; a faint line at 1 means no failure. Highlighted: complex rank two gives e/2 ≈ 1.36, real rank three gives e²/6 ≈ 1.23, and real rank two never fails. Right: the six standard photon polarisations H, V, D, A, R and L on a schematic Bloch sphere; with twelve photons the model bunching enhancement over identical photons is 62731/28800 ≈ 2.18. Footer: the general constant c* satisfies e^γ ≤ c* ≤ e^(1+γ), and whether it equals e^γ is open.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="44" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="start">How fast permanent-on-top fails at fixed rank</text><text class="og-hide" x="48" y="69" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">sharp base g(d): worst ratio ‖Π(A)‖ / per A grows like g(d)ⁿ (Theorem 1.1)</text><path d="M100 126.9 H590" stroke="#f6f2ea" stroke-width="1.6" stroke-dasharray="8 6" opacity=".85"/><text class="og-hide" x="590" y="117.9" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">ceiling e^γ ≈ 1.78</text><path d="M100 296.3 H590" stroke="#d9d2c4" stroke-width="1.2" opacity=".5"/><text class="og-hide" x="590" y="315.3" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">1 = no failure</text><path d="M100 318 H590 M100 318 V106" stroke="#d9d2c4" stroke-width="1.2" fill="none"/><path d="M100.0 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="100.0" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1</text><path d="M144.5 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="144.5" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2</text><path d="M189.1 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="189.1" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3</text><path d="M233.6 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="233.6" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4</text><path d="M322.7 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="322.7" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">6</text><path d="M411.8 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="411.8" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">8</text><path d="M500.9 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="500.9" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">10</text><path d="M590.0 318 v5" stroke="#d9d2c4"/><text class="og-hide" x="590.0" y="339" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">12</text><text class="og-hide" x="590" y="360" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">rank d (dimension of the vectors) →</text><path d="M100.0 296.3 L144.5 296.3 L189.1 246.1 L233.6 218.4 L278.2 201.1 L322.7 189.2 L367.3 180.6 L411.8 174.1 L456.4 169.0 L500.9 164.9 L545.5 161.5 L590.0 158.6 " stroke="#8fd3c8" stroke-width="2.4" fill="none" opacity=".75"/><circle cx="100.0" cy="296.3" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="144.5" cy="296.3" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="189.1" cy="246.1" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="233.6" cy="218.4" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="278.2" cy="201.1" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="322.7" cy="189.2" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="367.3" cy="180.6" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="411.8" cy="174.1" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="456.4" cy="169.0" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="500.9" cy="164.9" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="545.5" cy="161.5" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><circle cx="590.0" cy="158.6" r="5" fill="#8fd3c8" stroke="#14181c" stroke-width="1.5"/><path d="M100.0 296.3 L144.5 218.4 L189.1 189.2 L233.6 174.1 L278.2 164.9 L322.7 158.6 L367.3 154.2 L411.8 150.8 L456.4 148.2 L500.9 146.1 L545.5 144.4 L590.0 142.9 " stroke="#f6c177" stroke-width="2.4" fill="none" opacity=".75"/><circle cx="100.0" cy="296.3" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="144.5" cy="218.4" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="189.1" cy="189.2" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="233.6" cy="174.1" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="278.2" cy="164.9" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="322.7" cy="158.6" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="367.3" cy="154.2" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="411.8" cy="150.8" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="456.4" cy="148.2" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="500.9" cy="146.1" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="545.5" cy="144.4" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="590.0" cy="142.9" r="5" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><circle cx="144.5" cy="218.4" r="10" fill="none" stroke="#f6c177" stroke-width="2"/><path d="M140.5 207.4 L126.7 154.9" stroke="#f6c177" stroke-width="1.2"/><text class="og-hide" x="108" y="148.9" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="15.5" font-weight="bold" text-anchor="start">complex, d = 2: e/2 ≈ 1.36</text><circle cx="189.1" cy="246.1" r="10" fill="none" stroke="#8fd3c8" stroke-width="2"/><text class="og-hide" x="205.1" y="251.1" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="15.5" font-weight="bold" text-anchor="start">real, d = 3: e²/6 ≈ 1.23</text><text class="og-hide" x="242.5" y="287.3" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">real, d = 2: never fails</text><text class="og-hide" x="420.7" y="204.1" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="bold" text-anchor="start">complex g_C(d)</text><text class="og-hide" x="420.7" y="224.1" fill="#8fd3c8" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="bold" text-anchor="start">real g_R(d)</text><text class="og-hide" x="676" y="44" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="start">Bunching beyond identical photons</text><text class="og-hide" x="676" y="69" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">six standard polarisations (Section 7)</text><circle cx="800" cy="210" r="92" fill="#ffffff" fill-opacity=".04" stroke="#d9d2c4" stroke-opacity=".55"/><ellipse cx="800" cy="210" rx="92" ry="29.44" fill="none" stroke="#d9d2c4" stroke-opacity=".35" stroke-dasharray="4 5"/><path d="M800 118 V302 M708 210 H892 M761.4 237.6 L838.6 182.4" stroke="#d9d2c4" stroke-opacity=".3"/><circle cx="800.0" cy="118.0" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="800.0" y="106.0" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">H</text><circle cx="800.0" cy="302.0" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="800.0" y="326.0" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">V</text><circle cx="708.0" cy="210.0" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="694.0" y="215.0" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">D</text><circle cx="892.0" cy="210.0" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="906.0" y="215.0" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">A</text><circle cx="761.4" cy="237.6" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="747.4" y="261.6" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="end">R</text><circle cx="838.6" cy="182.4" r="8" fill="#f6c177" stroke="#14181c" stroke-width="1.5"/><text class="og-hide" x="852.6" y="170.4" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">L</text><text class="og-hide" x="800" y="352" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">twelve photons: 62731/28800 ≈ 2.18</text><path d="M640 30 V352" stroke="#d9d2c4" stroke-opacity=".25"/><text class="og-hide" x="600" y="388" fill="#d9d2c4" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">General constant: e^γ ≤ c* ≤ e^(1+γ); whether c* equals e^γ is open · rates are asymptotic in n</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Left: two oscillators i and j, each replaced by a hexagonal ring of six groups whose phases are offset by multiples of 60 degrees; a repulsive base edge is realised by attractive edges matching group a of i with group a + 3 of j, half a turn apart, where a pull acts as a push. Right: the resulting positive network of 324 oscillators has a continuum of stable equilibria that near one state (three phases at 0, three at pi) is a cone over a torus, whose single connected regular part rules out any cover by closed manifolds.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffd979" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd979" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

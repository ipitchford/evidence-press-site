<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper proving that damped best responses in Tullock contests converge without a minimum-effort floor. Left: exact iterations of the update with step 0.10 for three players with linear costs 1, 4 and 10; efforts converge to 4/25, 1/25 and 0, so the most expensive player withdraws. Centre: on a logarithmic scale, each player’s rival total (the combined effort of the others) for the same run stays bounded away from zero; the withdrawing player still faces rival effort 1/5. Right: for the paper’s three-player example with harmonic steps, total regret plotted against iteration on log-log axes falls like 1/k and stays above the proved floor 3/(4k), because the withdrawing player’s effort decays exactly like 1/(10(k+1)). The curves are exact evaluations of the paper’s update rule. The proved floor in Lemma 4 is a much smaller explicit constant.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

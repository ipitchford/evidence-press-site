<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Two diagonal four-dimensional state pairs obey the same trace-distance cap 3/10 and operator-distance cap 1/5. At exact distances 3/10 and 1/5 the spectra are (2/3,1/3,0,0) and (7/15,7/30,3/20,3/20). The cap maximizer instead has trace distance 1/5, spectra (1,0,0,0) and (4/5,1/15,1/15,1/15), and a larger entropy gap. Bars are exact constructed probabilities, not measured data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#efc77e" stop-opacity="0.06"/><stop offset="1" stop-color="#efc77e" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif" fill="#faf3e5">
<text class="og-hide" x="600" y="43" text-anchor="middle" font-size="27">Same caps: trace distance ≤ 3/10 · operator distance ≤ 1/5</text>
<text class="og-hide" x="305" y="101" text-anchor="middle" font-size="35">Exact: 3/10</text><text class="og-hide" x="880" y="101" text-anchor="middle" font-size="35" fill="#88dbc5">Actual: 1/5</text>
<path d="M100 144 H475 M675 144 H1050" stroke="#fff" stroke-opacity=".12" stroke-dasharray="4 7"/>
<path d="M100 276 H475 M675 276 H1050" stroke="#faf3e5" stroke-opacity=".3"/>

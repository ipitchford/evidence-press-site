<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">One conclusion shared by four nearby answers</title><desc id="dg-desc">At the manuscript’s exact double-boundary example q=(2/5,2/5,3/10,1/5), the nearby compatibility sets are {3}, {1,3}, {2,3}, and {1,2,3}. Every set contains orientation 3, but the complete set varies. Lines indicate set inclusion, not parameter-space distances. Conditional on the stated evolutionary model.</desc><rect width="900" height="1000" fill="#172933"/><g font-family="Arial, sans-serif" fill="#f1f5ee"><text x="450" y="65" text-anchor="middle" font-size="35">Four nearby compatibility sets</text><text x="450" y="112" text-anchor="middle" font-size="25" fill="#b8c8d0">Exact boundary example · manuscript §6.1</text><text x="180" y="222" text-anchor="end" font-size="32">{3}</text><g transform="translate(470 212)"><circle cx="-90" cy="0" r="40" fill="#172933" stroke="#b8c8d0" stroke-width="3" stroke-dasharray="5 6" opacity=".45"/><text x="-90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#b8c8d0" opacity=".55">1</text><circle cx="0" cy="0" r="40" fill="#172933" stroke="#b8c8d0" stroke-width="3" stroke-dasharray="5 6" opacity=".45"/><text x="0" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#b8c8d0" opacity=".55">2</text><circle cx="90" cy="0" r="40" fill="#6ddbc4" stroke="#6ddbc4" stroke-width="3" /><text x="90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >3</text></g><path d="M625 212 H700" stroke="#6ddbc4" stroke-width="3"/><text x="180" y="372" text-anchor="end" font-size="32">{1, 3}</text><g transform="translate(470 362)"><circle cx="-90" cy="0" r="40" fill="#f3c779" stroke="#f3c779" stroke-width="3" /><text x="-90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >1</text><circle cx="0" cy="0" r="40" fill="#172933" stroke="#b8c8d0" stroke-width="3" stroke-dasharray="5 6" opacity=".45"/><text x="0" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#b8c8d0" opacity=".55">2</text><circle cx="90" cy="0" r="40" fill="#6ddbc4" stroke="#6ddbc4" stroke-width="3" /><text x="90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >3</text></g><path d="M625 362 H700" stroke="#6ddbc4" stroke-width="3"/><text x="180" y="522" text-anchor="end" font-size="32">{2, 3}</text><g transform="translate(470 512)"><circle cx="-90" cy="0" r="40" fill="#172933" stroke="#b8c8d0" stroke-width="3" stroke-dasharray="5 6" opacity=".45"/><text x="-90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#b8c8d0" opacity=".55">1</text><circle cx="0" cy="0" r="40" fill="#f3c779" stroke="#f3c779" stroke-width="3" /><text x="0" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >2</text><circle cx="90" cy="0" r="40" fill="#6ddbc4" stroke="#6ddbc4" stroke-width="3" /><text x="90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >3</text></g><path d="M625 512 H700" stroke="#6ddbc4" stroke-width="3"/><text x="180" y="672" text-anchor="end" font-size="32">{1, 2, 3}</text><g transform="translate(470 662)"><circle cx="-90" cy="0" r="40" fill="#f3c779" stroke="#f3c779" stroke-width="3" /><text x="-90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >1</text><circle cx="0" cy="0" r="40" fill="#f3c779" stroke="#f3c779" stroke-width="3" /><text x="0" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >2</text><circle cx="90" cy="0" r="40" fill="#6ddbc4" stroke="#6ddbc4" stroke-width="3" /><text x="90" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172933" >3</text></g><path d="M625 662 H700" stroke="#6ddbc4" stroke-width="3"/><path d="M700 212 V662" stroke="#6ddbc4" stroke-width="3"/><path d="M700 438 H758" stroke="#6ddbc4" stroke-width="3"/><text x="778" y="448" font-size="38" fill="#6ddbc4">3</text><path d="M70 757 H830" stroke="#b8c8d0" opacity=".4"/><text x="450" y="814" text-anchor="middle" font-size="32" fill="#6ddbc4">Orientation 3 is common to every set.</text><text x="450" y="869" text-anchor="middle" font-size="28">The complete answer is not locally constant.</text><text x="450" y="927" text-anchor="middle" font-size="23" fill="#b8c8d0">q = (2/5, 2/5, 3/10, 1/5) · h = (0, 0, 1/50)</text><text x="450" y="970" text-anchor="middle" font-size="22" fill="#b8c8d0">Model-conditional statement, not biological validation</text></g></svg>
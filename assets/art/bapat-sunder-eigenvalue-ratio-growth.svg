="og-hide" x="62" y="287.3333333333333" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">1</text><text class="og-hide" x="62" y="214" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">3</text><text class="og-hide" x="62" y="140.66666666666666" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">5</text><text class="og-hide" x="360" y="358" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle">matrix order n (log scale); dots are exactly certified examples</text><text class="og-hide" x="720" y="128" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">Worst ratio: ½ log n for real matrices,</text><text class="og-hide" x="720" y="150" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">log n for complex ones (error O(log log n)).</text><text class="og-hide" x="720" y="184" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Real rank three and complex rank two suffice, so</text><text class="og-hide" x="720" y="204" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">three is the smallest real rank (Corollary 1.2).</text><text class="og-hide" x="720" y="238" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Explicit upper bounds: ½ log n + 5/2 and log n + 5.</text><text class="og-hide" x="720" y="272" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Smallest known real example: order 27 with</text><text class="og-hide" x="720" y="292" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">integer vectors (previously 32), B &gt; 1.0036.</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Dots: certified lower bounds at orders 27, 378 and 10 710 (exact arithmetic). Dashed lines: leading growth (log n is cut off at the top). Unrefereed candidate.</text>

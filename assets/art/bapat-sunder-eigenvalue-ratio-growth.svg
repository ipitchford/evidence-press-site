<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the sharp logarithmic growth of the Bapat–Sunder eigenvalue ratio. Title: The permanent is not on top: by about one half log n, or log n. Subtitle: ratio B equals the largest eigenvalue of F_A divided by the permanent, worst case over n by n correlation matrices (Theorem 1.1). Left: a chart against the matrix order n on a log scale, with ticks at 27, 378 and 10 710. A dashed green line at B = 1 is labelled Bapat–Sunder conjecture: B = 1. Two dashed rising lines are labelled one half log n (real), in blue, and log n (complex), in pink. Dots mark exactly certified examples: an amber dot at order 27, labelled B greater than 1.0036; blue dots at 1.32 and 2.17 (real) and pink dots at 2.64 and 4.34 (complex) at orders 378 and 10 710. Right: worst ratio one half log n for real matrices, log n for complex ones, with error of order log log n. Real rank three and complex rank two suffice, so three is the smallest real rank (Corollary 1.2). Explicit upper bounds: one half log n plus 5/2 and log n plus 5. Smallest known real example: order 27 with integer vectors (previously 32), B greater than 1.0036. Footer: dots are certified lower bounds at orders 27, 378 and 10 710 in exact arithmetic; dashed lines show leading growth, with the log n line cut off at the top; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

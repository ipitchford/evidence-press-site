<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on entropy contraction. On the left, two prior distributions drawn as bars: (0.1, 0.2, 0.7) and (0.1, 0.9), with the rarest bar of height 0.1 highlighted in orange in both. Caption: same rarest probability q = 0.1, so at retention alpha = 1/2 both keep the same worst-case fraction of relative entropy, log 10 / log 20, about 0.769. In the middle, the formula eta = log(1/q) / log(1/(alpha q)), valid for alpha up to the sharp threshold q to the power q/(1-q); above it the worst inputs are tilts with no closed form; a half-lazy walk on two vertex sets is two reverse-erasure steps with alpha = 1/2 and a uniform prior on each side, q = 1/n. On the right, a chart of the worst-case entropy kept by one step of the half-lazy walk on the complete bipartite graph K_{n,n}, log n / (2 log 2n), for n = 2 to 10, rising from 1/4 towards 1/2; the point n = 3 is marked in yellow as checked by computer in 2025, and the curve is labelled proved for all n. A dotted line marks the local value 1/4 and a dashed line the limit 1/2.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.7" r="0.4">
<stop offset="0" stop-color="#ffb38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="56" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">How much relative entropy survives one step of a noisy reset?</text><text class="og-hide" x="40" y="84" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">The worst case depends on the prior only through its rarest symbol, which settles a complete-bipartite conjecture</text><text class="og-hide" x="40" y="128" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Reverse erasure: keep the symbol with probability α,</text><text class="og-hide" x="40" y="146" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">otherwise redraw it from the prior. Two different priors:</text><rect x="52" y="304.0" width="34" height="14.0" rx="3" fill="#ffb38a" fill-opacity="0.9" stroke="#ffb38a" stroke-width="1.4"/><text class="og-hide" x="69" y="297" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">0.1</text><rect x="96" y="290.0" width="34" height="28.0" rx="3" fill="#9fd2ff" fill-opacity="0.45" stroke="#9fd2ff" stroke-width="1.4"/><text class="og-hide" x="113" y="283" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">0.2</text><rect x="140" y="220.0" width="34" height="98.0" rx="3" fill="#9fd2ff" fill-opacity="0.45" stroke="#9fd2ff" stroke-width="1.4"/><text class="og-hide" x="157" y="213" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">0.7</text><path d="M46 318 H180" stroke="#c9bdb0" stroke-width="1.1"/><text class="og-hide" x="46" y="340" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">ρ = (0.1, 0.2, 0.7)</text><rect x="228" y="304.0" width="34" height="14.0" rx="3" fill="#ffb38a" fill-opacity="0.9" stroke="#ffb38a" stroke-width="1.4"/><text class="og-hide" x="245" y="297" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">0.1</text><rect x="272" y="192.0" width="34" height="126.0" rx="3" fill="#9fd2ff" fill-opacity="0.45" stroke="#9fd2ff" stroke-width="1.4"/><text class="og-hide" x="289" y="185" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">0.9</text><path d="M222 318 H312" stroke="#c9bdb0" stroke-width="1.1"/><text class="og-hide" x="222" y="340" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">ρ = (0.1, 0.9)</text><text class="og-hide" x="40" y="366" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Same rarest probability q = 0.1, so at α = 1/2 both keep</text><text class="og-hide" x="40" y="384" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">the same worst-case fraction: log 10 / log 20 ≈ 0.769</text><path d="M424 112 L 424 384" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="448" y="150" fill="#f4f1ea" font-family="Georgia,serif" font-size="19" font-weight="normal" text-anchor="start">Only the rarest symbol matters</text><text class="og-hide" x="448" y="196" fill="#ffb38a" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="start">η = log(1/q) / log(1/(αq))</text><text class="og-hide" x="448" y="224" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">for α ≤ q<tspan dy="-7" font-size="12">q/(1−q)</tspan><tspan dy="7">, the sharp threshold;</tspan></text><text class="og-hide" x="448" y="244" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">above it the worst inputs are tilts, with</text><text class="og-hide" x="448" y="262" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">no closed form.</text><text class="og-hide" x="448" y="304" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">A half-lazy walk on two vertex sets is two</text><text class="og-hide" x="448" y="322" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">reverse-erasure steps with α = 1/2 and</text><text class="og-hide" x="448" y="340" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">a uniform prior on each side, q = 1/n.</text><path d="M784 112 L 784 384" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="800" y="128" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">Half-lazy walk on K<tspan dy="4" font-size="12">n,n</tspan><tspan dy="-4">: worst-case entropy kept</tspan></text><path d="M818 150.0 H1168" stroke="#c9bdb0" stroke-width="1.1" stroke-dasharray="5 4"/><text class="og-hide" x="1168" y="144" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1/2</text><path d="M818 300.0 H1168" stroke="#d9c7ff" stroke-width="1.1" stroke-dasharray="2 4"/><text class="og-hide" x="1168" y="316" fill="#d9c7ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">local value 1/4</text><path d="M818 334 H1168" stroke="#c9bdb0" stroke-width="1.1"/><path d="M828.0 300.0 L838.4 288.3 L848.8 279.2 L859.1 272.0 L869.5 266.1 L879.9 261.1 L890.3 256.9 L900.6 253.2 L911.0 250.0 L921.4 247.2 L931.8 244.6 L942.1 242.4 L952.5 240.3 L962.9 238.4 L973.3 236.7 L983.6 235.1 L994.0 233.7 L1004.4 232.3 L1014.8 231.1 L1025.1 229.9 L1035.5 228.8 L1045.9 227.8 L1056.3 226.8 L1066.6 225.9 L1077.0 225.0 L1087.4 224.2 L1097.8 223.4 L1108.1 222.7 L1118.5 221.9 L1128.9 221.3 L1139.3 220.6 L1149.6 220.0 L1160.0 219.4" stroke="#9be3c0" stroke-width="2.4" fill="none"/><circle cx="828.0" cy="300.0" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="828" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><circle cx="869.5" cy="266.1" r="7" fill="#ffd56b" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="869.5" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">3</text><circle cx="911.0" cy="250.0" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="911" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><circle cx="952.5" cy="240.3" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="952.5" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><circle cx="994.0" cy="233.7" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="994" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><circle cx="1035.5" cy="228.8" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="1035.5" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">7</text><circle cx="1077.0" cy="225.0" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="1077" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><circle cx="1118.5" cy="221.9" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="1118.5" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">9</text><circle cx="1160.0" cy="219.4" r="5" fill="#9be3c0" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="1160" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text class="og-hide" x="814" y="352" fill="#c9bdb0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">n =</text><text class="og-hide" x="881.5" y="292.0558421703625" fill="#ffd56b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">n = 3: checked by computer (2025)</text><text class="og-hide" x="977.4" y="197.4134639479277" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">log n / (2 log 2n): proved for all n</text>
</svg>
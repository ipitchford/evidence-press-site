<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that each zero of a deformed monotone Hurwitz polynomial approaches its limit from a definite side as the genus grows: for the 4-cycle the smallest zero climbs towards −2 from below, and up to ten items only 8 of 132 cycle types ever move the wrong way.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">MATHEMATICS · ENUMERATIVE COMBINATORICS</text>
<text class="og-hide" x="56" y="148" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">Hurwitz zeros: which way</text>
<text class="og-hide" x="56" y="194" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">they move</text>
<text class="og-hide" x="56" y="236" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">For the 4-cycle the smallest zero goes −2.618,</text>
<text class="og-hide" x="56" y="264" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">−2.215, −2.086, −2.036 at genus 0 to 3, approaching</text>
<text class="og-hide" x="56" y="292" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">−2 from below.</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="101.19999999999999" fill="#ffc36b" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">132</text>
<text class="og-hide" x="948" y="124.19999999999999" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cycle types, 4 to 10 items, all real-rooted</text>
<rect x="752" y="158.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="201.7" fill="#9fd3ff" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">8</text>
<text class="og-hide" x="948" y="227.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">types with a zero ever moving away</text>
<rect x="752" y="260.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#a8e0b0" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="303.7" fill="#a8e0b0" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">genus 2</text>
<text class="og-hide" x="948" y="329.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">last genus with a wrong-way step</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on how the zeros of deformed monotone Hurwitz polynomials approach their limits. Each panel has one row per genus, 0 at the top to 6 at the bottom, with the real zeros plotted as dots joined into tracks and the limiting values as dashed vertical lines. Left: the 4-cycle; its smallest zero goes −2.618, −2.215, −2.086, −2.036 and onwards, climbing towards −2 from below, while the other zero rises towards −1/2 from above. Right: a zoom on the zero of the profile of three 2-cycles whose limit is −3/2; from genus 0 to genus 1 it first steps away from −3/2, then turns back and approaches it. A side note gives the census: all 132 cycle types with 4 to 10 items have only real zeros at every genus, and only 8, all made of even cycles, ever move the wrong way, never after genus 2. Zeros are computed from the exact cut-and-join polynomials.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Which way the zeros move as the genus grows</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">each row is one genus, 0 at the top to 6; dashed lines are the limits the zeros approach</text><path d="M215.4 114V320" stroke="#d9d2c4" stroke-dasharray="4 5" opacity=".7"/><path d="M484.2 114V320" stroke="#d9d2c4" stroke-dasharray="4 5" opacity=".7"/><path d="M90 128H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 158H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 188H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 218H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 248H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 278H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M90 308H520" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M104.7 128.0L176.9 158.0L200.0 188.0L208.9 218.0L212.6 248.0L214.2 278.0L214.9 308.0" stroke="#f6c177" stroke-width="2.6" fill="none" opacity=".9"/><circle cx="104.7" cy="128.0" r="5" fill="#f6c177"/><circle cx="176.9" cy="158.0" r="5" fill="#f6c177"/><circle cx="200.0" cy="188.0" r="5" fill="#f6c177"/><circle cx="208.9" cy="218.0" r="5" fill="#f6c177"/><circle cx="212.6" cy="248.0" r="5" fill="#f6c177"/><circle cx="214.2" cy="278.0" r="5" fill="#f6c177"/><circle cx="214.9" cy="308.0" r="5" fill="#f6c177"/><path d="M505.3 128.0L492.9 158.0L487.9 188.0L485.8 218.0L484.9 248.0L484.5 278.0L484.3 308.0" stroke="#8fd3c8" stroke-width="1.6" fill="none" opacity=".9"/><circle cx="505.3" cy="128.0" r="3.8" fill="#8fd3c8"/><circle cx="492.9" cy="158.0" r="3.8" fill="#8fd3c8"/><circle cx="487.9" cy="188.0" r="3.8" fill="#8fd3c8"/><circle cx="485.8" cy="218.0" r="3.8" fill="#8fd3c8"/><circle cx="484.9" cy="248.0" r="3.8" fill="#8fd3c8"/><circle cx="484.5" cy="278.0" r="3.8" fill="#8fd3c8"/><circle cx="484.3" cy="308.0" r="3.8" fill="#8fd3c8"/><text class="og-hide" x="215.41666666666669" y="112" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">−2</text><text class="og-hide" x="484.16666666666663" y="112" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">−1/2</text><text class="og-hide" x="114.69166666666672" y="120" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">−2.618</text><text class="og-hide" x="198.96666666666667" y="223" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">−2.036</text><text class="og-hide" x="305" y="344" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">the 4-cycle: from below to −2, from above to −1/2</text><text class="og-hide" x="70" y="133" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">g 0</text><text class="og-hide" x="70" y="313" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">g 6</text><path d="M882.7 114V320" stroke="#d9d2c4" stroke-dasharray="4 5" opacity=".7"/><path d="M640 128H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 158H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 188H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 218H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 248H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 278H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M640 308H920" stroke="#d9d2c4" stroke-width=".6" opacity=".22"/><path d="M874.4 128.0L692.8 158.0L711.5 188.0L758.5 218.0L798.6 248.0L827.4 278.0L846.9 308.0" stroke="#f6c177" stroke-width="2.6" fill="none" opacity=".9"/><circle cx="874.4" cy="128.0" r="5" fill="#f6c177"/><circle cx="692.8" cy="158.0" r="5" fill="#f6c177"/><circle cx="711.5" cy="188.0" r="5" fill="#f6c177"/><circle cx="758.5" cy="218.0" r="5" fill="#f6c177"/><circle cx="798.6" cy="248.0" r="5" fill="#f6c177"/><circle cx="827.4" cy="278.0" r="5" fill="#f6c177"/><circle cx="846.9" cy="308.0" r="5" fill="#f6c177"/><text class="og-hide" x="882.6666666666666" y="112" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">−3/2</text><text class="og-hide" x="700" y="122" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">first steps away from −3/2</text><text class="og-hide" x="695.9999999999997" y="332" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">−1.55</text><path d="M696.0 314v6" stroke="#d9d2c4"/><text class="og-hide" x="780" y="344" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">three 2-cycles, zoomed: the wrong way first</text><text class="og-hide" x="966" y="150" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="start">132</text><text class="og-hide" x="966" y="172" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">cycle types, 4 to 10 items:</text><text class="og-hide" x="966" y="190" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">all zeros real, every genus</text><text class="og-hide" x="966" y="236" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="start">8</text><text class="og-hide" x="966" y="258" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">ever move the wrong way,</text><text class="og-hide" x="966" y="276" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">all made of even cycles,</text><text class="og-hide" x="966" y="294" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">never after genus 2</text><text class="og-hide" x="1160" y="388" fill="#d9d2c4" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">Zeros computed from the exact cut-and-join polynomials · eventual direction proved for every cycle type</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on noise in gene expression with bursty production. Left: the two-species loop used in the paper; species Y activates the production of species X, and X represses the production of Y; each production event releases a random burst of K molecules. Noise is the Fano factor, variance divided by mean, compared with a baseline B for constant-rate production at the same mean. Right: for the same weak feedback and two burst-size laws with the same mean 2 and variance 2, bars show the second-order coefficient Q in F minus B approximately equal to epsilon squared times Q, for species X and Y. With geometric bursts, P(K = k) = 2 to the minus k, both bars point up (Q about +7.5 times 10 to the minus 4): both species are noisier than baseline, so the trade-off holds. With bursts of 1 or 4 molecules with probabilities 2/3 and 1/3, both bars point down (Q = −19/11520 exactly): both species are quieter than baseline. The paper proves that every non-geometric burst law with finite variance allows this, and that only geometric laws force the trade-off; the effects are of order one part in a million and occur below 0.1 molecules on average. Bar heights are computed from the paper's exact formula.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.7" cy="0.6" r="0.5">
<stop offset="0" stop-color="#9fe8b8" stop-opacity="0.05"/><stop offset="1" stop-color="#9fe8b8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text x="40" y="52" fill="#f3eef6" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Only geometric burst sizes force a noise trade-off</text><text x="40" y="80" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">With any other burst-size law, one activation and one repression can make both species quieter than baseline</text><defs><marker id="gbc-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fe8b8"/></marker></defs><text x="40" y="116" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">The loop</text><text x="40" y="136" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">two species made in random bursts</text><path d="M308 202 C 290 160, 166 160, 152 198" fill="none" stroke="#9fe8b8" stroke-width="3" marker-end="url(#gbc-act)"/><text x="228" y="154" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Y activates X</text><path d="M150 274 C 166 316, 290 316, 304 278" fill="none" stroke="#ffb3a1" stroke-width="3"/><path d="M295 268 L311 288" stroke="#ffb3a1" stroke-width="4" stroke-linecap="round"/><text x="228" y="316" fill="#ffb3a1" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">X represses Y</text><circle cx="118" cy="238" r="46" fill="#1b1224" fill-opacity=".55" stroke="#ffd27a" stroke-width="2.6"/><text x="118" y="236" fill="#ffd27a" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle">X</text><text x="118" y="258" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">bursts K</text><circle cx="338" cy="238" r="46" fill="#1b1224" fill-opacity=".55" stroke="#9fd8ff" stroke-width="2.6"/><text x="338" y="236" fill="#9fd8ff" font-family="Georgia,serif" font-size="26" font-weight="bold" text-anchor="middle">Y</text><text x="338" y="258" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">bursts K</text><text x="40" y="362" fill="#b6a9c2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">noise = Fano factor (variance ÷ mean)</text><text x="40" y="380" fill="#b6a9c2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">baseline B = constant-rate production</text><path d="M450 112 V372" stroke="#d9cfe0" stroke-opacity=".18"/><text x="470" y="116" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Feedback’s effect on each species’ noise, F − B ≈ ε²·Q</text><text x="470" y="136" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">same weak feedback, same burst mean (2) and variance (2), two burst-size laws</text><path d="M470 240 H1160" stroke="#d9cfe0" stroke-opacity=".8" stroke-width="1.6"/><text x="1160" y="234" fill="#d9cfe0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="bold" text-anchor="end">baseline B</text><rect x="574.0" y="209.0" width="52" height="31.0" rx="3" fill="#ffd27a" fill-opacity=".85"/><text x="600.0" y="201.0" fill="#ffd27a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">X</text><rect x="654.0" y="209.0" width="52" height="31.0" rx="3" fill="#9fd8ff" fill-opacity=".85"/><text x="680.0" y="201.0" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Y</text><text x="640" y="266" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Q = +7.5 × 10⁻⁴</text><text x="640" y="312" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Geometric bursts</text><text x="640" y="330" fill="#b6a9c2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">P(K = k) = 2⁻ᵏ</text><text x="640" y="352" fill="#ffb3a1" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">both noisier: trade-off holds</text><rect x="894.0" y="240.0" width="52" height="67.9" rx="3" fill="#ffd27a" fill-opacity=".85"/><text x="920.0" y="325.9" fill="#ffd27a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">X</text><rect x="974.0" y="240.0" width="52" height="67.9" rx="3" fill="#9fd8ff" fill-opacity=".85"/><text x="1000.0" y="325.9" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Y</text><text x="960" y="226" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Q = −19/11520</text><text x="960" y="168" fill="#f3eef6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Bursts of 1 or 4</text><text x="960" y="186" fill="#b6a9c2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">probabilities 2/3 and 1/3</text><text x="960" y="204" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">both quieter than baseline</text><text x="1160" y="384" fill="#b6a9c2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">Theorem: every non-geometric law with finite variance can do this; effects ~10⁻⁶, below 0.1 molecules</text>
</svg>
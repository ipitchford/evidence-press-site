<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic full community-resolved SIS trajectory is tightly sampled on an observed interval up to T0, then branches into two admissible continuations. Labels state the proved split: a finite linear continuation factor at fixed network size, no dimension-free linear factor as size grows, and an explicit dimension-free Holder replacement. Sample points identify the deterministic fill-distance and bounded-error corollary. The curves illustrate the relationships and are not empirical epidemic data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#76dec7" stop-opacity="0.06"/><stop offset="1" stop-color="#76dec7" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><filter id="soft"><feGaussianBlur stdDeviation="9"/></filter></defs><text class="og-hide" x="58" y="47" fill="#fff8ee" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">The same observed history can be increasingly hard to continue linearly</text><text class="og-hide" x="58" y="76" fill="#ead9c8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">full community-resolved SIS trajectories · schematic curves · theorem-backed relationships</text><path d="M70 305 H1130" stroke="#ead9c8" stroke-opacity=".35" stroke-width="2"/><path d="M620 96 V330" stroke="#ead9c8" stroke-opacity=".45" stroke-width="2" stroke-dasharray="7 8"/><text class="og-hide" x="345" y="116" fill="#76dec7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">observed interval</text><text class="og-hide" x="875" y="116" fill="#ffbf69" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">continuation interval</text><path d="M78 268 C175 250 248 190 340 213 S510 172 620 205" fill="none" stroke="#76dec7" stroke-width="7" stroke-linecap="round"/><circle cx="115" cy="260" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><circle cx="205" cy="228" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><circle cx="295" cy="204" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><circle cx="390" cy="207" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><circle cx="480" cy="188" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><circle cx="570" cy="194" r="7" fill="#fff8ee" stroke="#76dec7" stroke-width="3"/><text class="og-hide" x="94" y="340" fill="#ead9c8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" text-anchor="start">samples + fill distance η + error σ</text><path d="M620 205 C715 190 790 139 885 153 S1030 222 1132 140" fill="none" stroke="#ffbf69" stroke-width="7" stroke-linecap="round"/><path d="M620 205 C715 221 790 280 885 267 S1030 196 1132 278" fill="none" stroke="#d6a7ef" stroke-width="7" stroke-linecap="round"/><circle cx="620" cy="205" r="10" fill="#fff8ee" stroke="#4b2c22" stroke-width="3"/><text class="og-hide" x="620" y="365" fill="#fff8ee" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">T₀</text>
</svg>
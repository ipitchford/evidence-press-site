<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Two horizontal proof lanes converge on primitivity of the even-rank SU(N) at level N series. The first lane shows the resolved N equals 4 sector ranks R_0 through R_3 as 8, 4, 6 and 4, illustrating the uniform strict inequality R_q less than R_0 for nonzero charge; that inequality crosses out a two-object invertible-vortex factor, which would require equal rank. The second lane shows two distinct objects X and fX exchanged by electron fusion in every nonzero sector for every even N at least 4; this crosses out a one-object fixed factor, which would require fX equals X. A boundary caption says that at N equals 2, ranks 2 and 1 alone are insufficient, emphasizing that rank is only one obstruction. The image is a mathematical sector-resolution diagram, not a claim about a material or experiment.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a8ddf0" stop-opacity="0.06"/><stop offset="1" stop-color="#a8ddf0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Georgia,serif"><text class="og-hide" x="56" y="40" fill="#faf7f2" font-family="ui-monospace,monospace" font-size="15" letter-spacing="1.6">TWO INDEPENDENT OBSTRUCTIONS · EVEN N ≥ 4</text><path d="M48 205 H804" stroke="#cbd4df" stroke-width="1.2" opacity=".24"/><circle cx="69" cy="105" r="18" fill="#14191f" stroke="#a8ddf0" stroke-width="2.4"/><text class="og-hide" x="69" y="111" text-anchor="middle" fill="#a8ddf0" font-family="ui-monospace,monospace" font-size="17">1</text><text class="og-hide" x="101" y="91" fill="#faf7f2" font-family="ui-monospace,monospace" font-size="14" letter-spacing="1.2">RANK OBSTRUCTION</text><rect x="115" y="120" width="34" height="56" rx="7" fill="#a8ddf0" fill-opacity=".92"/><text class="og-hide" x="132" y="112" text-anchor="middle" fill="#a8ddf0" font-size="17">8</text><text class="og-hide" x="132" y="197" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="12">q=0</text><rect x="171" y="148" width="34" height="28" rx="7" fill="#f2c36f" fill-opacity=".72"/><text class="og-hide" x="188" y="140" text-anchor="middle" fill="#f2c36f" font-size="17">4</text><text class="og-hide" x="188" y="197" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="12">q=1</text><rect x="227" y="134" width="34" height="42" rx="7" fill="#f2c36f" fill-opacity=".72"/><text class="og-hide" x="244" y="126" text-anchor="middle" fill="#f2c36f" font-size="17">6</text><text class="og-hide" x="244" y="197" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="12">q=2</text><rect x="283" y="148" width="34" height="28" rx="7" fill="#f2c36f" fill-opacity=".72"/><text class="og-hide" x="300" y="140" text-anchor="middle" fill="#f2c36f" font-size="17">4</text><text class="og-hide" x="300" y="197" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="12">q=3</text><path d="M104 177 H329" stroke="#cbd4df" stroke-width="1.4" opacity=".55"/><text class="og-hide" x="217" y="66" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="12">N=4 RESOLVED SECTORS</text>
  <path d="M352 132 H421" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/>
  <path d="M411 125 L421 132 L411 139" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/><text class="og-hide" x="482" y="121" text-anchor="middle" fill="#a8ddf0" font-size="25">R<tspan baseline-shift="sub" font-size="15">q</tspan> &lt; R<tspan baseline-shift="sub" font-size="15">0</tspan></text><text class="og-hide" x="482" y="151" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="11">EVERY q ≠ 0</text>
  <path d="M542 132 H598" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/>
  <path d="M588 125 L598 132 L588 139" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/><rect x="603" y="78" width="176" height="109" rx="20" fill="#14191f" fill-opacity=".38" stroke="#cbd4df" stroke-width="1.2" opacity=".9"/><circle cx="650" cy="126" r="15" fill="#f2c36f"/><circle cx="714" cy="126" r="15" fill="#f2c36f"/><path d="M669 126 H694 M688 120 l7 6 l-7 6" fill="none" stroke="#faf7f2" stroke-width="1.8"/>
  <circle cx="748" cy="95" r="16" fill="none" stroke="#f2c36f" stroke-width="1.4" opacity=".45"/>
  <path d="M737.12 84.12 L758.88 105.88 M758.88 84.12 L737.12 105.88" stroke="#f2c36f" stroke-width="3" stroke-linecap="round"/><text class="og-hide" x="691" y="160" text-anchor="middle" fill="#faf7f2" font-family="ui-monospace,monospace" font-size="12">2-OBJECT FACTOR</text><text class="og-hide" x="691" y="178" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="10">would require Rq = R0</text><circle cx="69" cy="269" r="18" fill="#14191f" stroke="#f2c36f" stroke-width="2.4"/><text class="og-hide" x="69" y="275" text-anchor="middle" fill="#f2c36f" font-family="ui-monospace,monospace" font-size="17">2</text><text class="og-hide" x="101" y="225" fill="#faf7f2" font-family="ui-monospace,monospace" font-size="14" letter-spacing="1.2">ELECTRON PAIR</text><circle cx="164" cy="292" r="30" fill="#14191f" stroke="#a8ddf0" stroke-width="2.7"/><text class="og-hide" x="164" y="300" text-anchor="middle" fill="#faf7f2" font-size="24">X</text><circle cx="301" cy="292" r="30" fill="#14191f" stroke="#f2c36f" stroke-width="2.7"/><text class="og-hide" x="301" y="300" text-anchor="middle" fill="#faf7f2" font-size="23">fX</text><path d="M199 284 H266 M258 277 l9 7 l-9 7 M266 301 H199 M207 294 l-9 7 l9 7" fill="none" stroke="#cbd4df" stroke-width="2"/><text class="og-hide" x="232" y="250" text-anchor="middle" fill="#f2c36f" font-size="20">X ≠ fX</text><text class="og-hide" x="232" y="338" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="11">EVERY NONZERO SECTOR</text>
  <path d="M345 292 H421" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/>
  <path d="M411 285 L421 292 L411 299" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/><text class="og-hide" x="484" y="281" text-anchor="middle" fill="#f2c36f" font-size="21">f exchanges them</text><text class="og-hide" x="484" y="310" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="11">FULL-PERIOD LABEL</text>
  <path d="M546 292 H600" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/>
  <path d="M590 285 L600 292 L590 299" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity="0.75"/><rect x="605" y="238" width="174" height="108" rx="20" fill="#14191f" fill-opacity=".38" stroke="#cbd4df" stroke-width="1.2" opacity=".9"/><circle cx="690" cy="282" r="22" fill="#f2c36f" fill-opacity=".8" stroke="#faf7f2" stroke-width="1.5"/><path d="M713 283 C741 258 739 315 708 303" fill="none" stroke="#a8ddf0" stroke-width="2"/><path d="M713 303 l-6 1 l3 -7" fill="none" stroke="#a8ddf0" stroke-width="2"/><text class="og-hide" x="690" y="289" text-anchor="middle" fill="#14191f" font-size="18">X</text>
  <circle cx="748" cy="251" r="16" fill="none" stroke="#f2c36f" stroke-width="1.4" opacity=".45"/>
  <path d="M737.12 240.12 L758.88 261.88 M758.88 240.12 L737.12 261.88" stroke="#f2c36f" stroke-width="3" stroke-linecap="round"/><text class="og-hide" x="692" y="326" text-anchor="middle" fill="#faf7f2" font-family="ui-monospace,monospace" font-size="12">1 FIXED OBJECT</text><text class="og-hide" x="692" y="343" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="10">would require fX = X</text><path d="M795 132 C855 132 835 192 891 200 M795 292 C855 292 835 208 891 200" fill="none" stroke="#cbd4df" stroke-width="2.2" opacity=".62"/><circle cx="1010" cy="200" r="112" fill="#14191f" fill-opacity=".32" stroke="#a8ddf0" stroke-width="2.4"/><circle cx="1010" cy="200" r="95" fill="none" stroke="#f2c36f" stroke-width="1.5" stroke-dasharray="7 7" opacity=".72"/><text class="og-hide" x="1010" y="142" text-anchor="middle" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1">BOTH FACTORS EXCLUDED</text><text class="og-hide" x="1010" y="202" text-anchor="middle" fill="#faf7f2" font-size="31">primitive</text><text class="og-hide" x="1010" y="235" text-anchor="middle" fill="#a8ddf0" font-size="20">SU(N)<tspan baseline-shift="sub" font-size="13">N</tspan></text><text class="og-hide" x="1010" y="263" text-anchor="middle" fill="#f2c36f" font-family="ui-monospace,monospace" font-size="12">EVEN N ≥ 4</text><text class="og-hide" x="56" y="379" fill="#cbd4df" font-family="ui-monospace,monospace" font-size="11">BOUNDARY: N=2 HAS RANKS 2,1 — RANK ALONE IS INSUFFICIENT</text></g>
</svg>
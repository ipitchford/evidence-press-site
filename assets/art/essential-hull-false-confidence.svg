<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on false confidence in location models. Left: on logarithmic axes, the largest computed collision probability over all observations, 1 minus exp of minus R squared over 2 sigma squared, falls as uncertainty sigma over R grows from 0.5 to 20, although a collision is certain. A dashed line marks 1 percent, and a red marker at sigma over R equal to 10 shows at most 0.5 percent. Right: a certain collision has a computed probability under 1 percent; hypotheses mislead in this all-threshold sense when the truth lies strictly inside their essential convex hull; only halfspaces are calibrated both ways; the model assumes known shape, an exact model and light tails.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

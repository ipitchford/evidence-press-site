<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Three schematic lens planes, each containing two point masses, are joined only to their neighbors. Retaining this nearest-neighbor structure lowers the regular-image upper bound from Perry’s 365 to the candidate sparse bound 213. Prior constructions attain 125 images; the sharp maximum remains open. The diagram is a coupling schematic, not a ray simulation.</desc><defs>

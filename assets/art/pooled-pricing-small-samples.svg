<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that no window of small sample sizes guarantees that a single pooled empirical price beats separate prices per market. Left: exact revenue curves, scaled to equal height, for the paper’s low-valuation buyers (a truncated Lomax law with a = 0.05, best price about 0.18) and rare high-valuation buyers (best price about 0.55). Centre: the low market’s exact revenue curve; segmentation prices near its peak, while a pooled price pulled to one high observation V = 0.7 earns the low market less than half as much. Right: simulated relative revenue gain of two-market over pooled empirical pricing for sample sizes 3 to 40, for a = 0.01 and a = 0.05 with high-segment probability q = 0.02, from the release’s exploratory Monte Carlo record (unsmoothed model; simulation, not proof). The provable constructions in the paper use far more extreme parameters.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

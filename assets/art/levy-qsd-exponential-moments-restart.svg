<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for exact exponential moments of interval quasi-stationary laws and idealised restart. Centre: the Esscher-tilted quasi-stationary distribution of the source model of Garcia, Bermolen, Jonckheere and Shneer on the interval from the floor 0 to the target L, computed exactly for L = 48. Its bulk is the sine law (π/2) sin(πy/L). Two side panels zoom into the edges, plotting L² times the density against distance from each end: near 0 the curve follows the renewal function of the ascending ladder height, near L that of the descending ladder height, and both bend away from the straight line that Brownian motion would give. The constant in the conjectured moment growth is the ratio of a right-layer quantity to a left-layer quantity, C* = 0.8501…, not 1 as the ratio-one reading of the conjecture suggests; Brownian motion has no layers and gives exactly 1. Right: for idealised restart from the quasi-stationary law, the chance of reaching L within a simulated-time budget B, 1 − exp(−R* B e^(−ηL)) with R* = 0.906…, plotted for L = 10 on a logarithmic budget axis. The chance rises linearly and then saturates near B ~ e^(ηL); the corrected linear regime is B = O(e^(ηL)), while the source restart theorem stated a range up to o(e^(λ*L)), far beyond saturation.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#9fd0ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

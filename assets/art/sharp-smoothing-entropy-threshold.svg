<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the exact threshold for local entropy concavity. A horizontal axis shows the signal fraction q, the share of the output variance that comes from the signal rather than the noise, from 0 to 1, stretched between one half and 0.6 so that the interval from one half to four sevenths is visible; a second row of labels gives the total signal-to-noise ratio, 1 at one half, 4/3 at four sevenths. The upper row is for two copies mixed with weights root t and root of 1 minus t: it is green (entropy concave near the Gaussian) from 0 up to and including 4/7, credited to Schubr 2026 below one half and to the earlier Evidence Press release from one half to just below 4/7, with a yellow filled dot at 4/7 labelled as new in this paper; above 4/7 it is orange (not concave, Luo 2026, written out as Theorem D). The lower row is for three or more copies with concavity required over all weightings: it is not concave at every q, new in Theorem E up to 4/7 where the failures sit near the faces of the weight simplex, and by Luo's theorem on an edge above 4/7. A footnote says the inputs are symmetric and within a factor 1 plus or minus 10 to the minus 8 of the Gaussian density; the bands show proved regimes, not data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.42" cy="0.45" r="0.45">
<stop offset="0" stop-color="#c6f28a" stop-opacity="0.06"/><stop offset="1" stop-color="#c6f28a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="25" font-weight="normal" text-anchor="start">Is entropy concave in the mixing weights? Two copies: up to and including q = 4/7</text><text class="og-hide" x="40" y="78" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Symmetric near-Gaussian inputs, weights √t and √(1−t) (or a weight simplex), plus Gaussian noise. Three or more copies: not at any q.</text><text class="og-hide" x="214" y="142" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="end">two copies</text><text class="og-hide" x="214" y="161" fill="#cbbfd6" font-family="Georgia,serif" font-size="12.5" font-weight="normal" text-anchor="end">mixed by weight t</text><rect x="230.0" y="122" width="240.0" height="44" fill="#8fd3b0" fill-opacity="0.62"/><rect x="470.0" y="122" width="307.1" height="44" fill="#8fd3b0" fill-opacity="0.86"/><rect x="777.1" y="122" width="372.9" height="44" fill="#ffab7a" fill-opacity="0.9"/><text class="og-hide" x="963.5714285714286" y="149.76" fill="#141414" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">not concave</text><text class="og-hide" x="503.57142857142856" y="149.76" fill="#141414" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">concave</text><path d="M777.1 114 V294" stroke="#ffd76a" stroke-width="3"/><circle cx="777.1" cy="144" r="10" fill="#ffd76a" stroke="#141414" stroke-width="2"/><text class="og-hide" x="765.1428571428571" y="108" fill="#ffd76a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="end">4/7 itself: concave (new)</text><text class="og-hide" x="350" y="185" fill="#8fd3b0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Schubr 2026</text><text class="og-hide" x="623.5714285714286" y="185" fill="#8fd3b0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">earlier release</text><text class="og-hide" x="1025" y="185" fill="#ffab7a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Luo 2026 (Theorem D)</text><text class="og-hide" x="214" y="242" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="end">three or more</text><text class="og-hide" x="214" y="261" fill="#cbbfd6" font-family="Georgia,serif" font-size="12.5" font-weight="normal" text-anchor="end">over all weightings</text><rect x="230.0" y="222" width="547.1" height="44" fill="#ff9a8a" fill-opacity="0.92"/><text class="og-hide" x="503.57142857142856" y="249.4" fill="#141414" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">not concave: failures near the faces (Theorem E, new)</text><rect x="777.1" y="222" width="372.9" height="44" fill="#ffab7a" fill-opacity="0.9"/><text class="og-hide" x="963.5714285714286" y="249.4" fill="#141414" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">not concave (Luo on an edge)</text><path d="M230 286 H1150" stroke="#e3d9c9" stroke-width="1.6"/><path d="M466.0 292 l8 -12 M472.0 292 l8 -12" stroke="#cbbfd6" stroke-width="1.4"/><path d="M896.0 292 l8 -12 M902.0 292 l8 -12" stroke="#cbbfd6" stroke-width="1.4"/><path d="M230.0 286 v7" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="230" y="312" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">0</text><text class="og-hide" x="230" y="337" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">0</text><path d="M470.0 286 v7" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="470" y="312" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">1/2</text><text class="og-hide" x="470" y="337" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">1</text><path d="M777.1 286 v7" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="777.1428571428571" y="312" fill="#ffd76a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">4/7</text><text class="og-hide" x="777.1428571428571" y="337" fill="#ffd76a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">4/3</text><path d="M1150.0 286 v7" stroke="#e3d9c9" stroke-width="1.4"/><text class="og-hide" x="1150" y="312" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">1</text><text class="og-hide" x="1150" y="337" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">∞</text><text class="og-hide" x="214" y="312" fill="#cbbfd6" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="end">signal fraction q</text><text class="og-hide" x="214" y="337" fill="#cbbfd6" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="end">signal-to-noise ratio</text><text class="og-hide" x="230" y="362" fill="#cbbfd6" font-family="Georgia,serif" font-size="11.5" font-weight="italic" text-anchor="start">scale stretched between ½ and 0.6</text><text class="og-hide" x="1150" y="362" fill="#cbbfd6" font-family="Georgia,serif" font-size="12" font-weight="italic" text-anchor="end">inputs symmetric and within a factor 1 ± 10⁻⁸ of the Gaussian density</text>
</svg>
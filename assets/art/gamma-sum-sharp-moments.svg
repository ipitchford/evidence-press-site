<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on sharp moments of weighted sums of independent exponential (more generally gamma) random variables when the sum of squared weights is fixed at one. Left: a staircase chart of the best number of equal weights, the support size that minimises the q-th moment, against the moment order q from 0 to 30. It stays at one weight up to q = 5.32, then steps up by one at q = 7.88, 10.41, 12.93 and so on, reaching 11 near q = 28; a dashed line of slope about 0.40 shows its long-run growth. Right: the same result as a table: for q up to 5.32 one weight is best, between 5.32 and 7.88 two equal weights, between 7.88 and 10.41 three, one more at each step. A note says this is now proved for every real q and every gamma shape, and the sharp maximum is found too. Values are from the paper’s Section 6 and its table of support transitions for exponentials.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.42">
<stop offset="0" stop-color="#ffd27f" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd27f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="32" y="52" fill="#eef6f6" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Spread or concentrate? The answer is a staircase</text><text class="og-hide" x="32" y="80" fill="#d6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Minimum of E(a₁X₁ + … + aₙXₙ)^q over nonnegative weights with a₁² + … + aₙ² = 1</text><text class="og-hide" x="32" y="104" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">best number of equal weights</text><path d="M92 310.7 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="314.72727272727275" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M92 291.5 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="295.45454545454544" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><path d="M92 272.2 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="276.1818181818182" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">3</text><path d="M92 233.6 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="237.63636363636363" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">5</text><path d="M92 195.1 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="199.0909090909091" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">7</text><path d="M92 156.5 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="160.54545454545453" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">9</text><path d="M92 118.0 H640" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="82" y="122" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">11</text><path d="M92 330 H640 M92 330 V112" stroke="#a9c4c6" stroke-opacity=".5" stroke-width="1"/><path d="M92.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="92" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><path d="M183.3 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="183.33333333333331" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><path d="M274.7 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="274.66666666666663" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><path d="M366.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="366" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">15</text><path d="M457.3 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="457.3333333333333" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">20</text><path d="M548.7 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="548.6666666666667" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">25</text><path d="M640.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="640" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">30</text><text class="og-hide" x="640" y="370" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">moment order q</text><path d="M92.0 330.0 L640.0 99.9" stroke="#9fd8ff" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/><text class="og-hide" x="539.5333333333333" y="130.09404266184845" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="end">slope ≈ 0.40 q</text><path d="M92.0 310.7 H189.2 V291.5 H235.9 V272.2 H282.2 V252.9 H328.2 V233.6 H374.3 V214.4 H420.3 V195.1 H466.2 V175.8 H512.2 V156.5 H558.1 V137.3 H604.0 V118.0 H640.0" stroke="#ffd27f" stroke-width="3.4" fill="none" stroke-linejoin="round"/><circle cx="189.2" cy="310.7" r="5" fill="#ffb38a"/><text class="og-hide" x="199.17359503261332" y="330.72727272727275" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">q = 5.32</text><text class="og-hide" x="97.48" y="301.72727272727275" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="start">one weight</text><path d="M672 104 L 672 384" stroke="#d6e6e6" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="700" y="120" fill="#d6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Exponential waiting times, variance fixed</text><text class="og-hide" x="700" y="150" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Weights giving the smallest q-th moment:</text><text class="og-hide" x="700" y="186" fill="#ffd27f" font-family="Georgia,serif" font-size="22" font-weight="bold" text-anchor="start">q ≤ 5.32</text><text class="og-hide" x="860" y="186" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">1 weight</text><text class="og-hide" x="700" y="216" fill="#ffd27f" font-family="Georgia,serif" font-size="22" font-weight="bold" text-anchor="start">5.32 – 7.88</text><text class="og-hide" x="860" y="216" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">2 equal weights</text><text class="og-hide" x="700" y="246" fill="#ffd27f" font-family="Georgia,serif" font-size="22" font-weight="bold" text-anchor="start">7.88 – 10.41</text><text class="og-hide" x="860" y="246" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">3 equal weights</text><text class="og-hide" x="700" y="276" fill="#ffd27f" font-family="Georgia,serif" font-size="22" font-weight="bold" text-anchor="start">…</text><text class="og-hide" x="860" y="276" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">one more at each step</text><text class="og-hide" x="700" y="330" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Now proved for every real q and every gamma shape;</text><text class="og-hide" x="700" y="348" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">the sharp maximum is found too.</text><text class="og-hide" x="700" y="378" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Exponentials (α = 1); n large enough not to cap the support.</text>
</svg>
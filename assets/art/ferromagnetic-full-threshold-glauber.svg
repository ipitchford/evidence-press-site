<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic graph before and after analytical pinning. Gold vertices form a deterministic set T selected for large degree or bias. After burn-in, each has zero-spin probability at most delta. In the auxiliary comparison they are pinned to one; retained vertices have controlled conditional marginals. The original-chain error is bounded by residual mixing, trajectory exit probability and stationary conditioning cost. The actual sampler is unchanged, with uniformly chosen single-site updates. The candidate near-linear bound holds strictly below the stated field threshold, not at its endpoint.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2c579" stop-opacity="0.06"/><stop offset="1" stop-color="#f2c579" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

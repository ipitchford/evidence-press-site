<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on when Mpemba-type crossings in Markovian relaxation can be ruled out at all times. Left: three bath emission weights J as functions of the energy gap d: a sub-Ohmic square-root law (dashed green) and an Ohmic weight d times e to the minus d over omega, on a range up to twice the cutoff (solid green), both bend downwards (concave), which by the paper's Theorem 4 and Proposition 6 keeps two cooling copies in order at every time; a super-Ohmic cube law (orange) bends upwards (convex), and the guarantee fails. Right: for the cube-law bath on four equally spaced levels, the exact relative entropy to equilibrium of a hotter (solid orange) and a cooler (dashed blue) preparation at six certified times on a logarithmic scale. The hotter one starts about three times farther away, the curves cross in the shaded interval between t = 1/5 and t = 3/10, and afterwards the hotter preparation is closer to equilibrium. Values are from the paper's Table 3; lines merely join the certified points.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ff9d6c" stop-opacity="0.06"/><stop offset="1" stop-color="#ff9d6c" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

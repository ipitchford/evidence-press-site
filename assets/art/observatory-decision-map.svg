<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Robust-decision map across the admissible model set</title>
<desc id="d">A grid of four policy options scored against six models the evidence still admits. Option A fails under every model and is dominated. Option B passes under every model and is robust. Option C passes under five of six models and fails under one. Option D passes under three and fails under three, so its ranking turns on a single visible assumption. A note records that objectives, distributional weights, rights constraints and acceptable risk remain with the people and institutions authorised to set them.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.28" r="0.9">
<stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
</radialGradient>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#8a938f"/>
</marker>
<marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
</marker>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<rect width="1200" height="560" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on group homophily with three or more categories. Left: in the same 4,600 distinct three-person proximity groups from a primary school, the affinity ratio of groups in which exactly two of three members share a category, against the chance baseline (dashed line at 1). Labelled by the 10 pupil classrooms (blue bars, 1.015 to 2.145) every classroom is above chance, so 10 of 10 pass the strict-majority homophily test; labelled by the 5 school years formed by merging classrooms (red bars, 0.512 to 0.808) every year is below chance, so 0 of 5 pass, although the years are not less segregated: merging roughly doubles the chance rate of two-of-three groups. Right: the paper’s exact ceiling on how far all categories could exceed chance at once: 0.64 with two categories (pupils versus teachers, below 1 as the two-category impossibility requires), 2.07 with six categories (school years) and 3.92 with eleven (classrooms). Exploratory and descriptive; one school over two days. Data: SocioPatterns primary-school contacts (Stehlé et al. 2011), CC BY-NC-SA 3.0, aggregated.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.42">
<stop offset="0" stop-color="#9fd2ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Same 4,600 school groups, two labellings, opposite verdicts</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">With three or more categories every category can look homophilous at once; an exact ceiling says how far, and what blocks it</text><path d="M70 318.0 H630" stroke="#e3d9c9" stroke-opacity="0.4" stroke-width="1"/><text class="og-hide" x="62" y="322" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><path d="M70 238.8 H630" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="62" y="242.83333333333331" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M70 159.7 H630" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="62" y="163.66666666666666" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><rect x="80" y="237.6" width="26" height="80.4" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="93" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">1A</text><rect x="115" y="217.7" width="26" height="100.3" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="128" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">1B</text><rect x="150" y="212.5" width="26" height="105.5" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="163" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">2A</text><rect x="185" y="204.5" width="26" height="113.5" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="198" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">2B</text><rect x="220" y="148.2" width="26" height="169.8" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="233" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">3A</text><rect x="255" y="183.4" width="26" height="134.6" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="268" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">3B</text><rect x="290" y="158.7" width="26" height="159.3" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="303" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">4A</text><rect x="325" y="217.9" width="26" height="100.1" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="338" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">4B</text><rect x="360" y="189.4" width="26" height="128.6" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="373" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">5A</text><rect x="395" y="198.0" width="26" height="120.0" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><text class="og-hide" x="408" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">5B</text><rect x="456" y="269.5" width="26" height="48.5" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><text class="og-hide" x="469" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y1</text><rect x="491" y="262.3" width="26" height="55.7" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><text class="og-hide" x="504" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y2</text><rect x="526" y="265.4" width="26" height="52.6" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><text class="og-hide" x="539" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y3</text><rect x="561" y="254.0" width="26" height="64.0" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><text class="og-hide" x="574" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y4</text><rect x="596" y="277.5" width="26" height="40.5" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><text class="og-hide" x="609" y="335" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Y5</text><path d="M70 238.8 H631" stroke="#f4f1ea" stroke-width="2" stroke-dasharray="7 5"/><text class="og-hide" x="637" y="243.83333333333331" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">chance</text><text class="og-hide" x="80" y="132" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">10 classrooms: all above chance → 10/10 pass</text><text class="og-hide" x="456" y="189.75" fill="#ff9f8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">same pupils merged</text><text class="og-hide" x="456" y="206.75" fill="#ff9f8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">into 5 school years:</text><text class="og-hide" x="456" y="223.75" fill="#ff9f8a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">all below → 0/5 pass</text><text class="og-hide" x="70" y="358" fill="#c4b7a2" font-family="Georgia,serif" font-size="12.5" font-weight="normal" text-anchor="start">two-of-three groups: affinity ratio vs chance (same 4,600 triples)</text><path d="M690 112 L 690 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="720" y="134" fill="#f4f1ea" font-family="Georgia,serif" font-size="19" font-weight="normal" text-anchor="start">Could every category pass at once?</text><text class="og-hide" x="720" y="158" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Exact ceiling (Theorem 3); above 1 = room to pass</text><text class="og-hide" x="720" y="190" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">2 categories (pupils / teachers)</text><rect x="720" y="198" width="38.2" height="16" rx="3" fill="#f2a7c3" fill-opacity="0.92"/><path d="M779.5 194 V 218" stroke="#f4f1ea" stroke-width="1.8" stroke-dasharray="4 3"/><text class="og-hide" x="787.5238095238095" y="212" fill="#f2a7c3" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">0.64</text><text class="og-hide" x="720" y="242" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">6 categories (school years)</text><rect x="720" y="250" width="123.0" height="16" rx="3" fill="#ff9f8a" fill-opacity="0.92"/><path d="M779.5 246 V 270" stroke="#f4f1ea" stroke-width="1.8" stroke-dasharray="4 3"/><text class="og-hide" x="850.9756547619047" y="264" fill="#ff9f8a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">2.07</text><text class="og-hide" x="720" y="294" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">11 categories (classrooms)</text><rect x="720" y="302" width="233.4" height="16" rx="3" fill="#9fd2ff" fill-opacity="0.92"/><path d="M779.5 298 V 322" stroke="#f4f1ea" stroke-width="1.8" stroke-dasharray="4 3"/><text class="og-hide" x="961.3820833333333" y="316" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">3.92</text><text class="og-hide" x="779.5238095238095" y="332" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1</text><text class="og-hide" x="720" y="354" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Two categories, odd group size: never above 1</text><text class="og-hide" x="720" y="370" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">(Corollary 2). Years fail only at two-of-three.</text><text class="og-hide" x="40" y="388" fill="#c4b7a2" font-family="Georgia,serif" font-size="10.5" font-weight="normal" text-anchor="start">Exploratory, descriptive: one school, two days. Data: SocioPatterns primary-school contacts (Stehlé et al. 2011), CC BY-NC-SA 3.0, aggregated.</text>
</svg>
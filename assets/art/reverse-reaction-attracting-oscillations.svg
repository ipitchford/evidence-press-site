<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">A reversible three-species reaction loop crosses a Hopf boundary, while deleting the highlighted reverse arrow leaves a convergent flow. The trajectories are schematic, not simulated data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#73ddd0" stop-opacity="0.06"/><stop offset="1" stop-color="#73ddd0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="none" stroke-linecap="round"><path d="M205 180 L315 116" stroke="#73ddd0" stroke-width="5"/><path d="M320 137 L213 198" stroke="#f0b76c" stroke-width="5" stroke-dasharray="10 8"/><path d="M355 133 L355 267" stroke="#73ddd0" stroke-width="5"/><path d="M323 286 L207 219" stroke="#73ddd0" stroke-width="5"/><circle cx="170" cy="200" r="31" fill="#111b22" stroke="#73ddd0" stroke-width="3"/><text x="170" y="208" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="25">X</text><circle cx="355" cy="95" r="31" fill="#111b22" stroke="#73ddd0" stroke-width="3"/><text x="355" y="103" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="25">Y</text><circle cx="355" cy="305" r="31" fill="#111b22" stroke="#73ddd0" stroke-width="3"/><text x="355" y="313" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="25">Z</text><path d="M470 200 H565" stroke="#f4efe6" stroke-width="2" opacity=".45"/><path d="M548 188 L565 200 L548 212" stroke="#f4efe6" stroke-width="2"/><path d="M650 205 C690 90 770 90 810 205 C850 320 930 320 970 205 C1010 90 1070 105 1115 180" stroke="#f0b76c" stroke-width="6"/><path d="M650 205 C735 205 790 205 850 205 C940 205 1010 205 1115 205" stroke="#73ddd0" stroke-width="2" stroke-dasharray="8 8" opacity=".8"/></g><text x="275" y="370" text-anchor="middle" fill="#d8e1df" font-family="monospace" font-size="17">remove one reverse reaction</text><text x="880" y="58" text-anchor="middle" fill="#f4efe6" font-family="Georgia" font-size="31">attracting oscillation</text><text x="880" y="350" text-anchor="middle" fill="#73ddd0" font-family="monospace" font-size="17">deleted network: global convergence</text>
</svg>
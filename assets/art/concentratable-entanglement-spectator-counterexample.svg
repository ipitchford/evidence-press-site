<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A Bell-pair SWAP event of probability one quarter splits when an independent maximally mixed spectator qubit is added. Outcome 110 is counted, with probability three sixteenths; outcome 111 is omitted, with probability one sixteenth. Ribbon thicknesses encode those exact probabilities. Both entanglement roofs remain one quarter.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f5ce7b" stop-opacity="0.06"/><stop offset="1" stop-color="#f5ce7b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><linearGradient id="counted" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f5ce7b" stop-opacity=".55"/><stop offset="1" stop-color="#f5ce7b" stop-opacity=".94"/></linearGradient><linearGradient id="omitted" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ee9b99" stop-opacity=".6"/><stop offset="1" stop-color="#ee9b99" stop-opacity=".95"/></linearGradient></defs><text class="og-hide" x="58" y="51" text-anchor="start" font-family="Georgia,serif" font-size="34" fill="#fff4e9">Entanglement stays. The count falls.</text><text class="og-hide" x="115" y="127" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#fff4e9">Bell event 11</text><text class="og-hide" x="195" y="209" text-anchor="middle" font-family="Georgia,serif" font-size="66" fill="#fff7eb">¼</text><path d="M300 150 H425 C590 150 620 96 790 96 H828 V186 H790 C620 186 590 240 425 240 H300 Z" fill="url(#counted)"/><path d="M300 240 H425 C590 240 620 288 790 288 H828 V318 H790 C620 318 590 270 425 270 H300 Z" fill="url(#omitted)"/><path d="M300 150 V270 M828 96 V186 M828 288 V318" stroke="#fff4e9" stroke-opacity=".8" stroke-width="2"/><text class="og-hide" x="863" y="119" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#f5ce7b">110 · counted</text><text class="og-hide" x="863" y="176" text-anchor="start" font-family="Georgia,serif" font-size="51" fill="#f5ce7b">3/16</text><text class="og-hide" x="863" y="277" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#ee9b99">111 · omitted</text><text class="og-hide" x="863" y="331" text-anchor="start" font-family="Georgia,serif" font-size="51" fill="#ee9b99">1/16</text><text class="og-hide" x="588" y="81" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#fff4e9">+ mixed qubit</text><text class="og-hide" x="58" y="367" text-anchor="start" font-family="Georgia,serif" font-size="28" fill="#fff4e9">Exact roof: ¼</text><text class="og-hide" x="1142" y="367" text-anchor="end" font-family="Georgia,serif" font-size="28" fill="#fff4e9">Proposed bound: 3/16</text>
</svg>
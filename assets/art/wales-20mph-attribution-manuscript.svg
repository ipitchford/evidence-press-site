<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Left: the same first-year comparison in three frozen official vintages, falls of 28.18, 26.10 and 24.18 per cent. Right: three hypothetical worlds share the observed totals 2,402 and 1,725 and an affected-road policy count of 1,000, but their unobserved no-policy counts of 2,000, 1,000 and 500 imply effects of minus 50, 0 and plus 100 per cent.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2c46f" stop-opacity="0.06"/><stop offset="1" stop-color="#f2c46f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="64" y="64" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#cfc6b8">ONE COMPARISON · THREE FROZEN VINTAGES</text><text class="og-hide" x="64" y="112" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">Provisional figure</text><rect x="64" y="124" width="282" height="22" rx="4" fill="#f2c46f" fill-opacity=".95"/><text class="og-hide" x="358" y="142" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#f2c46f">−28.18%</text><text class="og-hide" x="64" y="186" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">StatsWales, current</text><rect x="64" y="198" width="261" height="22" rx="4" fill="#f2c46f" fill-opacity=".6"/><text class="og-hide" x="337" y="216" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#f4efe6">−26.10%</text><text class="og-hide" x="64" y="260" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">DfT rows, current</text><rect x="64" y="272" width="242" height="22" rx="4" fill="#f2c46f" fill-opacity=".6"/><text class="og-hide" x="318" y="290" text-anchor="start" font-family="Georgia,serif" font-size="21" fill="#f4efe6">−24.18%</text><text class="og-hide" x="64" y="342" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#cfc6b8">descriptive fall, first post-policy year</text><text class="og-hide" x="64" y="362" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#cfc6b8">vs the preceding four quarters</text><path d="M 470 72 V 360" stroke="#cfc6b8" stroke-opacity=".25"/><text class="og-hide" x="510" y="64" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#cfc6b8">SAME OBSERVED TOTALS 2,402 → 1,725 · AFFECTED ROADS</text><text class="og-hide" x="510" y="128" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">World B</text><rect x="640" y="104" width="130" height="18" rx="3" fill="#f4efe6" fill-opacity=".85"/><rect x="640" y="128" width="260" height="18" rx="3" fill="none" stroke="#e79a8a" stroke-width="2.5" stroke-dasharray="6 4"/><text class="og-hide" x="926" y="136" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#e79a8a">−50%</text><text class="og-hide" x="510" y="208" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">World A</text><rect x="640" y="184" width="130" height="18" rx="3" fill="#f4efe6" fill-opacity=".85"/><rect x="640" y="208" width="130" height="18" rx="3" fill="none" stroke="#f4efe6" stroke-width="2.5" stroke-dasharray="6 4"/><text class="og-hide" x="926" y="216" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#f4efe6">0%</text><text class="og-hide" x="510" y="288" text-anchor="start" font-family="Georgia,serif" font-size="19" fill="#f4efe6">World C</text><rect x="640" y="264" width="130" height="18" rx="3" fill="#f4efe6" fill-opacity=".85"/><rect x="640" y="288" width="65" height="18" rx="3" fill="none" stroke="#f2c46f" stroke-width="2.5" stroke-dasharray="6 4"/><text class="og-hide" x="926" y="296" text-anchor="start" font-family="Georgia,serif" font-size="30" fill="#f2c46f">+100%</text><rect x="640" y="340" width="14" height="10" fill="#f4efe6" fill-opacity=".85"/><text class="og-hide" x="662" y="350" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#cfc6b8">with policy P1 = 1,000</text><rect x="880" y="340" width="14" height="10" fill="none" stroke="#cfc6b8" stroke-dasharray="4 3"/><text class="og-hide" x="902" y="350" text-anchor="start" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#cfc6b8">no-policy P0 (unobserved)</text><text class="og-hide" x="1140" y="378" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#cfc6b8">hypothetical worlds · not estimates</text>
</svg>
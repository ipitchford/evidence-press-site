<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on sharp static pricing guarantees. Left: two exact curves against offered load for five servers and capacity seven. Mean occupancy factor peaks at 1.01003 at load 2.59. The share of optimal revenue kept falls to 81.85 percent at load 5. Right: the published guarantees cannot be improved, their worst cases sit at different loads, and a quartic decides when they coincide; this concerns one construction and the best fixed price stays open.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

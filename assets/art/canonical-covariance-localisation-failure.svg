<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on when canonical covariance localisation fails. Left: a line chart from the paper’s reconstruction of Snyder and Hakim’s 200-variable test case, scored by mean squared analysis error in physical units divided by the Kalman-filter error, for ensemble sizes 4, 8, 16, 32 and 64. The canonical-coordinates curve starts at 1.37 for 4 members and falls to 1.01 for 64; the symmetric (ZCA) whitening curve lies well below it, starting at 1.14 and falling to 1.008, and a dashed curve for the best basis found is almost identical to ZCA. The shaded gap between the curves is the avoidable error. Right: the headline numbers at 8 ensemble members: canonical coordinates give 1.137 times the Kalman-filter error, the best basis found 1.063 times; whitening removes about half the excess error, worth roughly doubling the ensemble. A note gives the scope: error measured in physical units, a known prior covariance and one analysis step; when error is scored relative to the forecast uncertainty, canonical coordinates are best at leading order. Values are from the paper’s Section 10 Monte Carlo (4000 replicates per ensemble size).</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9fd8ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f6f0ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Where you localise matters: the canonical basis is not the best</text><text class="og-hide" x="40" y="80" fill="#e6d8cf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Reconstruction of the Snyder–Hakim 200-variable ensemble Kalman filter test case (50 observations)</text><text class="og-hide" x="40" y="106" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">analysis error ÷ Kalman-filter error</text><path d="M110 330.0 H640" stroke="#c9b6aa" stroke-opacity=".55" stroke-width="1"/><text class="og-hide" x="100" y="334" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.0</text><path d="M110 277.5 H640" stroke="#c9b6aa" stroke-opacity=".16" stroke-width="1"/><text class="og-hide" x="100" y="281.49999999999994" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.1</text><path d="M110 225.0 H640" stroke="#c9b6aa" stroke-opacity=".16" stroke-width="1"/><text class="og-hide" x="100" y="229" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.2</text><path d="M110 172.5 H640" stroke="#c9b6aa" stroke-opacity=".16" stroke-width="1"/><text class="og-hide" x="100" y="176.49999999999994" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.3</text><path d="M110 120.0 H640" stroke="#c9b6aa" stroke-opacity=".16" stroke-width="1"/><text class="og-hide" x="100" y="124" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.4</text><text class="og-hide" x="118" y="323" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="start">Kalman filter (ideal) = 1.0</text><path d="M110.0 137.7 L242.5 257.9 L375.0 299.4 L507.5 315.9 L640.0 323.2 L640.0 326.0 L507.5 321.9 L375.0 313.7 L242.5 296.5 L110.0 258.9 Z" fill="#ffb38a" fill-opacity=".12"/><path d="M110.0 137.7 L242.5 257.9 L375.0 299.4 L507.5 315.9 L640.0 323.2" stroke="#ffb38a" stroke-width="3.2" fill="none" stroke-linejoin="round"/><circle cx="110.0" cy="137.7" r="4.5" fill="#ffb38a"/><circle cx="242.5" cy="257.9" r="4.5" fill="#ffb38a"/><circle cx="375.0" cy="299.4" r="4.5" fill="#ffb38a"/><circle cx="507.5" cy="315.9" r="4.5" fill="#ffb38a"/><circle cx="640.0" cy="323.2" r="4.5" fill="#ffb38a"/><path d="M110.0 258.9 L242.5 296.5 L375.0 313.7 L507.5 321.9 L640.0 326.0" stroke="#9fd8ff" stroke-width="3.2" fill="none" stroke-linejoin="round"/><circle cx="110.0" cy="258.9" r="4.5" fill="#9fd8ff"/><circle cx="242.5" cy="296.5" r="4.5" fill="#9fd8ff"/><circle cx="375.0" cy="313.7" r="4.5" fill="#9fd8ff"/><circle cx="507.5" cy="321.9" r="4.5" fill="#9fd8ff"/><circle cx="640.0" cy="326.0" r="4.5" fill="#9fd8ff"/><path d="M110.0 259.7 L242.5 296.9 L375.0 313.9 L507.5 322.0 L640.0 326.0" stroke="#b9f0c8" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M110.0 330 v5" stroke="#c9b6aa" stroke-width="1.2"/><text class="og-hide" x="110" y="351" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><path d="M242.5 330 v5" stroke="#c9b6aa" stroke-width="1.2"/><text class="og-hide" x="242.5" y="351" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><path d="M375.0 330 v5" stroke="#c9b6aa" stroke-width="1.2"/><text class="og-hide" x="375" y="351" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">16</text><path d="M507.5 330 v5" stroke="#c9b6aa" stroke-width="1.2"/><text class="og-hide" x="507.5" y="351" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">32</text><path d="M640.0 330 v5" stroke="#c9b6aa" stroke-width="1.2"/><text class="og-hide" x="640" y="351" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">64</text><text class="og-hide" x="640" y="370" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">ensemble size N</text><text class="og-hide" x="122" y="141.6924999999999" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">canonical coordinates</text><text class="og-hide" x="252.5" y="249.91750000000002" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">1.137</text><text class="og-hide" x="252.5" y="318.925" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">1.063</text><text class="og-hide" x="393" y="287.67250000000007" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">symmetric (ZCA) whitening</text><text class="og-hide" x="393" y="303.67250000000007" fill="#b9f0c8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">best basis found (dashed) almost identical</text><path d="M680 104 L 680 384" stroke="#e6d8cf" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="712" y="122" fill="#e6d8cf" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">At N = 8 ensemble members</text><text class="og-hide" x="712" y="172" fill="#ffb38a" font-family="Georgia,serif" font-size="42" font-weight="bold" text-anchor="start">1.137 ×</text><text class="og-hide" x="880" y="166" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">canonical</text><text class="og-hide" x="880" y="184" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">coordinates</text><text class="og-hide" x="712" y="226" fill="#9fd8ff" font-family="Georgia,serif" font-size="42" font-weight="bold" text-anchor="start">1.063 ×</text><text class="og-hide" x="880" y="220" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="start">best basis</text><text class="og-hide" x="880" y="238" fill="#9fd8ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">found</text><text class="og-hide" x="712" y="272" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">the Kalman-filter error</text><text class="og-hide" x="712" y="308" fill="#f6f0ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Whitening removes about half the excess error,</text><text class="og-hide" x="712" y="326" fill="#f6f0ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">worth roughly doubling the ensemble</text><text class="og-hide" x="712" y="362" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Error in physical units; known prior covariance; one analysis step.</text><text class="og-hide" x="712" y="378" fill="#c9b6aa" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Scored relative to forecast uncertainty, canonical is best (leading order).</text>
</svg>
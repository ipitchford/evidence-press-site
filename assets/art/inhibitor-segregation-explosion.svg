<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that a nonexplosive reaction network can explode inside dividing compartments without any inflow reactions. Left: a schematic division (not data): a compartment holding substrate S (orange) and inhibitor I (blue) divides at rate lambda times its substrate count; one daughter keeps every S molecule and little inhibitor and keeps growing, the other receives the exported inhibitor and is inert. Right: the exact explosion threshold for conversion inhibition with b = c = 1 and d = 2, plotted from the paper's formulas, with inhibitor retention probability p on the horizontal axis and the division coefficient lambda on the vertical axis. Above the gold curve, lambda times log(1/p) equals d minus b, explosion is possible; on and below it the model is safe. The dashed curve is the threshold when the same mean amount of inhibitor is removed by an ordinary well-mixed reaction instead, lambda times (1 minus p) equals d minus b; the band between the curves is the purely compartmental effect. The dot marks the worked example, lambda = 3 with all inhibitor exported, whose explosion probability is about 0.7975.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffb86b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3d9c9"/></marker></defs><text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">Dividing compartments can throw away the brakes</text><text class="og-hide" x="40" y="82" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Keep all substrate together, export the inhibitor, and a chemistry that is safe on its own can explode</text><circle cx="150" cy="235" r="78" fill="#ffffff" fill-opacity=".06" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><circle cx="165.5" cy="239.8" r="6" fill="#ffb86b"/><circle cx="124.5" cy="247.0" r="6" fill="#ffb86b"/><circle cx="163.7" cy="201.3" r="6" fill="#ffb86b"/><circle cx="164.9" cy="275.4" r="6" fill="#ffb86b"/><circle cx="106.6" cy="212.7" r="6" fill="#ffb86b"/><circle cx="202.0" cy="220.8" r="6" fill="#ffb86b"/><circle cx="118.7" cy="284.6" r="6" fill="#ffb86b"/><circle cx="148.3" cy="248.6" r="6" fill="#7fd6e0"/><circle cx="141.8" cy="204.1" r="6" fill="#7fd6e0"/><circle cx="189.9" cy="247.9" r="6" fill="#7fd6e0"/><circle cx="110.0" cy="246.8" r="6" fill="#7fd6e0"/><circle cx="179.5" cy="185.9" r="6" fill="#7fd6e0"/><circle cx="167.7" cy="288.6" r="6" fill="#7fd6e0"/><path d="M238 235 H300" stroke="#e3d9c9" stroke-width="2.4" marker-end="url(#ah)"/><text class="og-hide" x="269" y="222" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="middle">division</text><text class="og-hide" x="269" y="256" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="middle">at rate λs</text><circle cx="385" cy="180" r="62" fill="#ffffff" fill-opacity=".06" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><circle cx="397.3" cy="183.8" r="5.5" fill="#ffb86b"/><circle cx="364.8" 
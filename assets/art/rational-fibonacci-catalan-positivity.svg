<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper proving that rational Fibonacci–Catalan polynomials have nonnegative coefficients. Left: a 5 by 8 grid of dots, the monomials of the product of the q-integers [5]_q and [8]_q, where 5 and 8 are Fibonacci numbers; dots on the same diagonal share a power of q, shaded alternately. An arrow labelled divide by [2]_q, that is by 1 + q, leads to the right: the eleven coefficients of C_{4,3}(q), drawn as stacks of blocks above a zero line with heights 1, 1, 2, 2, 3, 2, 3, 2, 2, 1, 1 for the powers 1 to q^10, all nonnegative, computed exactly. A note states the theorem: the same holds for every m and n with gcd(m, n) at most 2. Footer: the coefficients count dimensions of a graded algebra, not yet a combinatorial model.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

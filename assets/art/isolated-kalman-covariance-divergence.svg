<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the isolated Kalman filter. Left: three nodes x1, x2, x3 in a triangle; each edge is a measurement of the sum of two node states (x1 + x2, x2 + x3, x3 + x1), and each update touches only two nodes. Right: a logarithmic plot of the reported variance against round k. The isolated Kalman filter values (exact) rise to 982 by round 4, above a dashed proved lower bound (5/4)(9/5) to the power k minus 1/4, while a flat green line shows the centralised Kalman filter staying at or below 3/4.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.45" r="0.42">
<stop offset="0" stop-color="#ff9f80" stop-opacity="0.06"/><stop offset="1" stop-color="#ff9f80" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Observable systems with divergent isolated Kalman covariances</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Counterexample to the convergence conjecture: the shortcut filter’s reported uncertainty explodes while the full filter stays bounded</text><text class="og-hide" x="60" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Three nodes, pair-sum measurements</text><text class="og-hide" x="60" y="150" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">observable and controllable · every local update valid · A = 3I</text><path d="M150.0 330.0 L330.0 330.0" stroke="#e3d9c9" stroke-opacity=".7" stroke-width="2.2"/><text class="og-hide" x="240.0" y="369.0" fill="#e3d9c9" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="middle">x₁ + x₂</text><path d="M330.0 330.0 L240.0 190.0" stroke="#e3d9c9" stroke-opacity=".7" stroke-width="2.2"/><text class="og-hide" x="315.3" y="249.5" fill="#e3d9c9" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="middle">x₂ + x₃</text><path d="M240.0 190.0 L150.0 330.0" stroke="#e3d9c9" stroke-opacity=".7" stroke-width="2.2"/><text class="og-hide" x="164.7" y="249.5" fill="#e3d9c9" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="middle">x₃ + x₁</text><circle cx="150" cy="330" r="20" fill="#8cc8ff"/><text class="og-hide" x="150" y="336" fill="#15202b" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="middle">x₁</text><circle cx="330" cy="330" r="20" fill="#8cc8ff"/><text class="og-hide" x="330" y="336" fill="#15202b" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="middle">x₂</text><circle cx="240" cy="190" r="20" fill="#8cc8ff"/><text class="og-hide" x="240" y="196" fill="#15202b" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="middle">x₃</text><text class="og-hide" x="240" y="392" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">each update touches only two nodes</text><path d="M545 108 L 545 380" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="600" y="128" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">Reported variance after k rounds</text><text class="og-hide" x="600" y="150" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">same system, same measurements · logarithmic scale</text><path d="M640 166 V345 H1140" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.3" fill="none"/><text class="og-hide" x="632" y="349.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.1</text><text class="og-hide" x="632" y="310.6" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><text class="og-hide" x="632" y="272.1" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><text class="og-hide" x="632" y="233.7" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">100</text><text class="og-hide" x="632" y="195.2" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1000</text><text class="og-hide" x="640.0" y="365" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><text class="og-hide" x="806.7" y="365" fill="#c4b7a2" font-family="
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the lower boundary of the region of Chatterjee’s rank correlation and Spearman’s footrule. Title: How little functional dependence when rankings disagree. Subtitle: which pairs of Chatterjee’s xi and Spearman’s footrule psi can occur together (Theorem 1). Left: a plot with xi from 0 to 1 across and psi from minus one half to 1 up. A shaded region labelled possible pairs is bounded above by the blue curve psi = square root of xi (Rockel), on the right by xi = 1 and at the bottom by psi = minus one half. Its curved lower edge, from independence at (0, 0) to the checkerboard at (one half, minus one half), is drawn in bold orange and labelled new edge. A dashed pink line xi + 2 psi = minus 0.604 touches the new edge at one marked point. Right: the curved lower edge was open. Now, for every footrule between minus one half and 0, the least xi, its one extremal copula and a certificate valid for all copulas. Sharp for every copula: xi + 2 psi is at least minus 0.6042. Closed form for psi at most minus 0.4565; elsewhere a finite calculation. Population coefficients only. Footer: curve computed two ways (closed form; Nystrom solve) and checked against the release table; blue edges are Rockel’s; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

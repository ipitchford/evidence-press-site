" font-style="normal" text-anchor="start">Sharp for every copula:</text><text class="og-hide" x="690" y="254" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" font-style="normal" text-anchor="start">ξ + 2ψ ≥ −0.6042…</text><text class="og-hide" x="690" y="290" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Closed form for ψ ≤ −0.4565…; elsewhere a</text><text class="og-hide" x="690" y="308" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">finite calculation. Population coefficients only.</text><text class="og-hide" x="40" y="384" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Curve computed two ways (closed form; Nyström solve) and checked against the release’s table. Blue edges: Rockel. Unrefereed candidate.</text>

mily="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">slowest of 2,505,121 fair rules:</text><text class="og-hide" x="600" y="299.22431864335454" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">163/30 boxes on average</text><text class="og-hide" x="830" y="52" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">Chance still unfinished after k boxes</text><text class="og-hide" x="830" y="72" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">(limit for large n; critical window)</text><line x1="850" y1="318" x2="1150" y2="318" stroke="#c3ccd2" stroke-width="1.2"/><line x1="850" y1="318" x2="850" y2="112" stroke="#c3ccd2" stroke-width="1.2"/><text class="og-hide" x="844" y="122" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="end">1</text><text class="og-hide" x="844" y="322" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="end">0</text><text class="og-hide" x="950" y="334" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle">1</text><polyline points="850.0,318.0 851.0,316.0 852.0,314.0 853.0,312.0 854.0,310.0 855.0,308.0 856.0,306.0 857.0,304.0 858.0,302.0 859.0,300.0 860.0,298.0 861.0,296.0 862.0,294.0 863.0,292.0 864.0,290.0 865.0,288.0 866.0,286.0 867.0,284.0 868.0,282.0 869.0,280.0 870.0,278.0 871.0,276.0 872.0,274.0 873.0,272.0 874.0,270.0 875.0,268.0 876.0,266.0 877.0,264.0 878.0,262.0 879.0,260.0 880.0,258.0 881.0,256.0 882.0,254.0 883.0,252.0 884.0,250.0 885.0,248.0 886.0,246.0 887.0,244.0 888.0,242.0 889.0,240.0 890.0,238.0 891.0,2
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the slowest and fastest ways to fill boxes of coupons in groups. Title: how slow can fair group sampling be? Left text: each box holds a group of coupons; fair means every coupon is equally common. Proved: a fair rule is never more than 1/e + 0.42/ln(n/r) boxes slower on average than uniform sampling, so under one box when boxes hold at least half the coupons. Slowest fair rules: Steiner designs. Fastest rules: equal disjoint groups when the box size divides n. Centre: the Fano plane, seven points and seven lines of three points, any two lines meeting; with the lines as boxes it is the slowest of 2,505,121 fair rules for seven coupons in boxes of three, at 163/30 boxes on average. Right: the limiting chance of still being unfinished after k boxes against lambda, the expected number of coupons missing; the slowest fair rule follows min(1, lambda) and uniform sampling follows 1 minus e to the minus lambda, with the gap of 1/e, about 0.37, marked at lambda = 1. Footer: idealised independent draws; the curves are limits as n grows; the 1/e gap is a limit, not a finite-n guarantee; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.3">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the maximum Wiener index of trees with prescribed diameter. Title: how spread out can a tree of given diameter be? Subtitle: add up the distances between all pairs of points of a tree with n points and longest distance d; how far must the largest total fall short of its ceiling? Left: one branch drawn downwards against an axis labelled remaining height tau; a thick gold trunk labelled mass x splits into two equal halves at the level marked equal split at tau = x squared over 2, each half splits again at the level marked next at x squared over 8, and again at the level marked then x squared over 32, the lines getting thinner as the mass halves. Right: shortfall of the most spread-out tree, for large d with d over n tending to 0: kappa times (dn) to the power 3/2, kappa about 0.4775; kappa equals the square root of (175 minus root 7) over 756, exact. Before: Cambie (2020) placed it between 0.4714 and 0.4833. Best branches split in half, again and again; each split comes when a quarter as much height remains as at the last. Trees only; lower-order terms remain open. Footer: left, one branch of an optimal tree against the remaining height; line width is proportional to the mass of leaves it carries; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.22" cy="0.5" r="0.35">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="27" font-weight="normal" font-style="normal" text-anchor="start">How spread out can a tree of given diameter be?</text><text class="og-hide" x="40" y="74" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Add up the distances between all pairs of points of a tree with n points and longest distance d. How far must the largest total fall short of its ceiling?</text><line x1="52" y1="112.0" x2="52" y2="358" stroke="#c3ccd2" stroke-width="1.5"/><polygon points="47,354 57,354 52,364" fill="#c3ccd2"/><text class="og-hide" x="60" y="116" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">remaining</text><text class="og-hide" x="60" y="131" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">height τ</text><line x1="300" y1="112.0" x2="300" y2="232.0" stroke="#ffc36b" stroke-width="16.00" stroke-linecap="round"/><line x1="300" y1="232.0" x2="196" y2="246.0" stroke="#ffc36b" stroke-width="8.00" stroke-linecap="round"/><line x1="196" y1="246.0" x2="196" y2="322.0" stroke="#ffc36b" stroke-width="8.00" stroke-linecap="round"/><line x1="300" y1="232.0" x2="404" y2="246.0" stroke="#ffc36b" stroke-width="8.00" stroke-linecap="round"/><line x1="404" y1="246.0" x2="404" y2="322.0" stroke="#ffc36b" stroke-width="8.00" stroke-linecap="round"/><line x1="196" y1="322.0" x2="144" y2="335.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="144" y1="335.5" x2="144" y2="344.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="196" y1="322.0" x2="248" y2="335.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="248" y1="335.5" x2="248" y2="344.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="404" y1="322.0" x2="352" y2="335.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="352" y1="335.5" x2="352" y2="344.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="404" y1="322.0" x2="456" y2="335.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="456" y1="335.5" x2="456" y2="344.5" stroke="#9fd3ff" stroke-width="4.00" stroke-linecap="round"/><line x1="144" y1="344.5" x2="118" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="118" y1="349.0" x2="118" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="144" y1="344.5" x2="170" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="170" y1="349.0" x2="170" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="248" y1="344.5" x2="222" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="222" y1="349.0" x2="222" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="248" y1="344.5" x2="274" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="274" y1="349.0" x2="274" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="352" y1="344.5" x2="326" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="326" y1="349.0" x2="326" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="352" y1="344.5" x2="378" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="378" y1="349.0" x2="378" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="456" y1="344.5" x2="430" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="430" y1="349.0" x2="430" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="456" y1="344.5" x2="482" y2="349.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="482" y1="349.0" x2="482" y2="352.0" stroke="#a8e6c1" stroke-width="2.00" stroke-linecap="round"/><line x1="420" y1="232.0" x2="505" y2="232.0" stroke="#ffc36b" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/><text class="og-hide" x="510" y="236" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">equal split at τ = x²/2</text><line x1="420" y1="322.0" x2="505" y2="322.0" stroke="#9fd3ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/><text class="og-hide" x="510" y="326" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">next at x²/8</text><line x1="420" y1="344.5" x2="505" y2="344.5" stroke="#a8e6c1" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/><text class="og-hide" x="510" y="353.5" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">then x²/32</text><text class="og-hide" x="312" y="106" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">mass x</text><text class="og-hide" x="690" y="138" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">Shortfall of the most spread-out tree, for large d with d/n → 0:</text><text class="og-hide" x="690" y="178" fill="#ffc36b" font-family="Georgia,serif" font-size="30" font-weight="bold" font-style="normal" text-anchor="start">κ (dn)<tspan baseline-shift="super" font-size="15">3/2</tspan>,  κ ≈ 0.4775</text><text class="og-hide" x="690" y="206" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">κ = √((175 − √7)/756), exact</text><text class="og-hide" x="690" y="240" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Before: Cambie (2020) placed it between 0.4714 and 0.4833.</text><text class="og-hide" x="690" y="276" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="start">Best branches split in half, again and again; each split</text><text class="og-hide" x="690" y="295" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">comes when a quarter as much height remains as at the last.</text><text class="og-hide" x="690" y="330" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Trees only; lower-order terms remain open.</text><text class="og-hide" x="40" y="386" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Left: one branch of an optimal tree against the remaining height; line width is proportional to the mass of leaves it carries. Unrefereed candidate.</text>
</svg>
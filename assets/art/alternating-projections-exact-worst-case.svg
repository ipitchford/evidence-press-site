<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the worst-case speed of alternating projections. On the left, an exact drawing of the slowest configuration: a green disc (the common ball of radius delta) centred at a point, a horizontal blue line (the edge of set A, which lies below it) and a tilted yellow line (the edge of set B, which lies to its left), both touching the disc; their overlap, shaded violet, is the set of solutions, and the two lines meet at a corner, the nearest solution. The starting point lies on the blue line at distance R from the centre. Orange dots zig-zag between the two lines towards the corner; each projection shrinks the distance to the corner by the factor c, the cosine of the wedge angle. On the right, headed "The worst case is exactly this wedge", bars compare the cycles needed to get within one thousandth of R of a solution when R over delta is 10: 93 for the exact worst case (Theorem 1), 212 for an elementary bound with the sharp factor, and 833 for the classical interior-point bound. Text: Luner and Grimmer (2024) found this wedge and conjectured nothing is slower; now proved in every dimension, with exact answers for unequal balls and residuals.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.18" cy="0.65" r="0.4">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.07"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">How slow can alternating projections be?</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Two convex sets share a ball of radius δ; jump to the nearest point of one set, then of the other, and repeat.</text><path d="M52.0 236.8 L266.5 236.8 L157.6 382.0 L52.0 382.0 Z" fill="#d9c7ff" fill-opacity=".13"/><circle cx="134.5" cy="302.8" r="66.0" fill="#9be3c0" fill-opacity=".2" stroke="#9be3c0" stroke-width="2"/><path d="M52.0 236.8 H401.8" stroke="#9fd2ff" stroke-width="2.4"/><path d="M157.6 382.0 L365.5 104.8" stroke="#ffd56b" stroke-width="2.4"/><circle cx="134.5" cy="302.8" r="3" fill="#f4f1ea"/><text class="og-hide" x="134.5" y="330.52" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">common ball</text><text class="og-hide" x="134.5" y="346.52" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">radius δ</text><text class="og-hide" x="55.300000000000004" y="372.1" fill="#d9c7ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">A ∩ B</text><text class="og-hide" x="55.300000000000004" y="227.79999999999998" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">A: everything below this line</text><text class="og-hide" x="340.61" y="119.32000000000005" fill="#ffd56b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="end">B: everything left of this line</text><path d="M362.7 236.8 L301.1 190.6 L301.1 236.8 L279.0 220.2 L279.0 236.8 L271.0 230.8 L271.0 236.8 L268.1 234.6 L268.1 236.8" stroke="#ffb38a" stroke-width="1.8" fill="none" stroke-linejoin="round"/><circle cx="362.7" cy="236.8" r="5.5" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="301.1" cy="190.6" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="301.1" cy="236.8" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="279.0" cy="220.2" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="279.0" cy="236.8" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="271.0" cy="230.8" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="271.0" cy="236.8" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="268.1" cy="234.6" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><circle cx="268.1" cy="236.8" r="3.6" fill="#ffb38a" stroke="#1b1b1b" stroke-width="1"/><text class="og-hide" x="350.7493373484357" y="206.79999999999998" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">start, at distance</text><text class="og-hide" x="350.7493373484357" y="222.79999999999998" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">R from the centre</text><circle cx="266.5" cy="236.8" r="5" fill="none" stroke="#f4f1ea" stroke-width="1.6"/><text class="og-hide" x="272.5" y="256.79999999999995" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">↖ corner:</text><text class="og-hide" x="272.5" y="272.79999999999995" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">nearest solution</text><text class="og-hide" x="352.75" y="137.79999999999998" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">each projection</text><text class="og-hide" x="352.75" y="153.79999999999998" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">shrinks the distance</text><text class="og-hide" x="352.75" y="169.79999999999998" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">to the corner by c</text><path d="M495 112 L 495 380" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="520" y="136" fill="#f4f1ea" font-family="Georgia,serif" font-size="20" font-weight="normal" text-anchor="start">The worst case is exactly this wedge.</text><text class="og-hide" x="520" y="158" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Cycles needed to get within 10⁻³ R of a solution when R/δ = 10:</text><text class="og-hide" x="520" y="192" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Exact worst case (Theorem 1)</text><rect x="520" y="199" width="62.5" height="20" rx="4" fill="#ffb38a" fill-opacity="0.9"/><text class="og-hide" x="592.5210084033613" y="215" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">93</text><text class="og-hide" x="520" y="244" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Elementary bound with the sharp factor</text><rect x="520" y="251" width="142.5" height="20" rx="4" fill="#ffd56b" fill-opacity="0.5"/><text class="og-hide" x="672.5210084033613" y="267" fill="#ffd56b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">212</text><text class="og-hide" x="520" y="296" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">Classical interior-point bound</text><rect x="520" y="303" width="560.0" height="20" rx="4" fill="#9fd2ff" fill-opacity="0.5"/><text class="og-hide" x="1090" y="319" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">833</text><text class="og-hide" x="520" y="352" fill="#e3d9c9" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">Luner and Grimmer (2024) found this wedge and conjectured nothing is slower.</text><text class="og-hide" x="520" y="372" fill="#e3d9c9" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">Now proved in every dimension, with exact answers for unequal balls and residuals.</text>
</svg>
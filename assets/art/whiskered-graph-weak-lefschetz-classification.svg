<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the weak Lefschetz property of whiskered graph algebras. Title: three independent vertices always break the weak Lefschetz property. Subtitle: whiskered graphs; one change of variables splits the algebra into Boolean blocks, one per independent set. Left: a small graph with four base nodes, only the first two linked, so three base nodes (orange) have no links; each base node has a dashed private leaf. Caption: Theorem A, no weak Lefschetz property, over every field. Right: a table for K8 minus a triangle, degree 4 to 5, split into blocks by face size. Size 0 (1 face): 70 to 56, rank 56, shrinking with kernel 14. Size 1 (8 faces): 280 to 280, rank 280, balanced. Size 2 (3 faces): 45 to 60, rank 45, growing. Size 3 (1 face): 5 to 10, rank 5, growing. Total: 400 to 406, rank 386, kernel 14 and cokernel 20. One block shrinks while others still grow: no map of maximal rank. Paths: weak property for 1 to 7, 9, 10 and 13 nodes, and never again. Footer: block numbers from the paper’s Example 4.2; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.6" r="0.35">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

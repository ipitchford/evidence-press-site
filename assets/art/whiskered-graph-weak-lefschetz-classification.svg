t-anchor="start">56</text><text class="og-hide" x="870" y="156" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">56</text><text class="og-hide" x="960" y="156" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">shrinking: kernel 14</text><text class="og-hide" x="520" y="184" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">size 1 (8 faces)</text><text class="og-hide" x="690" y="184" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">280</text><text class="og-hide" x="780" y="184" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">280</text><text class="og-hide" x="870" y="184" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">280</text><text class="og-hide" x="960" y="184" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">balanced</text><text class="og-hide" x="520" y="212" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">size 2 (3 faces)</text><text class="og-hide" x="690" y="212" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">45</text><text class="og-hide" x="780" y="212" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">60</text><text class="og-hide" x="870" y="212" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">45</text><text class="og-hide" x="960" y="212" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">growing: +15</text><text class="og-hide" x="520" y="240" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">size 3 (1 face)</text><text class="og-hide" x="690" y="240" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">5</text><text class="og-hide" x="780" y="240" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">10</text><text class="og-hide" x="870" y="240" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">5</text><text class="og-hide" x="960" y="240" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">growing: +5</text><line x1="520" y1="250" x2="1140" y2="250" stroke="#e6e1ea" stroke-width="1"/><text class="og-hide" x="520" y="270" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">total</text><text class="og-hide" x="690" y="270" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">400</text><text class="og-hide" x="780" y="270" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">406</text><text class="og-hide" x="870" y="270" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">386</text><text class="og-hide" x="960" y="270" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="start">kernel 14, cokernel 20</text><text class="og-hide" x="520" y="304" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">One block shrinks while others still grow: no map of maximal rank.</text><text class="og-hide" x="520" y="328" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Paths: weak property for 1–7, 9, 10 and 13 nodes, and never again.</text><text class="og-hide" x="1160" y="386" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">Block numbers from the paper’s Example 4.2. Unrefereed candidate.</text>

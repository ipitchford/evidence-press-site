<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on recovering approval winners from ranked ballots. One voter approves candidates x and y, marked by a bracket. The ballot is counted twice, as two sincere rankings drawn as cards: copy 1 ranks x, y, z and copy 2 ranks y, x, z, with best–worst scores +1 for first, 0 for middle and −1 for last beside each place. An arrow leads to the totals: x +1, y +1 and z −2, so x and y both win, exactly the approval winners. A side note compares a single copy, x y z, which gives x +1, y 0, z −1 so that only x wins, and states the theorem: with m candidates at most m − 1 copies of each ballot always suffice; with four candidates this is the rule (2, 1, 1, 0). Footer: sincere rankings put approved candidates above the rest; the result holds in the worst case over every electorate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Best–worst voting gives back the approval winners</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">+1 for first place, −1 for last: one voter approves x and y, then ranks sincerely, twice</text><path d="M66 128v200" stroke="#f6c177" stroke-width="3"/><text transform="rotate(-90 58 228)" class="og-hide" x="58" y="228" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">approved: x, y</text><rect x="96" y="126" width="150" height="200" rx="10" fill="#0e1216" fill-opacity=".35" stroke="#d9d2c4" stroke-opacity=".45"/><text class="og-hide" x="171" y="114" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">copy 1</text><circle cx="136" cy="163" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="136" y="170" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">x</text><text class="og-hide" x="214" y="170" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">+1</text><circle cx="136" cy="221" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="136" y="228" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">y</text><text class="og-hide" x="214" y="228" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">0</text><circle cx="136" cy="279" r="20" fill="#8fd3c8" opacity="0.65"/><text class="og-hide" x="136" y="286" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">z</text><text class="og-hide" x="214" y="286" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">−1</text><rect x="276" y="126" width="150" height="200" rx="10" fill="#0e1216" fill-opacity=".35" stroke="#d9d2c4" stroke-opacity=".45"/><text class="og-hide" x="351" y="114" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">copy 2</text><circle cx="316" cy="163" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="316" y="170" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">y</text><text class="og-hide" x="394" y="170" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">+1</text><circle cx="316" cy="221" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="316" y="228" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">x</text><text class="og-hide" x="394" y="228" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">0</text><circle cx="316" cy="279" r="20" fill="#8fd3c8" opacity="0.65"/><text class="og-hide" x="316" y="286" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">z</text><text class="og-hide" x="394" y="286" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">−1</text><path d="M454 226h28" stroke="#d9d2c4" stroke-width="2"/><path d="M482 220l10 6-10 6z" fill="#d9d2c4"/><circle cx="522" cy="163" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="522" y="170" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">x</text><text class="og-hide" x="566" y="170" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">+1</text><text class="og-hide" x="612" y="170" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">wins</text><circle cx="522" cy="221" r="20" fill="#f6c177" opacity="1"/><text class="og-hide" x="522" y="228" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">y</text><text class="og-hide" x="566" y="228" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">+1</text><text class="og-hide" x="612" y="228" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">wins</text><circle cx="522" cy="279" r="20" fill="#8fd3c8" opacity="0.65"/><text class="og-hide" x="522" y="286" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">z</text><text class="og-hide" x="566" y="286" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">−2</text><text class="og-hide" x="522" y="340" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">totals</text><path d="M760 118V334" stroke="#d9d2c4" opacity=".35"/><text class="og-hide" x="790" y="136" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">with a single copy, x y z:</text><text class="og-hide" x="790" y="162" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">x +1, y 0, z −1: only x wins</text><text class="og-hide" x="790" y="214" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">two sincere copies:</text><text class="og-hide" x="790" y="240" fill="#f6c177" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">x +1, y +1, z −2: exactly the approval winners</text><text class="og-hide" x="790" y="292" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">theorem: with m candidates, at most</text><text class="og-hide" x="790" y="314" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">m − 1 copies of each ballot always suffice</text><text class="og-hide" x="790" y="336" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">with four candidates: the rule (2, 1, 1, 0)</text><text class="og-hide" x="1160" y="388" fill="#d9d2c4" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">Sincere rankings: approved candidates above the rest · worst case over every electorate</text>
</svg>
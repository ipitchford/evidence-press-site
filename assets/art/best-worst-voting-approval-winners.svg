<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that best–worst voting, one point for first and minus one for last, can turn sincere rankings back into the approval result: two copies of one ballot approving x and y, ranked x y z and y x z, give x 1, y 1 and z −2, so both approved candidates win.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">SOCIAL CHOICE · VOTING RULES</text>
<text class="og-hide" x="56" y="148" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">Best–worst voting recovers</text>
<text class="og-hide" x="56" y="194" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">approval winners</text>
<text class="og-hide" x="56" y="236" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">+1 first, −1 last: two copies of ballot {x, y},</text>
<text class="og-hide" x="56" y="264" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">ranked x y z and y x z</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="135.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="130.9" fill="#ffc36b" font-family="Georgia,serif" font-size="64" font-weight="normal" text-anchor="middle">1, 1, −2</text>
<text class="og-hide" x="948" y="160.9" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle">totals x, y, z</text>
<rect x="752" y="209.0" width="392" height="135.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="283.9" fill="#9fd3ff" font-family="Georgia,serif" font-size="64" font-weight="normal" text-anchor="middle">2</text>
<text class="og-hide" x="948" y="313.9" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="middle">copies</text>
</svg>
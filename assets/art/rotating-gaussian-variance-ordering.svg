<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on rotating kinetic Langevin samplers. A plot of the long-run variance of a linear observable against rotation strength, which equals the oscillator spectrum S(xi) = 2 gamma / (xi^4 + (gamma^2 - 2) xi^2 + 1) at the shifted frequency. Orange curve, friction gamma = 1: starts at 2 and rises to a resonance hump of 2.67 at shift 0.71 before falling, so small rotations raise the variance; the region above the unrotated level is shaded. Blue curve, friction gamma = square root of 2: starts at 2.83 and falls steadily, so every rotation lowers the variance. Side text: no resonance peak means rotation never hurts, for every square-integrable observable exactly when gamma is at least square root of 2, because convolution keeps single peaks single; below the threshold even observables still improve and a large enough rotation helps them all.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.45">
<stop offset="0" stop-color="#8fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

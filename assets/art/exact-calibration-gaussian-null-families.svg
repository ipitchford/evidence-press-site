<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the cost of exact calibration for growing Gaussian null families. Title: Demanding exact calibration on a fine null grid can wipe out the growth of evidence. Subtitle: Gaussian nulls with means across [1 − w, 1 + w] at spacing 1/n; growth rate of the best e-value per observation. Centre, a chart against the half-width w from 0 to 0.5: a blue curve for ordinary e-values (average at most one), (1 − w)²/2, falls gently from 0.5; an orange curve for exact e-values (average exactly one) falls faster and reaches zero at w* = 2 log cosh ½ ≈ 0.240, beyond which a shaded region is labelled: beyond it exact e-values gain nothing; while ordinary e-values still grow at about 0.289 there. Left, the worked example at w = 0.1: n = 6400 observations and 1281 null means from 0.9 to 1.1, alternative mean 0; best ordinary e-value 2592 nats, best exact e-value 1121 to 1128 nats. Why: ordinary e-values face mixtures of the nulls; exact ones face every signed combination, and differences of nearby bell curves build polynomials. Right: exactly one is costly. A fixed finite null list: no long-run cost; the whole continuum of means: no power at all; a grid growing with the data: this explicit phase diagram. A small shortfall from exactness restores the ordinary rate. Gaussian means, known variance.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.55" cy="0.6" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on exact total positivity. Left: the parameter region of Sra's Conjecture 6.1, proved in the paper. For matrix sizes d = 1 to 7 (rows) and alpha = log t / log q on the horizontal axis, a matrix law exists on a continuous blue range alpha at least d - 1, plus isolated yellow points at alpha = 1, ..., d - 2; for d = 1 every alpha &gt; 0 works. Right: for a waiting time with two slow exponential stages (rates 1 and 2) followed by a fast stage of rate 3 or 4 chosen at random, the derivative Wronskians at x = log 2 are W1 = 19/48, W2 = 235/384 and W3 = 29/8, all positive, and W4 = -255/128, negative; so the Polya frequency order is exactly 3 = m + 1, and matrix lifts exist only for d at most 3.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.45">
<stop offset="0" stop-color="#8fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Sra’s Conjecture 6.1: proved, with an exact cutoff</text><text class="og-hide" x="40" y="78" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Slow exponential stages, then one fast stage of random speed: Pólya frequency order and matrix-lift dimension are both exactly m + 1</text><text class="og-hide" x="40" y="108" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">Which matrix sizes d carry the law?</text><text class="og-hide" x="652" y="108" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">t = q^α,  0 &lt; q &lt; 1</text><path d="M92.0 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="92" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><path d="M165.7 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="165.68421052631578" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><path d="M239.4 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="239.36842105263156" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><path d="M313.1 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="313.0526315789474" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">3</text><path d="M386.7 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="386.7368421052631" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><path d="M460.4 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="460.42105263157896" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><path d="M534.1 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="534.1052631578948" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><path d="M607.8 116 V 320" stroke="#e3d9c9" stroke-opacity=".14"/><text class="og-hide" x="607.7894736842105" y="338" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">7</text><text class="og-hide" x="372" y="358" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">α = log t / log q   (larger α = smaller t)</text><text class="og-hide" x="78" y="313" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 1</text><path d="M92.0 308 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="92.0" cy="308" r="5" fill="#1d2633" stroke="#8fd3ff" stroke-width="2.5"/><text class="og-hide" x="78" y="283" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 2</text><path d="M165.7 278 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><text class="og-hide" x="78" y="253" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 3</text><path d="M239.4 248 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="165.7" cy="248" r="5.5" fill="#ffd77a"/><text class="og-hide" x="78" y="223" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 4</text><path d="M313.1 218 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="165.7" cy="218" r="5.5" fill="#ffd77a"/><circle cx="239.4" cy="218" r="5.5" fill="#ffd77a"/><text class="og-hide" x="78" y="193" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 5</text><path d="M386.7 188 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="165.7" cy="188" r="5.5" fill="#ffd77a"/><circle cx="239.4" cy="188" r="5.5" fill="#ffd77a"/><circle cx="313.1" cy="188" r="5.5" fill="#ffd77a"/><text class="og-hide" x="78" y="163" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 6</text><path d="M460.4 158 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="165.7" cy="158" r="5.5" fill="#ffd77a"/><circle cx="239.4" cy="158" r="5.5" fill="#ffd77a"/><circle cx="313.1" cy="158" r="5.5" fill="#ffd77a"/><circle cx="386.7" cy="158" r="5.5" fill="#ffd77a"/><text class="og-hide" x="78" y="133" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">d = 7</text><path d="M534.1 128 H 646.0" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><circle cx="165.7" cy="128" r="5.5" fill="#ffd77a"/><circle cx="239.4" cy="128" r="5.5" fill="#ffd77a"/><circle cx="313.1" cy="128" r="5.5" fill="#ffd77a"/><circle cx="386.7" cy="128" r="5.5" fill="#ffd77a"/><circle cx="460.4" cy="128" r="5.5" fill="#ffd77a"/><path d="M92 380 h 26" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round"/><text class="og-hide" x="128" y="385" fill="#8fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="start">continuous range α ≥ d − 1</text><circle cx="354" cy="380" r="5.5" fill="#ffd77a"/><text class="og-hide" x="366" y="385" fill="#ffd77a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" text-anchor="start">isolated points α = 1, …, d − 2</text><path d="M730 100 L 730 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="760" y="108" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">Why it stops: exactly m + 1</text><text class="og-hide" x="760" y="128" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">m = 2 slow stages (rates 1, 2), then rate 3 or 4 at random</text><rect x="760" y="152" width="46" height="36" rx="6" fill="#9be3c0" fill-opacity=".9"/><text class="og-hide" x="783" y="177" fill="#13202b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">+</text><text class="og-hide" x="822" y="176" fill="#9be3c0" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">W<tspan baseline-shift="sub" font-size="12">1</tspan>(log 2) = 19/48</text><rect x="760" y="196" width="46" height="36" rx="6" fill="#9be3c0" fill-opacity=".9"/><text class="og-hide" x="783" y="221" fill="#13202b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">+</text><text class="og-hide" x="822" y="220" fill="#9be3c0" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">W<tspan baseline-shift="sub" font-size="12">2</tspan>(log 2) = 235/384</text><rect x="760" y="240" width="46" height="36" rx="6" fill="#9be3c0" fill-opacity=".9"/><text class="og-hide" x="783" y="265" fill="#13202b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">+</text><text class="og-hide" x="822" y="264" fill="#9be3c0" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">W<tspan baseline-shift="sub" font-size="12">3</tspan>(log 2) = 29/8</text><rect x="760" y="284" width="46" height="36" rx="6" fill="#ff8f6b" fill-opacity=".9"/><text class="og-hide" x="783" y="309" fill="#13202b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">−</text><text class="og-hide" x="822" y="308" fill="#ff8f6b" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">W<tspan baseline-shift="sub" font-size="12">4</tspan>(log 2) = −255/128</text><text class="og-hide" x="760" y="344" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">order 3 = m + 1, never 4; W₄ &lt; 0 at every x &gt; 0</text><text class="og-hide" x="760" y="364" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">so matrix lifts exist only for d ≤ 3</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Four ordered points at 0,1,2,3: the outer two belong to group A, the inner two to B. Their interval hulls intersect. Deleting either inner B point preserves intersection; deleting either outer A point leaves disjoint hulls. Exactly two deletions preserve intersection. This deterministic one-dimensional example illustrates the deletion identity; it is not a drawing of a sampled Gaussian probability.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f1c777" stop-opacity="0.06"/><stop offset="1" stop-color="#f1c777" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="#faf3e5" font-family="Georgia,serif"><text class="og-hide" x="600" y="42" font-size="28" text-anchor="middle">Four points. Two groups. Intersecting hulls.</text><path d="M375 106 H825" stroke="#fff" stroke-opacity=".18"/><path d="M390 101 H810" stroke="#f1c777" stroke-width="7" stroke-opacity=".65"/><path d="M530 111 H670" stroke="#89dec9" stroke-width="7" stroke-opacity=".65"/><circle cx="390" cy="106" r="15" fill="#f1c777"/><circle cx="530" cy="106" r="15" fill="#89dec9"/><circle cx="670" cy="106" r="15" fill="#89dec9"/><circle cx="810" cy="106" r="15" fill="#f1c777"/><text class="og-hide" x="390" y="83" font-size="21" text-anchor="middle" fill="#f1c777">A</text><text class="og-hide" x="530" y="83" font-size="21" text-anchor="middle" fill="#89dec9">B</text><text class="og-hide" x="670" y="83" font-size="21" text-anchor="middle" fill="#89dec9">B</text><text class="og-hide" x="810" y="83" font-size="21" text-anchor="middle" fill="#f1c777">A</text><path d="M130 157 H1070" stroke="#fff" stroke-opacity=".14"/><text class="og-hide" x="167" y="198" text-anchor="middle" font-size="21">delete point 1</text><path d="M77 246 H257" stroke="#fff" stroke-opacity=".18"/><path d="M142 251 H192" stroke="#89dec9" stroke-width="7" stroke-opacity=".65"/><path d="M82 236 l20 20 m0 -20 l-20 20" stroke="#eee2d6" stroke-opacity=".4" stroke-width="2"/><circle cx="142" cy="246" r="10" fill="#89dec9"/><circle cx="192" cy="246" r="10" fill="#89dec9"/><circle cx="242" cy="246" r="10" fill="#f1c777"/><text class="og-hide" x="167" y="294" text-anchor="middle" font-size="26" fill="#d8bbb5">disjoint</text><text class="og-hide" x="457" y="198" text-anchor="middle" font-size="21">delete point 2</text><path d="M367 246 H547" stroke="#fff" stroke-opacity=".18"/><path d="M382 241 H532" stroke="#f1c777" stroke-width="7" stroke-opacity=".65"/><circle cx="382" cy="246" r="10" fill="#f1c777"/><path d="M422 236 l20 20 m0 -20 l-20 20" stroke="#eee2d6" stroke-opacity=".4" stroke-width="2"/><circle cx="482" cy="246" r="10" fill="#89dec9"/><circle cx="532" cy="246" r="10" fill="#f1c777"/><text class="og-hide" x="457" y="294" text-anchor="middle" font-size="26" fill="#89dec9">still intersects</text><text class="og-hide" x="747" y="198" text-anchor="middle" font-size="21">delete point 3</text><path d="M657 246 H837" stroke="#fff" stroke-opacity=".18"/><path d="M672 241 H822" stroke="#f1c777" stroke-width="7" stroke-opacity=".65"/><circle cx="672" cy="246" r="10" fill="#f1c777"/><circle cx="722" cy="246" r="10" fill="#89dec9"/><path d="M762 236 l20 20 m0 -20 l-20 20" stroke="#eee2d6" stroke-opacity=".4" stroke-width="2"/><circle cx="822" cy="246" r="10" fill="#f1c777"/><text class="og-hide" x="747" y="294" text-anchor="middle" font-size="26" fill="#89dec9">still intersects</text><text class="og-hide" x="1037" y="198" text-anchor="middle" font-size="21">delete point 4</text><path d="M947 246 H1127" stroke="#fff" stroke-opacity=".18"/><path d="M1012 251 H1062" stroke="#89dec9" stroke-width="7" stroke-opacity=".65"/><circle cx="962" cy="246" r="10" fill="#f1c777"/><circle cx="1012" cy="246" r="10" fill="#89dec9"/><circle cx="1062" cy="246" r="10" fill="#89dec9"/><path d="M1102 236 l20 20 m0 -20 l-20 20" stroke="#eee2d6" stroke-opacity=".4" stroke-width="2"/><text class="og-hide" x="1037" y="294" text-anchor="middle" font-size="26" fill="#d8bbb5">disjoint</text><text class="og-hide" x="600" y="365" text-anchor="middle" font-size="32">Exactly two deletions preserve intersection</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">A four-leaf four-state network with one reticulation, shown as a diamond with two incoming gold edges, is compared with a mixture of two trees sharing the same topology. Every two-versus-two network flattening has rank at least ten. The tree mixture has rank at most eight on its shared split, so their exact genetic-pattern distributions cannot be equal. Positive invertible channels and interior inheritance are assumed.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9dfed" stop-opacity="0.06"/><stop offset="1" stop-color="#a9dfed" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="245" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#a9dfed">ONE FOUR-STATE NETWORK</text><text class="og-hide" x="950" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#f4c77b">TWO TREE CLASSES</text><text class="og-hide" x="950" y="69" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff4e9">same topology</text><g fill="none" stroke="#a9dfed" stroke-width="4.5" stroke-linecap="round"><path d="M245 112 L340 190 M245 112 L150 190 M245 112 V84 M340 190 H389 M150 190 H101 M245 267 V305"/></g><g fill="none" stroke="#f4c77b" stroke-width="6" stroke-linecap="round"><path d="M340 190 L245 267 L150 190"/></g><circle cx="245" cy="112" r="7" fill="#a9dfed" stroke="#fff4e9" stroke-width="1.5"/><circle cx="340" cy="190" r="7" fill="#a9dfed" stroke="#fff4e9" stroke-width="1.5"/><circle cx="150" cy="190" r="7" fill="#a9dfed" stroke="#fff4e9" stroke-width="1.5"/><path d="M245 255 L257 267 L245 279 L233 267 Z" fill="#f4c77b" stroke="#fff4e9" stroke-width="2"/><circle cx="245" cy="84" r="6" fill="#fff4e9"/><circle cx="389" cy="190" r="6" fill="#fff4e9"/><circle cx="101" cy="190" r="6" fill="#fff4e9"/><circle cx="245" cy="305" r="6" fill="#fff4e9"/><text class="og-hide" x="245" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff4e9">A</text><text class="og-hide" x="413" y="198" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff4e9">B</text><text class="og-hide" x="77" y="198" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff4e9">C</text><text class="og-hide" x="267" y="312" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff4e9">D</text><path d="M297 223 l-13 3 l5 -12 M193 223 l13 3 l-5 -12" fill="none" stroke="#f4c77b" stroke-width="3" stroke-linecap="round"/><text class="og-hide" x="590" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="83" fill="#fff4e9">≠</text><text class="og-hide" x="590" y="235" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#fff4e9">exact genetic law</text><g fill="none" stroke="#f4c77b" stroke-width="4.5" stroke-linecap="round"><path d="M757 121 L802 186 L757 251 M802 186 H850 M895 121 L850 186 L895 251"/></g><circle cx="757" cy="121" r="6" fill="#f4c77b"/><text class="og-hide" x="757" y="107" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">A</text><circle cx="757" cy="251" r="6" fill="#f4c77b"/><text class="og-hide" x="757" y="279" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">B</text><circle cx="895" cy="121" r="6" fill="#f4c77b"/><text class="og-hide" x="895" y="107" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">C</text><circle cx="895" cy="251" r="6" fill="#f4c77b"/><text class="og-hide" x="895" y="279" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">D</text><circle cx="802" cy="186" r="6" fill="#fff4e9"/><circle cx="850" cy="186" r="6" fill="#fff4e9"/><g fill="none" stroke="#f4c77b" stroke-width="4.5" stroke-linecap="round"><path d="M1005 121 L1050 186 L1005 251 M1050 186 H1098 M1143 121 L1098 186 L1143 251"/></g><circle cx="1005" cy="121" r="6" fill="#f4c77b"/><text class="og-hide" x="1005" y="107" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">A</text><circle cx="1005" cy="251" r="6" fill="#f4c77b"/><text class="og-hide" x="1005" y="279" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">B</text><circle cx="1143" cy="121" r="6" fill="#f4c77b"/><text class="og-hide" x="1143" y="107" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">C</text><circle cx="1143" cy="251" r="6" fill="#f4c77b"/><text class="og-hide" x="1143" y="279" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">D</text><circle cx="1050" cy="186" r="6" fill="#fff4e9"/><circle cx="1098" cy="186" r="6" fill="#fff4e9"/><text class="og-hide" x="950" y="199" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#f4c77b">+</text><text class="og-hide" x="245" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#a9dfed">rank ≥ 10</text><text class="og-hide" x="245" y="389" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">every two-versus-two split</text><text class="og-hide" x="950" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#f4c77b">rank ≤ 8</text><text class="og-hide" x="950" y="389" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff4e9">the shared internal split</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for the sharp shape-parameter law of windowed Shannon sampling. Left: a plot of the error decay rate per sample, minus log E divided by m, against the shape parameter per sample, beta over m, at twofold oversampling (delta = pi/2). The rate rises in a straight line while beta is below dm (under-tuned), reaches its peak d = pi minus delta at the sharp corner beta = dm, and then drops with a vertical tangent, like a square root, when beta is above dm (over-tuned). A dashed horizontal line higher up marks 2 log cot(delta/4), about 1.76, the root-limsup rate of the best pointwise linear recovery from the same samples, which neither window reaches. Right: certified error ratios at twofold oversampling for 8 to 32 samples per side: one unit too high multiplies the error by 10 to 670 for the sinh window and 3 to 220 for the Kaiser–Bessel window; one unit too low multiplies it by only 2.1 to 3.1; so if unsure, err low. Based on Theorems 2.1 and 2.9 and Table 9 of the paper; polynomial factors are omitted from the left plot.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffd36e" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd36e" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

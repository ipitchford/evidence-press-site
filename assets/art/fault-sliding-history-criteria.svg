<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on when an injection-driven slow-slip crack on a fault first stops sliding forward everywhere. Left: the circular slipping patch seen from above, with the injection well at its centre; parallel green arrows show the forward slip rate at grid points, longest at about a quarter of the radius and shrinking towards the edge, and absent at the centre, which is marked in orange as the point that stops first. Right: the computed slip rate across the crack against distance from the injection point as a fraction of the crack radius, at the first moment full sliding is lost, for a Gaussian source with stress-injection parameter 0.1 after the rate is tapered linearly to 40 per cent: the curve is zero at the centre and positive everywhere else. Values are the paper's computed points (Section 9.2); lines and arrow lengths interpolate between them. The paper proves that in this model the centre always stops first under the stated conditions.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.6" r="0.4">
<stop offset="0" stop-color="#8fe3c4" stop-opacity="0.06"/><stop offset="1" stop-color="#8fe3c4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">The injection point decides when a fault stops sliding forward</text><text class="og-hide" x="40" y="82" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">While the centre keeps slipping forward, so does the whole expanding crack; when sliding is first lost, it is lost at the centre</text><circle cx="250" cy="245" r="118" fill="#8fe3c4" fill-opacity=".07" stroke="#8fe3c4" stroke-opacity=".75" stroke-width="2"/><defs><marker id="fsh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fe3c4"/></marker></defs><path d="M216.7 155.0 h6.6" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M246.1 155.0 h7.7" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M276.7 155.0 h6.6" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M185.4 185.0 h9.2" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M212.7 185.0 h14.7" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M241.6 185.0 h16.8" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M272.7 185.0 h14.7" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M305.4 185.0 h9.2" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M156.7 215.0 h6.6" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M182.7 215.0 h14.7" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M210.1 215.0 h19.9" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><path d="M239.0 215.0 h21.9" stroke="#8fe3c4" stroke-width="2.2" marker-end="url(#fsh)" opacity=".9"/><p
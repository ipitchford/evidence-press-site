<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on a sharp stop-loss bound for Rademacher sums, random sums of fair coins with weights whose squares add to one. Left: two equal coins of weight 1/√2; the absolute sum is 0 or √2, each with probability one half, and the part beyond 1, of length √2 − 1, is the overshoot, so the average overshoot is (√2 − 1)/2. Middle: exact curves of the average overshoot E(|S| − t)₊ against the threshold t from 0.5 to 1.5 for two equal coins (solid, highest), three equal coins and the Gaussian limit (dashed); the band 1/√2 ≤ t ≤ 1.005 where the sharp bound is proved is shaded, and t = 1 is marked. Right: the values at one standard deviation, 0.207 for two equal coins, 0.183 for three and 0.167 for the Gaussian; the sharp value (√2 − 1)/2 gives the comparison constant 2. Footer: exact curves; the bound is proved for thresholds from 1/√2 to 1.005.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="48" y="50" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" text-anchor="start">Two equal coins overshoot the most</text><text class="og-hide" x="48" y="76" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">weighted fair coins with spread one: how much of the sum sticks out beyond the threshold, on average?</text><circle cx="110" cy="150" r="30" fill="#f6c177"/><text class="og-hide" x="110" y="147" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1/√2</text><text class="og-hide" x="110" y="165" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">± each</text><circle cx="200" cy="150" r="30" fill="#f6c177"/><text class="og-hide" x="200" y="147" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1/√2</text><text class="og-hide" x="200" y="165" fill="#14181c" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">± each</text><path d="M70 300H280" stroke="#d9d2c4" stroke-width="1.4"/><path d="M70.0 300v7" stroke="#d9d2c4"/><text class="og-hide" x="70.0" y="324" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">0</text><path d="M201.3 300v7" stroke="#d9d2c4"/><text class="og-hide" x="201.3" y="324" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1</text><path d="M255.6 300v7" stroke="#d9d2c4"/><text class="og-hide" x="255.6" y="324" fill="#bdb5a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">√2</text><rect x="61.0" y="250" width="18" height="50" rx="3" fill="#8fd3c8" opacity=".8"/><rect x="246.6" y="250" width="18" height="50" rx="3" fill="#f6c1
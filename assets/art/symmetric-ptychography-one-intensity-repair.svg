<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on phase retrieval in ptychography with symmetric probes. Left: an 8 by 8 grid of the probe multipliers p_r(q) for a real Gaussian probe; the entries forced to zero, shown in orange, form a cross along row r = 4 and column q = 4 at odd positions, all other entries are nonzero and shaded by size. Middle: an object x supported on two opposite pixels, 1 and 5, and its twin with the phases conjugated; drawn as two short phase arrows mirrored about the horizontal axis; all 64 recorded intensities are identical for the two. Right: one extra coherent intensity |g*x|^2 with a twisted geometric beam gives 0.413 for x and 0.083 for the twin, so it tells every twin pair apart, making recovery unique even among mixed states; a defocus chirp fails when 4 divides n.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.22" cy="0.6" r="0.4">
<stop offset="0" stop-color="#8fd3ff" stop-opacity="0.06"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Symmetric probes: two lines of zeros, only twin images</text><text class="og-hide" x="40" y="78" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Real-even probe in finite cyclic ptychography, known probe, all positions and frequencies; one extra intensity makes recovery unique</text><text class="og-hide" x="60" y="112" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">Probe multipliers p_r(q), Gaussian probe, n = 8</text><rect x="71.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.900"/><rect x="98.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.887"/><rect x="125.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.849"/><rect x="152.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.797"/><rect x="179.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.768"/><rect x="206.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.797"/><rect x="233.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.849"/><rect x="260.5" y="133.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.887"/><rect x="71.5" y="160.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.858"/><rect x="98.5" y="160.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.844"/><rect x="125.5" y="160.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.800"/><rect x="152.5" y="160.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.714"/><rect x="179.5" y="160.5" width="24" height="24" rx="3" fill="#ff8f6b"/><rect x="206.5" y="160.5" width="24" height="24" rx="3" fill="#8fd3ff" fill-opacity="0.714"/><rect x="233.5" y="160.5" width="24" height="24" rx=
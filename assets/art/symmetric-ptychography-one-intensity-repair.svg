city="0.12"/><rect x="704" y="186" width="20" height="20" rx="4" fill="#e3d9c9" fill-opacity="0.12"/><text class="og-hide" x="558" y="226" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">pixel 1</text><text class="og-hide" x="662" y="226" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" text-anchor="middle">pixel 5</text><circle cx="540" cy="290" r="36" fill="none" stroke="#e3d9c9" stroke-opacity=".25"/><path d="M540 290 L553.6 266.4" stroke="#ffd77a" stroke-width="3" stroke-linecap="round"/><circle cx="553.6" cy="266.4" r="4" fill="#ffd77a"/><text class="og-hide" x="540" y="344" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">x at pixel 5</text><circle cx="660" cy="290" r="36" fill="none" stroke="#e3d9c9" stroke-opacity=".25"/><path d="M660 290 L673.6 313.6" stroke="#c9a6ff" stroke-width="3" stroke-linecap="round"/><circle cx="673.6" cy="313.6" r="4" fill="#c9a6ff"/><text class="og-hide" x="660" y="344" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">twin at pixel 5</text><text class="og-hide" x="470" y="372" fill="#ff8f6b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">all 64 recorded intensities: identical</text><path d="M805 100 L 805 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="830" y="112" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">One extra exposure</text><text class="og-hide" x="830" y="132" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">structured beam g, read at one pixel</text><text class="og-hide" x="830" y="182" fill="#f4f1ea" font-family="Georgia,serif" font-size="30" font-weight="normal" text-anchor="start">|g*x
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Three copies of the accounting simplex t0+t1+t2=1, with nonnegative coordinates. The target loss is b+t0 and the allowed reports are t1 and t2. At t1=0 the highlighted edge allows t0 to range from zero to one. At t2=0 another edge allows the same range. With both reports zero only the t0 vertex remains. Thus either report alone has worst-case residual width one, while both identify the loss. Other report values can already narrow the loss range. This is the exact synthetic one-layer construction, not banking data; a direct t0 report would identify the loss alone.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#b3dcd7" stop-opacity="0.06"/><stop offset="1" stop-color="#b3dcd7" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif">
    <path d="M220 104L95 290L345 290Z" fill="#b3dcd7" fill-opacity=".07" stroke="#b3dcd7" stroke-opacity=".36" stroke-width="1.8"/><path d="M188.75 150.5L251.25 150.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M157.5 197L282.5 197" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M126.25 243.5L313.75 243.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M220 104L345 290" fill="none" stroke="#f2c37d" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="220" cy="104" r="6" fill="#f2c37d" fill-opacity="1"/><circle cx="95" cy="290" r="3.6" fill="#b3dcd7" fill-opacity="0.55"/><circle cx="345" cy="290" r="6" fill="#f2c37d" fill-opacity="1"/><g class="og-hide" fill="#e2ebe5" font-size="24"><text x="220" y="80" text-anchor="middle">t₀</text><text x="75" y="311" text-anchor="middle">t₁</text><text x="365" y="311" text-anchor="middle">t₂</text></g><path d="M600 104L475 290L725 290Z" fill="#b3dcd7" fill-opacity=".07" stroke="#b3dcd7" stroke-opacity=".36" stroke-width="1.8"/><path d="M568.75 150.5L631.25 150.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M537.5 197L662.5 197" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M506.25 243.5L693.75 243.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M600 104L475 290" fill="none" stroke="#f2c37d" stroke-width="6" opacity="1" stroke-linecap="round"/><circle cx="600" cy="104" r="6" fill="#f2c37d" fill-opacity="1"/><circle cx="475" cy="290" r="6" fill="#f2c37d" fill-opacity="1"/><circle cx="725" cy="290" r="3.6" fill="#b3dcd7" fill-opacity="0.55"/><g class="og-hide" fill="#e2ebe5" font-size="24"><text x="600" y="80" text-anchor="middle">t₀</text><text x="455" y="311" text-anchor="middle">t₁</text><text x="745" y="311" text-anchor="middle">t₂</text></g><path d="M980 104L855 290L1105 290Z" fill="#b3dcd7" fill-opacity=".07" stroke="#b3dcd7" stroke-opacity=".36" stroke-width="1.8"/><path d="M948.75 150.5L1011.25 150.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M917.5 197L1042.5 197" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><path d="M886.25 243.5L1073.75 243.5" fill="none" stroke="#b3dcd7" stroke-width="0.8" opacity="0.14" stroke-linecap="round"/><circle cx="980" cy="104" r="6" fill="#f2c37d" fill-opacity="1"/><circle cx="855" cy="290" r="3.6" fill="#b3dcd7" fill-opacity="0.55"/><circle cx="1105" cy="290" r="3.6" fill="#b3dcd7" fill-opacity="0.55"/><circle cx="980" cy="104" r="15" fill="none" stroke="#f2c37d" stroke-opacity=".6" stroke-width="1.5"/><g class="og-hide" fill="#e2ebe5" font-size="24"><text x="980" y="80" text-anchor="middle">t₀</text><text x="835" y="311" text-anchor="middle">t₁</text><text x="1125" y="311" text-anchor="middle">t₂</text></g>
    <g class="og-hide" fill="#fff4e4" text-anchor="middle" font-size="31" font-family="Georgia,serif">
      <text x="220" y="39">t₁ = 0</text><text x="600" y="39">t₂ = 0</text><text x="980" y="39">t₁ = t₂ = 0</text>
    </g>
    <g class="og-hide" fill="#f2c37d" text-anchor="middle" font-size="37" font-family="Georgia,serif">
      <text x="220" y="356">width 1</text><text x="600" y="356">width 1</text><text x="980" y="356">width 0</text>
    </g>
    <text class="og-hide" x="600" y="389" text-anchor="middle" font-size="20" fill="#d2dfd9">t₀ + t₁ + t₂ = 1 · loss = b + t₀ · allowed reports: t₁, t₂</text>
  </g>
</svg>
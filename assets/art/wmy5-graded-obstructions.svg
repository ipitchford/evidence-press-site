<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
  <desc id="art-description">The still-open five-dimensional weak Markus–Yamabe target branches to two exact graded compression families, both blocked by certificates. A separate panel shows fifteen Hessian coefficient directions spanning the full space of symmetric five-by-five matrices, blocking affine constant-trace normalisation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#301720"/><stop offset="0.56" stop-color="#61313d"/><stop offset="1" stop-color="#1c1718"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#f0b35f" stop-opacity="0.16"/><stop offset="1" stop-color="#f0b35f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#warm)"/>

middle">Why some loss is forced: the Δ = 3 example (Figure 1)</text><text class="og-hide" x="895" y="144" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle"><tspan fill="#c9a7ff">24 constrained edges, quota 8</tspan>   ·   <tspan fill="#f0b54a">2 bridges</tspan>   ·   <tspan fill="#93a3b0">missing edge</tspan></text><text class="og-hide" x="895" y="350" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" font-style="normal" text-anchor="middle">Every perfect matching avoids both bridges, so it uses 9 constrained edges:</text><text class="og-hide" x="895" y="372" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" font-style="normal" text-anchor="middle">one over the quota. The best allowed matching has 8 edges, against 26/3: loss 2/3 &gt; 1/2.</text><text class="og-hide" x="40" y="392" fill="#b9c8d4" font-family="Georgia,serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start">Diagram drawn from the paper (Theorem 1, Section 7.1, Figure 1); not data.</text>

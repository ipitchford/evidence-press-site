<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on bipartite matching with strict budgets. Title: Strict budgets: rounding loses at most 7m/3 top pairings. On the left, a list of the value lost when a fractional plan is rounded without breaking any of m budgets, in units of W, the most valuable single pairing: previous general bound (2014), order m squared; the earlier release's method, about 9m; this release (Theorem 1), at most 7m/3; one budget, 1 (was 2); always unavoidable (knapsack), about m. On the right, the example with maximum degree 3 from Figure 1: three blocks of three top and three bottom dots, each joined by purple constrained edges except one missing edge shown dashed, and two thick ochre bridges joining consecutive blocks. Labels: 24 constrained edges, quota 8; 2 bridges. Caption: every perfect matching avoids both bridges, so it uses 9 constrained edges, one over the quota; the best allowed matching has 8 edges against 26/3, a loss of 2/3, more than 1/2.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.55" r="0.45">
<stop offset="0" stop-color="#7fe0c8" stop-opacity="0.06"/><stop offset="1" stop-color="#7fe0c8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" font-style="normal" text-anchor="start">Strict budgets: rounding loses at most 7m/3 top pairings</text><text class="og-hide" x="40" y="78" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Bipartite matching with m hard budgets: loss ≤ (14m−5)/6 · W ≤ (7m/3) · W, down from order m² · W</text><text class="og-hide" x="40" y="128" fill="#b9c8d4" font-family="Georgia,serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="start">Value lost when rounding a fractional plan without breaking any of m budgets,</text><text class="og-hide" x="40" y="148" fill="#b9c8d4" font-family="Georgia,serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="start">in units of W, the most valuable single pairing:</text><text class="og-hide" x="40" y="190" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start">previous general bound (2014)</text><text class="og-hide" x="470" y="190" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">order m²</text><path d="M40 202 H470" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="228" fill="#dfe6ec" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start">earlier release's method</text><text class="og-hide" x="470" y="228" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">about 9m</text><path d="M40 240 H470" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="266" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">this release (Theorem 1)</text><text class="og-hide" x="470" y="266" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">≤ 7m/3</text><path d="M40 278 H470" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="304" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">one budget</text><text class="og-hide" x="470" y="304" fill="#7fe0c8" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">1 (was 2)</text><path d="M40 316 H470" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><text class="og-hide" x="40" y="342" fill="#f0b54a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" font-style="normal" text-anchor="start">always unavoidable (knapsack)</text><text class="og-hide" x="470" y="342" fill="#f0b54a" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" font-style="normal" text-anchor="end">about m</text><path d="M40 354 H470" stroke="#b9c8d4" stroke-opacity="0.25" stroke-width="1"/><path d="M640 170 L744 282" stroke="#93a3b0" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M830 170 L934 282" stroke="#93a3b0" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M1020 170 L1124 282" stroke="#93a3b0" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M640 170 L692 282" stroke="#c9a7ff" stroke-width="1.8" stroke-opacity="0.9"/><path d="M640 170 L640 282" stroke="#c9a7ff" stroke-width="1.8" stroke-opacity="0.9"/><path d="M692 170 L744 282" stroke="#c9a7ff" stroke-width="1.8" stroke-opacity="0.9"/><path d="M692 170 L692 282" stroke="#c9a7ff" stroke-width="1.8" stroke-opacity="0.9"/><path d="M692 170 L640 282" stroke="#c9a7ff" stroke-width="1.8" stroke-opacity="0.9"/><path d="M744 170 L744 282" stroke="#c9a7ff" stroke-width="1.8" stro
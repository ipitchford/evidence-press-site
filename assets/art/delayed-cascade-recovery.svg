<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">A schematic infection-time line begins with sparse background infections, passes through a compressed burst containing many members of a latent dense planted set, and returns to sparse background activity. A bracket below the burst identifies the observed widest rapid window selected from infection times. A theorem annotation states that for planted size s equals n to the alpha, every fixed alpha strictly between one third and one half is below square-root size and has relative recovery error tending to zero under the paper's known-background assumptions. The image is explicitly labelled as a schematic rather than pilot data; the finite pilot recovered none of its twelve planted instances.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a8ddf0" stop-opacity="0.06"/><stop offset="1" stop-color="#a8ddf0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

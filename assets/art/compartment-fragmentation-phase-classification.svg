<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">A phase diagram separates conservative and explosive compartment regimes, with the critical random-retention coefficient alpha at most kappa times the expected negative logarithm of Q.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#78e0b5" stop-opacity="0.06"/><stop offset="1" stop-color="#78e0b5" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="55" y="48" fill="#fff8ef" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="start">production versus fragmentation</text><path d="M85 325 H545 M85 325 V75" stroke="#d7dde3" stroke-width="2" opacity=".55"/><path d="M115 285 L500 95" stroke="#ffb566" stroke-width="5"/><path d="M115 285 L115 95 L500 95 Z" fill="#78e0b5" opacity=".08"/><path d="M115 285 L500 95 L500 285 Z" fill="#ffb566" opacity=".07"/><text class="og-hide" x="250" y="135" fill="#78e0b5" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="middle">conservative</text><text class="og-hide" x="385" y="275" fill="#ffb566" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="middle">explosive</text><text class="og-hide" x="300" y="350" fill="#d7dde3" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle">growth exponent m − 1</text><text class="og-hide" x="62" y="68" fill="#d7dde3" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start">fragmentation exponent γ</text><text class="og-hide" x="320" y="205" fill="#ffb566" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">γ = m − 1</text><path d="M610 76 V334" stroke="#d7dde3" opacity=".18"/><text class="og-hide" x="900" y="88" fill="#fff8ef" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle">critical coefficient</text><text class="og-hide" x="900" y="158" fill="#78e0b5" font-family="Arial,Helvetica,sans-serif" font-size="43" text-anchor="middle">α  ≤  κ E[−log Q]</text><path d="M720 192 H1080" stroke="#78e0b5" stroke-width="2" opacity=".6"/><text class="og-hide" x="900" y="242" fill="#78e0b5" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle">conservative at equality</text><text class="og-hide" x="900" y="294" fill="#ffb566" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle">equal means can give different phases</text><text class="og-hide" x="900" y="348" fill="#d7dde3" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="middle">full descendant population controlled</text>
</svg>
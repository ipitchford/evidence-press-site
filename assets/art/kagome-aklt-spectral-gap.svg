<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Three nine-site blocks meet around one triangle, forming a 21-site local union. The candidate combines two blocks before comparing with the third, and 54 validated local positivity tests feed a size-independent gap above 0.0051 for the stated volumes. Abstract local graph, not a full lattice or a measured spectrum.</desc><defs>

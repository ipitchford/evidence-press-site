<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">Every allowed pattern occurs</title><desc id="desc">Exact witness with mode energies 1, 2 and 4. Positive parity gives energies minus five, minus three, one and seven. Negative parity gives minus seven, minus one, three and five. With irreducible dimension eight each allowed value occurs twice.</desc><rect width="900" height="740" rx="12" fill="#17282e"/><text class="og-hide" x="450" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" fill="#eff4ed">Support is not enough. Occupation matters.</text><text class="og-hide" x="450" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#b9ced0">Exact independent-set witness: modes 1, 2, 4</text><text class="og-hide" x="450" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#6ddbc4">Positive parity: product of signs = +1</text><path d="M90 255 H810" stroke="#b9ced0" stroke-width="2"/><path d="M100 250 V260" stroke="#b9ced0"/><text class="og-hide" x="100" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−7</text><path d="M200 250 V260" stroke="#b9ced0"/><text class="og-hide" x="200" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−5</text><path d="M300 250 V260" stroke="#b9ced0"/><text class="og-hide" x="300" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−3</text><path d="M400 250 V260" stroke="#b9ced0"/><text class="og-hide" x="400" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−1</text><path d="M500 250 V260" stroke="#b9ced0"/><text class="og-hide" x="500" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">1</text><path d="M600 250 V260" stroke="#b9ced0"/><text class="og-hide" x="600" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">3</text><path d="M700 250 V260" stroke="#b9ced0"/><text class="og-hide" x="700" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">5</text><path d="M800 250 V260" stroke="#b9ced0"/><text class="og-hide" x="800" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">7</text><circle cx="200" cy="243" r="9" fill="#6ddbc4"/><circle cx="200" cy="267" r="9" fill="#6ddbc4"/><circle cx="300" cy="243" r="9" fill="#6ddbc4"/><circle cx="300" cy="267" r="9" fill="#6ddbc4"/><circle cx="500" cy="243" r="9" fill="#6ddbc4"/><circle cx="500" cy="267" r="9" fill="#6ddbc4"/><circle cx="800" cy="243" r="9" fill="#6ddbc4"/><circle cx="800" cy="267" r="9" fill="#6ddbc4"/><text class="og-hide" x="450" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#f0c274">Negative parity: product of signs = −1</text><path d="M90 465 H810" stroke="#b9ced0" stroke-width="2"/><path d="M100 460 V470" stroke="#b9ced0"/><text class="og-hide" x="100" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−7</text><path d="M200 460 V470" stroke="#b9ced0"/><text class="og-hide" x="200" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−5</text><path d="M300 460 V470" stroke="#b9ced0"/><text class="og-hide" x="300" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−3</text><path d="M400 460 V470" stroke="#b9ced0"/><text class="og-hide" x="400" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">−1</text><path d="M500 460 V470" stroke="#b9ced0"/><text class="og-hide" x="500" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">1</text><path d="M600 460 V470" stroke="#b9ced0"/><text class="og-hide" x="600" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">3</text><path d="M700 460 V470" stroke="#b9ced0"/><text class="og-hide" x="700" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">5</text><path d="M800 460 V470" stroke="#b9ced0"/><text class="og-hide" x="800" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">7</text><circle cx="100" cy="453" r="9" fill="#f0c274"/><circle cx="100" cy="477" r="9" fill="#f0c274"/><circle cx="400" cy="453" r="9" fill="#f0c274"/><circle cx="400" cy="477" r="9" fill="#f0c274"/><circle cx="600" cy="453" r="9" fill="#f0c274"/><circle cx="600" cy="477" r="9" fill="#f0c274"/><circle cx="700" cy="453" r="9" fill="#f0c274"/><circle cx="700" cy="477" r="9" fill="#f0c274"/><text class="og-hide" x="450" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#6ddbc4">Trace projectors prove all four patterns occur.</text><text class="og-hide" x="450" y="637" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#eff4ed">Two copies each when d = 8; in general, d/4.</text><text class="og-hide" x="450" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#b9ced0">The proposition states the graph and centrality assumptions.</text></svg>
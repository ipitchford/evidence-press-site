<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper resolving Conjecture 2 of Ganesh, Hauert and Valla on the noisy weighted voter model. Left: the mean update rate of the resident (worse-option) agents over time when resident rates are 2 or 6 with probability one half. From a fresh start the rate is exactly 3 + e^(−4t), starting at 4 and decaying to 3; in equilibrium it is constant at the harmonic mean lambda = 3. The shaded early excess arises because an equilibrium snapshot over-represents slow residents (the inspection paradox). Right: for favourable rates 1/2 or 1 in the same example, the large-population probability that a single better-option agent takes over, under four starting conditions, on an axis from 0.75 to 0.81. Equilibrium founders with fresh residents: 0.8030. Fresh founders with fresh residents, the start Conjecture 2 states: 0.7842. All agents in equilibrium, as in the source simulations: 7/9 = 0.7778, exact. Fresh founders with equilibrium residents: (3 + square root of 37)/12 = 0.7569, which equals the conjectured value. A dashed line marks the conjectured value; the conjecture is exact only for that last start. The fresh/fresh and mixed values are numerical; their ordering is proved.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#ffcf7a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

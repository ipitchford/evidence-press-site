<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Left panel: the exact squared map error as a function of one uncertain slope b in the adverse family, zero for b at most 0.9, rising to its maximum 1/400 at b = 19/20 and falling back to zero at b = 1; a dashed line far above marks the possible-winner envelope 4, which is 1600 times too large. Right panel: three rows show the coefficient box bisected into 8, 64 and 256 sub-boxes, with the certified upper bound falling from 1/16 to within 2.7 per cent and then 0.12 per cent of the true maximum, while the lower bound is attained by an explicit slope.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2c46f" stop-opacity="0.06"/><stop offset="1" stop-color="#f2c46f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

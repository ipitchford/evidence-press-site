<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Two strict regimes for candidate O(n log n) mixing of the original global nonlazy Kawasaki chain: below beta_u all magnetisations; above beta_u only eta below minus eta_a or above eta_a. Threshold positions are schematic. The central low-temperature interval and beta equal to beta_u are not claimed. Endpoint magnetisations are singleton chains.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f2cb78" stop-opacity="0.06"/><stop offset="1" stop-color="#f2cb78" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
 <text class="og-hide" x="48" y="43" fill="#f2cb78" font-size="15" letter-spacing="1.8">GLOBAL KAWASAKI · FIXED PARTICLE COUNT</text>
 <text class="og-hide" x="48" y="89" fill="#fff5df" font-family="Georgia,serif" font-size="31">Two strict routes to fast mixing</text>
 <path d="M792 113V330" stroke="#d6c7b3" opacity=".25"/>
 <text class="og-hide" x="48" y="157" fill="#f2cb78" font-size="26">β &lt; β<tspan baseline-shift="sub" font-size="16">u</tspan></text>
 <text class="og-hide" x="48" y="182" fill="#d6c7b3" font-size="14">below the threshold</text>
 <path d="M254 154H738" stroke="#f2cb78" stroke-width="10" stroke-linecap="round"/>
 <text class="og-hide" x="496" y="130" text-anchor="middle" fill="#fff5df" font-size="18">all magnetisations</text>
 <text class="og-hide" x="48" y="250" fill="#ef9a87" font-size="26">β &gt; β<tspan baseline-shift="sub" font-size="16">u</tspan></text>
 <text class="og-hide" x="48" y="275" fill="#d6c7b3" font-size="14">above the threshold</text>
 <path d="M254 247H738" stroke="#d6c7b3" stroke-width="2" opacity=".35"/>
 <path d="M254 247H375 M617 247H738" stroke="#ef9a87" stroke-width="10" stroke-linecap="round"/>
 <circle cx="375" cy="247" r="8" fill="#3e2f20" stroke="#ef9a87" stroke-width="3"/>
 <circle cx="617" cy="247" r="8" fill="#3e2f20" stroke="#ef9a87" stroke-width="3"/>
 <text class="og-hide" x="496" y="232" text-anchor="middle" fill="#d6c7b3" font-size="16">not claimed here</text>
 <g fill="#fff5df" font-size="19" text-anchor="middle">
 <text class="og-hide" x="254" y="292">−1</text><text class="og-hide" x="375" y="292">−η<tspan baseline-shift="sub" font-size="13">a</tspan></text>
 <text class="og-hide" x="496" y="292">0</text><text class="og-hide" x="617" y="292">η<tspan baseline-shift="sub" font-size="13">a</tspan></text><text class="og-hide" x="738" y="292">1</text>
 </g><text class="og-hide" x="496" y="323" fill="#d6c7b3" text-anchor="middle" font-size="15">magnetisation η · threshold positions schematic</text>
 <text class="og-hide" x="987" y="155" text-anchor="middle" fill="#fff5df" font-family="Georgia,serif" font-size="47">O(n log n)</text>
 <text class="og-hide" x="987" y="191" text-anchor="middle" fill="#f2cb78" font-size="20">worst-start mixing</text>
 <text class="og-hide" x="987" y="230" text-anchor="middle" fill="#fff5df" font-size="18">global · nonlazy</text>
 <text class="og-hide" x="987" y="265" text-anchor="middle" fill="#d6c7b3" font-size="17">fixed parameters · large n</text>
 <text class="og-hide" x="987" y="299" text-anchor="middle" fill="#ef9a87" font-size="17">β = β<tspan baseline-shift="sub" font-size="12">u</tspan> excluded</text>
 <path d="M48 348H1152" stroke="#d6c7b3" opacity=".2"/>
 <text class="og-hide" x="48" y="377" fill="#d6c7b3" font-size="14">β<tspan baseline-shift="sub" font-size="11">u</tspan> = log[Δ/(Δ−2)] · η<tspan baseline-shift="sub" font-size="11">a</tspan> is the source-defined analytic threshold</text>
 <text class="og-hide" x="1152" y="377" text-anchor="end" fill="#f2cb78" font-size="12" letter-spacing="1">UNREFEREED CANDIDATE</text>
 </g>
</svg>
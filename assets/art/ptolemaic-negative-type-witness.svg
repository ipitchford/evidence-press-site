<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="witness-title witness-desc"><title id="witness-title">A seven-point sharpness witness</title><desc id="witness-desc">Seven-point complete split graph CS(3,4), shown as a shortest-path distance diagram, not a Euclidean embedding. Every drawn edge has length one; the four gold vertices are pairwise distance two. With coefficients plus one third on the three teal vertices and minus one quarter on the four gold vertices, the quadratic form Q(p) = 2/3 + (3/4) 2^p - 2 crosses zero at p = log base 2 of 16/9, approximately 0.830075. This witness supplies the sharpness obstruction, not the universal proof.</desc><rect width="900" height="1120" fill="#14282d"/><g font-family="Arial, Helvetica, sans-serif"><text class="og-hide" x="450" y="62" font-size="44" fill="#f4f5ed" text-anchor="middle">A seven-point sharpness witness</text><text class="og-hide" x="450" y="108" font-size="31" fill="#b6c8c8" text-anchor="middle">CS(3,4): every drawn edge has length 1</text><g transform="translate(76 106) scale(1.5 1.04)"><g fill="none" stroke-linecap="round"><path data-edge="clique-0-1" d="M110,175 L250,65" stroke="#69dbc6" stroke-width="3.8"/><path data-edge="clique-0-2" d="M110,175 L390,175" stroke="#69dbc6" stroke-width="3.8"/><path data-edge="clique-1-2" d="M250,65 L390,175" stroke="#69dbc6" stroke-width="3.8"/><path data-edge="cross-0-0" d="M110,175 L64,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-0-1" d="M110,175 L188,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-0-2" d="M110,175 L312,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-0-3" d="M110,175 L436,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-1-0" d="M250,65 L64,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-1-1" d="M250,65 L188,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-1-2" d="M250,65 L312,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-1-3" d="M250,65 L436,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-2-0" d="M390,175 L64,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-2-1" d="M390,175 L188,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-2-2" d="M390,175 L312,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/><path data-edge="cross-2-3" d="M390,175 L436,316" stroke="#b6cbcc" stroke-opacity=".64" stroke-width="2.8"/></g><circle data-vertex="clique-0" cx="110" cy="175" r="28" fill="#69dbc6" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="110" y="184" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">+⅓</text><circle data-vertex="clique-1" cx="250" cy="65" r="28" fill="#69dbc6" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="250" y="74" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">+⅓</text><circle data-vertex="clique-2" cx="390" cy="175" r="28" fill="#69dbc6" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="390" y="184" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">+⅓</text><circle data-vertex="independent-0" cx="64" cy="316" r="28" fill="#f2c373" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="64" y="325" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">−¼</text><circle data-vertex="independent-1" cx="188" cy="316" r="28" fill="#f2c373" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="188" y="325" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">−¼</text><circle data-vertex="independent-2" cx="312" cy="316" r="28" fill="#f2c373" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="312" y="325" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">−¼</text><circle data-vertex="independent-3" cx="436" cy="316" r="28" fill="#f2c373" stroke="#14282d" stroke-width="4"/><text class="og-hide" x="436" y="325" font-size="29" fill="#14282d" text-anchor="middle" font-weight="700">−¼</text></g><text class="og-hide" x="450" y="499" font-size="33" fill="#f2c373" text-anchor="middle">The four gold vertices are pairwise distance 2.</text><path d="M76 535 H824" stroke="#b6c8c8" stroke-opacity=".35"/><text class="og-hide" x="450" y="589" font-size="39" fill="#f4f5ed" text-anchor="middle" font-family="Georgia, serif">Q(p) = zᵀdᵖz = ⅔ + ¾ · 2ᵖ − 2</text><text class="og-hide" x="450" y="638" font-size="32" fill="#b6c8c8" text-anchor="middle">3(+⅓) + 4(−¼) = 0</text><path d="M139 742 V997 M139 846.3181818181818 H750" stroke="#b6c8c8" stroke-width="2" fill="none"/><path d="M561.647 846.318 L563.216 845.657 L564.786 844.994 L566.355 844.330 L567.925 843.665 L569.495 842.998 L571.064 842.330 L572.634 841.660 L574.203 840.989 L575.773 840.317 L577.343 839.643 L578.912 838.967 L580.482 838.290 L582.051 837.612 L583.621 836.932 L585.191 836.251 L586.760 835.568 L588.330 834.884 L589.900 834.198 L591.469 833.511 L593.039 832.823 L594.608 832.133 L596.178 831.441 L597.748 830.748 L599.317 830.054 L600.887 829.358 L602.456 828.660 L604.026 827.961 L605.596 827.261 L607.165 826.559 L608.735 825.856 L610.305 825.151 L611.874 824.444 L613.444 823.736 L615.013 823.027 L616.583 822.316 L618.153 821.603 L619.722 820.889 L621.292 820.174 L622.861 819.457 L624.431 818.738 L626.001 818.018 L627.570 817.296 L629.140 816.573 L630.709 815.848 L632.279 815.122 L633.849 814.394 L635.418 813.664 L636.988 812.933 L638.558 812.201 L640.127 811.467 L641.697 810.731 L643.266 809.994 L644.836 809.255 L646.406 808.514 L647.975 807.772 L649.545 807.029 L651.114 806.284 L652.684 805.537 L654.254 804.788 L655.823 804.038 L657.393 803.287 L658.962 802.534 L660.532 801.779 L662.102 801.022 L663.671 800.264 L665.241 799.505 L666.811 
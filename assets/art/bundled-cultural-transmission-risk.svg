<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper comparing bundled and piece-by-piece cultural learning in a neutral model of trait accumulation. Left: an exact chart for two learners (death rate 1, learning rate 2, innovation rate 1/2). The horizontal axis is the share b of a teacher’s traits copied per encounter, from 0 to 1, with encounters 1/b times as frequent so each trait’s transmission rate is fixed. A flat blue line shows the average repertoire, 3/2 at every b. An orange curve shows the variance of the repertoire rising from 53/20 at b near 0 to 13/4 at b = 1, with marked exact points 11/4 at b = 1/4 and 23/8 at b = 1/2. Right: text says that holding each trait’s rate fixed and changing only how bundled learning is leaves the average unchanged while variability and risk rise, because traits learnt together are also lost together, so shortfalls and total loss become more likely. The ordering is proved in convex order for every trait count; the model uses no data.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.42">
<stop offset="0" stop-color="#ffb38a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb38a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="32" y="52" fill="#eef6f6" font-family="Georgia,serif" font-size="28" font-weight="normal" text-anchor="start">Equal mean diversity, unequal risk</text><text class="og-hide" x="32" y="78" fill="#d6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Bundled versus piece-by-piece cultural learning at the same per-trait rate</text><text class="og-hide" x="32" y="100" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">two learners, exact values</text><path d="M96 330.0 H600" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="86" y="334" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><path d="M96 267.7 H600" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="86" y="271.7142857142857" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M96 205.4 H600" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="86" y="209.42857142857144" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><path d="M96 143.1 H600" stroke="#a9c4c6" stroke-opacity=".13" stroke-width="1"/><text class="og-hide" x="86" y="147.14285714285717" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">3</text><path d="M96 330 H600 M96 330 V106" stroke="#a9c4c6" stroke-opacity=".5" stroke-width="1"/><path d="M96.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="96" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><path d="M222.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="222" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">¼</text><path d="M348.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="348" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">½</text><path d="M474.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="474" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">¾</text><path d="M600.0 330 v5" stroke="#a9c4c6" stroke-width="1.2"/><text class="og-hide" x="600" y="351" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">1</text><text class="og-hide" x="600" y="372" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">share of a teacher’s traits copied per encounter, b  →  more bundled</text><path d="M96.0 164.9 L101.0 164.7 L106.1 164.5 L111.1 164.3 L116.2 164.0 L121.2 163.8 L126.2 163.6 L131.3 163.3 L136.3 163.1 L141.4 162.8 L146.4 162.6 L151.4 162.4 L156.5 162.1 L161.5 161.9 L166.6 161.6 L171.6 161.4 L176.6 161.1 L181.7 160.9 L186.7 160.6 L191.8 160.3 L196.8 160.1 L201.8 159.8 L206.9 159.5 L211.9 159.3 L217.0 159.0 L222.0 158.7 L227.0 158.4 L232.1 158.2 L237.1 157.9 L242.2 157.6 L247.2 157.3 L252.2 157.0 L257.3 156.7 L262.3 156.4 L267.4 156.1 L272.4 155.8 L277.4 155.5 L282.5 155.2 L287.5 154.9 L292.6 154.6 L297.6 154.3 L302.6 153.9 L307.7 153.6 L312.7 153.3 L317.8 153.0 L322.8 152.6 L327.8 152.3 L332.9 152.0 L337.9 151.6 L343.0 151.3 L348.0 150.9 L353.0 150.6 L358.1 150.2 L363.1 149.9 L368.2 149.5 L373.2 149.1 L378.2 148.8 L383.3 148.4 L388.3 148.0 L393.4 147.6 L398.4 147.2 L403.4 146.9 L408.5 146.5 L413.5 146.1 L418.6 145.7 L423.6 145.2 L428.6 144.8 L433.7 144.4 L438.7 144.0 L443.8 143.6 L448.8 143.1 L453.8 142.7 L458.9 142.3 L463.9 141.8 L469.0 141.4 L474.0 140.9 L479.0 140.5 L484.1
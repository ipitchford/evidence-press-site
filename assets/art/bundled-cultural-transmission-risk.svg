text-anchor="start">Average: unchanged</text><text class="og-hide" x="660" y="244" fill="#ffb38a" font-family="Georgia,serif" font-size="28" font-weight="bold" text-anchor="start">Variability and risk: rise</text><text class="og-hide" x="660" y="286" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Traits learnt together are also lost together, so</text><text class="og-hide" x="660" y="306" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">shortfalls and total loss become more likely.</text><text class="og-hide" x="660" y="350" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Neutral model (Wakano et al. 2026): u = 1, β = 2, μ = ½.</text><text class="og-hide" x="660" y="368" fill="#a9c4c6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Proved in convex order for every trait count; no data.</text>
</svg>
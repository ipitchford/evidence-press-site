<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper that computes exactly how large a constant the simplest sum-of-squares proof of the DDVV commutator inequality needs. The DDVV inequality for m real symmetric n by n matrices holds with constant 1 (green horizontal line). The chart plots, against the matrix size n from 2 to 40, the least constant sigma(n, m) for which the inequality has a sum-of-squares proof using squares of quadratic forms: for m = 3 matrices (blue), m = 4 (gold) and the limit of many matrices (pink). All three curves start at 1 for n = 2, pass through 9/8 at n = 3 (circled), and rise with n; the m = 3 curve levels off towards 8/5, the m = 4 curve towards 2, and the many-matrices curve towards 3. A dashed line at 3 marks the supremum, approached but never reached. Right: the inequality holds with constant 1, but a sum-of-squares proof needs exactly 1 only when n = 2 or m = 2; the values run from 1 through 9/8 up to 3. For Hermitian matrices the true constant is 4/3 and the simplest proof needs up to 4. The classification is exact for degree-four certificates; higher-degree certificates are not covered.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.6" r="0.42">
<stop offset="0" stop-color="#9fd2ff" stop-opacity="0.06"/><stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="25" font-weight="normal" text-anchor="start">How much slack does the simplest sum-of-squares proof of the DDVV inequality need?</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Exact least constant σ(n, m) for m real symmetric n × n matrices (Theorem 1.1): 1 only at the edges, 9/8 for 3 × 3, up to 3</text><path d="M78 317.4 H640" stroke="#e3d9c9" stroke-opacity="0" stroke-width="1"/><text class="og-hide" x="68" y="321.4468085106383" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M78 271.1 H640" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="68" y="275.063829787234" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1.5</text><path d="M78 224.7 H640" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="68" y="228.68085106382978" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><path d="M78 178.3 H640" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="68" y="182.29787234042553" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2.5</text><path d="M78 131.9 H640" stroke="#e3d9c9" stroke-opacity="0.12" stroke-width="1"/><text class="og-hide" x="68" y="135.91489361702122" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">3</text><text class="og-hide" x="78" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text class="og-hide" x="196.31578947368422" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text class="og-hide" x="344.2105263157895" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">20</text><text class="og-hide" x="492.10526315789474" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">30</text><text class="og-hide" x="640" y="356" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">40</text><path d="M78 131.9 H640" stroke="#c4b7a2" stroke-width="1.6" stroke-dasharray="7 6"/><text class="og-hide" x="640" y="123.91489361702122" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="end">supremum 3: approached, never reached</text><path d="M78 317.4 H640" stroke="#9be3c0" stroke-width="3"/><text class="og-hide" x="640" y="337.4468085106383" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="end">true DDVV constant 1 (the inequality itself)</text><path d="M78.0 317.4 L92.8 305.9 L107.6 293.0 L122.4 281.4 L137.2 271.1 L151.9 262.0 L166.7 254.0 L181.5 246.9 L196.3 240.5 L211.1 234.8 L225.9 229.7 L240.7 225.0 L255.5 220.8 L270.3 217.0 L285.1 213.4 L299.8 210.1 L314.6 207.1 L329.4 204.3 L344.2 201.7 L359.0 199.3 L373.8 197.1 L388.6 195.0 L403.4 193.0 L418.2 191.1 L432.9 189.4 L447.7 187.8 L462.5 186.2 L477.3 184.7 L492.1 183.3 L506.9 182.0 L521.7 180.8 L536.5 179.6 L551.3 178.4 L566.1 177.3 L580.8 176.3 L595.6 175.3 L610.4 174.4 L625.2 173.5 L640.0 172.6" stroke="#f2a7c3" stroke-width="2.6" fill="none" stroke-linejoin="round"/><path d="M78.0 317.4 L92.8 305.9 L107.6 295.1 L122.4 286.0 L137.2 278.4 L151.9 272.0 L166.7 266.6 L181.5 261.9 L196.3 257.9 L211.1 254.3 L225.9 251.2 L240.7 249.7 L255.5 248.3 L270.3 247.1 L285.1 246.0 L299.8 245.0 L314.6 244.1 L329.4 243.2 L344.2 242.5 L359.0
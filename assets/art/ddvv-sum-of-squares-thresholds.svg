cx="151.9" cy="272.0" r="2.6" fill="#ffcf7a"/><circle cx="166.7" cy="266.6" r="2.6" fill="#ffcf7a"/><circle cx="225.9" cy="251.2" r="2.6" fill="#ffcf7a"/><circle cx="285.1" cy="246.0" r="2.6" fill="#ffcf7a"/><circle cx="344.2" cy="242.5" r="2.6" fill="#ffcf7a"/><circle cx="403.4" cy="240.0" r="2.6" fill="#ffcf7a"/><circle cx="462.5" cy="238.1" r="2.6" fill="#ffcf7a"/><circle cx="521.7" cy="236.6" r="2.6" fill="#ffcf7a"/><circle cx="580.8" cy="235.4" r="2.6" fill="#ffcf7a"/><circle cx="640.0" cy="234.4" r="2.6" fill="#ffcf7a"/><circle cx="78.0" cy="317.4" r="2.6" fill="#f2a7c3"/><circle cx="92.8" cy="305.9" r="2.6" fill="#f2a7c3"/><circle cx="107.6" cy="293.0" r="2.6" fill="#f2a7c3"/><circle cx="122.4" cy="281.4" r="2.6" fill="#f2a7c3"/><circle cx="137.2" cy="271.1" r="2.6" fill="#f2a7c3"/><circle cx="151.9" cy="262.0" r="2.6" fill="#f2a7c3"/><circle cx="166.7" cy="254.0" r="2.6" fill="#f2a7c3"/><circle cx="225.9" cy="229.7" r="2.6" fill="#f2a7c3"/><circle cx="285.1" cy="213.4" r="2.6" fill="#f2a7c3"/><circle cx="344.2" cy="201.7" r="2.6" fill="#f2a7c3"/><circle cx="403.4" cy="193.0" r="2.6" fill="#f2a7c3"/><circle cx="462.5" cy="186.2" r="2.6" fill="#f2a7c3"/><circle cx="521.7" cy="180.8" r="2.6" fill="#f2a7c3"/><circle cx="580.8" cy="176.3" r="2.6" fill="#f2a7c3"/><circle cx="640.0" cy="172.6" r="2.6" fill="#f2a7c3"/><text class="og-hide" x="648" y="177.60519085356162" fill="#f2a7c3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">many matrices</text><text class="og-hide" x="648" y="239.44568868980963" fill="#ffcf7a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">m = 4</text><text class="og-hide" x="648" y="272.8869134363159" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">m = 3</text><circle cx="92.8" cy="305.9" r="6.5" fill="none" stroke="#f4f1ea" stroke-width="2"/><path d="M92.8 298.9 L92.8 153.2" stroke="#f4f1ea" stroke-width="1.4" stroke-dasharray="3 3"/><text class="og-hide" x="100.78947368421052" y="165.16595744680848" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">9/8 for 3 × 3 matrices</text><text class="og-hide" x="100.78947368421052" y="182.16595744680848" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">(any number m ≥ 3)</text><text class="og-hide" x="78" y="378" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">matrix size n (n × n real symmetric matrices)</text><text class="og-hide" x="68" y="106" fill="#c4b7a2" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="start">least constant c with a quadratic sum-of-squares proof, σ(n, m)</text><path d="M752 112 L 752 372" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="772" y="134" fill="#f4f1ea" font-family="Georgia,serif" font-size="19" font-weight="normal" text-anchor="start">The price of the simplest proof</text><text class="og-hide" x="772" y="162" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">The inequality holds with constant</text><text class="og-hide" x="998" y="162" fill="#9be3c0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">1.</text><text class="og-hide" x="772" y="184" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">A sum-of-squares proof needs exactly 1</text><text class="og-hide" x="772" y="203" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">only when n = 2 or m = 2.</text><text class="og-hide" x="772" y="240" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" text-anchor="start">1 → 9/8 → 3</text><text class="og-hide" x="772" y="262" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">n = 2   ·   3 × 3   ·   supremum</text><text class="og-hide" x="772" y="300" fill="#9fd2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">Hermitian matrices (Theorem 1.2):</text><text class="og-hide" x="772" y="320" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">true constant 4/3; the simplest proof</text><text class="og-hide" x="772" y="338" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">needs up to 4.</text><text class="og-hide" x="772" y="368" fill="#c4b7a2" font-family="Georgia,serif" font-size="11" font-weight="normal" text-anchor="start">Exact for degree-four certificates; higher degrees not covered.</text>
</svg>
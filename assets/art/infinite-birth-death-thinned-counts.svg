<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">A birth–death chain with infinitely many states is observed through retained jumps. The cumulative edge-energy sum E determines the exact boundary: finite E gives finite stationary variance rate and a Brownian functional limit; infinite E gives divergent stationary variance per time. No universal claim about other weak limits is made.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#e6c1ec" stop-opacity="0.06"/><stop offset="1" stop-color="#e6c1ec" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g fill="none" stroke-linecap="round"><circle cx="75" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M98 115 H126 M126 135 H98" stroke="#e6c1ec" stroke-width="2"/><circle cx="150" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M173 115 H201 M201 135 H173" stroke="#e6c1ec" stroke-width="2"/><circle cx="225" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M248 115 H276 M276 135 H248" stroke="#e6c1ec" stroke-width="2"/><circle cx="300" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M323 115 H351 M351 135 H323" stroke="#e6c1ec" stroke-width="2"/><circle cx="375" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M398 115 H426 M426 135 H398" stroke="#e6c1ec" stroke-width="2"/><circle cx="450" cy="125" r="17" stroke="#e6c1ec" stroke-width="3" fill="#201922"/><path d="M477 125 H520" stroke="#e6c1ec" stroke-dasharray="4 8" stroke-width="3"/><path d="M80 205 V254" stroke="#efc778" stroke-width="5" opacity="1"/><path d="M137 205 V229" stroke="#a08d9e" stroke-width="2" opacity="0.4"/><path d="M194 205 V254" stroke="#efc778" stroke-width="5" opacity="1"/><path d="M251 205 V254" stroke="#efc778" stroke-width="5" opacity="1"/><path d="M308 205 V229" stroke="#a08d9e" stroke-width="2" opacity="0.4"/><path d="M365 205 V229" stroke="#a08d9e" stroke-width="2" opacity="0.4"/><path d="M422 205 V254" stroke="#efc778" stroke-width="5" opacity="1"/><path d="M479 205 V229" stroke="#a08d9e" stroke-width="2" opacity="0.4"/><path d="M565 190 H640 M625 180 L640 190 L625 200" stroke="#efe6ef" stroke-width="2"/><path d="M692 195 H1110" stroke="#efe6ef" stroke-opacity=".3"/></g><g font-family="Georgia" fill="#fff3f5"><text class="og-hide" x="280" y="60" text-anchor="middle" font-size="29">Infinitely many states</text><text class="og-hide" x="280" y="305" text-anchor="middle" font-size="29" fill="#efc778">Only retained jumps count</text><text class="og-hide" x="900" y="99" text-anchor="middle" font-size="36">E = Σ Hₖ² / cₖ</text></g><g font-family="system-ui" font-size="25"><text class="og-hide" x="710" y="161" fill="#e6c1ec">E finite</text><text class="og-hide" x="885" y="161" fill="#fff3f5">Brownian limit</text><text class="og-hide" x="710" y="244" fill="#efc778">E infinite</text><text class="og-hide" x="885" y="244" fill="#fff3f5">Var(Nₜ) / t → ∞</text><text class="og-hide" x="600" y="370" text-anchor="middle" fill="#e5d6e3" font-size="20">FINITE RETAINED RATE · STATIONARY VARIANCE BOUNDARY</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that one fixed time-asymmetric correlation function is compatible with arbitrarily weak dissipation. Left: the antisymmetric part of the covariance, C21(t) minus C12(t) = e^(-9t/2) sin(w0 t)/w0, a single curve rising to about 0.08 near lag 0.2 and decaying; it is identical for every member of the paper's four-state family. Centre: the four-state network of the paper's Figure 1, an idle state with weight 1 minus epsilon connected by dashed gate transitions, which dissipate nothing, to a driven three-state cycle with weight epsilon and large readout values. Right: on logarithmic axes against the active fraction epsilon, the exact entropy-production rate epsilon times log(5/2) (at kappa = 1) falls towards zero as epsilon shrinks, while the Gaussian spectral value of the same covariance stays flat at 1/3; a dot marks epsilon = 1/4, where the true rate is 0.229. The plots are exact formula evaluations from the paper.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.55" r="0.4">
<stop offset="0" stop-color="#ffb36b" stop-opacity="0.06"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

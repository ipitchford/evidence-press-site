="#ffb36b" stroke-width="3.5" marker-end="url(#fcw-arrow)"/><path d="M594.7 299.5 Q607.0 246.8 629.4 201.5" fill="none" stroke="#ffb36b" stroke-width="3.5" marker-end="url(#fcw-arrow)"/><circle cx="480" cy="260" r="30" fill="#00000033" stroke="#d9cfc0" stroke-width="2.5"/><text class="og-hide" x="480" y="266" fill="#f7f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">idle</text><circle cx="640" cy="180" r="17" fill="#00000033" stroke="#ffb36b" stroke-width="2.5"/><circle cx="710" cy="290" r="17" fill="#00000033" stroke="#ffb36b" stroke-width="2.5"/><circle cx="590" cy="320" r="17" fill="#00000033" stroke="#ffb36b" stroke-width="2.5"/><text class="og-hide" x="480" y="316" fill="#e3d8c8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">weight 1 − ε</text><text class="og-hide" x="735" y="180" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">driven cycle</text><text class="og-hide" x="735" y="198" fill="#e3d8c8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">weight ε</text><text class="og-hide" x="735" y="216" fill="#e3d8c8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">large readout</text><text class="og-hide" x="440" y="348" fill="#c9b9a3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">gate transitions dissipate nothing</text><path d="M850 144 V330 H1156" fill="none" stroke="#e3d8c8" stroke-opacity=".55" stroke-width="1.4"/><path d="M850 164.9 H1150" stroke="#c9a6ff" stroke-width="3.5"/><path d="M850.0 314.7 L855.0 312.0 L860.0 309.4 L865.0 306.8 L870.0 304.2 L875.0 301.5 L880.0 298.9 L885.0 296.3 L890.0 293.6 L895.0 291.0 L900.0 288.4 L905.0 285.7 L910.0 283.1 L915.0 280.5 L920.0 277.9 L925.0 275.2 L930.0 272.6 L935.0 270.0 L940.0 267.3 L945.0 264.7 L950.0 262.1 L955.0 259.4 L960.0 256.8 L965.0 254.2 L970.0 251.5 L975.0 248.9 L980.0 246.3 L985.0 243.7 L990.0 241.0 L995.0 238.4 L1000.0 235.8 L1005.0 233.1 L1010.0 230.5 L1015.0 227.9 L1020.0 225.2 L1025.0 222.6 L1030.0 220.0 L1035.0 217.4 L1040.0 214.7 L1045.0 212.1 L1050.0 209.5 L1055.0 206.8 L1060.0 204.2 L1065.0 201.6 L1070.0 198.9 L1075.0 196.3 L1080.0 193.7 L1085.0 191.0 L1090.0 188.4 L1095.0 185.8 L1100.0 183.2 L1105.0 180.5 L1110.0 177.9 L1115.0 175.3 L1120.0 172.6 L1125.0 170.0 L1130.0 167.4 L1135.0 164.7 L1140.0 162.1 L1145.0 159.5 L1150.0 156.9" fill="none" stroke="#ffb36b" stroke-width="4" stroke-linecap="round"/><circle cx="1116.5" cy="174.5" r="6" fill="#ffb36b"/><text class="og-hide" x="850" y="128" fill="#f7f2ea" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" text-anchor="start">Dissipation is not pinned</text><text class="og-hide" x="856" y="154.9" fill="#c9a6ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">Gaussian reading: 1/3</text><text class="og-hide" x="970" y="300" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">true rate ε·log(5/2)</text><text class="og-hide" x="1118.5" y="204.5" fill="#ffb36b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ε = 1/4: 0.229</text><text class="og-hide" x="1150" y="354" fill="#c9b9a3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">active fraction ε (log scale) →</text>
</svg>
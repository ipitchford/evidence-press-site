<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on global convergence rates for Sinkhorn’s algorithm. Left: the question “How many Sinkhorn iterations as the regularisation lambda shrinks?” and the answer: under one Poincaré inequality on the source, the dual gap shrinks by the factor C_P L squared over (C_P L squared plus lambda squared) in every iteration, from the first and for any target, so about C_P L squared over lambda squared times log of one over epsilon iterations are needed; a fixed cusp source shows that one over lambda squared cannot be beaten. Right: a log-log plot of iterations needed per e-fold reduction of the gap against one over lambda, from 1 to 1000. A dashed gold curve, the guarantee of Theorem 2 with Poincaré constant three quarters, rises with slope 2, to about 750,000 at lambda 0.001. Pink points, the fixed logarithmic-cusp source of Theorem 6, rise with a slope approaching 2, to about 14,000. Blue points, the uniform source, rise with slope 1, to about 500. All points lie below the guarantee. Points are the exact local rates computed in the paper’s two-atom model.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.7" cy="0.5" r="0.42">
<stop offset="0" stop-color="#ffcf7a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="58" fill="#f4f1ea" font-family="Georgia,serif" font-size="28" font-weight="normal" text-anchor="start">How many Sinkhorn iterations</text><text class="og-hide" x="40" y="92" fill="#f4f1ea" font-family="Georgia,serif" font-size="28" font-weight="normal" text-anchor="start">as the regularisation λ shrinks?</text><text class="og-hide" x="40" y="146" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">One Poincaré inequality on the source:</text><text class="og-hide" x="40" y="180" fill="#ffcf7a" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="start">gap shrinks by  C<tspan baseline-shift="sub" font-size="70%">P</tspan> L² / (C<tspan baseline-shift="sub" font-size="70%">P</tspan> L² + λ²)</text><text class="og-hide" x="40" y="206" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">every iteration, from the first, for any target</text><text class="og-hide" x="40" y="252" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">so about (C<tspan baseline-shift="sub" font-size="70%">P</tspan> L²/λ²) log(1/ε) iterations;</text><text class="og-hide" x="40" y="274" fill="#f2a7c3" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">a fixed cusp source shows 1/λ² cannot be beaten</text><text class="og-hide" x="40" y="336" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">Points: exact local rates in the two-atom model</text><text class="og-hide" x="40" y="352" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">(paper, Section 7 and Figure 1); cusp C<tspan baseline-shift="sub" font-size="70%">P</tspan> = 3/4</text><path d="M500 60 L 500 360" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><path d="M560 330.0 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="334" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><path d="M560 290.3 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="294.3333333333333" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><path d="M560 250.7 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="254.66666666666669" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10²</text><path d="M560 211.0 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="215" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10³</text><path d="M560 171.3 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="175.33333333333334" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10⁴</text><path d="M560 131.7 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="135.66666666666666" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10⁵</text><path d="M560 92.0 H1080" stroke="#c4b7a2" stroke-opacity=".14" stroke-width="1"/><text class="og-hide" x="552" y="96" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">10⁶</text><path d="M560.0 330 v5" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="560" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><path d="M733.3 330 v5" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="733.3333333333333" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><path d="M906.7 330 v5" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="906.6666666666666" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">100</text><path d="M1080.0 330 v5" stroke="#c4b7a2" stroke-width="1.2"/><text class="og-hide" x="1080" y="350" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1000</text><path d="M560 330 H1080 M560 330 V92" stroke="#c4b7a2" stroke-opacity=".55" stroke-width="1"/><text class="og-hide" x="1080" y="370" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="end">1/λ  (weaker regularisation →)</text><text class="og-hide" x="514" y="78" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">iterations per e-fold of the gap</text><path d="M612.2 308.5 L616.1 307.0 L620.0 305.4 L623.9 303.8 L627.8 302.2 L631.7 300.6 L635.6 298.9 L639.5 297.3 L643.4 295.6 L647.3 293.9 L651.2 292.3 L655.1 290.6 L659.0 288.9 L662.9 287.2 L666.8 285.4 L670.7 283.7 L674.6 282.0 L678.5 280.3 L682.4 278.5 L686.3 276.8 L690.1 275.0 L694.0 273.3 L697.9 271.5 L701.8 269.8 L705.7 268.0 L709.6 266.3 L713.5 264.5 L717.4 262.7 L721.3 261.0 L725.2 259.2 L729.1 257.4 L733.0 255.6 L736.9 253.9 L740.8 252.1 L744.7 250.3 L748.6 248.5 L752.5 246.8 L756.4 245.0 L760.3 243.2 L764.2 241.4 L768.1 239.7 L772.0 237.9 L775.9 236.1 L779.8 234.3 L783.7 232.5 L787.6 230.8 L791.5 229.0 L795.4 227.2 L799.3 225.4 L803.2 223.6 L807.1 221.8 L811.0 220.1 L814.9 218.3 L818.8 216.5 L822.7 214.7 L826.6 212.9 L830.5 211.1 L834.4 209.4 L838.3 207.6 L842.2 205.8 L846.1 204.0 L850.0 202.2 L853.9 200.4 L857.8 198.7 L861.7 196.9 L865.6 19
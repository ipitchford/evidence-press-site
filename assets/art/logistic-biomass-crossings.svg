<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on the logistic patch model with migration. Main panel: for the paper's exact three-patch network (growth rates 7/3, 1 and 2, carrying capacities 1, 3 and 1, so total carrying capacity S = 5), the curve shows total equilibrium biomass minus 5, in parts per million, against the overall migration intensity on a logarithmic axis from 0.01 to 7.4. The curve starts above zero (migration raises total biomass), then crosses zero five times at exactly certified intensities, the first being 46053/252320, so that it is alternately above and below S, with excursions of at most a few parts per million; at very high migration it falls to 249 parts per million below S. Side panel: the most crossings possible with n patches: 1 for two patches, exactly 5 for three, between 6 and 13 for four, and between n + 2 and 2 to the n minus 3 in general. An earlier question asked whether three was the maximum for three patches; the answer is five. The curve is computed numerically from the model and illustrates an exactly certified example.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.35" cy="0.6" r="0.5">
<stop offset="0" stop-color="#ffd27a" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text x="40" y="52" fill="#eef1fb" font-family="Georgia,serif" font-size="25" font-weight="normal" text-anchor="start">Migration can switch a population above and below its carrying capacity five times</text><text x="40" y="80" fill="#cdd3ea" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">Three logistic patches allow exactly five crossings; the effects are a few parts per million and need finely tuned migration rates</text><rect x="78" y="128" width="712" height="108" fill="#8fe0b0" fill-opacity=".07"/><rect x="78" y="236" width="712" height="108" fill="#ff9f8f" fill-opacity=".07"/><text x="88" y="148" fill="#8fe0b0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">above S: migration raises total biomass</text><text x="88" y="334" fill="#ff9f8f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">below S: migration lowers total biomass</text><path d="M78 236 H790" stroke="#cdd3ea" stroke-opacity=".75" stroke-width="1.6"/><text x="798" y="241" fill="#cdd3ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">S = 5</text><path d="M78.0 344 V349" stroke="#cdd3ea" stroke-opacity=".6"/><text x="78.0" y="364" fill="#a9b1d3" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">0.01</text><path d="M326.2 344 V349" stroke="#cdd3ea" stroke-opacity=".6"/><text x="326.2" y="364" fill="#a9b1d3" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">0.1</text><path d="M574.3 344 V349" stroke="#cdd3ea" stroke-opacity=".6"/><text x="574.3" y="364" fill="#a9b1d3" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">1</text><path d="M747.7 344 V349" stroke="#cdd3ea" stroke-opacity=".6"/><text x="747.7" y="364" fill="#a9b1d3" font-family="Arial,Helvetica,sans-serif" 
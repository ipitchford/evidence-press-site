<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on recurring delivery schedules in which every client must be visited before its stock runs out. Left: the paper's three-day example, two clients on one road from the depot with deadlines of 2 and 3 days, shown as rows of twelve days with filled squares on visit days. The power-of-two calendar visits both clients every 2 days and costs 3 per day. The integer calendar, obtained by rounding the event times of clocks with periods 3/2 and 3 up to whole days, visits the near client with gaps 2, 1, 2, 1 and the far client every 3 days, costs 8/3 per day, which is optimal, and never misses a deadline. Right: a number line of worst-case cost relative to the best possible schedule on tree networks. Factor 2 for the power-of-two calendars of Bosman et al. 2022; about 1.60, the best possible when every client keeps a constant gap and the gaps divide one another; and 1/ln 2, about 1.443, for the integer calendar, which is exact for calendars that repeat within the longest deadline. The example costs are recomputed from the paper's numbers.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.55" r="0.5">
<stop offset="0" stop-color="#9fe8b8" stop-opacity="0.05"/><stop offset="1" stop-color="#9fe8b8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text x="40" y="52" fill="#f4f0ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">Rounding event times, not periods, beats the factor two</text><text x="40" y="80" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="normal" text-anchor="start">Fixed-turnover replenishment: visit every client before its stock runs out, at the lowest average routing cost</text><text x="40" y="118" fill="#f4f0ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Two clients on one road: deadlines 2 and 3 days</text><text x="40" y="152" fill="#ffb3a1" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Power of two: both every 2 days</text><text x="140" y="173" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">near</text><rect x="150" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="178" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="206" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="234" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="262" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="290" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="318" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="346" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="374" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="402" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="430" y="160" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="458" y="160" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><text x="140" y="193" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">far</text><rect x="150" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="178" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="206" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="234" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="262" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="290" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="318" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="346" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="374" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="402" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="430" y="180" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="458" y="180" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><text x="494" y="184" fill="#ffb3a1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">3 per day</text><text x="40" y="242" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Integer calendar: near gaps 2, 1, 2, 1 …</text><text x="140" y="263" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">near</text><rect x="150" y="250" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="178" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="206" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="234" y="250" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="262" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="290" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="318" y="250" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="346" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="374" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="402" y="250" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="430" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><rect x="458" y="250" width="25" height="17" rx="3" fill="#ffd27a" fill-opacity=".92"/><text x="140" y="283" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">far</text><rect x="150" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="178" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="206" y="270" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="234" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="262" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="290" y="270" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="318" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="346" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="374" y="270" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><rect x="402" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="430" y="270" width="25" height="17" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="458" y="270" width="25" height="17" rx="3" fill="#9fd8ff" fill-opacity=".92"/><text x="494" y="274" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" text-anchor="start">8/3 per day</text><text x="162.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">1</text><text x="190.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">2</text><text x="218.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">3</text><text x="246.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">4</text><text x="274.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">5</text><text x="302.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">6</text><text x="330.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">7</text><text x="358.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">8</text><text x="386.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">9</text><text x="414.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">10</text><text x="442.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">11</text><text x="470.5" y="316" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">12</text><text x="318" y="334" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">day</text><text x="40" y="370" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Round each clock’s event times up to whole days: no deadline is missed,</text><text x="40" y="387" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">and clients sharing a road stay synchronised. Here 8/3 is the optimum.</text><path d="M572 104 V384" stroke="#ddd3c8" stroke-opacity=".18"/><text x="600" y="118" fill="#f4f0ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Worst-case cost relative to the best schedule, on trees</text><path d="M600 250 H1150" stroke="#ddd3c8" stroke-opacity=".75" stroke-width="1.6"/><path d="M600.0 245 V255" stroke="#ddd3c8" stroke-opacity=".8"/><text x="600.0" y="272" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1.0</text><path d="M700.0 245 V255" stroke="#ddd3c8" stroke-opacity=".8"/><text x="700.0" y="272" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1.2</text><path d="M800.0 245 V255" stroke="#ddd3c8" stroke-opacity=".8"/><text x="800.0" y="272" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1.4</text><path d="M1000.0 245 V255" stroke="#ddd3c8" stroke-opacity=".8"/><text x="1000.0" y="272" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1.8</text><path d="M1100.0 245 V255" stroke="#ddd3c8" stroke-opacity=".8"/><text x="1100.0" y="272" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2.0</text><text x="600.0" y="290" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">optimum</text><circle cx="1100.0" cy="250" r="8" fill="#ffb3a1"/><path d="M1100.0 238 V230" stroke="#ffb3a1" stroke-width="1.6"/><text x="1100.0" y="190" fill="#ffb3a1" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">factor 2</text><text x="1100.0" y="207" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">power of two</text><text x="1100.0" y="224" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Bosman et al. 2022</text><circle cx="900.3" cy="250" r="8" fill="#e2c2ff"/><path d="M900.3 262 V294" stroke="#e2c2ff" stroke-width="1.6"/><text x="900.3" y="314" fill="#e2c2ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">≈ 1.60</text><text x="900.3" y="331" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">constant gaps</text><text x="900.3" y="347" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">that divide (best possible)</text><circle cx="821.3" cy="250" r="8" fill="#9fe8b8"/><path d="M821.3 238 V230" stroke="#9fe8b8" stroke-width="1.6"/><text x="821.3" y="190" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">1/ln 2 ≈ 1.443</text><text x="821.3" y="207" fill="#ddd3c8" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">integer calendar</text><text x="821.3" y="224" fill="#bcb0a3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">exact for short cycles</text><path d="M1086.0 158 C 975.0 132, 900.0 132, 837.3 156" fill="none" stroke="#9fe8b8" stroke-width="2" stroke-dasharray="5 4"/><text x="960.0" y="132" fill="#9fe8b8" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">improved</text>
</svg>
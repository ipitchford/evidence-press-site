<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on Gaussian reproducing kernel Hilbert spaces under stochastic dynamics. Left: for the shear drift with strength s and identity noise, the largest isotropic Gaussian kernel width sigma squared that keeps the space invariant, plotted against s from 2 to 10. A gold region under the curve 2 over (s minus 2) shows the widths certified by the earlier sufficient condition with factor 2; a larger green region under 4 over (s minus 2) shows the exact range with factor 4. A red marker at s equals 5 shows sigma squared up to 4/3 instead of 2/3. Right: the factor is 4, not 2; the old rule AP + PA transpose at most 2BB transpose is sufficient, the exact rule has 4BB transpose; twice the admissible widths; nonlinear drift or state-dependent noise is never invariant.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.30" cy="0.55" r="0.42">
<stop offset="0" stop-color="#9be3c0" stop-opacity="0.06"/><stop offset="1" stop-color="#9be3c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="52" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">When does a Gaussian kernel space survive random dynamics?</text><text class="og-hide" x="40" y="80" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ornstein–Uhlenbeck processes: exact condition versus the 2025 sufficient condition</text><text class="og-hide" x="90" y="100" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">largest kernel width σ² keeping the Gaussian RKHS invariant, shear A = [[−1, s], [0, −1]], B = I</text><path d="M90.0 352.0 L90.0 112.0 L150.0 112.0 L153.7 112.0 L157.5 112.0 L161.2 112.0 L165.0 112.0 L168.7 112.0 L172.5 112.0 L176.2 112.0 L180.0 112.0 L183.7 112.0 L187.5 112.0 L191.2 112.0 L195.0 112.0 L198.7 112.0 L202.5 112.0 L206.2 112.0 L210.0 112.0 L213.7 119.3 L217.5 126.1 L221.2 132.6 L225.0 138.7 L228.7 144.4 L232.5 149.9 L236.2 155.1 L240.0 160.0 L243.7 164.7 L247.5 169.1 L251.2 173.4 L255.0 177.5 L258.7 181.3 L262.5 185.0 L266.2 188.6 L270.0 192.0 L273.7 195.3 L277.5 198.4 L281.2 201.4 L285.0 204.3 L288.7 207.1 L292.5 209.8 L296.2 212.4 L300.0 214.9 L303.7 217.3 L307.5 219.6 L311.2 221.8 L315.0 224.0 L318.7 226.1 L322.5 228.1 L326.2 230.1 L330.0 232.0 L333.7 233.8 L337.5 235.6 L341.2 237.4 L345.0 239.1 L348.7 240.7 L352.5 242.3 L356.2 243.8 L360.0 245.3 L363.7 246.8 L367.5 248.2 L371.2 249.6 L375.0 250.9 L378.7 252.3 L382.5 253.5 L386.2 254.8 L390.0 256.0 L393.7 257.2 L397.5 258.3 L401.2 259.5 L405.0 260.6 L408.7 261.6 L412.5 262.7 L416.2 263.7 L420.0 264.7 L423.7 265.7 L427.5 266.7 L431.2 267.6 L435.0 268.5 L438.7 269.4 L442.5 270.3 L446.2 271.2 L450.0 272.0 L453.7 272.8 L457.5 273.6 L461.2 274.4 L465.0 275.2 L468.7 276.0 L472.5 276.7 L476.2 277.4 L480.0 278.2 L483.7 278.9 L487.5 279.5 L491.2 280.2 L495.0 280.9 L498.7 281.5 L502.5 282.2 L506.2 282.8 L510.0 283.4 L513.7 284.0 L517
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Schematic comparison for two selections: an online decision maker commits as values arrive, while the prophet sees the entire sequence and takes the two largest. The displayed bars and online choices are illustrative, not simulated or certified outcomes, and their sums do not define the theorem ratio. Separately, the worst-case optimal expected online-to-prophet ratio has a limit for every fixed number k of selections. For k equals two the certified limiting interval is 0.83695 to 0.8372914. No exact constant or finite-horizon guarantee is implied.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f4c97f" stop-opacity="0.06"/><stop offset="1" stop-color="#f4c97f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text class="og-hide" x="42" y="48" fill="#fff6e9" font-size="29">Two choices. Different information.</text>
 <text class="og-hide" x="42" y="128" fill="#f4c97f" font-size="31">Online</text>
 <text class="og-hide" x="42" y="158" fill="#c9d4dc" font-size="19">commit as values arrive</text>
 <rect x="280" y="147" width="29" height="34" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="326" y="117" width="29" height="64" rx="4" fill="#f4c97f" fill-opacity="1"/><path d="M332 104 l5 5 l10 -12" fill="none" stroke="#f4c97f" stroke-width="3"/><rect x="372" y="138" width="29" height="43" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="418" y="97" width="29" height="84" rx="4" fill="#f4c97f" fill-opacity="1"/><path d="M424 84 l5 5 l10 -12" fill="none" stroke="#f4c97f" stroke-width="3"/><rect x="464" y="129" width="29" height="52" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="510" y="153" width="29" height="28" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="556" y="77" width="29" height="104" rx="4" fill="#ffffff" fill-opacity=".16"/>
 <path d="M270 193 H612 M602 186 l10 7 -10 7" stroke="#c9d4dc" stroke-width="2" fill="none" opacity=".7"/>
 <text class="og-hide" x="42" y="260" fill="#a8ded0" font-size="31">Prophet</text>
 <text class="og-hide" x="42" y="290" fill="#c9d4dc" font-size="19">see all, take the top two</text>
 <rect x="280" y="279" width="29" height="34" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="326" y="249" width="29" height="64" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="372" y="270" width="29" height="43" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="418" y="229" width="29" height="84" rx="4" fill="#a8ded0" fill-opacity="1"/><path d="M424 216 l5 5 l10 -12" fill="none" stroke="#a8ded0" stroke-width="3"/><rect x="464" y="261" width="29" height="52" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="510" y="285" width="29" height="28" rx="4" fill="#ffffff" fill-opacity=".16"/><rect x="556" y="209" width="29" height="104" rx="4" fill="#a8ded0" fill-opacity="1"/><path d="M562 196 l5 5 l10 -12" fill="none" stroke="#a8ded0" stroke-width="3"/>
 <path d="M270 325 H612" stroke="#c9d4dc" stroke-width="2" opacity=".4"/>
 <text class="og-hide" x="42" y="372" fill="#c9d4dc" font-size="19">Schematic arrivals and choices — not a policy simulation</text>
 <path d="M668 54 V340" stroke="#c9d4dc" stroke-width="1" opacity=".25"/>
 <text class="og-hide" x="928" y="59" text-anchor="middle" fill="#fff6e9" font-size="30">Two-choice limit</text>
 <text class="og-hide" x="928" y="102" text-anchor="middle" fill="#c9d4dc" font-size="20">worst-case expected reward ratio</text>
 <path d="M748 177 H1110" stroke="#c9d4dc" stroke-width="2" opacity=".35"/>
 <path d="M780 165 V190 M780 177 H1078 M1078 165 V190" stroke="#f4c97f" stroke-width="5" fill="none"/>
 <text class="og-hide" x="780" y="228" text-anchor="middle" fill="#f4c97f" font-size="27">0.83695</text>
 <text class="og-hide" x="1078" y="228" text-anchor="middle" fill="#f4c97f" font-size="27">0.8372914</text>
 <text class="og-hide" x="928" y="160" text-anchor="middle" fill="#fff6e9" font-family="Georgia,serif" font-size="40">γ₂*</text>
 <text class="og-hide" x="928" y="277" text-anchor="middle" fill="#c9d4dc" font-size="20">certified enclosure · not an exact value</text>
 <text class="og-hide" x="928" y="340" text-anchor="middle" fill="#fff6e9" font-size="25">A limit for every fixed k</text>
 <text class="og-hide" x="928" y="372" text-anchor="middle" fill="#c9d4dc" font-size="19">i.i.d. nonnegative values · at most k picks</text>
 </g>
</svg>
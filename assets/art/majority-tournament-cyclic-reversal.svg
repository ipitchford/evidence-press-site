<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="indigo" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper showing that a majority tournament with more voting cycles can be more probable. Title: more voting cycles, yet far more likely. Subtitle: with many random voters, an outcome costs about a factor of 2 for every pair that must be almost tied, not per cyclic triple. Left: 14 candidates in ranked groups, strongest on top, drawn as stacked boxes. The pattern (7, 7) has two boxes of 7 candidates with 21 tied pairs each: 42 almost-tied pairs and 28 cyclic triples. The pattern (1, 1, 1, 9, 1, 1) has one box of 9 candidates with 36 tied pairs and five single candidates: 36 almost-tied pairs and 30 cyclic triples, about 2.7 times as likely (Monte Carlo estimate). Pairs grow like size squared, loops like size cubed. Right: 78 candidates, exact certificate: (39, 39) has 1,482 tied pairs and 4,940 cyclic triples; (7, 7, 49, 5, 5, 5) has 1,248 tied pairs and 4,943 cyclic triples: 3 more loops, over 100,000 times as likely. Harrison-Trainor conjectured fewer cyclic triples always means more likely; false, but fully ordered outcomes are still the most likely of all. Smallest counterexample: between 8 and 13 candidates (estimate). Footer: impartial culture in the limit of many voters, a null model, not real elections; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a36"/><stop offset="1" stop-color="#303d68"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.5" r="0.35">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="27" font-weight="normal" font-style="normal" text-anchor="start">More voting cycles, yet far more likely</text><text class="og-hide" x="40" y="72" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Many random voters: an outcome costs about a factor of 2 for every pair that must be almost tied, not per cyclic triple</text><text class="og-hide" x="40" y="112" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">14 candidates in ranked groups (strongest on top):</text><rect x="60" y="128.0" width="96" height="105.5" rx="4" fill="#9fd3f2" fill-opacity="0.3" stroke="#9fd3f2" stroke-width="1.6"/><text class="og-hide" x="108" y="178.75" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">7 candidates</text><text class="og-hide" x="108" y="195.75" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">21 tied pairs</text><rect x="60" y="236.5" width="96" height="105.5" rx="4" fill="#9fd3f2" fill-opacity="0.3" stroke="#9fd3f2" stroke-width="1.6"/><text class="og-hide" x="108" y="287.25" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">7 candidates</text><text class="og-hide" x="108" y="304.25" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">21 tied pairs</text><rect x="330" y="128.0" width="96" height="12.5" rx="4" fill="#ffc36b" fill-opacity="0.14" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="138.25" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">1</text><rect x="330" y="143.5" width="96" height="12.5" rx="4" fill="#ffc36b" fill-opacity="0.14" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="153.75" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">1</text><rect x="330" y="159.0" width="96" height="12.5" rx="4" fill="#ffc36b" fill-opacity="0.14" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="169.25" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">1</text><rect x="330" y="174.5" width="96" height="136.5" rx="4" fill="#ffc36b" fill-opacity="0.3" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="240.75" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle">9 candidates</text><text class="og-hide" x="378" y="257.75" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle">36 tied pairs</text><rect x="330" y="314.0" width="96" height="12.5" rx="4" fill="#ffc36b" fill-opacity="0.14" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="324.25" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">1</text><rect x="330" y="329.5" width="96" height="12.5" rx="4" fill="#ffc36b" fill-opacity="0.14" stroke="#ffc36b" stroke-width="1.6"/><text class="og-hide" x="378" y="339.75" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="normal" font-style="normal" text-anchor="middle">1</text><text class="og-hide" x="170" y="150" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">(7, 7)</text><text class="og-hide" x="170" y="174" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">42 almost-tied pairs</text><text class="og-hide" x="170" y="194" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">28 cyclic triples</text><text class="og-hide" x="440" y="150" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="start">(1, 1, 1, 9, 1, 1)</text><text class="og-hide" x="440" y="174" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">36 almost-tied pairs</text><text class="og-hide" x="440" y="194" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">30 cyclic triples</text><text class="og-hide" x="440" y="228" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">about 2.7× as likely</text><text class="og-hide" x="440" y="247" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">(Monte Carlo estimate)</text><text class="og-hide" x="170" y="300" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Pairs grow like size²,</text><text class="og-hide" x="170" y="318" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">loops like size³.</text><line x1="668" y1="100" x2="668" y2="350" stroke="#c3ccd2" stroke-width="1" opacity="0.35"/><text class="og-hide" x="700" y="120" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">78 candidates, exact certificate:</text><text class="og-hide" x="700" y="152" fill="#9fd3f2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">(39, 39)</text><text class="og-hide" x="850" y="152" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">1,482 tied pairs · 4,940 cyclic triples</text><text class="og-hide" x="700" y="178" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">(7, 7, 49, 5, 5, 5)</text><text class="og-hide" x="850" y="178" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">1,248 tied pairs · 4,943 cyclic triples</text><text class="og-hide" x="700" y="228" fill="#ffc36b" font-family="Georgia,serif" font-size="22" font-weight="bold" font-style="normal" text-anchor="start">3 more loops, over 100,000× as likely</text><text class="og-hide" x="700" y="262" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">Harrison-Trainor conjectured fewer cyclic triples always</text><text class="og-hide" x="700" y="281" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">means more likely. False; but fully ordered outcomes</text><text class="og-hide" x="700" y="300" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">are still the most likely of all.</text><text class="og-hide" x="700" y="334" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" text-anchor="start">Smallest counterexample: between 8 and 13 candidates (estimate).</text><text class="og-hi
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="art-description">
<desc id="art-description">Every member has three-site energies 0, 1/2, 1 and 3/2, with multiplicities 21, 1, 4 and 1. Along theta from zero to pi/2 the plotted uniform lower bound is cos squared theta divided by six, positive before the endpoint. At the endpoint the exact finite-chain gap is 1 minus cos(pi/N), tending to zero as N grows. The curve is a bound, not the actual gap.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#151a1e"/><stop offset="1" stop-color="#1e2a2e"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#61d9c0" stop-opacity="0.25"/><stop offset="1" stop-color="#61d9c0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on hidden Markov models and dissipation. Left: two hidden mechanisms that produce exactly the same observed two-level signal, labelled A or B. One is the three-state driven ring A to B2 to B1 to A, the cheapest three-state model; the other is the paper’s four-state model Q*, with one extra hidden B state, whose links A–B1, A–B2, A–B3, B1–B2 and B2–B3 are shown without rates. Right: horizontal bars of entropy production rate at q = 1/20, from exact certificates: every three-state model at least 2.846; a simple four-state model 2.773; an improved four-state model 2.766; a five-state model 2.747; a lower bound valid for any hidden size 1.897; and the earlier certified floor 0.018, about 108 times smaller. The smallest model therefore overstates the least possible cost; the exact four-state minimum is still open.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#a9ebd3" stop-opacity="0.06"/><stop offset="1" stop-color="#a9ebd3" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<defs><marker id="ha-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ddd5c6"/></marker></defs><text class="og-hide" x="34" y="46" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="start">Two hidden mechanisms, one identical signal</text><text class="og-hide" x="34" y="70" fill="#bfb6a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">only the label A or B is observed; at q = 1/20 both give exactly the same A/B process</text><circle cx="170" cy="140" r="19" fill="#ffcf7a" fill-opacity=".9"/><text class="og-hide" x="170" y="146" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">A</text><circle cx="95" cy="280" r="19" fill="#9fd3ff" fill-opacity=".9"/><text class="og-hide" x="95" y="286" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B₁</text><circle cx="245" cy="280" r="19" fill="#9fd3ff" fill-opacity=".9"/><text class="og-hide" x="245" y="286" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B₂</text><path d="M181.3 161.2 L232.7 257.1" stroke="#ddd5c6" stroke-width="2.4" marker-end="url(#ha-arr)"/><path d="M221.0 280.0 L121.0 280.0" stroke="#ddd5c6" stroke-width="2.4" marker-end="url(#ha-arr)"/><path d="M106.3 258.8 L157.7 162.9" stroke="#ddd5c6" stroke-width="2.4" marker-end="url(#ha-arr)"/><text class="og-hide" x="170" y="330" fill="#bfb6a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cheapest 3-state model:</text><text class="og-hide" x="170" y="350" fill="#f2a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">the driven ring</text><path d="M480 135 L395 230" stroke="#ddd5c6" stroke-width="1.6"/><path d="M480 135 L565 230" stroke="#ddd5c6" stroke-width="1.6"/><path d="M480 135 L480 300" stroke="#ddd5c6" stroke-width="1.6"/><path d="M395 230 L565 230" stroke="#ddd5c6" stroke-width="1.6"/><path d="M565 230 L480 300" stroke="#ddd5c6" stroke-width="1.6"/><circle cx="480" cy="135" r="19" fill="#ffcf7a" fill-opacity=".9"/><text class="og-hide" x="480" y="141" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">A</text><circle cx="395" cy="230" r="19" fill="#9fd3ff" fill-opacity=".9"/><text class="og-hide" x="395" y="236" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B₁</text><circle cx="565" cy="230" r="19" fill="#9fd3ff" fill-opacity=".9"/><text class="og-hide" x="565" y="236" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B₂</text><circle cx="480" cy="300" r="19" fill="#9fd3ff" fill-opacity=".9"/><text class="og-hide" x="480" y="306" fill="#1b1b1b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">B₃</text><text class="og-hide" x="470" y="340" fill="#bfb6a6" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">the 4-state model Q* (links only, rates omitted)</text><text class="og-hide" x="480" y="360" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">one extra hidden state</text><text class="og-hide" x="318" y="222" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="middle">=</text><text class="og-hide" x="318" y="246" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">same</text><text class="og-hide" x="318" y="262" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">signal</text><text class="og-hide" x="640" y="46" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="start">…but different minimum dissipation</text><text class="og-hide" x="640" y="70" fill="#bfb6a6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">entropy production rate at q = 1/20 (exact certificates; Theorems 1, 5, Prop. 6)</text><text class="og-hide" x="650" y="104" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">every 3-state model ≥</text><rect x="650" y="110" width="436.4" height="15" rx="3" fill="#f2a3b8" fill-opacity=".85"/><text class="og-hide" x="1094.4" y="123" fill="#f2a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">2.846</text><text class="og-hide" x="650" y="145" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">simple 4-state model</text><rect x="650" y="151" width="425.2" height="15" rx="3" fill="#a9ebd3" fill-opacity=".85"/><text class="og-hide" x="1083.2" y="164" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">2.773</text><text class="og-hide" x="650" y="186" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">improved 4-state</text><rect x="650" y="192" width="424.1" height="15" rx="3" fill="#a9ebd3" fill-opacity=".85"/><text class="og-hide" x="1082.1" y="205" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">2.766</text><text class="og-hide" x="650" y="227" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">5-state model</text><rect x="650" y="233" width="421.2" height="15" rx="3" fill="#a9ebd3" fill-opacity=".85"/><text class="og-hide" x="1079.2" y="246" fill="#a9ebd3" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">2.747</text><text class="og-hide" x="650" y="268" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">floor, any hidden size</text><rect x="650" y="274" width="290.9" height="15" rx="3" fill="#ffcf7a" fill-opacity=".85"/><text class="og-hide" x="948.9" y="287" fill="#ffcf7a" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">1.897</text><text class="og-hide" x="650" y="309" fill="#ddd5c6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">earlier certified floor</text><rect x="650" y="315" width="2.7" height="15" rx="3" fill="#bfb6a6" fill-opacity=".85"/><text class="og-hide" x="660.7" y="328" fill="#bfb6a6" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">0.018</text><text class="og-hide" x="640" y="368" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">The smallest model overstates the least possible cost;</text><text class="og-hide" x="640" y="386" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">the new floor is about 108× the earlier one. Exact 4-state minimum still open.</text><path d="M612 30 V380" stroke="#ddd5c6" stroke-opacity=".25"/>
</svg>
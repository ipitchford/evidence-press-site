<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title"><title id="title">Seven-point linear rates and four-point quadratic behaviour</title><rect width="1000" height="710" rx="18" fill="#17292c"/><text class="og-hide" x="50" y="65" font-family="Arial,sans-serif" font-size="34" fill="#edf5f0">Seven points: a sharp range of linear rates</text><text class="og-hide" x="50" y="110" font-family="Arial,sans-serif" font-size="24" fill="#edf5f0">Mean cross-distance 1; h is the largest distance change</text><path d="M80 220 H915" stroke="#61d9c0" stroke-width="12"/><circle cx="80" cy="220" r="16" fill="#f0c274"/><circle cx="915" cy="220" r="16" fill="#f0c274"/><text class="og-hide" x="50" y="182" font-family="Arial,sans-serif" font-size="29" fill="#f0c274">2p/21 ≈ 0.0791</text><text class="og-hide" x="670" y="182" font-family="Arial,sans-serif" font-size="29" fill="#f0c274">16p/7 ≈ 1.8973</text><text class="og-hide" x="50" y="280" font-family="Arial,sans-serif" font-size="27" fill="#61d9c0">Attainable limiting values of Δₚ(d) / h</text><text class="og-hide" x="50" y="327" font-family="Arial,sans-serif" font-size="26" fill="#edf5f0">CS(3,4), with p = log₂(16/9)</text><path d="M50 365 H950" stroke="#4d7275"/><text class="og-hide" x="50" y="425" font-family="Arial,sans-serif" font-size="34" fill="#edf5f0">Four points: a genuinely different regime</text><text class="og-hide" x="50" y="476" font-family="Arial,sans-serif" font-size="27" fill="#edf5f0">Star arms 1+t, 1−t, 1; p = log₂3</text><text class="og-hide" x="50" y="535" font-family="Arial,sans-serif" font-size="34" fill="#f0c274">Δₚ(dₜ) = [p(2p−3)/8] t² + O(t⁴)</text><text class="og-hide" x="50" y="589" font-family="Arial,sans-serif" font-size="26" fill="#61d9c0">No positive linear lower bound along this family.</text><text class="og-hide" x="50" y="657" font-family="Arial,sans-serif" font-size="22" fill="#edf5f0">Exact asymptotic statements · not simulated finite-error curves</text></svg>
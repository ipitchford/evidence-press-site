<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on real entanglement witnesses under local filters. Title: Real witnesses miss it, whatever the local filter. Subtitle: an explicit two-qutrit state disproves both parts of the Shen–Chen–Bian conjecture (Theorem 8). Left: a schematic of convex sets. A large blue region labelled all witnesses contains a smaller green region labelled filtered real witnesses R. The large region has one sharp corner H, the exposed witness of Ha and Kye, which lies outside R. A dashed orange line through H is defined by D, a separable state touching the witness set only at H. Just across that line is a pink point, rho epsilon, detected by H and missed by all of R. Right: on the explicit state, the complex witness H gives minus 8 over 19199997, every filtered real witness gives more than 8.5 times 10 to the minus 10, and the certified ball radius is 8 times 10 to the minus 10. For 3 by 3 (two qutrits) both parts fail; for 2 by 4 local unitaries fail and the filter case is open; one extra local qubit restores detection. Far too fragile for experiment: noise threshold about 1.6 times 10 to the minus 7. Footer: schematic of convex sets, not data; witness and separable state from Ha and Kye; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.6" r="0.35">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="26" font-weight="normal" font-style="normal" text-anchor="start">Real witnesses miss it, whatever the local filter</text><text class="og-hide" x="40" y="72" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">An explicit two-qutrit state disproves both parts of the Shen–Chen–Bian conjecture (Theorem 8)</text><path d="M 470 132 C 420 128, 300 96, 190 120 C 90 142, 52 230, 98 300 C 140 360, 280 372, 380 330 C 440 300, 462 220, 470 132 Z" fill="#9fd3ff" fill-opacity="0.10" stroke="#9fd3ff" stroke-width="2"/><path d="M 380 214 C 360 160, 260 142, 190 168 C 120 196, 108 270, 150 310 C 200 350, 320 344, 362 296 C 386 268, 392 240, 380 214 Z" fill="#a8e0b0" fill-opacity="0.20" stroke="#a8e0b0" stroke-width="1.6"/><line x1="437" y1="92" x2="525" y2="211" stroke="#ffc36b" stroke-width="2" stroke-dasharray="7 5"/><circle cx="470" cy="132" r="7" fill="#ffc36b"/><circle cx="512" cy="112" r="6" fill="#f2a7b5"/><text class="og-hide" x="152" y="108" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle">all witnesses</text><text class="og-hide" x="250" y="258" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle">filtered real</text><text class="og-hide" x="250" y="278" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle">witnesses R</text><text class="og-hide" x="520" y="150" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start">H</text><text class="og-hide" x="520" y="168" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">exposed witness</text><text class="og-hide" x="520" y="183" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">(Ha and Kye)</text><text class="og-hide" x="540" y="226" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">D: separable state</text><text class="og-hide" x="540" y="241" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">touching only H</text><text class="og-hide" x="524" y="100" fill="#f2a7b5" font-family="Georgia,serif" font-size="18" font-weight="bold" font-style="italic" text-anchor="start">ρ<tspan font-size="13" dy="5">ε</tspan></text><text class="og-hide" x="552" y="104" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">detected by H,</text><text class="og-hide" x="552" y="119" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">missed by all of R</text><text class="og-hide" x="740" y="128" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="start">On the explicit state ρ<tspan font-size="11" dy="4">ε</tspan></text><text class="og-hide" x="740" y="160" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">complex witness H:</text><text class="og-hide" x="940" y="160" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">−8/19199997</text><text class="og-hide" x="740" y="188" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">every filtered real witness:</text><text class="og-hide" x="940" y="188" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">&gt; 8.5 × 10⁻¹⁰</text><text class="og-hide" x="740" y="216" fill="#e6e1ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">certified ball radius:</text><text class="og-hide" x="940" y="216" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" font-style="normal" text-anchor="start">8 × 10⁻¹⁰</text><line x1="740" y1="236" x2="1140" y2="236" stroke="#e6e1ea" stroke-width="1"/><text class="og-hide" x="740" y="262" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">3 × 3 (two qutrits): both parts fail</text><text class="og-hide" x="740" y="284" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">2 × 4: local unitaries fail; filters open</text><text class="og-hide" x="740" y="306" fill="#a8e0b0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">one extra local qubit restores detection</text><text class="og-hide" x="740" y="336" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Far too fragile for experiment: noise threshold about 1.6 × 10⁻⁷.</text><text class="og-hide" x="1160" y="386" fill="#c9c2cf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="end">Schematic of convex sets, not data. Witness and separable state: Ha and Kye. Unrefereed candidate.</text>
</svg>
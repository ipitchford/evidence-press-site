<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on whether additive noise preserves median-based (van Zwet) skewness. Left: the density of a right-skewed triangular variable on [0, 1] plus independent uniform noise on [−1, 1], with its median 1/3 marked; the two tails beyond distance t = 2/3 from the median are shaded, and the left tail carries more probability. Right: the tail imbalance D(t), the probability more than t below the median minus the probability more than t above it, plotted for t from 0 to 2 and computed from the exact model. It is zero up to t = 1/3, positive (left tail heavier) up to t = 1, with D(2/3) = +1/162 marked, then negative (right tail heavier) up to t = 5/3, with D(3/2) = −1/1296 marked. Footer: skewness survives uniform noise of half-width at most (3 − √3)/4 ≈ 0.317.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

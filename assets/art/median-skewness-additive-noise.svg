<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="slate" role="img" aria-labelledby="art-description">
<desc id="art-description">This image helps the reader understand that adding uniform noise to a right-skewed triangular variable makes the heavier tail switch sides: the left tail wins at some distances from the median and the right tail at others.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#182b3a"/><stop offset="1" stop-color="#365368"/>
</linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.45">
<stop offset="0" stop-color="#9fd3ff" stop-opacity="0.07"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="56" y="80" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">PROBABILITY · SKEWNESS</text>
<text class="og-hide" x="56" y="148" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">The heavier tail switches</text>
<text class="og-hide" x="56" y="194" fill="#f6f2ea" font-family="Georgia,serif" font-size="40" font-weight="normal" text-anchor="start">sides</text>
<text class="og-hide" x="56" y="236" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">Triangle plus uniform noise: left tail heavier at</text>
<text class="og-hide" x="56" y="264" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">distance 2/3, right tail heavier at 3/2</text>
<text class="og-hide" x="56" y="344" fill="#d9d3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">UNREFEREED CANDIDATE</text>
<rect x="752" y="56.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#ffc36b" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="99.69999999999999" fill="#ffc36b" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">+1/162</text>
<text class="og-hide" x="948" y="125.69999999999999" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">imbalance at 2/3</text>
<rect x="752" y="158.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#9fd3ff" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="201.7" fill="#9fd3ff" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">−1/1296</text>
<text class="og-hide" x="948" y="227.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">imbalance at 3/2</text>
<rect x="752" y="260.0" width="392" height="84.0" rx="14" fill="#000" fill-opacity="0.22" stroke="#a8e0b0" stroke-opacity="0.55"/>
<text class="og-hide" x="948" y="303.7" fill="#a8e0b0" font-family="Georgia,serif" font-size="42" font-weight="normal" text-anchor="middle">0.317</text>
<text class="og-hide" x="948" y="329.7" fill="#f6f2ea" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">safe noise half-width</text>
</svg>
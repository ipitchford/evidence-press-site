<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on geodesic hyperbolic sliced Wasserstein distance, drawn for the two-dimensional case with quadratic loss. Left: the Klein disc with centre o; points on one ray at hyperbolic depth r = 1, 2, 4 and 8 crowd against the boundary circle. Two points u and w on the boundary circle, at angle alpha, have squared sliced distance exactly pi times alpha. Right: a plot against depth r. The hyperbolic distance from the centre rises as the straight line r, while the sliced distance levels off at pi/2; points at depths 4 and 8 on the same ray are only 0.21 apart.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.45" r="0.42">
<stop offset="0" stop-color="#ffcf6e" stop-opacity="0.06"/><stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#f4f1ea" font-family="Georgia,serif" font-size="26" font-weight="normal" text-anchor="start">What hyperbolic sliced Wasserstein distance can and cannot see</text><text class="og-hide" x="40" y="77" fill="#e3d9c9" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">It converges weakly on the closed disc: mass escaping to infinity lands on the boundary circle, and depth far out is almost invisible</text><text class="og-hide" x="48" y="112" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">The Klein disc (d = 2)</text><text class="og-hide" x="48" y="133" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">geodesics are straight chords · infinity is the boundary circle</text><circle cx="205" cy="278" r="100" fill="#ffffff" fill-opacity=".04" stroke="#e3d9c9" stroke-opacity=".75" stroke-width="2"/><path d="M205 278 H305" stroke="#e3d9c9" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="4 4"/><circle cx="281.2" cy="278" r="5.5" fill="#8fd3ff"/><circle cx="301.4" cy="278" r="5.5" fill="#8fd3ff"/><circle cx="304.9" cy="278" r="5.5" fill="#8fd3ff"/><circle cx="305.0" cy="278" r="5.5" fill="#8fd3ff"/><text class="og-hide" x="281.1594155955765" y="266" fill="#8fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">r = 1</text><text class="og-hide" x="313" y="302" fill="#8fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="start">r = 2, 4, 8</text><circle cx="205" cy="278" r="4" fill="#f4f1ea"/><text class="og-hide" x="195" y="296" fill="#f4f1ea" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="end">o</text><path d="M205 278 L298.6 242.8 M205 278 L204.1 178.0" stroke="#b8f0c8" stroke-opacity=".6" stroke-width="1.4"/><path d="M242.4 263.9 A40 40 0 0 0 204.6 238.0" stroke="#b8f0c8" stroke-width="2" fill="none"/><text class="og-hide" x="236.7" y="236.8" fill="#b8f0c8" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="middle">α</text><circle cx="298.6" cy="242.8" r="6.5" fill="#b8f0c8"/><circle cx="204.1" cy="178.0" r="6.5" fill="#b8f0c8"/><text class="og-hide" x="310.6" y="238.8" fill="#b8f0c8" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="start">u</text><text class="og-hide" x="192.1" y="180.0" fill="#b8f0c8" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="end">w</text><text class="og-hide" x="368" y="200" fill="#b8f0c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">two points at infinity,</text><text class="og-hide" x="368" y="219" fill="#b8f0c8" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">angle α apart:</text><text class="og-hide" x="368" y="247" fill="#b8f0c8" font-family="Georgia,serif" font-size="19" font-weight="bold" text-anchor="start">distance² = π·α</text><text class="og-hide" x="368" y="267" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">exactly (Prop. 4.3)</text><text class="og-hide" x="368" y="330" fill="#8fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">far-out points on one ray</text><text class="og-hide" x="368" y="349" fill="#8fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">crowd against the edge</text><path d="M612 100 L 612 380" stroke="#e3d9c9" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="640" y="112" fill="#f4f1ea" font-family="Georgia,serif" font-size="16" font-weight="bold" text-anchor="start">A point moving out along one ray</text><text class="og-hide" x="640" y="133" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" text-anchor="start">distance from the centre o, against depth r (quadratic loss)</text><path d="M690 164 V352 H1150" stroke="#e3d9c9" stroke-opacity=".6" stroke-width="1.3" fill="none"/><text class="og-hide" x="682" y="356.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><text class="og-hide" x="682" y="310.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text class="og-hide" x="682" y="264.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text class="og-hide" x="682" y="218.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><text class="og-hide" x="682" y="172.0" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><text class="og-hide" x="690.0" y="371" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><text class="og-hide" x="805.0" y="371" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text class="og-hide" x="920.0" y="371" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text class="og-hide" x="1035.0" y="371" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text class="og-hide" x="1150.0" y="371" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><text class="og-hide" x="1150" y="389" fill="#c4b7a2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" text-anchor="end">depth r</text><path d="M690 352 L1150.0 168.0" stroke="#ff9f8a" stroke-width="3.2"/><text class="og-hide" x="928.6" y="239.3" fill="#ff9f8a" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="end">hyperbolic distance: r</text><path d="M690 315.9 H1150" stroke="#ffcf6e" stroke-opacity=".55" stroke-width="1.3" stroke-dasharray="5 5"/><path d="M690.0 352.0 L695.8 350.4 L701.5 348.8 L707.3 347.2 L713.0 345.6 L718.8 344.0 L724.5 342.5 L730.3 341.1 L736.0 339.6 L741.8 338.3 L747.5 336.9 L753.3 335.7 L759.0 334.4 L764.8 333.3 L770.5 332.2 L776.3 331.1 L782.0 330.2 L787.8 329.2 L793.5 328.3 L799.3 327.5 L805.0 326.7 L810.8 326.0 L816.5 325.3 L822.3 324.6 L828.0 324.0 L833.8 323.4 L839.5 322.9 L845.3 322.4 L851.0 321.9 L856.8 321.5 L862.5 321.1 L868.3 320.7 L874.0 320.3 L879.8 320.0 L885.5 319.7 L891.3 319.4 L897.0 319.1 L902.8 318.9 L908.5 318.7 L914.3 318.5 L920.0 318.3 L925.8 318.1 L931.5 317.9 L937.3 317.8 L943.0 317.6 L948.8 317.5 L954.5 317.3 L960.3 317.2 L966.0 317.1 L971.8 317.0 L977.5 316.9 L983.2 316.9 L989.0 316.8 L994.7 316.7 L1000.5 316.6 L1006.2 316.6 L1012.0 316.5 L1017.7 316.5 L1023.5 316.4 L1029.2 316.4 L1035.0 316.3 L1040.7 316.3 L1046.5 316.3 L1052.2 316.2 L1058.0 316.2 L1063.7 316.2 L1069.5 316.1 L1075.2 316.1 L1081.0 316.1 L1086.7 316.1 L1092.5 316.1 L1098.2 316.1 L1104.0 316.0 L1109.7 316.0 L1115.5 316.0 L1121.2 316.0 L1127.0 316.0 L1132.7 316.0 L1138.5 316.0 L1144.2 316.0 L1150.0 316.0" stroke="#ffcf6e" stroke-width="3.5" fill="none"/><text class="og-hide" x="1150" y="305.9" fill="#ffcf6e" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="end">sliced distance levels off at π/2</text><text class="og-hide" x="1150" y="335.9" fill="#ffcf6e" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="end">depths 4 and 8: only 0.21 apart</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on which random transitions keep a Gaussian kernel space invariant. Left: the exact admissible region from Corollary 6.1 for a two-branch Gaussian mixture with a bump-shaped gate e^(−αx²), plotted from the formula α ≤ 8q/(1+4q) with the branch variance q from 0 to 3 on the horizontal axis and the gate steepness α on the vertical axis. The shaded region below the curve, boundary included, is admissible; above it the operator is unbounded. Marked points: q = 1/12 at α = 1/2, q = 1/4 at α = 1 and q = 3/4 at α = 3/2; the curve approaches α = 2 as q grows. Right: two schematic complex planes. A probit gate Φ(βx) is entire with Gaussian growth and passes exactly when β² ≤ 16q/(1+4q); a logistic gate has poles at ±iπ, ±3iπ and so on, and is never admissible. Footer: additive noise of any law never rescues a nonlinear drift (Theorem 2.1).</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#f6c177" stop-opacity="0.06"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

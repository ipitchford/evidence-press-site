text class="og-hide" x="580" y="285" fill="#9fd3ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">spread design by at least ½ log 1.5 nats once there are many colours.</text><text class="og-hide" x="580" y="320" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">The threshold palette is not explicit (at least ten).</text><text class="og-hide" x="40" y="384" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Left: the star design, one shared colour (gold) paired with every other colour, one coin repeated; middle: the cycle Pelekis conjectured optimal. Unrefereed candidate.</text>

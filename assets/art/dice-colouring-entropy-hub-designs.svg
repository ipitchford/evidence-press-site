<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper on which dice colourings make the number of colours seen most uncertain. Title: most uncertain colour count: share one colour on every coin. Subtitle: paint coins with colours, toss them all, count the colours that show; which painting makes that count hardest to predict? Left: a star diagram, a gold hub colour joined to eleven blue colours by coins, with one spoke drawn thick and labelled repeated coin, captioned shared colour on every coin. Middle: twelve grey colours joined in a cycle, captioned evenly spread: a cycle. Right: same 12 colours, 12 coins; uncertainty of the count, computed exactly: star 1.912 nats, cycle 1.274 nats. Coins: for every large enough palette the star is the unique best design; extra coins repeat up to three pairs, or one pair four or more times. Dice with any number of faces: hub designs beat every evenly spread design by at least one half log 1.5 nats once there are many colours. The threshold palette is not explicit (at least ten). Footer: left, the star design, one shared colour paired with every other colour, one coin repeated; middle, the cycle Pelekis conjectured optimal; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.55" r="0.35">
<stop offset="0" stop-color="#ffc36b" stop-opacity="0.07"/><stop offset="1" stop-color="#ffc36b" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="46" fill="#f6f2ea" font-family="Georgia,serif" font-size="27" font-weight="normal" font-style="normal" text-anchor="start">Most uncertain colour count: share one colour on every coin</text><text class="og-hide" x="40" y="74" fill="#e2e7ea" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="start">Paint coins with colours, toss them all, count the colours that show. Which painting makes that count hardest to predict?</text><line x1="200" y1="218" x2="200.0" y2="114.0" stroke="#ffc36b" stroke-width="7" stroke-linecap="round" opacity="1"/><circle cx="200.0" cy="114.0" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="256.2" y2="130.5" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="256.2" cy="130.5" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="294.6" y2="174.8" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="294.6" cy="174.8" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="302.9" y2="232.8" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="302.9" cy="232.8" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="278.6" y2="286.1" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="278.6" cy="286.1" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="229.3" y2="317.8" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="229.3" cy="317.8" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="170.7" y2="317.8" stroke="#e2e7ea" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/><circle cx="170.7" cy="317.8" r="9" fill="#9fd3ff" stroke="#111" stroke-width="1.2"/><line x1="200" y1="218" x2="121.4" y2="286.1" 
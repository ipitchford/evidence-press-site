<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="oxblood" role="img" aria-labelledby="art-description">
<desc id="art-description">Two induced obstructions to all-coupling whole-spectrum freeness: a claw K1,3 and an even hole illustrated by C6. Their exclusion is necessary and sufficient under faithful Pauli realisation. Sector-wise freeness is a different property.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#301720"/><stop offset="1" stop-color="#61313d"/>
</linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.3" r="0.9">
<stop offset="0" stop-color="#6ddbc4" stop-opacity="0.06"/><stop offset="1" stop-color="#6ddbc4" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="600" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#b9ced0">WHOLE-SPECTRUM FREENESS AT EVERY COUPLING</text><path d="M210,208 L125,122" stroke="#f0c274" stroke-width="4"/><path d="M210,208 L120,285" stroke="#f0c274" stroke-width="4"/><path d="M210,208 L315,208" stroke="#f0c274" stroke-width="4"/><circle cx="210" cy="208" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="125" cy="122" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="120" cy="285" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="315" cy="208" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><path d="M656,207 L610.5,285.8083117443839" stroke="#f0c274" stroke-width="4"/><path d="M610.5,285.8083117443839 L519.5,285.8083117443839" stroke="#f0c274" stroke-width="4"/><path d="M519.5,285.8083117443839 L474,207" stroke="#f0c274" stroke-width="4"/><path d="M474,207 L519.5,128.1916882556161" stroke="#f0c274" stroke-width="4"/><path d="M519.5,128.1916882556161 L610.5,128.1916882556161" stroke="#f0c274" stroke-width="4"/><path d="M610.5,128.1916882556161 L656,207" stroke="#f0c274" stroke-width="4"/><circle cx="656" cy="207" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="610.5" cy="285.8083117443839" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="519.5" cy="285.8083117443839" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="474" cy="207" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="519.5" cy="128.1916882556161" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><circle cx="610.5" cy="128.1916882556161" r="11" fill="#f0c274" stroke="#17282e" stroke-width="3"/><text class="og-hide" x="210" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#eff4ed">No induced claw</text><text class="og-hide" x="565" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#eff4ed">No induced even hole</text><path d="M748 95 V320" stroke="#b9ced0" stroke-opacity=".3"/><text class="og-hide" x="975" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#6ddbc4">Exactly the criterion</text><text class="og-hide" x="975" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#eff4ed">for faithful Pauli terms</text><text class="og-hide" x="975" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#b9ced0">and independent couplings</text><text class="og-hide" x="600" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#b9ced0">An even hole has no chords · C₆ illustrated · unrefereed candidate</text>
</svg>
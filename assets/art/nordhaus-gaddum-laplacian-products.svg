ed to a</text><text class="og-hide" x="470" y="328" fill="#ffd27f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Fano line of 3</text><path d="M672 104 L 672 384" stroke="#d6e6e6" stroke-opacity=".22" stroke-width="1.2"/><text class="og-hide" x="700" y="124" fill="#d6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">Product of the 6th Laplacian eigenvalues</text><text class="og-hide" x="700" y="146" fill="#d6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">of this graph and of its complement:</text><text class="og-hide" x="700" y="226" fill="#ffd27f" font-family="Georgia,serif" font-size="58" font-weight="bold" text-anchor="start">115.85 &gt; 112</text><text class="og-hide" x="700" y="262" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="start">exactly 63 + 7√57</text><text class="og-hide" x="700" y="288" fill="#ffb38a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" text-anchor="start">conjectured limit: n(n − k) = 14 × 8 = 112</text><text class="og-hide" x="700" y="334" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">Both eigenvalues stay high at the same rank,</text><text class="og-hide" x="700" y="352" fill="#eef6f6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" text-anchor="start">so the 2025 conjecture fails.</text>

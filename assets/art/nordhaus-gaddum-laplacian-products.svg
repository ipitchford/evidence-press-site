<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="petrol" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper disproving a conjecture on Laplacian eigenvalues of a graph and its complement. Left: the 14-vertex counterexample, with seven filled vertices in the centre all joined to each other and seven open vertices around them, each open vertex joined to three filled vertices forming a line of the Fano plane. Right: the result. The product of the sixth Laplacian eigenvalues of this graph and of its complement is exactly 63 + 7 root 57, about 115.85, which exceeds 112, the conjectured limit n(n minus k) = 14 times 8.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#102b30"/><stop offset="1" stop-color="#245057"/>
</linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.55" r="0.42">
<stop offset="0" stop-color="#ffd27f" stop-opacity="0.06"/><stop offset="1" stop-color="#ffd27f" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="plum" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper classifying integrable homogeneous polynomial potentials for the relativistic Hamiltonian. Title: which force fields stay integrable under relativity? Subtitle: for H equals the square root of 1 plus p squared, plus V, with V a homogeneous polynomial of degree k at least 3; contour maps of V for k equals 4. Three square panels of contour lines. First panel, green: straight vertical lines with an arrow along them, labelled c times x to the k; slide along y: unchanged; survives. Second panel, green: concentric circles with a curved arrow, labelled c times (x squared plus y squared) to the power k over 2; rotate: unchanged; survives. Third panel, pink: rounded-square contours, labelled x to the 4 plus y to the 4; integrable classically; fails relativistically. Right: relativity keeps only two kinds of polynomial potential integrable: c times x to the k and c times (x squared plus y squared) to the power k over 2, up to rotation, for every degree k at least 3 (new for k at least 6). Their extra conserved quantity is the matching momentum. Along the direction where the absolute value of V is largest, the sideways eigenvalue lambda must be 0 or 1, and any sideways term fails. Integrals meromorphic on the complex phase space. Footer: contour lines are level sets of V; arrows show the symmetry that leaves V unchanged; unrefereed candidate.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#291b35"/><stop offset="1" stop-color="#51375e"/>
</linearGradient>
<radialGradient id="glow" cx="0.25" cy="0.5" r="0.35">
<stop offset="0" stop-color="#a8e6c1" stop-opacity="0.07"/><stop offset="1" stop-color="#a8e6c1" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>

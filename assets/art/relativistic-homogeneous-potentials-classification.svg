ine-shift="super" font-size="0.62em">k</tspan>  and  c·(x<tspan baseline-shift="super" font-size="0.62em">2</tspan> + y<tspan baseline-shift="super" font-size="0.62em">2</tspan>)<tspan baseline-shift="super" font-size="0.62em">k/2</tspan></text><text class="og-hide" x="740" y="218" fill="#ffc36b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">up to rotation, for every degree k ≥ 3 (new for k ≥ 6)</text><text class="og-hide" x="740" y="250" fill="#a8e6c1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="start">Their extra conserved quantity is the matching momentum.</text><text class="og-hide" x="740" y="280" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">Along the direction where |V| is largest, the sideways</text><text class="og-hide" x="740" y="298" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="start">eigenvalue λ must be 0 or 1, and any sideways term fails.</text><text class="og-hide" x="740" y="330" fill="#f2a7b5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start">Integrals meromorphic on the complex phase space.</text><text class="og-hide" x="40" y="386" fill="#c3ccd2" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start">Contour lines are level sets of V; arrows show the symmetry that leaves V unchanged. Unrefereed candidate.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" data-banner-palette="bronze" role="img" aria-labelledby="art-description">
<desc id="art-description">Banner for a paper classifying when Weniger’s delta transformation of a Stieltjes series has all its poles on the branch cut. Left: the complex z-plane drawn with equal scales on both axes. The branch cut, the negative real axis from minus infinity to 0, is a thick amber line labelled as the place where Padé approximants keep every pole. For the order-3 delta transformation with n = 0, beta = 1 and the positive measure delta_1 + 50 delta_{1/50} + 10^-3 e^-t dt, two real poles sit on the cut at -0.065 and 0, and a genuine nonreal conjugate pair sits just off it at -0.8832 plus or minus 0.0824i, with residue 0.357 minus 1.360i at the lower pole and its conjugate at the upper. Positions are rounded; the paper certifies the nonreal pair in exact rational arithmetic. Right: whether every Stieltjes measure keeps the delta poles on the cut, by order k: always at k = 1 and 2; at k = 3 only when n + beta is at most (sqrt(33) - 5)/2, about 0.372; from k = 4 on never guaranteed, because some measure gives a nonreal pair. The mechanism, in the paper: tuning the moments isolates three consecutive denominator coefficients, whose quadratic has nonreal roots exactly when h_j^2 is less than 4 h_{j-1} h_{j+1}, and the delta weights fail this factor-four test from order four.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#302319"/><stop offset="1" stop-color="#58442b"/>
</linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.62" r="0.45">
<stop offset="0" stop-color="#8fe3ff" stop-opacity="0.08"/><stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#glow)"/>
<text class="og-hide" x="40" y="50" fill="#fff6ea" font-family="Georgia,serif" font-size="27" font-weight="normal" text-anchor="start">Weniger’s delta transformation can put poles off the cut</text><text class="og-hide" x="40" y="80" fill="#ead8c2" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="normal" text-anchor="start">Order-3 delta transformation of one Stieltjes series: two real poles on the cut and a genuine nonreal pair beside it</text><path d="M762 118 V372" stroke="#ead8c2" stroke-opacity=".35" stroke-width="1.5"/><path d="M762 246 H824.0" stroke="#ead8c2" stroke-opacity=".45" stroke-width="2"/><text class="og-hide" x="772" y="132" fill="#d2bb9f" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">Im z</text><text class="og-hide" x="822.0" y="236" fill="#d2bb9f" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="end">Re z</text><path d="M28 246 H762" stroke="#ffb45c" stroke-opacity=".22" stroke-width="16" stroke-linecap="round"/><path d="M28 246 H762" stroke="#ffb45c" stroke-width="5" stroke-linecap="round"/><text class="og-hide" x="30" y="276" fill="#ffb45c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">← −∞</text><path d="M142.0 252 V259" stroke="#ead8c2" stroke-opacity=".7" stroke-width="2"/><text class="og-hide" x="142.0" y="277" fill="#d2bb9f" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">−1</text><path d="M452.0 252 V259" stroke="#ead8c2" stroke-opacity=".7" stroke-width="2"/><text class="og-hide" x="452.0" y="277" fill="#d2bb9f" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="middle">−0.5</text><text class="og-hide" x="590" y="308" fill="#ffb45c" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="middle">branch cut (−∞, 0]</text><text class="og-hide" x="590" y="331" fill="#ead8c2" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Padé approximants keep every pole on it</text><circle cx="721.7" cy="246" r="8" fill="#ffe2a8" stroke="#2b1a0c" stroke-width="2.5"/><circle cx="762.0" cy="246" r="8" fill="#ffe2a8" stroke="#2b1a0c" stroke-width="2.5"/><path d="M741.9 232 V206" stroke="#ffe2a8" stroke-opacity=".6" stroke-width="1.5"/><text class="og-hide" x="747.9" y="198" fill="#ffe2a8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" text-anchor="end">δ<tspan baseline-shift="sub" font-size="72%">3</tspan> real poles: −0.065 and 0</text><path d="M214.4 194.9 V297.1" stroke="#8fe3ff" stroke-opacity=".35" stroke-dasharray="3 5" stroke-width="1.5"/><circle cx="214.4" cy="194.9" r="17" fill="#8fe3ff" fill-opacity=".16"/><circle cx="214.4" cy="194.9" r="9" fill="#8fe3ff" stroke="#2b1a0c" stroke-width="2.5"/><circle cx="214.4" cy="297.1" r="17" fill="#8fe3ff" fill-opacity=".16"/><circle cx="214.4" cy="297.1" r="9" fill="#8fe3ff" stroke="#2b1a0c" stroke-width="2.5"/><text class="og-hide" x="236.4" y="192.9" fill="#8fe3ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="start">−0.8832 + 0.0824i</text><text class="og-hide" x="236.4" y="309.1" fill="#8fe3ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" text-anchor="start">−0.8832 − 0.0824i</text><text class="og-hide" x="194.4" y="140" fill="#8fe3ff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" text-anchor="start">δ<tspan baseline-shift="sub" font-size="72%">3</tspan>: a genuine nonreal pair, just off the cut</text><text class="og-hide" x="236.4" y="331.1" fill="#ead8c2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="normal" text-anchor="start">residue 0.357 − 1.360i</text><path d="M850 112 V360" stroke="#ead8c2" stroke-opacity=".22" stroke-width="1.5"/><text class="og-hide" x="878" y="134" fill="#fff6ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">Poles on the cut for every</text><text class="og-hide" x="878" y="155" fill="#fff6ea" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">Stieltjes measure?</text><text class="og-hide" x="878" y="196" fill="#fff6ea" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">k = 1, 2</text><text class="og-hide" x="966" y="196" fill="#b6ec9c" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">always</text><text class="og-hide" x="878" y="240" fill="#fff6ea" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">k = 3</text><text class="og-hide" x="966" y="240" fill="#ffe2a8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">only if n + β ≤ 0.372</text><text class="og-hide" x="966" y="261" fill="#d2bb9f" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">0.372 ≈ (√33 − 5)/2</text><text class="og-hide" x="878" y="302" fill="#fff6ea" font-family="Georgia,serif" font-size="17" font-weight="bold" text-anchor="start">k ≥ 4</text><text class="og-hide" x="966" y="302" fill="#ff9f8c" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" text-anchor="start">never guaranteed</text><text class="og-hide" x="966" y="323" fill="#d2bb9f" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">some measure gives a nonreal pair</text><text class="og-hide" x="878" y="356" fill="#8fe3ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" text-anchor="start">example shown: k = 3, n = 0, β = 1</text><text class="og-hide" x="40" y="388" fill="#d2bb9f" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">measure δ₁ + 50 δ<tspan baseline-shift="sub" font-size="75%">1/50</tspan> + 10<tspan baseline-shift="super" font-size="72%">−3</tspan> e<tspan baseline-shift="super" font-size="72%">−t</tspan> dt · equal scales on both axes · positions rounded; the paper certifies the nonreal pair exactly</text>
</svg>
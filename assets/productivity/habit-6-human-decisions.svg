<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Keep the decisions human</title><desc id="d">AI steps flow freely until an action that sends, publishes, spends or deletes, which waits for a person to approve.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13232f"/><stop offset="1" stop-color="#24384a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbe65" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="720" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="360" y="48" fill="#fff9ed" font-size="26" text-anchor="middle" font-weight="700">The AI does the work; a person makes the calls</text><rect x="54" y="139" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="63.8" cy="153" r="2.7" fill="#13232f"/><circle cx="76.2" cy="153" r="2.7" fill="#13232f"/><path d="M90 155H128" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="134" y="139" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="143.8" cy="153" r="2.7" fill="#13232f"/><circle cx="156.2" cy="153" r="2.7" fill="#13232f"/><path d="M170 155H208" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="214" y="139" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="223.8" cy="153" r="2.7" fill="#13232f"/><circle cx="236.2" cy="153" r="2.7" fill="#13232f"/><path d="M250 155H288" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="294" y="139" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="303.8" cy="153" r="2.7" fill="#13232f"/><circle cx="316.2" cy="153" r="2.7" fill="#13232f"/><text x="190" y="212" fill="#a9b6c4" font-size="20" text-anchor="middle">drafting, checking, building</text><path d="M335 155H385" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="395" y="90" width="16" height="130" rx="6" fill="#efbe65"/><circle cx="462" cy="143" r="13" fill="#efbe65"/><path d="M440 183c0-22 10-30 22-30s22 8 22 30z" fill="#efbe65"/><text x="462" y="240" fill="#efbe65" font-size="18" text-anchor="middle">a person approves</text><path d="M505 155H545" stroke="#efbe65" stroke-width="3" marker-end="url(#ag)"/><text x="612" y="112" fill="#fff9ed" font-size="21" text-anchor="middle">send</text><text x="612" y="144" fill="#fff9ed" font-size="21" text-anchor="middle">publish</text><text x="612" y="176" fill="#fff9ed" font-size="21" text-anchor="middle">spend</text><text x="612" y="208" fill="#fff9ed" font-size="21" text-anchor="middle">delete</text></g></svg>

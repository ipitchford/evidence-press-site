<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Keep a notebook the AI reads</title><desc id="d">A notebook of instructions and lessons is read at the start of each session, and each session adds new lessons back to it.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13232f"/><stop offset="1" stop-color="#24384a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbe65" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="720" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="360" y="44" fill="#fff9ed" font-size="26" text-anchor="middle" font-weight="700">Explain once; every session starts informed</text><rect x="55" y="80" width="130" height="165" rx="10" fill="none" stroke="#efbe65" stroke-width="3"/><path d="M75 80V245" stroke="#efbe65" stroke-width="3"/><path d="M92 112H168" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M92 137H150" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M92 162H168" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M92 187H150" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M92 212H168" stroke="#efbe65" stroke-width="3" opacity=".7"/><text x="120" y="275" fill="#a9b6c4" font-size="20" text-anchor="middle">the notebook</text><path d="M195 120C290 120 320 95 405 95" fill="none" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="419" y="79" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="428.8" cy="93" r="2.7" fill="#13232f"/><circle cx="441.2" cy="93" r="2.7" fill="#13232f"/><text x="465" y="102" fill="#fff9ed" font-size="19" text-anchor="start">Monday: reads it first</text><path d="M195 155C290 155 320 165 405 165" fill="none" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="419" y="149" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="428.8" cy="163" r="2.7" fill="#13232f"/><circle cx="441.2" cy="163" r="2.7" fill="#13232f"/><text x="465" y="172" fill="#fff9ed" font-size="19" text-anchor="start">Tuesday: reads it first</text><path d="M195 190C290 190 320 235 405 235" fill="none" stroke="#71d5d0" stroke-width="3" marker-end="url(#a)"/><rect x="419" y="219" width="32" height="32" rx="6.7" fill="#71d5d0"/><circle cx="428.8" cy="233" r="2.7" fill="#13232f"/><circle cx="441.2" cy="233" r="2.7" fill="#13232f"/><text x="465" y="242" fill="#fff9ed" font-size="19" text-anchor="start">Wednesday: reads it first</text><path d="M425 260C330 280 250 270 195 235" fill="none" stroke="#efbe65" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ag)"/><text x="330" y="290" fill="#efbe65" font-size="18" text-anchor="middle">new lessons written back</text></g></svg>

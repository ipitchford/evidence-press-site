<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Make one AI check another</title><desc id="d">A first AI writes a draft; a second AI, told to find mistakes, marks two errors; the corrected draft goes out.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13232f"/><stop offset="1" stop-color="#24384a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbe65" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="720" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="360" y="48" fill="#fff9ed" font-size="26" text-anchor="middle" font-weight="700">A second model, told to find mistakes</text><rect x="48" y="133" width="44" height="44" rx="9.2" fill="#efbe65"/><circle cx="61.5" cy="153" r="3.7" fill="#13232f"/><circle cx="78.5" cy="153" r="3.7" fill="#13232f"/><text x="70" y="210" fill="#a9b6c4" font-size="20" text-anchor="middle">writer</text><path d="M100 155H160" stroke="#efbe65" stroke-width="4" marker-end="url(#ag)"/><rect x="170" y="100" width="90" height="110" rx="8" fill="none" stroke="#fff9ed" stroke-width="3"/><path d="M184 120H246" stroke="#fff9ed" stroke-width="3" opacity=".7"/><path d="M184 136H232" stroke="#fff9ed" stroke-width="3" opacity=".7"/><path d="M184 152H246" stroke="#fff9ed" stroke-width="3" opacity=".7"/><path d="M184 168H232" stroke="#fff9ed" stroke-width="3" opacity=".7"/><circle cx="200" cy="136" r="14" fill="none" stroke="#e58f8a" stroke-width="3"/><circle cx="232" cy="168" r="14" fill="none" stroke="#e58f8a" stroke-width="3"/><path d="M275 155H330" stroke="#e58f8a" stroke-width="4" marker-end="url(#ar)"/><rect x="348" y="133" width="44" height="44" rx="9.2" fill="#e58f8a"/><circle cx="361.5" cy="153" r="3.7" fill="#13232f"/><circle cx="378.5" cy="153" r="3.7" fill="#13232f"/><circle cx="404" cy="126" r="15" fill="none" stroke="#fff9ed" stroke-width="4"/><path d="M415 137l13 13" stroke="#fff9ed" stroke-width="5" stroke-linecap="round"/><text x="370" y="212" fill="#a9b6c4" font-size="20" text-anchor="middle">checker</text><text x="370" y="240" fill="#e58f8a" font-size="18" text-anchor="middle">"find the errors"</text><path d="M450 155H545" stroke="#71d5d0" stroke-width="4" marker-end="url(#a)"/><text x="497" y="140" fill="#71d5d0" font-size="18" text-anchor="middle">errors fixed</text><rect x="560" y="100" width="90" height="110" rx="8" fill="none" stroke="#fff9ed" stroke-width="3"/><path d="M574 120H636" stroke="#fff9ed" stroke-width="3" opacity=".7"/
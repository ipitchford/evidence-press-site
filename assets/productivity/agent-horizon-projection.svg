<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-labelledby="t d">
<title id="t">Where the trend leads, if it holds</title><desc id="d">Projection on a logarithmic scale from METR's May 2026 estimate of about 12 hours of skilled human work. Doubling every 7 months reaches about 129 hours by May 2028; doubling every 3 months reaches about 3072 hours. A projection, not a forecast.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13232f"/><stop offset="1" stop-color="#24384a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbe65" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="1160" height="430" rx="18" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="580" y="46" fill="#fff9ed" font-size="26" text-anchor="middle" font-weight="700">How long a task can an AI agent take on? Where the trend leads, if it holds</text><path d="M170 330.0H930" stroke="#3b5267" stroke-width="2" stroke-dasharray="4 8"/><text x="160" y="336" fill="#a9b6c4" font-size="16" text-anchor="end">a working day</text><path d="M170 265.3H930" stroke="#3b5267" stroke-width="2" stroke-dasharray="4 8"/><text x="160" y="271.2558565662927" fill="#a9b6c4" font-size="16" text-anchor="end">a working week</text><path d="M170 207.0H930" stroke="#3b5267" stroke-width="2" stroke-dasharray="4 8"/><text x="160" y="213.04949181966936" fill="#a9b6c4" font-size="16" text-anchor="end">a working month</text><path d="M170 109.9H930" stroke="#3b5267" stroke-width="2" stroke-dasharray="4 8"/><text x="160" y="115.9472011411508" fill="#a9b6c4" font-size="16" text-anchor="end">a working year</text><text x="170" y="362" fill="#a9b6c4" font-size="16" text-anchor="middle">May 2026</text><text x="550" y="362" fill="#a9b6c4" font-size="16" text-anchor="middle">May 2027</text><text x="930" y="362" fill="#a9b6c4" font-size="16" text-anchor="middle">May 2028</text><polyline points="170.0,313.7 201.7,309.7 233.3,305.7 265.0,301.7 296.7,297.8 328.3,293.8 360.0,289.8 391.7,285.8 423.3,281.8 455.0,277.8 486.7,273.9 518.3,269.9 550.0,265.9 581.7,261.9 613.3,257.9 645.0,253.9 676.7,250.0 708.3,246.0 740.0,242.0 771.7,238.0 803.3,234.0 835.0,230.0 866.7,226.1 898.3,222.1 930.0,218.1" fill="none" stroke="#71d5d0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="170.0,313.7 201.7,304.4 233.3,295.1 265.0,285.8 296.7,276.5 328.3,267.2 360.0,257.9 391.7,248.6 423.3,239.3 455.0,230.0 486.7,220.7 518.3,211.4 550.0,202.2 581.7,192.9 613.3,183.6 645.0,174.3 676.7,165.0 708.3,155.7 740.0,146.4 771.7,137.1 803.3,127.8 835.0,118.5 866.7,109.2 898.3,99.9 930.0,90.6" fill="none" stroke="#efbe65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="313.7" r="9" fill="#fff9ed"/><text x="232" y="341.6890314849014" fill="#fff9ed" font-size="17" text-anchor="start">about 12 hours (METR, May 2026)</text><text x="942" y="96.61875268938851" fill="#efbe65" font-size="17" text-anchor="start">doubling every 3 months</text><text x="942" y="224.08748342968158" fill="#71d5d0" font-size="17" text-anchor="start">every 7 months</text><text x="580" y="405" fill="#a9b6c4" font-size="16" text-anchor="middle">Projection, not a forecast: METR’s measured doubling times applied to its May 2026 estimate, which it calls highly uncertain.</text></g></svg>

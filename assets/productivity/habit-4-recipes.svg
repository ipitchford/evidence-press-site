<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Turn every repeated job into a recipe</title><desc id="d">Schematic: the first attempt at a job takes longest; once its method is written down as a recipe, each repetition takes less time.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13232f"/><stop offset="1" stop-color="#24384a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#efbe65" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="720" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="360" y="44" fill="#fff9ed" font-size="26" text-anchor="middle" font-weight="700">Write the method down once; repeat it faster</text><text x="185" y="103" fill="#a9b6c4" font-size="20" text-anchor="end">first time</text><rect x="200" y="84" width="470" height="26" rx="13" fill="#efbe65"/><text x="185" y="151" fill="#a9b6c4" font-size="20" text-anchor="end">with the recipe</text><rect x="200" y="132" width="280" height="26" rx="13" fill="#71d5d0"/><text x="185" y="199" fill="#a9b6c4" font-size="20" text-anchor="end">next time</text><rect x="200" y="180" width="200" height="26" rx="13" fill="#71d5d0"/><text x="185" y="247" fill="#a9b6c4" font-size="20" text-anchor="end">and the next</text><rect x="200" y="228" width="150" height="26" rx="13" fill="#71d5d0"/><rect x="590" y="120" width="96" height="70" rx="8" fill="none" stroke="#efbe65" stroke-width="3"/><path d="M604 140H670" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M604 156H658" stroke="#efbe65" stroke-width="3" opacity=".7"/><path d="M604 172H646" stroke="#efbe65" stroke-width="3" opacity=".7"/><text x="638" y="214" fill="#efbe65" font-size="18" text-anchor="middle">recipe</text><path d="M590 160C560 175 520 160 490 150" fill="none" stroke="#efbe65" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#ag)"/><text x="360" y="285" fill="#a9b6c4" font-size="18" text-anchor="middle">schematic: each repetition starts from the written method</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">From an RNA array to a functioning system: the missing steps</title><desc id="desc">Transcription of the DNA array is supported by RNA evidence. The RNA substrate, reverse-transcriptase activity and biological role of ART remain unproved. Solid teal denotes reported evidence; dashed gold denotes proposed steps requiring experiments.</desc><rect width="960" height="900" rx="18" fill="#142d30"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="65" font-size="42" fill="#fff9ed" text-anchor="start">Where the evidence stops</text><text x="48" y="111" font-size="30" fill="#bbd6cf" text-anchor="start">Reported observations versus proposed function</text><rect x="48" y="152" width="864" height="135" rx="12" fill="#204640" stroke="#42d8c1" stroke-width="2"/><text x="78" y="198" font-size="36" fill="#fff9ed" text-anchor="start">1  DNA repeat array</text><text x="78" y="247" font-size="30" fill="#bbd6cf" text-anchor="start">A recurring upstream sequence pattern</text><path d="M112 296V337M98 324L112 340L126 324" fill="none" stroke="#42d8c1" stroke-width="5"/><text x="151" y="328" font-size="30" fill="#42d8c1" text-anchor="start">Transcription is supported</text><rect x="48" y="355" width="864" height="135" rx="12" fill="#204640" stroke="#42d8c1" stroke-width="2"/><text x="78" y="401" font-size="36" fill="#fff9ed" text-anchor="start">2  RNA from the array</text><text x="78" y="450" font-size="30" fill="#bbd6cf" text-anchor="start">Mature RNA identities remain provisional</text><path d="M112 501V549M98 536L112 552L126 536" fill="none" stroke="#efbe65" stroke-width="5" stroke-dasharray="8 7"/><text x="151" y="538" font-size="30" fill="#efbe65" text-anchor="start">Does ART copy these RNAs?</text><rect x="48" y="566" width="864" height="135" rx="12" fill="#343b33" stroke="#efbe65" stroke-width="2" stroke-dasharray="9 7"/><text x="78" y="612" font-size="36" fill="#fff9ed" text-anchor="start">3  Reverse-transcription activity</text><text x="78" y="661" font-size="30" fill="#bbd6cf" text-anchor="start">Substrate and DNA product not established</text><text x="48" y="759" font-size="34" fill="#efbe65" text-anchor="start">Still unknown: the system’s biological role</text><path d="M48 795H912" stroke="#648c84"/><text x="48" y="842" font-size="28" fill="#42d8c1" text-anchor="start">Solid: evidence reported in the preprint</text><text x="48" y="880" font-size="28" fill="#efbe65" text-anchor="start">Dashed: a hypothesis to test, not a demonstrated step</text></g></svg>

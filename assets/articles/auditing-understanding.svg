<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" data-banner-palette="oxblood">
<title id="t">Same observations, different interventions</title><desc id="d">Two constructed causal mechanisms give identical observations. Under a forced-on X, Y is always on in the first and on half the time in the second.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#301720"/><stop offset="1" stop-color="#61313d"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#fff6e8" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="600" y="53" font-size="38" fill="#fff6e8" text-anchor="middle">Same observations. Different consequences.</text>
<path d="M600 91V357" stroke="#fff6e8" opacity=".2"/>
<text x="300" y="110" font-size="29" fill="#f4cd78" text-anchor="middle">X controls Y</text><text x="900" y="110" font-size="29" fill="#a3e4d1" text-anchor="middle">Y controls X</text>
<text x="115" y="182" font-size="26" fill="#fff6e8" text-anchor="middle">signal</text><path d="M163 173L244 173" stroke="#fff6e8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="290" cy="173" r="34" fill="#f4cd78"/><text x="290" y="184" font-size="32" fill="#301720" text-anchor="middle">X</text><path d="M332 173L432 173" stroke="#fff6e8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="480" cy="173" r="34" fill="#f4cd78"/><text x="480" y="184" font-size="32" fill="#301720" text-anchor="middle">Y</text>
<text x="715" y="182" font-size="26" fill="#fff6e8" text-anchor="middle">signal</text><path d="M763 173L844 173" stroke="#fff6e8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="890" cy="173" r="34" fill="#a3e4d1"/><text x="890" y="184" font-size="32" fill="#301720" text-anchor="middle">Y</text><path d="M932 173L1032 173" stroke="#fff6e8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1080" cy="173" r="34" fill="#a3e4d1"/><text x="1080" y="184" font-size="32" fill="#301720" text-anchor="middle">X</text>
<text x="300" y="252" font-size="27" fill="#fff6e8" text-anchor="middle">Force X on</text><text x="900" y="252" font-size="27" fill="#fff6e8" text-anchor="middle">Force X on</text>
<text x="300" y="310" font-size="38" fill="#f4cd78" text-anchor="middle">Y is always on</text><text x="900" y="310" font-size="38" fill="#a3e4d1" text-anchor="middle">Y is on half the time</text>
<text x="600" y="374" font-size="25" fill="#fff6e8" text-anchor="middle">Observations alone cannot choose between these two models</text>
</g></svg>

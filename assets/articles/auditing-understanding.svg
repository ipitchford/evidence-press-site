<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="bt bd" data-banner-palette="oxblood">
<title id="bt">A longer program, the same answers</title><desc id="bd">For three switches, a compact parity program takes 2 exclusive-or steps and a padded version takes 46. A table of all 8 switch settings shows both give identical outputs.</desc>
<defs><linearGradient id="bbg" x2="1" y2="1"><stop stop-color="#301720"/><stop offset="1" stop-color="#61313d"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#bbg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="600" y="50" font-size="34" fill="#fff6e8" text-anchor="middle">More steps, same answers: 2 versus 46</text>
<text x="220" y="100" font-size="27" fill="#f4cd78" text-anchor="middle">Compact program</text>
<rect x="70" y="150" width="300" height="70" rx="12" fill="none" stroke="#f4cd78" stroke-width="3"/>
<text x="220" y="196" font-size="32" fill="#f4cd78" text-anchor="middle">x1 ⊕ x2 ⊕ x3</text>
<text x="220" y="270" font-size="40" fill="#f4cd78" text-anchor="middle">2 steps</text>
<path d="M470 100V362" stroke="#fff6e8" opacity=".25"/><path d="M730 100V362" stroke="#fff6e8" opacity=".25"/>
<text x="600" y="100" font-size="25" fill="#fff6e8" text-anchor="middle">All 8 settings</text>
<text x="526" y="132" font-size="0"> </text>
<text x="498" y="132" font-size="22" fill="#fff6e8">0 0 0</text><text x="612" y="132" font-size="22" fill="#f4cd78" text-anchor="middle">0</text><text x="676" y="132" font-size="22" fill="#a3e4d1" text-anchor="middle">0</text><text x="498" y="162" font-size="22" fill="#fff6e8">0 0 1</text><text x="612" y="162" font-size="22" fill="#f4cd78" text-anchor="middle">1</text><text x="676" y="162" font-size="22" fill="#a3e4d1" text-anchor="middle">1</text><text x="498" y="192" font-size="22" fill="#fff6e8">0 1 0</text><text x="612" y="192" font-size="22" fill="#f4cd78" text-anchor="middle">1</text><text x="676" y="192" font-size="22" fill="#a3e4d1" text-anchor="middle">1</text><text x="498" y="222" font-size="22" fill="#fff6e8">0 1 1</text><text x="612" y="222" font-size="22" fill="#f4cd78" text-anchor="middle">0</text><text x="676" y="222" font-size="22" fill="#a3e4d1" text-anchor="middle">0</text><text x="498" y="252" font-size="22" fill="#fff6e8">1 0 0</text><text x="612" y="252" font-size="22" fill="#f4cd78" text-anchor="middle">1</text><text x="676" y="252" font-size="22" fill="#a3e4d1" text-anchor="middle">1</text><text x="498" y="282" font-size="22" fill="#fff6e8">1 0 1</text><text x="612" y="282" font-size="22" fill="#f4cd78" text-anchor="middle">0</text><text x="676" y="282" font-size="22" fill="#a3e4d1" text-anchor="middle">0</text><text x="498" y="312" font-size="22" fill="#fff6e8">1 1 0</text><text x="612" y="312" font-size="22" fill="#f4cd78" text-anchor="middle">0</text><text x="676" y="312" font-size="22" fill="#a3e4d1" text-anchor="middle">0</text><text x="498" y="342" font-size="22" fill="#fff6e8">1 1 1</text><text x="612" y="342" font-size="22" fill="#f4cd78" text-anchor="middle">1</text><text x="676" y="342" font-size="22" fill="#a3e4d1" text-anchor="middle">1</text>
<text x="980" y="100" font-size="27" fill="#a3e4d1" text-anchor="middle">Padded program</text>
<g font-family="Courier New,monospace" font-size="15" fill="#a3e4d1" opacity=".8"><text x="790" y="140">x1⊕x2⊕x3⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2</text><text x="790" y="157">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="174">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="191">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="208">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="225">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="242">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="259">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="276">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text><text x="790" y="293">⊕(x1⊕x3)⊕(x1⊕x3)⊕(x2)⊕(x2)</text></g>
<text x="980" y="345" font-size="40" fill="#a3e4d1" text-anchor="middle">46 steps</text><text x="980" y="375" font-size="18" fill="#fff6e8" text-anchor="middle">illustrative excerpt</text>
<text x="220" y="330" font-size="20" fill="#fff6e8" text-anchor="middle">Each pair of identical terms cancels,</text><text x="220" y="356" font-size="20" fill="#fff6e8" text-anchor="middle">so padding changes nothing.</text>
</g></svg>

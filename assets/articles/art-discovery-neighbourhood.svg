<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">The ART genomic neighbourhood</title><desc id="desc">Schematic: repeated DNA units separated by spacers lie upstream of a reverse-transcriptase-like gene, with a recurring partner gene downstream. Four repeats illustrate the pattern, not a measured locus.</desc><rect width="960" height="320" rx="18" fill="#142d30"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" font-size="34" fill="#fff9ed" text-anchor="start">A newly recognised genetic arrangement</text><path d="M55 132H906" stroke="#648c84" stroke-width="5"/><rect x="98" y="115" width="78" height="34" rx="4" fill="#efbe65"/><rect x="200" y="115" width="78" height="34" rx="4" fill="#efbe65"/><rect x="302" y="115" width="78" height="34" rx="4" fill="#efbe65"/><rect x="74" y="100" width="24" height="64" rx="4" fill="#42d8c1"/><rect x="176" y="100" width="24" height="64" rx="4" fill="#42d8c1"/><rect x="278" y="100" width="24" height="64" rx="4" fill="#42d8c1"/><rect x="380" y="100" width="24" height="64" rx="4" fill="#42d8c1"/><path d="M475 90H668L710 132L668 174H475Z" fill="#42d8c1"/><path d="M744 90H862L904 132L862 174H744Z" fill="#efbe65"/><text x="224" y="217" font-size="32" fill="#fff9ed" text-anchor="middle">RNA array region</text><text x="591" y="217" font-size="32" fill="#fff9ed" text-anchor="middle">RT-like gene</text><text x="819" y="217" font-size="32" fill="#fff9ed" text-anchor="middle">Partner</text><rect x="64" y="257" width="24" height="30" rx="3" fill="#42d8c1"/><text x="105" y="282" font-size="30" fill="#fff9ed" text-anchor="start">Repeat</text><rect x="284" y="257" width="56" height="30" rx="3" fill="#efbe65"/><text x="357" y="282" font-size="30" fill="#fff9ed" text-anchor="start">Spacer</text><text x="660" y="282" font-size="28" fill="#bbd6cf" text-anchor="start">DNA · schematic</text></g></svg>

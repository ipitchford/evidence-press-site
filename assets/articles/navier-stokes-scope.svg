<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="scope-title scope-description">
  <title id="scope-title">Four fluid questions, four distinct reported states</title>
  <desc id="scope-description">A two-by-two matrix as of 9 September 2026. Columns distinguish smooth external forcing from no external force. Rows distinguish the viscous Navier–Stokes equations from the inviscid Euler equations. For forced Navier–Stokes, OpenAI claims blow-up corresponding to Clay alternatives C and D. Unforced Navier–Stokes remains open; alternatives A and B ask for global smoothness. For forced Euler, Alpöge and Buckmaster report blow-up, a different equation from Navier–Stokes. For unforced Euler, OpenAI claims blow-up, a separate result that does not settle Navier–Stokes alternatives A or B. These are reported claims, not independent validation by Evidence Press.</desc>
  <defs>
    <linearGradient id="scope-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d25"/>
      <stop offset="1" stop-color="#1b3037"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="890" rx="20" fill="url(#scope-background)"/>
  <path d="M52 51H100" stroke="#52cbbb" stroke-width="4"/>
  <text x="116" y="58" fill="#adbfbe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" letter-spacing="2">EVIDENCE PRESS · EXPLAINER</text>
  <text x="52" y="117" fill="#f4efe5" font-family="Georgia, 'Times New Roman', serif" font-size="38">Four questions, not one</text>
  <text x="52" y="154" fill="#bbc9c7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Reported mathematical scope · 9 September 2026</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="467" y="222" text-anchor="middle" fill="#f4efe5" font-size="26" font-weight="650">Forced</text>
    <text x="467" y="253" text-anchor="middle" fill="#bbc9c7" font-size="19">Smooth external force</text>
    <text x="925" y="222" text-anchor="middle" fill="#f4efe5" font-size="26" font-weight="650">Unforced</text>
    <text x="925" y="253" text-anchor="middle" fill="#bbc9c7" font-size="19">No external force</text>

    <text x="52" y="367" fill="#f4efe5" font-size="23" font-weight="650">Navier–Stokes</text>
    <text x="52" y="399" fill="#bbc9c7" font-size="21">Viscous</text>
    <text x="52" y="641" fill="#f4efe5" font-size="26" font-weight="650">Euler</text>
    <text x="52" y="673" fill="#bbc9c7" font-size="21">Inviscid</text>

    <rect x="258" y="285" width="418" height="231" rx="12" fill="#19363b" stroke="#4ea99e" stroke-width="1.5"/>
    <rect x="716" y="285" width="418" height="231" rx="12" fill="#34342d" stroke="#d4b365" stroke-width="1.5"/>
    <rect x="258" y="554" width="418" height="231" rx="12" fill="#19363b" stroke="#4ea99e" stroke-width="1.5"/>
    <rect x="716" y="554" width="418" height="231" rx="12" fill="#19363b" stroke="#4ea99e" stroke-width="1.5"/>

    <text x="286" y="328" fill="#81ddd0" font-size="18" font-weight="600" letter-spacing="1.1">OPENAI</text>
    <text x="286" y="378" fill="#f4efe5" font-size="30" font-weight="650">Claims blow-up</text>
    <path d="M286 402H648" stroke="#416368" stroke-width="1"/>
    <text x="286" y="440" fill="#d8e0dc" font-size="22">Clay alternatives C and D</text>
    <text x="286" y="474" fill="#adbfbe" font-size="19">Smoothness can break down.</text>

    <text x="744" y="328" fill="#ebcc83" font-size="18" font-weight="600" letter-spacing="1.1">UNRESOLVED</text>
    <text x="744" y="378" fill="#f4efe5" font-size="30" font-weight="650">Remains open</text>
    <path d="M744 402H1106" stroke="#6c6450" stroke-width="1"/>
    <text x="744" y="440" fill="#e2dfd3" font-size="22">Clay alternatives A and B</text>
    <text x="744" y="474" fill="#c8c3b3" font-size="19">Ask for global smoothness.</text>

    <text x="286" y="597" fill="#81ddd0" font-size="18" font-weight="600" letter-spacing="0.8">ALPÖGE–BUCKMASTER</text>
    <text x="286" y="647" fill="#f4efe5" font-size="30" font-weight="650">Report blow-up</text>
    <path d="M286 671H648" stroke="#416368" stroke-width="1"/>
    <text x="286" y="709" fill="#d8e0dc" font-size="22">A different equation</text>
    <text x="286" y="743" fill="#adbfbe" font-size="19">Distinct from Navier–Stokes.</text>

    <text x="744" y="597" fill="#81ddd0" font-size="18" font-weight="600" letter-spacing="1.1">OPENAI</text>
    <text x="744" y="647" fill="#f4efe5" font-size="30" font-weight="650">Claims blow-up</text>
    <path d="M744 671H1106" stroke="#416368" stroke-width="1"/>
    <text x="744" y="709" fill="#d8e0dc" font-size="22">A separate result</text>
    <text x="744" y="743" fill="#adbfbe" font-size="19">Not Clay Navier–Stokes A or B.</text>

    <text x="52" y="841" fill="#bbc9c7" font-size="20">Reported claims are not independent validation by Evidence Press.</text>
  </g>
</svg>

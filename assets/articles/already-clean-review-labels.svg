l="#d9a441"/><text x="820.4" y="280" fill="#ffffff" font-size="19" text-anchor="middle" font-weight="700">6</text><rect x="839.6" y="240" width="19.2" height="64" fill="#b07aa1"/><rect x="858.8" y="240" width="6.4" height="64" fill="#c8605a"/><rect x="865.2" y="240" width="6.4" height="64" fill="#8d8d8d"/><rect x="871.6" y="240" width="38.4" height="64" fill="#c9c4bb"/><text x="890.8" y="280" fill="#1d2a33" font-size="19" text-anchor="middle" font-weight="700">6</text><path d="M270 322v8H801.2v-8" fill="none" stroke="#1d2a33" stroke-width="1.6"/><text x="535.6" y="352" fill="#1d2a33" font-size="21" text-anchor="middle">one idea + branching = 83</text><path d="M801.2 362v8H839.6v-8" fill="none" stroke="#1d2a33" stroke-width="1.6"/><text x="849.6" y="376" fill="#1d2a33" font-size="21" text-anchor="start">+ unplaced cases = 89</text><rect x="40" y="441" width="18" height="18" fill="#2f7f7a"/><text x="66" y="455" fill="#1d2a33" font-size="20" text-anchor="start">One idea</text><rect x="220" y="441" width="18" height="18" fill="#5fb3ad"/><text x="246" y="455" fill="#1d2a33" font-size="20" text-anchor="start">Branching structure</text><rect x="470" y="441" width="18" height="18" fill="#d9a441"/><text x="496" y="455" fill="#1d2a33" font-size="20" text-anchor="start">One idea + unplaced cases</text><rect x="800" y="441" width="18" height="18" fill="#b07aa1"/><text x="826" y="455" fill="#1d2a33" font-size="20" text-anchor="start">Two related ideas</text><rect x="40" y="471" width="18" height="18" fill="#c8605a"/><text x="66" y="485" fill="#1d2a33" font-size="20" text-anchor="start">Mixture</text><rect x="220" y="471" width="18" height="18" fill="#8d8d8d"/><text x="246" y="485" fill="#1d2a33" font-size="20" text-anchor="start">Unresolved</text><rect x="470" y="471" width="18" height="18" fill="#c9c4bb"/><text x="496" y="485" fill="#1d2a33" font-size="20" text-anchor="start">No strong firings</text></g></svg>

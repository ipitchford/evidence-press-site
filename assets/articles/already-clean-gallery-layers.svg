<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="f2t f2d">
<title id="f2t">Layer position of the 500 dense-model neurons in Goodfire's gallery</title>
<desc id="f2d">Bars for successive quarters of Qwen3-32B's 64 layers: 53, 92, 142, 213 neurons. A uniform sample of coordinates would put about 125 in each quarter. 355 of 500 come from the latter half.</desc>
<rect width="1100" height="500" fill="#fffdf8"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="550" y="40" fill="#1d2a33" font-size="24" text-anchor="middle" font-weight="700">Qwen3-32B gallery neurons by layer quarter (500 neurons, 64 layers)</text>
<line x1="140" y1="400" x2="1050" y2="400" stroke="#1d2a33" stroke-width="2"/><rect x="170" y="333.75" width="160" height="66.25" fill="#8fc7c2"/><text x="250" y="321.75" fill="#1d2a33" font-size="24" text-anchor="middle" font-weight="700">53</text><text x="250" y="432" fill="#1d2a33" font-size="18" text-anchor="middle">layers 0–15</text><rect x="390" y="285" width="160" height="115" fill="#8fc7c2"/><text x="470" y="273" fill="#1d2a33" font-size="24" text-anchor="middle" font-weight="700">92</text><text x="470" y="432" fill="#1d2a33" font-size="18" text-anchor="middle">layers 16–31</text><rect x="610" y="222.5" width="160" height="177.5" fill="#2f7f7a"/><text x="690" y="210.5" fill="#1d2a33" font-size="24" text-anchor="middle" font-weight="700">142</text><text x="690" y="432" fill="#1d2a33" font-size="18" text-anchor="middle">layers 32–47</text><rect x="830" y="133.75" width="160" height="266.25" fill="#2f7f7a"/><text x="910" y="121.75" fill="#1d2a33" font-size="24" text-anchor="middle" font-weight="700">213</text><text x="910" y="432" fill="#1d2a33" font-size="18" text-anchor="middle">layers 48–63</text><line x1="140" y1="243.75" x2="990" y2="243.75" stroke="#e58f8a" stroke-width="3" stroke-dasharray="10 8"/><text x="146" y="233.75" fill="#a3443e" font-size="18" text-anchor="start">125 per quarter if layers were sampled uniformly</text><text x="550" y="470" fill="#1d2a33" font-size="20" text-anchor="middle">355 of 500 (71%) come from the latter half of the network</text></g></svg>

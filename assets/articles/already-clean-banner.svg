<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" data-banner-palette="petrol">
<title id="title">One neuron's uses, and two histories that could explain them</title>
<desc id="desc">Schematic. Left: Goodfire's example of a neuron that detected the letters iy, then diy, then the phrase do it yourself, which no longer contains iy. Right: two rival learning histories, related branching growth and packing of unrelated uses into shared capacity, both arrive at the same observed endpoint. The final pattern alone does not say which history occurred. No measured data is shown.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b30"/><stop offset="1" stop-color="#245057"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#71d5d0" stroke-width="1.8"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e58f8a" stroke-width="1.8"/></marker></defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="300" y="58" fill="#fff9ed" font-size="34" text-anchor="middle">What the neuron does now</text>
<path d="M120 300C150 230 230 175 300 160" fill="none" stroke="#fff9ed" stroke-width="7" stroke-linecap="round" opacity=".85"/>
<path d="M372 172C420 205 440 230 452 248" fill="none" stroke="#fff9ed" stroke-width="6" stroke-linecap="round" opacity=".85"/>
<circle cx="120" cy="300" r="44" fill="#efbe65"/><text x="120" y="311.9" fill="#102b30" font-size="34" text-anchor="middle" font-weight="700">iy</text>
<circle cx="330" cy="150" r="46" fill="#efbe65"/><text x="330" y="161.2" fill="#102b30" font-size="32" text-anchor="middle" font-weight="700">diy</text>
<rect x="382" y="248" width="196" height="56" rx="28" fill="#efbe65"/><text x="480" y="285" fill="#102b30" font-size="25" text-anchor="middle" font-weight="700">do it yourself</text>
<text x="320" y="365" fill="#d4ccd9" font-size="24" text-anchor="middle">Each step is related to the last; the end has no "iy"</text>
<line x1="640" y1="70" x2="640" y2="345" stroke="#fff9ed" stroke-width="2" opacity=".25"/>
<text x="915" y="58" fill="#fff9ed" font-size="34" text-anchor="middle">How did it get that way?</text>
<rect x="700" y="96" width="430" height="92" rx="16" fill="none" stroke="#71d5d0" stroke-width="3"/>
<text x="915" y="134" fill="#71d5d0" font-size="27" text-anchor="middle" font-weight="700">Grew by related branching</text>
<text x="915" y="168" fill="#fff9ed" font-size="25" text-anchor="middle" font-style="italic">recursive generalisation</text>
<rect x="700" y="214" width="430" height="92" rx="16" fill="none" stroke="#e58f8a" stroke-width="3"/>
<text x="915" y="252" fill="#e58f8a" font-size="27" text-anchor="middle" font-weight="700">Unrelated uses packed together</text>
<text x="915" y="286" fill="#fff9ed" font-size="25" text-anchor="middle" font-style="italic">superposition</text>
<path d="M700 142C650 142 625 200 600 255" fill="none" stroke="#71d5d0" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M700 260C660 260 630 270 600 274" fill="none" stroke="#e58f8a" stroke-width="3" marker-end="url(#arrowr)"/>
<text x="915" y="352" fill="#d4ccd9" font-size="25" text-anchor="middle">The endpoint alone cannot tell them apart</text>
</g></svg>

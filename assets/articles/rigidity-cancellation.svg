<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">The cubic term gives the game away</title>
<desc id="desc">For a(z)=z+z² and b(z)=z−z², a(b(z))=z−2z³+z⁴. Coefficients are 1, 0, −2, 1. The square term cancels and the first difference from the identity is cubic.</desc>
<rect width="640" height="580" rx="16" fill="#0a2c28"/>
<g font-family="system-ui, sans-serif" fill="#f0fdfa">
<text x="40" y="55" font-size="23" font-weight="650">What survives composition?</text>
<text x="40" y="96" font-size="25">a(b(z)) = z − 2z³ + z⁴</text>
<text x="40" y="151" fill="#a7d5cc" font-size="18">POWER</text>
<text x="245" y="151" fill="#a7d5cc" font-size="18">COEFFICIENT</text>
<path d="M380 175V478" stroke="#a7d5cc" stroke-opacity=".5"/>
<text x="48" y="212" font-size="28" fill="#f0fdfa">z</text>
<rect x="380" y="187" width="70" height="34" rx="4" fill="#f0fdfa"/>
<text x="505" y="212" font-size="26" fill="#f0fdfa">+1</text>
<text x="48" y="294" font-size="28" fill="#a7d5cc">z²</text>
<circle cx="380" cy="286" r="5" fill="#a7d5cc"/>
<text x="505" y="294" font-size="26" fill="#a7d5cc">0</text>
<text x="48" y="376" font-size="28" fill="#fbbf24">z³</text>
<rect x="240" y="351" width="140" height="34" rx="4" fill="#fbbf24"/>
<text x="505" y="376" font-size="26" fill="#fbbf24">−2</text>
<text x="48" y="458" font-size="28" fill="#2dd4bf">z⁴</text>
<rect x="380" y="433" width="70" height="34" rx="4" fill="#2dd4bf"/>
<text x="505" y="458" font-size="26" fill="#2dd4bf">+1</text>
<text x="40" y="532" fill="#fbbf24" font-size="21">First difference from z: the cubic term.</text>
</g></svg>
